<!-- MODO DEMO: sin conexión a Firebase real. Este bloque reemplaza al SDK de Firebase
     por un motor que simula Firestore/Auth 100% en memoria del navegador. Nada de lo que
     pase acá se guarda ni se comparte con la base de datos real del negocio: cada visita
     arranca de cero con datos de ejemplo, y se pierde todo al recargar la página. -->
<script id="mock-firebase-demo">
"use strict";
(function(){
  var STORE = Object.create(null);
  var listeners = [];
  var notifyScheduled = false;
  function scheduleNotify(){
    if(notifyScheduled) return;
    notifyScheduled = true;
    setTimeout(function(){
      notifyScheduled = false;
      listeners.slice().forEach(function(l){ try{ l(); }catch(e){ console.error(e); } });
    }, 0);
  }
  function genId(){ return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,9); }
  function clone(o){ return o===undefined ? undefined : JSON.parse(JSON.stringify(o)); }

  function DocRef(path){ this.path = path; this.id = path.split('/').pop(); }
  DocRef.prototype.collection = function(name){ return new CollectionRef(this.path + '/' + name); };
  function makeDocSnap(path){
    var data = STORE[path];
    return { exists: data !== undefined, id: path.split('/').pop(), data: function(){ return clone(data); } };
  }
  DocRef.prototype.get = function(){ return Promise.resolve(makeDocSnap(this.path)); };
  DocRef.prototype.set = function(data, opts){
    var cur = STORE[this.path];
    var merge = opts && opts.merge;
    STORE[this.path] = (merge && cur) ? Object.assign({}, cur, data) : Object.assign({}, data);
    scheduleNotify();
    return Promise.resolve();
  };
  DocRef.prototype.update = function(data){
    STORE[this.path] = Object.assign({}, STORE[this.path] || {}, data);
    scheduleNotify();
    return Promise.resolve();
  };
  DocRef.prototype.delete = function(){ delete STORE[this.path]; scheduleNotify(); return Promise.resolve(); };
  DocRef.prototype.onSnapshot = function(a, b, c){
    // soporta onSnapshot(cb, errCb) y onSnapshot(opts, cb, errCb)
    var cb = (typeof a === 'function') ? a : b;
    var self = this;
    var fn = function(){ cb(makeDocSnap(self.path)); };
    listeners.push(fn);
    setTimeout(fn, 0);
    return function(){ var i = listeners.indexOf(fn); if(i>=0) listeners.splice(i,1); };
  };

  function CollectionRef(path){ this.path = path; this._orderBy = null; this._limit = null; }
  CollectionRef.prototype.doc = function(id){ return new DocRef(this.path + '/' + (id || genId())); };
  CollectionRef.prototype.add = function(data){ var ref = this.doc(); return ref.set(data).then(function(){ return ref; }); };
  CollectionRef.prototype.orderBy = function(field, dir){
    var q = new CollectionRef(this.path); q._orderBy = { field:field, dir:dir||'asc' }; q._limit = this._limit; return q;
  };
  CollectionRef.prototype.limit = function(n){
    var q = new CollectionRef(this.path); q._orderBy = this._orderBy; q._limit = n; return q;
  };
  CollectionRef.prototype._docs = function(){
    var prefix = this.path + '/';
    var out = [];
    Object.keys(STORE).forEach(function(p){
      if(p.indexOf(prefix) === 0 && p.slice(prefix.length).indexOf('/') === -1) out.push({ path:p, id:p.slice(prefix.length) });
    });
    if(this._orderBy){
      var f = this._orderBy.field, dir = this._orderBy.dir;
      out.sort(function(a,b){
        var av = STORE[a.path][f], bv = STORE[b.path][f];
        if(av===undefined && bv===undefined) return 0;
        if(av===undefined) return dir==='desc' ? 1 : -1;
        if(bv===undefined) return dir==='desc' ? -1 : 1;
        if(av<bv) return dir==='desc' ? 1 : -1;
        if(av>bv) return dir==='desc' ? -1 : 1;
        return 0;
      });
    }
    if(this._limit) out = out.slice(0, this._limit);
    return out;
  };
  function makeQuerySnap(docsMeta){
    return {
      docs: docsMeta.map(function(m){
        return { id:m.id, data:function(){ return clone(STORE[m.path]); }, metadata:{ hasPendingWrites:false } };
      })
    };
  }
  CollectionRef.prototype.get = function(){ return Promise.resolve(makeQuerySnap(this._docs())); };
  CollectionRef.prototype.onSnapshot = function(a, b, c){
    // soporta onSnapshot(cb, errCb) y onSnapshot(opts, cb, errCb)
    var cb = (typeof a === 'function') ? a : b;
    var self = this;
    var fn = function(){ cb(makeQuerySnap(self._docs())); };
    listeners.push(fn);
    setTimeout(fn, 0);
    return function(){ var i = listeners.indexOf(fn); if(i>=0) listeners.splice(i,1); };
  };

  function Batch(){ this.ops = []; }
  Batch.prototype.set = function(ref, data, opts){ this.ops.push({ type:'set', ref:ref, data:data, opts:opts }); return this; };
  Batch.prototype.update = function(ref, data){ this.ops.push({ type:'update', ref:ref, data:data }); return this; };
  Batch.prototype.delete = function(ref){ this.ops.push({ type:'delete', ref:ref }); return this; };
  Batch.prototype.commit = function(){
    this.ops.forEach(function(op){
      if(op.type==='set'){
        var cur = STORE[op.ref.path]; var merge = op.opts && op.opts.merge;
        STORE[op.ref.path] = (merge && cur) ? Object.assign({}, cur, op.data) : Object.assign({}, op.data);
      } else if(op.type==='update'){
        STORE[op.ref.path] = Object.assign({}, STORE[op.ref.path]||{}, op.data);
      } else if(op.type==='delete'){
        delete STORE[op.ref.path];
      }
    });
    scheduleNotify();
    return Promise.resolve();
  };

  function Transaction(){}
  Transaction.prototype.get = function(ref){ return Promise.resolve(makeDocSnap(ref.path)); };
  Transaction.prototype.set = function(ref, data, opts){
    var cur = STORE[ref.path]; var merge = opts && opts.merge;
    STORE[ref.path] = (merge && cur) ? Object.assign({}, cur, data) : Object.assign({}, data);
    return this;
  };
  Transaction.prototype.update = function(ref, data){ STORE[ref.path] = Object.assign({}, STORE[ref.path]||{}, data); return this; };
  Transaction.prototype.delete = function(ref){ delete STORE[ref.path]; return this; };

  function Firestore(){}
  Firestore.prototype.collection = function(name){ return new CollectionRef(name); };
  Firestore.prototype.batch = function(){ return new Batch(); };
  Firestore.prototype.runTransaction = function(fn){
    var t = new Transaction();
    return Promise.resolve().then(function(){ return fn(t); }).then(function(res){ scheduleNotify(); return res; });
  };
  var dbInstance = new Firestore();

  function Auth(){}
  Auth.prototype.onAuthStateChanged = function(cb){
    setTimeout(function(){ cb({ uid:'demo-visitante', isAnonymous:true }); }, 0);
    return function(){};
  };
  Auth.prototype.signInAnonymously = function(){ return Promise.resolve({ user:{ uid:'demo-visitante' } }); };
  var authInstance = new Auth();

  window.firebase = {
    initializeApp: function(){ /* modo demo: no se conecta a ningún proyecto real */ },
    firestore: function(){ return dbInstance; },
    auth: function(){ return authInstance; }
  };

  // Datos iniciales de la demo (ficticios, se recrean en cada carga de página)
  STORE['negocios/principal'] = { nombreNegocio:'Mi Comercio (Demo)', telefonoNegocio:'', claveGestion:'1234' };
  STORE['negocios/principal/sucursales/demo'] = { nombre:'Casa Central (Demo)', direccion:'', telefono:'', activa:true, esCentral:true, creadaEn: new Date().toISOString() };
})();
</script>

<script>
  // Si algo revienta antes de que React monte, lo mostramos en pantalla
  // en vez de dejar la pantalla de carga infinita y silenciosa.
  window.addEventListener('error', function(e){
    var sub = document.getElementById('boot-sub');
    var loader = document.getElementById('boot-loader');
    if (loader && loader.style.display !== 'none') {
      sub.textContent = 'Error al iniciar la aplicación:';
      var pre = document.createElement('div');
      pre.className = 'err';
      pre.textContent = (e.error && e.error.stack) ? e.error.stack : e.message;
      loader.appendChild(pre);
    }
  });
</script>

<script id="app-script">
"use strict";
var h = React.createElement;
var useState = React.useState, useEffect = React.useEffect, useMemo = React.useMemo,
    useRef = React.useRef, useCallback = React.useCallback,
    createContext = React.createContext, useContext = React.useContext,
    forwardRef = React.forwardRef, Fragment = React.Fragment;

/* ============================================================
   CONFIGURACIÓN DE FIREBASE
============================================================ */
var firebaseConfig = {
  // MODO DEMO: no se usa ningún proyecto real (ver mock-firebase-demo más arriba)
  apiKey: "demo", authDomain: "demo", projectId: "demo"
};
var NEGOCIO_ID = "principal";
// Sucursal actualmente seleccionada. Todas las colecciones operativas (productos, stock,
// clientes, ventas, etc.) quedan anidadas debajo de la sucursal activa — se define en
// AppProvider al elegir sucursal y negRef/negDoc la usan para armar la ruta en Firestore.
var SUCURSAL_ACTUAL_ID = null;

firebase.initializeApp(firebaseConfig);
var auth = firebase.auth();
var db = firebase.firestore();

// Persistencia offline: Firestore guarda una copia local (IndexedDB) de todo lo que el
// dispositivo fue viendo, y encola ahí mismo cualquier escritura hecha sin conexión para
// sincronizarla sola en cuanto vuelve la señal. synchronizeTabs permite tener la app abierta
// en más de una pestaña del mismo navegador sin que esto falle.
try{
  db.enablePersistence({ synchronizeTabs: true }).catch(function(err){
    console.warn('No se pudo activar el modo sin conexión:', err && err.code);
  });
}catch(e){ console.warn('Este navegador no soporta el modo sin conexión', e); }

function sucursalesRef(){ return db.collection('negocios').doc(NEGOCIO_ID).collection('sucursales'); }
function sucursalDoc(id){ return sucursalesRef().doc(id); }
function negRef(sub){ return sucursalesRef().doc(SUCURSAL_ACTUAL_ID).collection(sub); }
function negDoc(sub, id){ return negRef(sub).doc(id); }

/* ============================================================
   UTILIDADES
============================================================ */
// Envuelve una promesa con un límite de tiempo: si no se resuelve antes de ms,
// se rechaza con TIMEOUT_SIN_CONEXION (usado para detectar cortes de conexión
// silenciosos durante una venta, donde el navegador cree estar online pero el
// pedido al servidor nunca vuelve).
function withTimeout(promise, ms){
  return new Promise(function(resolve, reject){
    var settled = false;
    var timer = setTimeout(function(){
      if(!settled){ settled = true; reject(new Error('TIMEOUT_SIN_CONEXION')); }
    }, ms);
    promise.then(function(v){
      if(!settled){ settled = true; clearTimeout(timer); resolve(v); }
    }, function(err){
      if(!settled){ settled = true; clearTimeout(timer); reject(err); }
    });
  });
}
function uid(p){
  p = p || '';
  return p + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);
}
function fmtMoney(n){
  if (n === null || n === undefined || isNaN(n)) n = 0;
  return n.toLocaleString('es-AR', { style:'currency', currency:'ARS', minimumFractionDigits:2, maximumFractionDigits:2 });
}
function fmtNum(n, dec){
  dec = dec === undefined ? 3 : dec;
  if (n === null || n === undefined || isNaN(n)) n = 0;
  return n.toLocaleString('es-AR', { minimumFractionDigits:0, maximumFractionDigits:dec });
}
function fmtDate(iso){
  if(!iso) return '—';
  var d = new Date(iso);
  return d.toLocaleDateString('es-AR', { day:'2-digit', month:'2-digit', year:'numeric' });
}
function fmtDateTime(iso){
  if(!iso) return '—';
  var d = new Date(iso);
  return d.toLocaleDateString('es-AR', { day:'2-digit', month:'2-digit', year:'numeric' }) + ' ' +
         d.toLocaleTimeString('es-AR', { hour:'2-digit', minute:'2-digit' });
}
function daysUntil(iso){
  if(!iso) return null;
  var today = new Date(); today.setHours(0,0,0,0);
  var target = new Date(iso); target.setHours(0,0,0,0);
  return Math.round((target - today) / 86400000);
}
function umbralAlertaVenc(producto){
  return (producto.diasAlertaVencimiento!=null) ? producto.diasAlertaVencimiento : 3;
}
function estaPorVencer(producto){
  if(!producto.vencimiento) return false;
  var d = daysUntil(producto.vencimiento);
  return d <= umbralAlertaVenc(producto);
}
function tieneControlStock(producto){ return producto.controlaStock !== false; }
function nivelAlertaProducto(producto){
  var vencido = producto.vencimiento && daysUntil(producto.vencimiento) < 0;
  if(!tieneControlStock(producto)){
    if(vencido) return 'critico';
    return estaPorVencer(producto) ? 'alerta' : null;
  }
  var sinStock = producto.stock <= 0;
  if(vencido || sinStock) return 'critico';
  var porVencer = estaPorVencer(producto);
  var stockBajo = producto.stock > 0 && producto.stock <= producto.stockMin;
  if(porVencer || stockBajo) return 'alerta';
  return null;
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function nowISO(){ return new Date().toISOString(); }

/* ============================================================
   IMPRESIÓN EN VENTANA NUEVA (para estado de cuenta y códigos de barras)
   Captura el HTML ya renderizado (incluyendo SVGs de JsBarcode) y lo imprime
   en una ventana separada con CSS propio, sin interferir con el CSS de la térmica.
============================================================ */
function printInNewWindow(contenidoHTML, titulo, esEtiquetas){
  var estilos = esEtiquetas ? [
    'body { margin:0; padding:16px; font-family: Arial, sans-serif; background:#fff; }',
    '.etiqueta-print { border:1px solid #ccc; border-radius:6px; padding:14px; text-align:center; width:280px; display:inline-block; margin:8px; vertical-align:top; break-inside:avoid; }',
    '.mono { font-family: "JetBrains Mono", "Courier New", monospace; }',
    '@media print { @page { margin:10mm; size:auto; } body { padding:0; } }'
  ].join('\n') : [
    'body { margin:0; padding:20px; font-family: "Courier New", monospace; font-size:12px; color:#000; background:#fff; }',
    'table { width:100%; border-collapse:collapse; font-size:12px; }',
    'th, td { padding:5px 4px; }',
    '@media print { @page { margin:10mm; size:A4; } body { padding:0; } }'
  ].join('\n');

  var win = window.open('', '_blank', 'width=800,height=600');
  if(!win){ alert('El navegador bloqueó la ventana emergente. Permitila para este sitio.'); return; }
  win.document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"><title>' + (titulo||'Imprimir') + '</title><style>' + estilos + '</style></head><body>' + contenidoHTML + '</body></html>');
  win.document.close();
  // Esperamos a que los recursos carguen antes de imprimir
  win.onload = function(){ win.focus(); win.print(); };
  // Fallback por si onload ya disparó
  setTimeout(function(){ try{ win.focus(); win.print(); } catch(e){} }, 800);
}

/* ============================================================
   ÍCONOS (SVG vía h(), sin JSX)
============================================================ */
function Icon(name, size, color){
  size = size || 18;
  var paths = {
    check: [h('path',{d:"M22 11.08V12a10 10 0 11-5.93-9.14"}), h('polyline',{points:"22 4 12 14.01 9 11.01"})],
    alert: [h('path',{d:"M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"}), h('line',{x1:12,y1:9,x2:12,y2:13}), h('line',{x1:12,y1:17,x2:12.01,y2:17})],
    package: [h('path',{d:"M21 8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16V8z"}), h('polyline',{points:"3.27 6.96 12 12.01 20.73 6.96"}), h('line',{x1:12,y1:22.08,x2:12,y2:12})],
    cash: [h('rect',{x:2,y:6,width:20,height:12,rx:2}), h('circle',{cx:12,cy:12,r:3}), h('path',{d:"M6 12h.01M18 12h.01"})],
    users: [h('path',{d:"M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"}), h('circle',{cx:9,cy:7,r:4}), h('path',{d:"M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"})],

  // Registra la venta LEYENDO stock/contador reales del servidor dentro de una transacción:
  // evita que dos ventas simultáneas desde dispositivos distintos pisen el mismo stock.
  // Requiere conexión — confirmarVenta la usa como camino principal y, si no responde a
  // tiempo, cae sola al camino offline (confirmarVentaOffline, más abajo).
  function confirmarVentaOnline(d){
    return db.runTransaction(function(transaction){
      return Promise.all(
        d.productoRefs.map(function(pr){ return transaction.get(pr.ref); })
      ).then(function(prodSnaps){
        return transaction.get(d.clienteRef).then(function(clienteSnap){
          return transaction.get(d.contadorRef).then(function(contadorSnap){
            for(var i=0;i<prodSnaps.length;i++){
              var snap = prodSnaps[i];
              var it = d.productoRefs[i].item;
              if(!snap.exists) continue;
              if(snap.data().controlaStock === false) continue;
              if(snap.data().stock < it.cantidad){
                throw new Error('STOCK_INSUFICIENTE:' + it.nombre);
              }
            }

            var numero = (contadorSnap.exists ? contadorSnap.data().ultimoNumero : 1000) + 1;
            var clienteData = clienteSnap.exists ? clienteSnap.data() : d.clienteLocal;

            var venta = {
              numero: numero, fecha: d.fecha, items: d.items, total: d.total, metodoPago: d.metodoPago,
              clienteId: d.clienteLocal.id, clienteNombre: d.nombreParaVenta, origen: d.origen,
              estado:'completada', montoRecibido: d.montoRecibido === undefined ? null : d.montoRecibido,
              atendioPor: d.atendioPor
            };

            transaction.set(d.ventaRef, venta);
            transaction.set(d.contadorRef, { ultimoNumero: numero }, { merge: true });

            prodSnaps.forEach(function(snap, i){
              if(!snap.exists) return;
              if(snap.data().controlaStock === false) return;
              var it = d.productoRefs[i].item;
              var nuevoStock = Math.max(0, Math.round((snap.data().stock - it.cantidad)*1000)/1000);
              transaction.update(d.productoRefs[i].ref, { stock: nuevoStock });
            });

            if(d.metodoPago==='cuenta_corriente'){
              var nuevoSaldo = Math.round(((clienteData.saldoCC||0)+d.total)*100)/100;
              transaction.update(d.clienteRef, { saldoCC: nuevoSaldo });
              var movRef = negRef('movimientosCC').doc();
              transaction.set(movRef, { clienteId: d.clienteLocal.id, tipo:'venta', monto: d.total, fecha: d.fecha, nota:'Venta #'+numero, ventaId: d.ventaRef.id });
            }

            return { id: d.ventaRef.id, numero: numero, venta: venta };
          });
        });
      });
    });
  }

  // Registra la venta SIN transacción, con los datos que ya tenemos sincronizados en el
  // dispositivo (stock, número de venta, cliente). batch.commit() encola la escritura en
  // el almacenamiento local (IndexedDB) y la sincroniza sola apenas vuelve la conexión —
  // no esperamos la confirmación del servidor para no trabar la pantalla mientras no hay señal.
  // Contrapartida de no usar transacción: si DOS dispositivos venden offline al mismo tiempo
  // el mismo producto justo al límite del stock, no hay forma de detectarlo hasta sincronizar.
  function confirmarVentaOffline(d){
    for(var i=0;i<d.items.length;i++){
      var it = d.items[i];
      var prodLocal = productos.find(function(p){ return p.id===it.productoId; });
      if(prodLocal && prodLocal.controlaStock !== false && prodLocal.stock < it.cantidad){
        return Promise.reject(new Error('STOCK_INSUFICIENTE:' + it.nombre));
      }
    }

    var numero = ventas.reduce(function(m,v){ return Math.max(m, v.numero||0); }, 1000) + 1;
    var venta = {
      numero: numero, fecha: d.fecha, items: d.items, total: d.total, metodoPago: d.metodoPago,
      clienteId: d.clienteLocal.id, clienteNombre: d.nombreParaVenta, origen: d.origen,
      estado:'completada', montoRecibido: d.montoRecibido === undefined ? null : d.montoRecibido,
      atendioPor: d.atendioPor
    };

    var batch = db.batch();
    batch.set(d.ventaRef, venta);
    batch.set(d.contadorRef, { ultimoNumero: numero }, { merge:true });
    d.items.forEach(function(it){
      var prodLocal = productos.find(function(p){ return p.id===it.productoId; });
      if(prodLocal && prodLocal.controlaStock !== false){
        var nuevoStock = Math.max(0, Math.round((prodLocal.stock - it.cantidad)*1000)/1000);
        batch.update(negDoc('productos', it.productoId), { stock: nuevoStock });
      }
    });
    if(d.metodoPago==='cuenta_corriente'){
      var nuevoSaldo = Math.round(((d.clienteLocal.saldoCC||0)+d.total)*100)/100;
      batch.update(d.clienteRef, { saldoCC: nuevoSaldo });
      var movRef = negRef('movimientosCC').doc();
      batch.set(movRef, { clienteId: d.clienteLocal.id, tipo:'venta', monto: d.total, fecha: d.fecha, nota:'Venta #'+numero, ventaId: d.ventaRef.id });
    }
    // No se espera este commit: si no hay conexión la promesa recién resuelve al sincronizar,
    // y no queremos trabar el ticket/modal de cobro esperando eso.
    batch.commit().catch(function(err){ console.error('Error sincronizando una venta guardada localmente:', err); });

    return Promise.resolve({ id: d.ventaRef.id, numero: numero, venta: venta });
  }

  function confirmarVenta(args){
    var items = args.items, metodoPago = args.metodoPago, clienteId = args.clienteId, montoRecibido = args.montoRecibido, clienteNombreLibre = args.clienteNombreLibre, atendioPor = args.atendioPor || '';
    var origen = args.origen === 'cafeteria' ? 'cafeteria' : 'panaderia';
    var clienteLocal = clientes.find(function(c){ return c.id===clienteId; }) || clientes.find(function(c){ return c.id==='cli-cf'; }) || clientes[0];
    if(!clienteLocal){
      pushToast('No se pudo confirmar la venta: todavía no hay ningún cliente cargado en esta sucursal. Probá de nuevo en unos segundos.', 'error');
      return Promise.resolve(null);
    }
    var nombreParaVenta = (clienteNombreLibre && clienteNombreLibre.trim()) ? clienteNombreLibre.trim() : clienteLocal.nombre;
    var total = Math.round(items.reduce(function(s,i){ return s+i.subtotal; }, 0)*100)/100;
    var fecha = nowISO();

    var datos = {
      ventaRef: negRef('ventas').doc(),
      productoRefs: items.map(function(it){ return { item: it, ref: negDoc('productos', it.productoId) }; }),
      clienteRef: negDoc('clientes', clienteLocal.id),
      contadorRef: negDoc('contadores', 'ventas'),
      clienteLocal: clienteLocal, items: items, total: total, fecha: fecha, metodoPago: metodoPago,
      origen: origen, nombreParaVenta: nombreParaVenta, montoRecibido: montoRecibido, atendioPor: atendioPor
    };

    // Si ya sabemos que no hay conexión, vamos directo al camino offline (sin esperar nada).
    // Si hay conexión, intentamos la transacción normal; si el servidor no responde en 6
    // segundos (corte de conexión justo durante la venta, sin que el navegador lo note todavía),
    // caemos igual al camino offline — la venta nunca queda esperando indefinidamente.
    var intento = online ? withTimeout(confirmarVentaOnline(datos), 6000) : Promise.reject(new Error('SIN_CONEXION'));

    return intento.then(function(resultado){
      pushToast('Venta #'+resultado.numero+' registrada — '+fmtMoney(total), 'success');
      var result = { id: resultado.id };
      for(var k in resultado.venta) result[k] = resultado.venta[k];
      return result;
    }).catch(function(err){
      if(err && err.message && err.message.indexOf('STOCK_INSUFICIENTE:')===0){
        var nombreProd = err.message.split(':')[1];
        pushToast('Sin stock suficiente de "'+nombreProd+'" — alguien más lo vendió recién. Revisá el carrito.', 'error');
        return null;
      }
      if(err && err.message !== 'SIN_CONEXION' && err.message !== 'TIMEOUT_SIN_CONEXION'){
        console.error(err);
      }
      // Sin conexión o el servidor no respondió a tiempo: guardamos la venta en el dispositivo.
      return confirmarVentaOffline(datos).then(function(resultado){
        pushToast('Sin conexión: venta #'+resultado.numero+' guardada en el dispositivo — se sincronizará sola cuando vuelva internet.', 'info');
        var result = { id: resultado.id };
        for(var k in resultado.venta) result[k] = resultado.venta[k];
        return result;
      }).catch(function(err2){
        if(err2 && err2.message && err2.message.indexOf('STOCK_INSUFICIENTE:')===0){
          var nombreProd2 = err2.message.split(':')[1];
          pushToast('Sin stock suficiente de "'+nombreProd2+'".', 'error');
        } else {
          console.error(err2);
          pushToast('Error al registrar la venta.', 'error');
        }
        return null;
      });
    });
  }

  function agregarItemMesa(mesaId, producto, cantidadDefault){
    var mesa = mesas.find(function(m){ return m.id===mesaId; });
    if(!mesa) return Promise.resolve();
    var cant = cantidadDefault != null ? cantidadDefault : 1;
    var items = mesa.items || [];
    var idx = -1;
    for(var i=0;i<items.length;i++){ if(items[i].productoId===producto.id){ idx=i; break; } }
    var nuevosItems;
    if(idx>=0){
      var nuevaCant = Math.round((items[idx].cantidad + cant)*1000)/1000;
      var nuevoSubtotal = Math.round(producto.precioVenta*nuevaCant*100)/100;
      nuevosItems = items.slice();
      nuevosItems[idx] = { productoId:producto.id, nombre:producto.nombre, unidad:producto.unidad, cantidad:nuevaCant, precioUnit:producto.precioVenta, subtotal:nuevoSubtotal };
    } else {
      var subtotal = Math.round(producto.precioVenta*cant*100)/100;
      nuevosItems = items.concat([{ productoId:producto.id, nombre:producto.nombre, unidad:producto.unidad, cantidad:cant, precioUnit:producto.precioVenta, subtotal:subtotal }]);
    }
    return negDoc('mesas', mesaId).update({ items:nuevosItems, estado:'ocupada', abiertaEn: mesa.abiertaEn || nowISO() })
      .catch(function(err){ console.error(err); pushToast('Error al agregar el ítem al pedido', 'error'); });
  }
  function actualizarCantidadItemMesa(mesaId, idx, nuevaCantidad){
    var mesa = mesas.find(function(m){ return m.id===mesaId; });
    if(!mesa) return Promise.resolve();
    var items = mesa.items || [];
    if(idx<0 || idx>=items.length) return Promise.resolve();
    var it = items[idx];
    var minQty = isDecimalUnit(it.unidad) ? 0.05 : 1;
    var cantFinal = Math.max(minQty, nuevaCantidad);
    cantFinal = Math.round(cantFinal*1000)/1000;
    var nuevosItems = items.slice();
    nuevosItems[idx] = { productoId:it.productoId, nombre:it.nombre, unidad:it.unidad, cantidad:cantFinal, precioUnit:it.precioUnit, subtotal: Math.round(it.precioUnit*cantFinal*100)/100 };
    return negDoc('mesas', mesaId).update({ items:nuevosItems })
      .catch(function(err){ console.error(err); pushToast('Error al actualizar la cantidad', 'error'); });
  }
  function quitarItemMesa(mesaId, idx){
    var mesa = mesas.find(function(m){ return m.id===mesaId; });
    if(!mesa) return Promise.resolve();
    var nuevosItems = (mesa.items || []).filter(function(_,i){ return i!==idx; });
    return negDoc('mesas', mesaId).update({ items:nuevosItems })
      .catch(function(err){ console.error(err); pushToast('Error al quitar el ítem', 'error'); });
  }
  function cancelarPedidoMesa(mesaId){
    return negDoc('mesas', mesaId).update({ items:[], estado:'libre', abiertaEn:null }).then(function(){
      pushToast('Pedido cancelado', 'info');
    }).catch(function(err){ console.error(err); pushToast('Error al cancelar el pedido', 'error'); });
  }
  function cobrarMesa(mesaId, pagoData){
    var mesa = mesas.find(function(m){ return m.id===mesaId; });
    if(!mesa || !mesa.items || mesa.items.length===0) return Promise.resolve(null);
    var args = { items: mesa.items, origen:'cafeteria', atendioPor: mesa.atendioPor || '' };
    for(var k in pagoData) args[k]=pagoData[k];
    return confirmarVenta(args).then(function(venta){
      if(venta){
        return negDoc('mesas', mesaId).update({ items:[], estado:'libre', abiertaEn:null }).then(function(){ return venta; });
      }
      return null;
    });
  }

  // --- Pedidos pendientes (Panadería): permiten que dos estaciones de venta armen
  // pedidos (elijen productos, cliente) sin poder cobrarlos — la cobranza queda
  // reservada exclusivamente a la pantalla de Caja, que ve estos pedidos en tiempo real.
  function crearPedidoPendiente(clienteNombre){
    return negRef('pedidosPendientes').add({ clienteNombre: clienteNombre || 'Consumidor Final', items:[], creadoEn: nowISO(), estado:'pendiente' }).then(function(ref){
      pushToast('Pedido creado', 'success');
      return ref.id;
    }).catch(function(err){ console.error(err); pushToast('Error al crear el pedido', 'error'); return null; });
  }
  function actualizarClientePedidoPendiente(pedidoId, clienteNombre){
    return negDoc('pedidosPendientes', pedidoId).update({ clienteNombre: clienteNombre || 'Consumidor Final' })
      .catch(function(err){ console.error(err); pushToast('Error al actualizar el cliente', 'error'); });
  }
  function eliminarPedidoPendiente(pedidoId){
    return negDoc('pedidosPendientes', pedidoId).delete().then(function(){
      pushToast('Pedido cancelado', 'info');
      return true;
    }).catch(function(err){ console.error(err); pushToast('Error al cancelar el pedido', 'error'); return false; });
  }
  function agregarItemPedidoPendiente(pedidoId, producto, cantidadDefault){
    var pedido = pedidosPendientes.find(function(p){ return p.id===pedidoId; });
    if(!pedido) return Promise.resolve();
    var cant = cantidadDefault != null ? cantidadDefault : 1;
    var items = pedido.items || [];
    var idx = -1;
    for(var i=0;i<items.length;i++){ if(items[i].productoId===producto.id){ idx=i; break; } }
    var nuevosItems;
    if(idx>=0){
      var nuevaCant = Math.round((items[idx].cantidad + cant)*1000)/1000;
      var nuevoSubtotal = Math.round(producto.precioVenta*nuevaCant*100)/100;
      nuevosItems = items.slice();
      nuevosItems[idx] = { productoId:producto.id, nombre:producto.nombre, unidad:producto.unidad, cantidad:nuevaCant, precioUnit:producto.precioVenta, subtotal:nuevoSubtotal };
    } else {
      var subtotal = Math.round(producto.precioVenta*cant*100)/100;
      nuevosItems = items.concat([{ productoId:producto.id, nombre:producto.nombre, unidad:producto.unidad, cantidad:cant, precioUnit:producto.precioVenta, subtotal:subtotal }]);
    }
    return negDoc('pedidosPendientes', pedidoId).update({ items:nuevosItems })
      .catch(function(err){ console.error(err); pushToast('Error al agregar el ítem al pedido', 'error'); });
  }
  function actualizarCantidadItemPedidoPendiente(pedidoId, idx, nuevaCantidad){
    var pedido = pedidosPendientes.find(function(p){ return p.id===pedidoId; });
    if(!pedido) return Promise.resolve();
    var items = pedido.items || [];
    if(idx<0 || idx>=items.length) return Promise.resolve();
    var it = items[idx];
    var minQty = isDecimalUnit(it.unidad) ? 0.05 : 1;
    var cantFinal = Math.max(minQty, nuevaCantidad);
    cantFinal = Math.round(cantFinal*1000)/1000;
    var nuevosItems = items.slice();
    nuevosItems[idx] = { productoId:it.productoId, nombre:it.nombre, unidad:it.unidad, cantidad:cantFinal, precioUnit:it.precioUnit, subtotal: Math.round(it.precioUnit*cantFinal*100)/100 };
    return negDoc('pedidosPendientes', pedidoId).update({ items:nuevosItems })
      .catch(function(err){ console.error(err); pushToast('Error al actualizar la cantidad', 'error'); });
  }
  function quitarItemPedidoPendiente(pedidoId, idx){
    var pedido = pedidosPendientes.find(function(p){ return p.id===pedidoId; });
    if(!pedido) return Promise.resolve();
    var nuevosItems = (pedido.items || []).filter(function(_,i){ return i!==idx; });
    return negDoc('pedidosPendientes', pedidoId).update({ items:nuevosItems })
      .catch(function(err){ console.error(err); pushToast('Error al quitar el ítem', 'error'); });
  }
  function cobrarPedidoPendiente(pedidoId, pagoData){
    var pedido = pedidosPendientes.find(function(p){ return p.id===pedidoId; });
    if(!pedido || !pedido.items || pedido.items.length===0) return Promise.resolve(null);
    var args = { items: pedido.items, origen:'panaderia', clienteNombreLibre: pedido.clienteNombre || '' };
    for(var k in pagoData) args[k]=pagoData[k];
    return confirmarVenta(args).then(function(venta){
      if(venta){
        return negDoc('pedidosPendientes', pedidoId).delete().then(function(){ return venta; });
      }
      return null;
    });
  }

  function guardarConfigNegocio(data){
    return db.collection("negocios").doc(NEGOCIO_ID).set(data, { merge: true }).then(function(){
      pushToast("Configuración guardada", "success");
    }).catch(function(err){ console.error(err); pushToast("Error al guardar la configuración", "error"); });
  }

  // Estas acciones borran solo los datos de la SUCURSAL ACTUAL (ventas, clientes, productos,
  // categorías) — el resto de las sucursales y la configuración general del negocio no se tocan.
  function resetearTodo(){
    var colecciones = ['ventas', 'movimientosCC', 'clientes', 'productos', 'categorias', 'contadores'];
    pushToast('Borrando datos de esta sucursal, aguardá...', 'info');

    function borrarColeccion(nombre){
      return negRef(nombre).get().then(function(snap){
        if(snap.empty) return Promise.resolve();
        var batch = db.batch();
        snap.docs.forEach(function(doc){ batch.delete(doc.ref); });
        return batch.commit().then(function(){
          // Si quedan más (Firestore borra de a 500), recursivo
          if(snap.size >= 500) return borrarColeccion(nombre);
        });
      });
    }

    return Promise.all(colecciones.map(borrarColeccion))
      .then(function(){
        pushToast('¡Listo! Se borraron todos los datos de esta sucursal.', 'success');
      })
      .catch(function(err){
        console.error(err);
        pushToast('Error al resetear: ' + err.message, 'error');
      });
  }

  // ── Sucursales ──
  function desmarcarOtrasCentrales(idAExcluir){
    // Sólo puede haber una sucursal central a la vez: al marcar una, se desmarcan las demás.
    var otras = sucursales.filter(function(s){ return s.id!==idAExcluir && s.esCentral===true; });
    if(otras.length===0) return Promise.resolve();
    var batch = db.batch();
    otras.forEach(function(s){ batch.update(sucursalDoc(s.id), { esCentral:false }); });
    return batch.commit();
  }
  function addSucursal(data){
    var d2 = {
      nombre: (data.nombre||'').trim() || 'Sucursal',
      direccion: (data.direccion||'').trim(),
      telefono: (data.telefono||'').trim(),
      esCentral: !!data.esCentral,
      activa: true, creadaEn: nowISO()
    };
    var previo = d2.esCentral ? desmarcarOtrasCentrales(null) : Promise.resolve();
    return previo.then(function(){
      return sucursalesRef().add(d2);
    }).then(function(ref){
      pushToast('Sucursal creada', 'success');
      return ref;
    }).catch(function(err){ console.error(err); pushToast('Error al crear la sucursal', 'error'); });
  }
  function updateSucursal(id, data){
    var previo = data.esCentral===true ? desmarcarOtrasCentrales(id) : Promise.resolve();
    return previo.then(function(){
      return sucursalDoc(id).update(data);
    }).then(function(){
      pushToast('Sucursal actualizada', 'success');
    }).catch(function(err){ console.error(err); pushToast('Error al actualizar la sucursal', 'error'); });
  }
  function deleteSucursal(id){
    return sucursalDoc(id).update({ activa:false }).then(function(){
      pushToast('Sucursal dada de baja', 'info');
    }).catch(function(err){ console.error(err); pushToast('Error al dar de baja la sucursal', 'error'); });
  }
  function restoreSucursal(id){
    return sucursalDoc(id).update({ activa:true }).then(function(){
      pushToast('Sucursal reactivada', 'success');
    }).catch(function(err){ console.error(err); pushToast('Error al reactivar la sucursal', 'error'); });
  }
  function seleccionarSucursal(id){
    try{ localStorage.setItem('sucursalActualId', id); }catch(e){}
    setSucursalId(id);
  }
  function cambiarSucursal(){
    try{ localStorage.removeItem('sucursalActualId'); }catch(e){}
    setSucursalId(null);
  }

  var value = {
    categorias: categorias, productos: productos, clientes: clientes, ventas: ventas,
    movimientosCC: movimientosCC, toasts: toasts, pushToast: pushToast,
    addProducto: addProducto, addProductosMultiples: addProductosMultiples, updateProducto: updateProducto, deleteProducto: deleteProducto, restoreProducto: restoreProducto,
    addCategoria: addCategoria, updateCategoria: updateCategoria, deleteCategoria: deleteCategoria,
    addCliente: addCliente, updateCliente: updateCliente, deleteCliente: deleteCliente, registrarPagoCC: registrarPagoCC,
    confirmarVenta: confirmarVenta, configNegocio: configNegocio, guardarConfigNegocio: guardarConfigNegocio,
    resetearTodo: resetearTodo,
    mesas: mesas, crearMesa: crearMesa, actualizarAtendioPorMesa: actualizarAtendioPorMesa, eliminarMesa: eliminarMesa, agregarItemMesa: agregarItemMesa,
    actualizarCantidadItemMesa: actualizarCantidadItemMesa, quitarItemMesa: quitarItemMesa,
    cancelarPedidoMesa: cancelarPedidoMesa, cobrarMesa: cobrarMesa,
    pedidosPendientes: pedidosPendientes, crearPedidoPendiente: crearPedidoPendiente,
    actualizarClientePedidoPendiente: actualizarClientePedidoPendiente, eliminarPedidoPendiente: eliminarPedidoPendiente,
    agregarItemPedidoPendiente: agregarItemPedidoPendiente, actualizarCantidadItemPedidoPendiente: actualizarCantidadItemPedidoPendiente,
    quitarItemPedidoPendiente: quitarItemPedidoPendiente, cobrarPedidoPendiente: cobrarPedidoPendiente,
    loadingData: loadingData, authReady: authReady, authError: authError,
    online: online, ventasPendientes: ventasPendientes,
    sucursales: sucursales, sucursalId: sucursalId,
    sucursalActual: sucursales.filter(function(s){ return s.id===sucursalId; })[0] || null,
    // Si ninguna sucursal fue marcada como central todavía, no se restringe el acceso a Ajustes
    // (comportamiento anterior, sin romper negocios que ya venían usando la app).
    tieneAccesoAjustes: (function(){
      var actual = sucursales.filter(function(s){ return s.id===sucursalId; })[0] || null;
      var hayCentralDefinida = sucursales.some(function(s){ return s.esCentral===true; });
      if(!hayCentralDefinida) return true;
      return !!(actual && actual.esCentral===true);
    })(),
    loadingInicial: loadingInicial,
    seleccionarSucursal: seleccionarSucursal, cambiarSucursal: cambiarSucursal,
    addSucursal: addSucursal, updateSucursal: updateSucursal, deleteSucursal: deleteSucursal, restoreSucursal: restoreSucursal
  };
  return h(AppCtx.Provider, { value: value }, children);
}

function Button(props){
  var variant = props.variant || 'primary';
  var size = props.size || 'md';
  var base = { display:'inline-flex', alignItems:'center', justifyContent:'center', gap:8, fontWeight:700, border:'1px solid transparent', borderRadius:9, transition:'transform 0.05s ease, opacity 0.15s ease, background 0.15s ease', width: props.full?'100%':'auto' };
  var sizes = { sm:{ padding:'7px 12px', fontSize:13 }, md:{ padding:'10px 16px', fontSize:14 }, lg:{ padding:'13px 20px', fontSize:15 } };
  var variants = {
    primary:{ background:'var(--green)', color:'white' },
    dark:{ background:'var(--ink)', color:'white' },
    ghost:{ background:'transparent', color:'var(--ink)', borderColor:'var(--border)' },
    subtle:{ background:'var(--panel-2)', color:'var(--ink)' },
    danger:{ background:'var(--red)', color:'white' },
    outlineGreen:{ background:'var(--green-bg)', color:'var(--green-dark)' }
  };
  var style = {};
  for(var k in base) style[k]=base[k];
  for(var k2 in sizes[size]) style[k2]=sizes[size][k2];
  for(var k3 in variants[variant]) style[k3]=variants[variant][k3];
  if(props.style) for(var k4 in props.style) style[k4]=props.style[k4];
  style.opacity = props.disabled ? 0.5 : 1;
  style.cursor = props.disabled ? 'not-allowed' : 'pointer';

  var rest = {};
  for(var k5 in props){ if(['children','variant','size','icon','full','style'].indexOf(k5)===-1) rest[k5]=props[k5]; }
  rest.style = style;
  rest.onMouseDown = function(e){ if(!props.disabled) e.currentTarget.style.transform='scale(0.98)'; };
  rest.onMouseUp = function(e){ e.currentTarget.style.transform='scale(1)'; };
  rest.onMouseLeave = function(e){ e.currentTarget.style.transform='scale(1)'; };

  return h('button', rest, props.icon || null, props.children);
}

function useAlertCounts(){
  var productos = useApp().productos;
  return useMemo(function(){
    var bajoStock = 0, vencProx = 0, vencido = 0;
    productos.filter(function(p){ return p.activo; }).forEach(function(p){
      if(tieneControlStock(p) && p.stock <= p.stockMin) bajoStock++;
      if(p.vencimiento){
        var d = daysUntil(p.vencimiento);
        if(d < 0) vencido++;
        else if(d <= umbralAlertaVenc(p)) vencProx++;
      }
    });
    return { bajoStock:bajoStock, vencProx:vencProx, vencido:vencido, total: bajoStock+vencProx+vencido };
  }, [productos]);
}

function SucursalBadgeButton(){

    onClick: app.cambiarSucursal,
    title:'Cambiar de sucursal',
    style:{ display:'flex', alignItems:'center', gap:6, background:'var(--green-bg)', color:'var(--green-dark)', border:'none', borderRadius:8, padding:'8px 12px', fontSize:12.5, fontWeight:700 }
  }, Icon('store',15), sucursal.nombre);
}

// Aviso fijo y siempre visible (arriba de todo, en cualquier pantalla) de que no hay
// conexión y de cuántas ventas quedaron guardadas en el dispositivo esperando sincronizar.
// Cuando vuelve la conexión y ya no quedan pendientes, se oculta solo.
function ConnStatusBar(){
  var app = useApp();
  if(app.online && app.ventasPendientes===0) return null;
  var offline = !app.online;
  return h('div', {
    style:{
      position:'fixed', top:0, left:0, right:0, zIndex:200,
      display:'flex', alignItems:'center', justifyContent:'center', gap:8,
      padding:'7px 12px', fontSize:12.5, fontWeight:700, textAlign:'center',
      background: offline ? 'var(--red)' : 'var(--amber)', color:'#fff'
    }
  },
    Icon(offline ? 'wifioff' : 'sync', 14, '#fff'),
    offline
      ? 'Sin conexión — las ventas se guardan en el dispositivo y se sincronizan solas'
      : (app.ventasPendientes+' venta'+(app.ventasPendientes!==1?'s':'')+' sincronizando con el servidor...')
  );
}

/* ============================================================
   MÓDULO: DASHBOARD
============================================================ */
function Dashboard(props){
  var app = useApp();
  var productos = app.productos, ventas = app.ventas, clientes = app.clientes, categorias = app.categorias;
  var activos = productos.filter(function(p){ return p.activo; });
  var hoy = todayISO();
  var ventasHoy = ventas.filter(function(v){ return v.fecha.slice(0,10)===hoy; });
  var totalHoy = ventasHoy.reduce(function(s,v){ return s+v.total; }, 0);

  var bajoStock = activos.filter(function(p){ return tieneControlStock(p) && p.stock<=p.stockMin; }).sort(function(a,b){ return a.stock-b.stock; });
  var porVencer = activos.filter(function(p){ return estaPorVencer(p); }).sort(function(a,b){ return daysUntil(a.vencimiento)-daysUntil(b.vencimiento); });
  var deudores = clientes.filter(function(c){ return !c.esGenerico && c.saldoCC>0; }).sort(function(a,b){ return b.saldoCC-a.saldoCC; });
  var totalCC = deudores.reduce(function(s,c){ return s+c.saldoCC; }, 0);

  var catById = {};
  categorias.forEach(function(c){ catById[c.id]=c; });

  var last7 = useMemo(function(){
    var days = [];
    for(var i=6;i>=0;i--){
      var d = new Date(); d.setDate(d.getDate()-i);
      var iso = d.toISOString().slice(0,10);
      var total = ventas.filter(function(v){ return v.fecha.slice(0,10)===iso; }).reduce(function(s,v){ return s+v.total; }, 0);
      days.push({ iso:iso, label: d.toLocaleDateString('es-AR',{weekday:'short'}).replace('.',''), total:total });
    }
    return days;
  }, [ventas]);
  var maxDay = Math.max.apply(null, last7.map(function(d){return d.total;}).concat([1]));

  // Ranking de productos por unidades vendidas (histórico completo, sobre productos activos).
  var rankingProductos = useMemo(function(){
    var vendidoPorId = {};
    ventas.forEach(function(v){
      (v.items||[]).forEach(function(it){
        if(!vendidoPorId[it.productoId]) vendidoPorId[it.productoId] = 0;
        vendidoPorId[it.productoId] += it.cantidad;
      });
    });
    var stats = activos.map(function(p){
      return { producto:p, cantidad: Math.round((vendidoPorId[p.id]||0)*1000)/1000 };
    });
    var vendidos = stats.filter(function(s){ return s.cantidad>0; });
    var masVendidos = vendidos.slice().sort(function(a,b){ return b.cantidad-a.cantidad; }).slice(0,5);
    var menosVendidos = vendidos.slice().sort(function(a,b){ return a.cantidad-b.cantidad; })
      .filter(function(s){ return masVendidos.indexOf(s)===-1; }).slice(0,5);
    var sinMovimiento = stats.filter(function(s){ return s.cantidad===0; }).sort(function(a,b){ return a.producto.nombre.localeCompare(b.producto.nombre); });
    return { masVendidos:masVendidos, menosVendidos:menosVendidos, sinMovimiento:sinMovimiento };
  }, [ventas, activos]);

  return h('div', { style:{ animation:'fadeIn 0.2s ease-out' } },
    h('div', { style:{ marginBottom:22 } },
      h('h1', { className:'display', style:{ fontSize:24, margin:'0 0 4px' } }, 'Buen día 👋'),
      h('p', { style:{ margin:0, color:'var(--ink-soft)', fontSize:14 } }, new Date().toLocaleDateString('es-AR',{ weekday:'long', day:'numeric', month:'long', year:'numeric' }))
    ),
    h('div', { className:'grid-2', style:{ display:'grid', gridTemplateColumns:'repeat(2,1fr)', gap:14, marginBottom:22 } },
      h(StatCard, { label:'Ventas de hoy', value: fmtMoney(totalHoy), icon: Icon('cash',20), tone:'green', sub: ventasHoy.length+(ventasHoy.length===1?' venta':' ventas') }),
      h(StatCard, { label:'Productos activos', value: activos.length, icon: Icon('package',20), tone:'blue', sub: categorias.length+' categorías' })
    ),
    h('div', { style:{ display:'flex', flexDirection:'column', gap:16 } },
        h('div', { style:{ background:'var(--panel)', border:'1px solid var(--border)', borderRadius:12, padding:18, boxShadow:'var(--shadow)' } },
          h('div', { style:{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:16 } },
            h('span', { className:'display', style:{ fontSize:14 } }, 'VENTAS · ÚLTIMOS 7 DÍAS'),
            h(Button, { size:'sm', variant:'ghost', onClick:function(){ props.setPage('historial'); } }, 'Ver historial ', Icon('arrowright',14))
          ),
          h('div', { style:{ display:'flex', alignItems:'flex-end', gap:10, height:120 } },
            last7.map(function(d){
              return h('div', { key:d.iso, style:{ flex:1, display:'flex', flexDirection:'column', alignItems:'center', gap:6 } },
                h('div', { className:'mono', style:{ fontSize:10.5, color:'var(--ink-faint)' } }, d.total>0 ? fmtNum(d.total/1000,0)+'k' : ''),
                h('div', { title: fmtMoney(d.total), style:{ width:'100%', maxWidth:36, height: Math.max(4,(d.total/maxDay)*84), background: d.iso===hoy?'var(--green)':'var(--panel-2)', borderRadius:5, transition:'height 0.3s ease' } }),
                h('span', { style:{ fontSize:11, color:'var(--ink-soft)', textTransform:'capitalize', fontWeight: d.iso===hoy?700:500 } }, d.label)

function fileToDataUrl(file){
  return new Promise(function(resolve, reject){
    var r = new FileReader();
    r.onload = function(){ resolve(r.result); };
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

function ProductoForm(props){

  var valid = esMultiple ?

function StockStatusBadge(props){
  var p = props.producto;
  if(!tieneControlStock(p)) return h(Badge,{tone:'neutral'},'Sin control');
  if(p.stock<=0) return h(Badge,{tone:'red'},'Sin stock');
  if(p.stock<=p.stockMin) return h(Badge,{tone:'amber'},'Stock bajo');
  return h(Badge,{tone:'green'},'OK');
}
function VencBadge(props){
  var producto = props.producto;
  var iso = producto ? producto.vencimiento : props.iso;

function PagoModal(props){

function buildTicketText(venta, config){
  var nombre = (config && config.nombreNegocio) ? config.nombreNegocio : 'MI COMERCIO';
  var telefono = (config && config.telefonoNegocio) ? config.telefonoNegocio : '';
  var lineas = [];
  lineas.push('*' + nombre + '*');
  if(telefono) lineas.push('Tel: ' + telefono);
  lineas.push('Venta #' + venta.numero);
  lineas.push(fmtDateTime(venta.fecha));
  lineas.push('Cliente: ' + venta.clienteNombre);
  if(venta.atendioPor) lineas.push('Atendió: ' + venta.atendioPor);
  lineas.push('-----------------------------');
  venta.items.forEach(function(it){
    var cant = fmtNum(it.cantidad) + fmtUnidad(it.unidad);
    lineas.push(it.nombre);
    lineas.push('  ' + cant + ' x ' + fmtMoney(it.precioUnit) + ' = ' + fmtMoney(it.subtotal));
  });
  lineas.push('-----------------------------');
  lineas.push('*TOTAL: ' + fmtMoney(venta.total) + '*');
  var metodoLabel = venta.metodoPago==='contado' ? 'Contado' : venta.metodoPago==='transferencia' ? 'Transferencia' : 'Cuenta corriente';
  lineas.push('Pago: ' + metodoLabel);
  if(venta.montoRecibido!=null && venta.montoRecibido>venta.total){
    lineas.push('Recibido: ' + fmtMoney(venta.montoRecibido));
    lineas.push('Vuelto: ' + fmtMoney(venta.montoRecibido - venta.total));
  }
  lineas.push('');
  lineas.push('¡Gracias por tu compra!');
  return lineas.join('\n');
}

function buildEstadoCuentaText(cliente, movimientos, config){
  var nombre = (config && config.nombreNegocio) ? config.nombreNegocio : 'MI COMERCIO';
  var telefono = (config && config.telefonoNegocio) ? config.telefonoNegocio : '';
  var movs = movimientos.slice().sort(function(a,b){ return new Date(a.fecha)-new Date(b.fecha); });
  var saldoCorrido = 0;
  var lineas = [];
  lineas.push('*' + nombre + '*');
  if(telefono) lineas.push('Tel: ' + telefono);
  lineas.push('Estado de cuenta corriente');
  lineas.push('Cliente: ' + cliente.nombre);
  if(cliente.direccion) lineas.push(cliente.direccion);
  if(cliente.telefono) lineas.push(cliente.telefono);
  lineas.push('Emitido el ' + fmtDateTime(nowISO()));
  lineas.push('-----------------------------');
  if(movs.length===0){
    lineas.push('Sin movimientos registrados.');
  } else {
    movs.forEach(function(m){
      saldoCorrido = m.tipo==='pago' ? Math.round((saldoCorrido-m.monto)*100)/100 : Math.round((saldoCorrido+m.monto)*100)/100;
      var detalle = m.nota || (m.tipo==='pago' ? 'Pago a cuenta' : 'Compra');
      var signo = m.tipo==='pago' ? '-' : '+';
      lineas.push(fmtDate(m.fecha) + ' · ' + detalle);
      lineas.push('  ' + signo + fmtMoney(m.monto) + '  (saldo: ' + fmtMoney(saldoCorrido) + ')');
    });
  }
  lineas.push('-----------------------------');
  lineas.push('*SALDO ACTUAL: ' + fmtMoney(cliente.saldoCC) + '*');
  return lineas.join('\n');
}

// Devuelve la abreviatura de la unidad para mostrar en pantalla
function fmtUnidad(unidad){
  if(unidad==='kg') return 'kg';
  if(unidad==='m') return 'm';
  return 'un.';
}
// Devuelve true si la unidad usa cantidades decimales (kg, metros)
function isDecimalUnit(unidad){
  return unidad==='kg' || unidad==='m';
}

function normalizarTelefono(tel){
  // Quita todo lo que no sea dígito; si no empieza con código de país, asume Argentina (54)
  var digits = (tel||'').replace(/\D/g,'');
  if(!digits) return '';
  if(digits.indexOf('54')===0) return digits;
  return '54' + digits;
}

// ── Impresión térmica ───────────────────────────────────────────────────────
// Usa window.print() con CSS optimizado para impresora térmica 80mm.
// El diálogo de Windows aparece solo la primera vez; después Chrome recuerda
// la impresora seleccionada y el cliente solo aprieta Enter (o Ctrl+P).

function imprimirTicket(venta){
  var cfg    = window.__appConfig || {};
  var nombre = cfg.nombreNegocio || 'MI COMERCIO';
  var tel    = cfg.telefonoNegocio || '';
  var mp     = venta.metodoPago === 'contado'       ? 'Contado'
             : venta.metodoPago === 'transferencia' ? 'Transferencia'
             :                                        'Cuenta corriente';

  // Construir HTML del ticket
  var html = '';
  html += '<div style="text-align:center;font-weight:900;font-size:15px;margin-bottom:2px;">' + nombre + '</div>';
  if(tel) html += '<div style="text-align:center;font-size:11px;margin-bottom:2px;">Tel: ' + tel + '</div>';
  html += '<div style="text-align:center;font-size:11px;">Venta #' + venta.numero + '</div>';
  html += '<div style="text-align:center;font-size:11px;margin-bottom:6px;">' + fmtDateTime(venta.fecha) + '</div>';
  html += '<div style="border-top:1px dashed #000;margin:4px 0;"></div>';
  html += '<div style="font-size:11px;margin-bottom:4px;">Cliente: ' + venta.clienteNombre + '</div>';
  if(venta.atendioPor) html += '<div style="font-size:11px;margin-bottom:4px;">Atendió: ' + venta.atendioPor + '</div>';
  html += '<div style="border-top:1px dashed #000;margin:4px 0;"></div>';

  venta.items.forEach(function(it){
    var cant = fmtNum(it.cantidad) + fmtUnidad(it.unidad);
    html += '<div style="font-size:11px;">' + it.nombre + '</div>';
    html += '<div style="font-size:11px;display:flex;justify-content:space-between;margin-bottom:3px;">'
          + '<span>' + cant + ' x ' + fmtMoney(it.precioUnit) + '</span>'
          + '<span>' + fmtMoney(it.subtotal) + '</span></div>';
  });

  html += '<div style="border-top:1px dashed #000;margin:4px 0;"></div>';
  html += '<div style="display:flex;justify-content:space-between;font-weight:900;font-size:13px;margin-bottom:4px;">'
        + '<span>TOTAL</span><span>' + fmtMoney(venta.total) + '</span></div>';
  html += '<div style="font-size:11px;">Pago: ' + mp + '</div>';

  if(venta.montoRecibido != null && venta.montoRecibido > venta.total){
    html += '<div style="font-size:11px;">Recibido: ' + fmtMoney(venta.montoRecibido) + '</div>';
    html += '<div style="font-size:11px;">Vuelto: ' + fmtMoney(venta.montoRecibido - venta.total) + '</div>';
  }

  html += '<div style="border-top:1px dashed #000;margin:4px 0;"></div>';
  html += '<div style="text-align:center;font-size:11px;margin-top:4px;">¡Gracias por tu compra!</div>';

  // Inyectar en contenedor de impresión
  var cont = document.getElementById('__ticket-print-root');
  if(!cont){
    cont = document.createElement('div');
    cont.id = '__ticket-print-root';
    cont.className = 'print-only';
    document.body.appendChild(cont);
  }
  cont.innerHTML = html;
  window.print();
  setTimeout(function(){ cont.innerHTML = ''; }, 1000);
}

function tiempoTranscurrido(iso){
  if(!iso) return '';
  var mins = Math.max(0, Math.round((Date.now() - new Date(iso).getTime())/60000));
  if(mins<60) return mins+' min';
  var hs = Math.floor(mins/60), m = mins%60;
  return hs+'h '+m+'min';
}

/* ============================================================
   Agrupa productos generados como presentaciones/variantes
   (mismo grupoId) para mostrarlos como una sola tarjeta con
   chips de selección, en vez de una fila por cada uno.
============================================================ */
function agruparProductosParaVenta(productosOrdenados){
  var porGrupo = {};
  productosOrdenados.forEach(function(p){
    if(!p.grupoId) return;
    if(!porGrupo[p.grupoId]) porGrupo[p.grupoId] = [];
    porGrupo[p.grupoId].push(p);
  });
  var yaAgrupados = {};
  var out = [];
  productosOrdenados.forEach(function(p){
    if(p.grupoId && porGrupo[p.grupoId].length>1){
      if(yaAgrupados[p.grupoId]) return;
      yaAgrupados[p.grupoId] = true;
      var items = porGrupo[p.grupoId].slice().sort(function(a,b){
        var la = (a.varianteEtiqueta||'')+' '+(a.presentacionEtiqueta||'');
        var lb = (b.varianteEtiqueta||'')+' '+(b.presentacionEtiqueta||'');
        return la.localeCompare(lb);
      });
      out.push({ tipo:'grupo', id:p.grupoId, nombreBase:p.nombreBase||p.nombre, categoriaId:p.categoriaId, imagen:p.imagen, items:items });
    } else {
      out.push({ tipo:'simple', id:p.id, producto:p });
    }
  });
  return out;
}

function HistorialCCTab(){
  var app = useApp();
  var clientes = app.clientes, movimientosCC = app.movimientosCC;
  var filterClienteS = useState('all'); var filterCliente = filterClienteS[0]; var setFilterCliente = filterClienteS[1];
  var clientesConCC = clientes.filter(function(c){return !c.esGenerico && c.saldoCC>0;});

  var filtered = useMemo(function(){
    return movimientosCC.filter(function(m){ return filterCliente==='all' || m.clienteId===filterCliente; }).sort(function(a,b){return new Date(b.fecha)-new Date(a.fecha);});
  }, [movimientosCC, filterCliente]);

  var gruposPorCliente = useMemo(function(){
    var porCliente = {};
    filtered.forEach(function(m){
      if(!porCliente[m.clienteId]) porCliente[m.clienteId] = [];
      porCliente[m.clienteId].push(m);

    var grupos = Object.keys(porCliente).map(function(clienteId){

    grupos.sort(function(a,b){ return b.fechaMasReciente - a.fechaMasReciente; });
    return grupos;
  }, [filtered]);

  var totalDeuda = clientesConCC.reduce(function(s,c){return s+c.saldoCC;},0);
  var clienteById = {}; clientes.forEach(function(c){ clienteById[c.id]=c; });

  return h('div', null,

      h('div', { style:{ background:'var(--panel)', border:'1px solid var(--border)', borderRadius:12, padding:18, boxShadow:'var(--shadow)' } },
        h('span', { className:'display', style:{ fontSize:14, display:'block', marginBottom:14 } }, 'SALDOS POR CLIENTE'),

        })

        h('span', { className:'display', style:{ fontSize:14, display:'block', marginBottom:14 } }, 'MOVIMIENTOS RECIENTES'),
        h('div', { style:{ maxHeight:380, overflowY:'auto' } },
          filtered.length===0 ? h('div', { style:{ fontSize:13, color:'var(--ink-faint)', padding:'10px 0' } }, 'Sin movimientos.') :

          h('p', { style:{ margin:0, fontSize:13, color:'var(--ink-soft)' } }, 'Al confirmar, se borrarán TODOS los datos de forma permanente. El sistema quedará vacío y listo para un uso nuevo.'),
          h('div', { style:{ display:'flex', gap:10 } },

function BottomNav(props){

    { id:'pedidos', label:'Pedidos', icon:'receipt' },

  return h('nav', { className:'bottom-nav' },
    items.map(function(item){
      var active = props.page === item.id;

function PasswordGateForm(props){
  var claveS = useState(''); var clave = claveS[0]; var setClave = claveS[1];
  var errorS = useState(''); var error = errorS[0]; var setError = errorS[1];
  var inputRef = useRef(null);
  useEffect(function(){ if(inputRef.current){ inputRef.current.focus(); } }, []);
  function submit(e){
    e.preventDefault();
    if(clave === props.claveEsperada){
      props.onSuccess();
    } else {
      setError('Contraseña incorrecta');
      setClave('');
    }
  }
  return h('form', { onSubmit:submit },
    h(Field, { label:'Contraseña', required:true },
      h(TextInput, { ref:inputRef, type:'password', value:clave, onChange:function(e){ setClave(e.target.value); setError(''); }, placeholder:'••••', autoComplete:'off' })

}

/* ============================================================
   APP PRINCIPAL
============================================================ */
function AppShell(){
  var vistaS = useState('inicio'); var vista = vistaS[0]; var setVista = vistaS[1];
  var pageS = useState('dashboard'); var page = pageS[0]; var setPage = pageS[1];
  var mobileOpenS = useState(false); var mobileOpen = mobileOpenS[0]; var setMobileOpen = mobileOpenS[1];

  function irAInicio(){ setVista('inicio'); setPage('dashboard'); }

  function renderPage(){
    if(page==='dashboard') return h(Dashboard, { setPage:setPage });
    if(page==='caja') return h(CajaModule);
    if(page==='pedidos') return h(PedidosPanaderiaModule);
    if(page==='cafeteria') return h(CafeteriaModule);
    if(page==='stock') return h(StockModule);
    if(page==='clientes') return h(ClientesModule);
    if(page==='historial') return h(HistorialModule);
    if(page==='ajustes') return h(AjustesModule);
    return null;
  }

  if(vista==='inicio'){
    return h(HomeMenu, { onSelect: function(v){ setVista(v); if(v==='gestion') setPage('dashboard'); } });
  }

  if(vista==='cafeteria'){
    return h('div', { style:{ minHeight:'100vh', display:'flex', flexDirection:'column' } },
      h(ConnStatusBar),
      h(TopBar, { page:'cafeteria', setMobileOpen:function(){}, onHome:irAInicio }),
      h('main', { className:'main-content', style:{ flex:1, padding:'28px 32px', maxWidth:1400, width:'100%', margin:'0 auto' } }, h(CafeteriaModule)),
      h(Toasts)
    );
  }

  if(vista==='pedidos'){
    return h('div', { style:{ minHeight:'100vh', display:'flex', flexDirection:'column' } },
      h(ConnStatusBar),
      h(TopBar, { page:'pedidos', setMobileOpen:function(){}, onHome:irAInicio }),
      h('main', { className:'main-content', style:{ flex:1, padding:'28px 32px', maxWidth:1400, width:'100%', margin:'0 auto' } }, h(PedidosPanaderiaModule)),
      h(Toasts)
    );
  }

  return h('div', { className:'pos-root', style:{ display:'flex', minHeight:'100vh' } },
    h(ConnStatusBar),
    h('div', { className:'sidebar' },
      h(Sidebar, { page:page, setPage:setPage, mobileOpen:false, setMobileOpen:function(){}, onHome:irAInicio })
    ),
    h('div', { style:{ flex:1, minWidth:0, display:'flex', flexDirection:'column' } },
      h(TopBar, { page:page, setMobileOpen:setMobileOpen, onHome:irAInicio }),
      h('main', { className:'main-content', style:{ flex:1, padding:'28px 32px', maxWidth:1400, width:'100%', margin:'0 auto' } }, renderPage())
    ),
    h(BottomNav, { page:page, setPage:setPage }),
    h(Toasts)
  );
}

function AppGate(){
  var app = useApp();
  if(app.authError) return h(LoadingScreen, { authError: app.authError });
  if(!app.authReady || app.loadingInicial) return h(LoadingScreen);
  if(!app.sucursalId) return h(SucursalSelectorScreen);
  if(app.loadingData) return h(LoadingScreen);
  return h(AppShell);
}

function App(){
  return h(AppProvider, null, h(AppGate));
}

var root = ReactDOM.createRoot(rootEl);
root.render(h(App));
