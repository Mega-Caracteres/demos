// Achica y comprime una foto antes de guardarla (lado mayor = maxLado px, JPEG).
// Así una foto de celular de varios MB queda en ~20-60 KB y entra sin problema en Firebase.
function comprimirImagen(file, maxLado, calidad){
  // En celulares las fotos de la cámara pesan varios MB y tienen 12+ megapíxeles.
  // Se decodifican desde un objectURL (no un dataURL gigante, que en el celular agota la memoria)
  // y se achican en un canvas. createImageBitmap respeta la orientación EXIF de la foto.
  function dibujar(fuente, w, hgt){
    var escala = Math.min(1, maxLado / Math.max(w, hgt));
    var cw = Math.max(1, Math.round(w*escala)), ch = Math.max(1, Math.round(hgt*escala));
    var canvas = document.createElement('canvas');
    canvas.width = cw; canvas.height = ch;
    var ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, cw, ch); // fondo blanco para PNG con transparencia
    ctx.drawImage(fuente, 0, 0, cw, ch);
    var out = canvas.toDataURL('image/jpeg', calidad);
    canvas.width = 0; canvas.height = 0; // libera la memoria del canvas (importante en iPhone)
    return out;
  }
  function conImg(){
    return new Promise(function(resolve, reject){
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function(){
        try{ resolve(dibujar(img, img.naturalWidth, img.naturalHeight)); }catch(err){ reject(err); }
        finally{ URL.revokeObjectURL(url); }
      };
      img.onerror = function(err){ URL.revokeObjectURL(url); reject(err || new Error('No se pudo leer la imagen')); };
      img.src = url;
    });
  }
  if(typeof createImageBitmap === 'function'){
    return createImageBitmap(file, { imageOrientation:'from-image' }).then(function(bmp){
      var out = dibujar(bmp, bmp.width, bmp.height);
      if(bmp.close) bmp.close();
      return out;
    }).catch(function(){ return conImg(); });
  }
  return conImg();
}
function esArchivoImagen(file){
  if(!file) return false;
  // En algunos celulares (Android, galerías de terceros) el tipo llega vacío: se mira la extensión.
  if(file.type) return /^image\//.test(file.type);
  return /\.(jpe?g|png|gif|webp|bmp|heic|heif|avif)$/i.test(file.name||'') || !file.name;
}
function fileToDataUrl(file){
  return new Promise(function(resolve, reject){
    var r = new FileReader();
    r.onload = function(){ resolve(r.result); };
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

/* ============================================================
   CÓDIGOS DE BARRAS
   Se genera un EAN-13 de uso interno (empieza con 20, rango reservado para códigos propios
   del comercio, así no choca con los códigos de fábrica). Si el producto ya trae código
   de fábrica, se escanea o se escribe en el mismo campo.
============================================================ */
function digitoControlEAN13(doce){
  var suma = 0;
  for(var i=0;i<12;i++) suma += Number(doce.charAt(i)) * (i%2 ? 3 : 1);
  return (10 - suma%10) % 10;
}
function esEAN13Valido(c){ return /^\d{13}$/.test(c||'') && Number(c.charAt(12))===digitoControlEAN13(c); }
function generarCodigoBarras(existentes){
  var usados = {}; (existentes||[]).forEach(function(c){ if(c) usados[String(c)] = true; });

var CAMPOS_IMPORTACION = [

];

var CAMPOS_IMPORTACION_ORDEN = ['nombre','codigo','categoria','proveedor','unidad','costo','ganancia','venta','stock','stockMin','vencimiento','sectores'];

function adivinarColumnas(encabezados){
  var usadas = {}, map = {};
  var norm = encabezados.map(function(t){ return normalizeStr(t); });
  CAMPOS_IMPORTACION.forEach(function(c){
    for(var i=0;i<norm.length;i++){
      if(usadas[i] || !norm[i]) continue;
      if(c.sin.some(function(s){ return norm[i]===s || norm[i].indexOf(s)>=0; })){ map[c.k] = i; usadas[i] = true; break; }
    }
  });
  return map;
}
// Números escritos a la argentina ("$ 1.234,50") o con punto decimal ("1234.5")
function numeroDesdeCelda(v){
  if(v===null || v===undefined || v==='') return null;
  if(typeof v==='number') return isFinite(v) ? v : null;
  var s = String(v).replace(/[$\s%]/g,'').replace(/[^\d.,-]/g,'');
  if(!s) return null;
  if(s.indexOf(',')>=0 && s.indexOf('.')>=0){
    if(s.lastIndexOf(',') > s.lastIndexOf('.')) s = s.replace(/\./g,'').replace(',', '.');
    else s = s.replace(/,/g,'');
  } else if(s.indexOf(',')>=0){
    s = s.replace(',', '.');
  } else if(/^-?\d{1,3}(\.\d{3})+$/.test(s)){
    s = s.replace(/\./g,'');
  }
  var n = Number(s);
  return isFinite(n) ? n : null;
}
function fechaDesdeCelda(v){
  if(v===null || v===undefined || v==='') return null;
  function iso(y,m,d){ var dt = new Date(y, m-1, d); if(isNaN(dt) || dt.getMonth()!==m-1) return null; return y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0'); }
  if(v instanceof Date){ return isNaN(v) ? null : iso(v.getFullYear(), v.getMonth()+1, v.getDate()); }
  if(typeof v==='number'){ var d = new Date(Math.round((v-25569)*86400000)); return iso(d.getUTCFullYear(), d.getUTCMonth()+1, d.getUTCDate()); }
  var s = String(v).trim(), m;
  if((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return iso(+m[1], +m[2], +m[3]);
  if((m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/))){ var y = +m[3]; if(y<100) y += 2000; return iso(y, +m[2], +m[1]); }
  return undefined; // texto que no es una fecha
}

/* ============================================================
   CAMBIO MASIVO DE PRECIOS POR PORCENTAJE
   Se filtran los productos (búsqueda, categoría, proveedor, punto de venta, unidad, stock),
   se elige subir/bajar un %, sobre qué precio y cómo redondear, se revisa la vista previa
   (se pueden destildar productos) y se confirma con la contraseña de gestión.
============================================================ */
function redondearPrecio(n, paso){
  n = Number(n)||0;
  if(!paso) return Math.round(n*100)/100;
  return Math.max(paso, Math.round(n/paso)*paso);
}

  var catById = {}; categorias.forEach(function(c){ catById[c.id]=c; });
  var claveEsperada = (app.configNegocio && app.configNegocio.claveGestion) || '1234';

// Datos completos de un movimiento de cuenta corriente para imprimir / enviar:
// compra → venta con productos, quién atendió y forma de pago; pago → forma de pago y quién lo recibió.
function horaCorta(iso){ return new Date(iso).toLocaleTimeString('es-AR', { hour:'2-digit', minute:'2-digit', hour12:false })+' hs'; }
function filasEstadoCuenta(movimientos, ventaById){
  var movs = movimientos.slice().sort(function(a,b){ return new Date(a.fecha)-new Date(b.fecha); });
  var saldo = 0, debe = 0, haber = 0;
  var filas = movs.map(function(m){
    if(m.tipo==='pago'){ haber += m.monto||0; saldo -= m.monto||0; } else { debe += m.monto||0; saldo += m.monto||0; }
    saldo = Math.round(saldo*100)/100;
    var vId = m.ventaId || m.aplicadoAVentaId;
    var v = vId ? ventaById[vId] : null;
    var titulo;
    if(m.tipo!=='pago') titulo = v ? 'Compra — Venta #'+v.numero : (m.nota || 'Compra');
    else if(m.ventaId) titulo = 'Entrega al comprar'+(v ? ' (venta #'+v.numero+')' : '');
    else if(m.aplicadoAVentaId) titulo = 'Pago parcial'+(v ? ' de la venta #'+v.numero : '');
    else titulo = 'Pago a cuenta';
    var notaExtra = (m.tipo==='pago' && m.nota && !/^(Pago a cuenta|Pago parcial venta #|Entrega en venta #)/.test(m.nota)) ? m.nota : '';
    return { m:m, v:v, saldo:saldo, titulo:titulo, notaExtra:notaExtra, recibio: quienRecibioPago(m, ventaById) };
  });
  return { filas:filas, debe: Math.round(debe*100)/100, haber: Math.round(haber*100)/100 };
}
function textoFormaPagoVenta(v){
  if(!v) return '';
  var ent = infoEntregaVenta(v);
  if(ent) return 'Cuenta corriente — entregó '+fmtMoney(ent.entrega)+' ('+ent.metodo+'), quedó a cuenta '+fmtMoney(ent.resto);
  var mix = detallePagoMixto(v);
  if(mix) return 'Pago dividido — '+mix.lineas.map(function(l){ return l.label+' '+fmtMoney(l.monto); }).join(' · ');
  return etiquetaMetodoPago(v.metodoPago);
}

function CantidadModal(props){
  var producto = props.producto;
  var isKg = isDecimalUnit(producto.unidad);
  var precio = Number(producto.precioVenta)||0;
  var u = fmtUnidad(producto.unidad);
  // Productos por peso: se puede cargar el peso o la plata ("$2000 de pan") y el otro valor se calcula solo.
  var modoS = useState('monto'); var modo = modoS[0]; var setModo = modoS[1];
  var kgS = useState(''); var kgTxt = kgS[0]; var setKgTxt = kgS[1];
  var montoS = useState(''); var montoTxt = montoS[0]; var setMontoTxt = montoS[1];
  var cantidadS = useState('1'); var cantidad = cantidadS[0]; var setCantidad = cantidadS[1];
  var inputRef = useRef(null);
  useEffect(function(){ if(inputRef.current){ inputRef.current.focus(); inputRef.current.select(); } }, []);

  function onKg(v){
    setModo('peso'); setKgTxt(v);
    var n = Number(v);
    setMontoTxt(v!=='' && n>0 ? String(Math.round(n*precio*100)/100) : '');
  }
  function onMonto(v){
    setModo('monto'); setMontoTxt(v);
    var n = Number(v);
    setKgTxt(v!=='' && n>0 && precio>0 ? String(Math.round(n/precio*1000)/1000) : '');
  }

  var cantNum, subtotal, subtotalFijo = null;
  if(isKg){
    if(modo==='monto'){
      var m = Math.round((Number(montoTxt)||0)*100)/100;
      cantNum = precio>0 ? Math.round(m/precio*1000)/1000 : 0;
      subtotal = m; subtotalFijo = m;
    } else {
      cantNum = Math.round((Number(kgTxt)||0)*1000)/1000;
      subtotal = Math.round(cantNum*precio*100)/100;
    }
  } else {
    cantNum = Number(cantidad)||0;
    subtotal = cantNum*precio;
  }
  var excedeStock = tieneControlStock(producto) && cantNum > producto.stock;
  var valido = cantNum>0 && !excedeStock;

  function submit(e){ e.preventDefault(); if(!valido) return; props.onConfirm(cantNum, subtotalFijo); }
  var quickKg = producto.unidad==='kg' ? [0.25,0.5,1,1.5,2] : [0.5,1,1.5,2,5];
  var nombreMedida = producto.unidad==='kg' ? 'Peso' : producto.unidad==='l' ? 'Litros' : 'Metros';
  var quickMonto = [500,1000,2000,3000,5000];
  var quickUn = [1,2,3,5,10];
  var chip = function(label, onClick, activo, key){
    return h('button', { key:key, type:'button', onClick:onClick, style:{ flex:1, minWidth:50, padding:'8px', borderRadius:8, border: activo?'1.5px solid var(--green)':'1px solid var(--border)', background: activo?'var(--green-bg)':'var(--panel)', fontSize:13, fontWeight:700, color: activo?'var(--green-dark)':'var(--ink-soft)' } }, label);
  };
  var bigInput = { fontSize:22, fontWeight:800, textAlign:'center', padding:'14px' };

  return h('form', { onSubmit:submit },
    h('div', { style:{ display:'flex', alignItems:'center', gap:12, marginBottom:18, padding:14, background:'var(--panel-2)', borderRadius:10 } },
      h(ProductAvatar, { producto:producto, size:48 }),
      h('div', null, h('div', { style:{ fontWeight:700, fontSize:15 } }, producto.nombre), h('div', { className:'mono', style:{ fontSize:13, color:'var(--ink-soft)' } }, fmtMoney(precio)+(isKg?' / '+u:' / unidad')))
    ),
    isKg ? h(Fragment, null,
      h('div', { style:{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12 } },
        h(Field, { label:'Plata que pide ($)' },
          h(TextInput, { ref:inputRef, type:'number', step:'0.01', min:'0', value:montoTxt, onChange:function(e){ onMonto(e.target.value); }, placeholder:'Ej: 2000', style:Object.assign({}, bigInput, modo==='monto'?{ borderColor:'var(--green)' }:{}) })
        ),
        h(Field, { label:nombreMedida+' ('+u+')' },
          h(TextInput, { type:'number', step:'0.001', min:'0', value:kgTxt, onChange:function(e){ onKg(e.target.value); }, placeholder:'Ej: 0.5', style:Object.assign({}, bigInput, modo==='peso'?{ borderColor:'var(--green)' }:{}) })
        )

function PagoModal(props){

  var mixContNum = r2(mixCont), mixTransfNum = r2(mixTransf), mixCCNum = r2(mixCC), mixDebNum = r2(mixDeb), mixCredNum = r2(mixCred);

function buildTicketText(venta, config){
  var nombre = (config && config.nombreNegocio) ? config.nombreNegocio : 'MI COMERCIO';
  var telefono = (config && config.telefonoNegocio) ? config.telefonoNegocio : '';
  var lineas = [];
  lineas.push('*' + nombre + '*');
  if(telefono) lineas.push('Tel: ' + telefono);
  lineas.push('Venta #' + venta.numero);
  lineas.push(fmtDateTime(venta.fecha));
  lineas.push('Cliente: ' + venta.clienteNombre);
  if(venta.atendioPor) lineas.push('Atendió: ' + venta.atendioPor);
  lineas.push('-----------------------------');
  venta.items.forEach(function(it){
    var cant = fmtNum(it.cantidad) + fmtUnidad(it.unidad);
    lineas.push(it.nombre);
    if(textoIngredientes(it)) lineas.push('  Ingredientes: ' + textoIngredientes(it));
    lineas.push('  ' + cant + ' x ' + fmtMoney(it.precioUnit) + ' = ' + fmtMoney(it.subtotal));
  });
  lineas.push('-----------------------------');
  if(propinaVenta(venta)>0){
    lineas.push('Consumo: ' + fmtMoney(venta.total));
    lineas.push(etiquetaPropina(venta) + ': ' + fmtMoney(propinaVenta(venta)));
  }
  lineas.push('*TOTAL: ' + fmtMoney(totalCobradoVenta(venta)) + '*');
  lineas.push('Pago: ' + etiquetaMetodoPago(venta.metodoPago));
  var mixW = detallePagoMixto(venta);
  if(mixW){
    mixW.lineas.forEach(function(l){ lineas.push('  ' + l.label + ': ' + fmtMoney(l.monto)); });
    if(mixW.vuelto>0){ lineas.push('Efectivo recibido: ' + fmtMoney(mixW.efectivoRecibido)); lineas.push('Vuelto: ' + fmtMoney(mixW.vuelto)); }
  }
  var infoEnt = infoEntregaVenta(venta);
  if(infoEnt){
    lineas.push('Entrega (' + infoEnt.metodo + '): ' + fmtMoney(infoEnt.entrega));
    lineas.push('Queda a cuenta corriente: ' + fmtMoney(infoEnt.resto));
  }
  if(venta.montoRecibido!=null && venta.montoRecibido>totalCobradoVenta(venta)){
    lineas.push('Recibido: ' + fmtMoney(venta.montoRecibido));
    lineas.push('Vuelto: ' + fmtMoney(venta.montoRecibido - totalCobradoVenta(venta)));
  }
  lineas.push('');
  lineas.push('¡Gracias por tu compra!');
  return lineas.join('\n');
}

function buildEstadoCuentaText(cliente, movimientos, config, ventas){
  var nombre = (config && config.nombreNegocio) ? config.nombreNegocio : 'MI COMERCIO';
  var telefono = (config && config.telefonoNegocio) ? config.telefonoNegocio : '';
  var ventaById = {}; (ventas||[]).forEach(function(v){ ventaById[v.id]=v; });
  var datos = filasEstadoCuenta(movimientos, ventaById);
  var lineas = [];
  lineas.push('*' + nombre + '*');
  if(telefono) lineas.push('Tel: ' + telefono);
  lineas.push('Estado de cuenta corriente');
  lineas.push('Cliente: ' + cliente.nombre);
  if(cliente.direccion) lineas.push(cliente.direccion);
  if(cliente.telefono) lineas.push(cliente.telefono);
  lineas.push('Emitido el ' + fmtDateTime(nowISO()));
  lineas.push('-----------------------------');
  if(datos.filas.length===0){
    lineas.push('Sin movimientos registrados.');
  } else {
    datos.filas.forEach(function(f){
      var m = f.m, v = f.v, esPago = m.tipo==='pago';
      lineas.push('*' + (esPago ? 'PAGO' : 'COMPRA') + ' · ' + f.titulo + '*');
      lineas.push(fmtDate(m.fecha) + ' ' + horaCorta(m.fecha) + (esPago ? ' · Recibió: ' + (f.recibio || '-') : ' · Atendió: ' + ((v && v.atendioPor) || '-')));
      if(!esPago && v){
        v.items.forEach(function(it){
          lineas.push('  ' + fmtNum(it.cantidad) + ' ' + fmtUnidad(it.unidad) + ' ' + it.nombre + ' x ' + fmtMoney(it.precioUnit) + ' = ' + fmtMoney(it.subtotal));
          if(textoIngredientes(it)) lineas.push('    (' + textoIngredientes(it) + ')');
        });
        lineas.push('  Total venta: ' + fmtMoney(totalCobradoVenta(v)));
        lineas.push('  Forma de pago: ' + textoFormaPagoVenta(v));
      }
      if(esPago){
        lineas.push('  Forma de pago: ' + metodoMovTexto(m));
        if(f.notaExtra) lineas.push('  Nota: ' + f.notaExtra);
      }
      lineas.push('  ' + (esPago ? 'Haber: -' : 'Debe: +') + fmtMoney(m.monto) + '  ·  Saldo: ' + fmtMoney(f.saldo));
      lineas.push('');
    });
  }
  lineas.push('-----------------------------');
  lineas.push('Total compras: ' + fmtMoney(datos.debe));
  lineas.push('Total pagos: ' + fmtMoney(datos.haber));
  lineas.push('*DEUDA ACTUAL: ' + fmtMoney(cliente.saldoCC||0) + '*');
  return lineas.join('\n');
}

// Devuelve la abreviatura de la unidad para mostrar en pantalla
function fmtUnidad(unidad){
  if(unidad==='kg') return 'kg';
  if(unidad==='m') return 'm';
  if(unidad==='l') return 'L';
  return 'un.';
}
// Devuelve true si la unidad usa cantidades decimales (kg, metros)
function isDecimalUnit(unidad){
  return unidad==='kg' || unidad==='m' || unidad==='l';
}

function normalizarTelefono(tel){
  // Quita todo lo que no sea dígito; si no empieza con código de país, asume Argentina (54)
  var digits = (tel||'').replace(/\D/g,'');
  if(!digits) return '';
  if(digits.indexOf('54')===0) return digits;
  return '54' + digits;
}

// ── Impresión térmica silenciosa (QZ Tray) ──────────────────────────────────
// Envía el ticket como comandos ESC/POS crudos directo a la impresora térmica
// a través de QZ Tray (programa que corre en la PC), sin abrir ningún diálogo
// de impresión. Requiere tener QZ Tray instalado y corriendo en la PC:
// https://qz.io/download/
//
// Conexión FIRMADA con certificado propio: QZ Tray reconoce el sitio y no muestra
// el aviso de "Allow". En cada PC hay que importar una sola vez el archivo
// digital-certificate.txt en QZ Tray → Advanced → Site Manager → "+" → Browse.
// MODO DEMO: sin certificado ni impresión térmica directa; se usa el diálogo de impresión del navegador.

function qzConectar(){
  return Promise.reject(new Error('En la demo se imprime con el diálogo del navegador. En el sistema real sale directo a la impresora térmica.'));
  if(qz.websocket.isActive()) return Promise.resolve();
  return qz.websocket.connect();
}

function qzListarImpresoras(){
  return qzConectar().then(function(){ return qz.printers.find(); });
}

// Corta una línea en dos columnas (izquierda / derecha) para que quede alineada
// en el ancho de una impresora de 80mm (32 caracteres con fuente estándar).
function escposLineaDosColumnas(izq, der, ancho){
  ancho = ancho || 32;
  var espacios = ancho - izq.length - der.length;
  if(espacios < 1) espacios = 1;
  return izq + new Array(espacios+1).join(' ') + der;
}

// La impresora térmica recibe los bytes "crudos": cualquier carácter fuera de ASCII
// (el espacio especial que mete el formato de moneda entre "$" y el número, tildes, ñ, ¡)
// se imprime como un símbolo raro. Esta función lo deja todo en ASCII simple.
function escposLimpiarTexto(str){
  str = String(str == null ? '' : str);
  str = str.replace(/[\u00A0\u202F\u2007\u2009]/g, ' ');   // espacios especiales -> espacio normal
  str = str.replace(/[¡¿]/g, '');
  str = str.replace(/[·•]/g, '-');
  str = str.replace(/[\u2013\u2014]/g, '-').replace(/[\u2018\u2019]/g, "'").replace(/[\u201C\u201D]/g, '"');
  if(str.normalize) str = str.normalize('NFD').replace(/[\u0300-\u036f]/g, ''); // á->a, ñ->n, ü->u
  return str.replace(/[^\x00-\x7E]/g, '');                  // cualquier otro símbolo se descarta
}

function buildEscPosTicket(venta, cfg){
  var ESC = '\x1B', GS = '\x1D';
  var ANCHO = 32;
  var nombre = cfg.nombreNegocio || 'MI COMERCIO';
  var tel = cfg.telefonoNegocio || '';
  var mp = etiquetaMetodoPago(venta.metodoPago);
  var raya = new Array(ANCHO+1).join('-');
  var out = '';

  out += ESC + '@';                 // inicializar impresora
  out += ESC + 'a' + '\x01';        // centrado
  out += ESC + '!' + '\x38';        // negrita + doble alto/ancho
  out += nombre + '\n';
  out += ESC + '!' + '\x00';        // normal
  if(tel) out += 'Tel: ' + tel + '\n';
  out += 'Venta #' + venta.numero + '\n';
  out += fmtDateTime(venta.fecha) + '\n';
  out += ESC + 'a' + '\x00';        // izquierda
  out += raya + '\n';
  out += 'Cliente: ' + venta.clienteNombre + '\n';
  if(venta.atendioPor) out += 'Atendió: ' + venta.atendioPor + '\n';
  out += raya + '\n';

  venta.items.forEach(function(it){
    var cant = fmtNum(it.cantidad) + fmtUnidad(it.unidad);
    out += it.nombre + '\n';
    if(textoIngredientes(it)) out += '  ' + textoIngredientes(it) + '\n';
    out += escposLineaDosColumnas(cant + ' x ' + fmtMoney(it.precioUnit), fmtMoney(it.subtotal), ANCHO) + '\n';
  });

  out += raya + '\n';
  if(propinaVenta(venta) > 0){
    out += escposLineaDosColumnas('Consumo', fmtMoney(venta.total), ANCHO) + '\n';
    out += escposLineaDosColumnas(etiquetaPropina(venta), fmtMoney(propinaVenta(venta)), ANCHO) + '\n';
  }
  out += ESC + '!' + '\x30';        // negrita + doble alto/ancho
  out += escposLineaDosColumnas('TOTAL', fmtMoney(totalCobradoVenta(venta)), Math.ceil(ANCHO/2)) + '\n';
  out += ESC + '!' + '\x00';        // normal
  out += 'Pago: ' + mp + '\n';
  var mixE = detallePagoMixto(venta);
  if(mixE){
    mixE.lineas.forEach(function(l){ out += escposLineaDosColumnas('  ' + l.label, fmtMoney(l.monto), ANCHO) + '\n'; });
    if(mixE.vuelto>0){
      out += escposLineaDosColumnas('Efectivo recibido', fmtMoney(mixE.efectivoRecibido), ANCHO) + '\n';
      out += escposLineaDosColumnas('Vuelto', fmtMoney(mixE.vuelto), ANCHO) + '\n';
    }
  }
  var infoEnt = infoEntregaVenta(venta);
  if(infoEnt){
    out += escposLineaDosColumnas('Entrega ' + infoEnt.metodo, fmtMoney(infoEnt.entrega), ANCHO) + '\n';
    out += escposLineaDosColumnas('A cta. corriente', fmtMoney(infoEnt.resto), ANCHO) + '\n';
  }

  if(venta.montoRecibido != null && venta.montoRecibido > totalCobradoVenta(venta)){
    out += 'Recibido: ' + fmtMoney(venta.montoRecibido) + '\n';
    out += 'Vuelto: ' + fmtMoney(venta.montoRecibido - totalCobradoVenta(venta)) + '\n';
  }

  out += raya + '\n';
  out += ESC + 'a' + '\x01';        // centrado
  out += '¡Gracias por tu compra!\n';
  out += '\n\n\n';
  out += GS + 'V' + '\x42' + '\x00'; // corte parcial de papel
  return escposLimpiarTexto(out);
}

// Imprime silenciosamente por QZ Tray. Si QZ Tray no está instalado/corriendo,
// o la impresora configurada no responde, cae automáticamente al método viejo
// (window.print(), con diálogo) para que la venta nunca se quede sin ticket.
function imprimirTicketQZ(venta){
  var cfg = window.__appConfig || {};
  var nombreImpresora = cfg.impresoraTicket || '';

  return qzConectar().then(function(){
    return nombreImpresora ? Promise.resolve(nombreImpresora) : qz.printers.getDefault();
  }).then(function(impresora){
    var config = qz.configs.create(impresora);
    var datos = [{ type: 'raw', format: 'command', flavor: 'plain', data: buildEscPosTicket(venta, cfg) }];
    return qz.print(config, datos).then(function(){
      if(window.__pushToastGlobal) window.__pushToastGlobal('Ticket enviado a "'+impresora+'" por QZ Tray', 'success');
    });
  }).catch(function(err){
    console.error('QZ Tray: no se pudo imprimir directo, se usa el diálogo de impresión.', err);
    if(window.__pushToastGlobal) window.__pushToastGlobal('Demo: se abrió el diálogo de impresión (en el sistema real imprime directo en la térmica)', 'info');
    imprimirTicket(venta);
  });
}

    var cant = fmtNum(it.cantidad) + fmtUnidad(it.unidad);
    html += '<div style="font-size:11px;">' + escHtml(it.nombre) + '</div>';
    if(textoIngredientes(it)) html += '<div style="font-size:10px;">' + escHtml(textoIngredientes(it)) + '</div>';
    html += '<div style="font-size:11px;display:flex;justify-content:space-between;margin-bottom:3px;">'
          + '<span>' + cant + ' x ' + fmtMoney(it.precioUnit) + '</span>'
          + '<span>' + fmtMoney(it.subtotal) + '</span></div>';
  });

  html += '<div style="border-top:1px dashed #000;margin:4px 0;"></div>';
  if(propinaVenta(venta) > 0){
    html += '<div style="font-size:11px;display:flex;justify-content:space-between;"><span>Consumo</span><span>' + fmtMoney(venta.total) + '</span></div>';

  }

    }
  }

    html += '<div style="font-size:11px;display:flex;justify-content:space-between;"><span>A cuenta corriente</span><span>' + fmtMoney(infoEnt.resto) + '</span></div>';
  }

  if(venta.montoRecibido != null && venta.montoRecibido > totalCobradoVenta(venta)){
    html += '<div style="font-size:11px;">Recibido: ' + fmtMoney(venta.montoRecibido) + '</div>';
    html += '<div style="font-size:11px;">Vuelto: ' + fmtMoney(venta.montoRecibido - totalCobradoVenta(venta)) + '</div>';
  }

  html += '<div style="border-top:1px dashed #000;margin:4px 0;"></div>';
  html += '<div style="text-align:center;font-size:11px;margin-top:4px;">¡Gracias por tu compra!</div>';

  // Inyectar en contenedor de impresión
  var cont = document.getElementById('__ticket-print-root');
  if(!cont){
    cont = document.createElement('div');
    cont.id = '__ticket-print-root';
    cont.className = 'print-only';
    document.body.appendChild(cont);
  }
  cont.innerHTML = html;
  window.print();
  setTimeout(function(){ cont.innerHTML = ''; }, 1000);
}

function tiempoTranscurrido(iso){
  if(!iso) return '';
  var mins = Math.max(0, Math.round((Date.now() - new Date(iso).getTime())/60000));
  if(mins<60) return mins+' min';
  var hs = Math.floor(mins/60), m = mins%60;
  return hs+'h '+m+'min';
}

/* ============================================================
   Agrupa productos generados como presentaciones/variantes
   (mismo grupoId) para mostrarlos como una sola tarjeta con
   chips de selección, en vez de una fila por cada uno.
============================================================ */
function agruparProductosParaVenta(productosOrdenados){
  var porGrupo = {};
  productosOrdenados.forEach(function(p){
    if(!p.grupoId) return;
    if(!porGrupo[p.grupoId]) porGrupo[p.grupoId] = [];
    porGrupo[p.grupoId].push(p);
  });
  var yaAgrupados = {};
  var out = [];
  productosOrdenados.forEach(function(p){
    if(p.grupoId && porGrupo[p.grupoId].length>1){
      if(yaAgrupados[p.grupoId]) return;
      yaAgrupados[p.grupoId] = true;
      var items = porGrupo[p.grupoId].slice().sort(function(a,b){
        var la = (a.varianteEtiqueta||'')+' '+(a.presentacionEtiqueta||'');
        var lb = (b.varianteEtiqueta||'')+' '+(b.presentacionEtiqueta||'');
        return la.localeCompare(lb);
      });
      out.push({ tipo:'grupo', id:p.grupoId, nombreBase:p.nombreBase||p.nombre, categoriaId:p.categoriaId, imagen:p.imagen, items:items });
    } else {
      out.push({ tipo:'simple', id:p.id, producto:p });
    }
  });
  return out;
}

// ¿El punto de venta muestra los productos con su foto? Si nunca se eligió, la Verdulería arranca con fotos.
function puntoVentaConImagenes(pv){
  if(!pv) return false;
  if(pv.vistaImagenes!=null) return !!pv.vistaImagenes;
  return normalizeStr(pv.nombre).indexOf('verdul')>=0;
}

function PedidoPendienteDetalle(props){
  var pedido = props.pedido;
  var app = useApp();
  var productos = app.productos, categorias = app.categorias;
  var agregarItemPedidoPendiente = app.agregarItemPedidoPendiente, actualizarCantidadItemPedidoPendiente = app.actualizarCantidadItemPedidoPendiente,
      quitarItemPedidoPendiente = app.quitarItemPedidoPendiente, eliminarPedidoPendiente = app.eliminarPedidoPendiente,
      actualizarClientePedidoPendiente = app.actualizarClientePedidoPendiente;
  var editableS = useState(null); var editable = editableS[0]; var setEditable = editableS[1];
  var agregarItemEditable = useApp().agregarItemEditable, editarItemEditable = useApp().editarItemEditable;
  var showCambiarClienteS = useState(false); var showCambiarCliente = showCambiarClienteS[0]; var setShowCambiarCliente = showCambiarClienteS[1];
  var showCambiarAtiendeS = useState(false); var showCambiarAtiende = showCambiarAtiendeS[0]; var setShowCambiarAtiende = showCambiarAtiendeS[1];
  var actualizarAtendioPorPedido = app.actualizarAtendioPorPedido;

  var searchS = useState(''); var search = searchS[0]; var setSearch = searchS[1];
  var filterCatS = useState('all'); var filterCat = filterCatS[0]; var setFilterCat = filterCatS[1];
  var confirmCancelarS = useState(false); var confirmCancelar = confirmCancelarS[0]; var setConfirmCancelar = confirmCancelarS[1];
  var grupoAbiertoS = useState(null); var grupoAbierto = grupoAbiertoS[0]; var setGrupoAbierto = grupoAbiertoS[1];
  var pesoProdS = useState(null); var pesoProd = pesoProdS[0]; var setPesoProd = pesoProdS[1];
  var escanerS = useState(false); var escaner = escanerS[0]; var setEscaner = escanerS[1];

  var catById = {}; categorias.forEach(function(c){ catById[c.id]=c; });
  var items = pedido.items || [];
  var pvDelPedido = (app.puntosVenta||[]).find(function(x){ return x.id===puntoVentaDePedido(pedido); }) || null;
  var conImagenes = puntoVentaConImagenes(pvDelPedido);

  // Ranking de ventas (solo para el módulo Pedidos): cuántas veces se vendió cada producto
  // en ventas no anuladas. Así los más pedidos quedan arriba y la lista se va acomodando sola.
  var ventasApp = app.ventas;
  var vecesVendido = useMemo(function(){
    var cont = {};
    (ventasApp||[]).forEach(function(v){
      if(ventaAnulada(v)) return;
      (v.items||[]).forEach(function(it){ if(it.productoId) cont[it.productoId] = (cont[it.productoId]||0) + 1; });
    });
    return cont;
  }, [ventasApp]);

  var disponibles = useMemo(function(){
    var pvPedido = puntoVentaDePedido(pedido);
    var lista = productos.filter(function(p){
      if(!p.activo || (tieneControlStock(p) && p.stock<=0)) return false;
      if(!productoEnPuntoVenta(p, pvPedido)) return false;
      if(filterCat!=='all' && p.categoriaId!==filterCat) return false;
      if(search && p.nombre.toLowerCase().indexOf(search.toLowerCase())===-1 && p.sku.toLowerCase().indexOf(search.toLowerCase())===-1) return false;
      return true;
    });
    // Los productos de un mismo grupo (x1, x6, x12...) suman sus ventas para ubicar el grupo completo
    var porGrupo = {};
    lista.forEach(function(p){ if(p.grupoId) porGrupo[p.grupoId] = (porGrupo[p.grupoId]||0) + (vecesVendido[p.id]||0); });
    function puntaje(p){ return p.grupoId ? porGrupo[p.grupoId] : (vecesVendido[p.id]||0); }
    return lista.sort(function(a,b){
      var d = puntaje(b) - puntaje(a);
      if(d!==0) return d;
      return (a.nombreBase||a.nombre).localeCompare(b.nombreBase||b.nombre) || a.nombre.localeCompare(b.nombre);
    });
  }, [productos, search, filterCat, vecesVendido, pedido.puntoVentaId]);

  function abrirEditableNuevo(p){ setEditable({ producto:p, idx:null, item:null }); }
  // Lector de códigos: el código escaneado (o escrito + Enter) agrega el producto al pedido
  function agregarPorCodigo(txt){
    var cod = String(txt||'').trim(); if(!cod) return false;
    var p = productos.find(function(x){ return x.activo && x.sku && String(x.sku)===cod; });
    if(!p){ app.pushToast('No hay ningún producto con el código '+cod, 'error'); return false; }
    if(tieneControlStock(p) && p.stock<=0){ app.pushToast('"'+p.nombre+'" no tiene stock', 'error'); return true; }
    if(p.editableAlVender) abrirEditableNuevo(p); else if(isDecimalUnit(p.unidad)) setPesoProd({ producto:p }); else agregarItemPedidoPendiente(pedido.id, p, 1);
    return true;
  }
  function abrirEditableItem(idx){
    var it = items[idx]; if(!it) return;
    var prod = productos.find(function(x){ return x.id===it.productoId; }) || { id:it.productoId, nombre:it.nombre, precioVenta:it.precioUnit };
    setEditable({ producto:prod, idx:idx, item:it });
  }
  function confirmarEditable(datos){
    if(editable && editable.idx!=null) editarItemEditable('pedido', pedido.id, editable.idx, datos);
    else if(editable) agregarItemEditable('pedido', pedido.id, editable.producto, datos);
    setEditable(null);
  }
  function handleCancelarPedido(){
    eliminarPedidoPendiente(pedido.id).then(function(ok){ if(ok) props.onBack(); });
  }

  return h('div', { style:{ animation:'fadeIn 0.2s ease-out' } },
    h('button', { onClick:props.onBack, style:{ display:'inline-flex', alignItems:'center', gap:6, background:'var(--panel)', border:'1px solid var(--border)', borderRadius:8, color:'var(--ink-soft)', fontSize:13, fontWeight:700, padding:'8px 14px', marginBottom:14, cursor:'pointer', boxShadow:'var(--shadow)' } }, '← Todos los pedidos'),
    h('div', { style:{ marginBottom:18, display:'flex', justifyContent:'space-between', alignItems:'flex-start', flexWrap:'wrap', gap:10 } },
      h('div', null,
        h('h1', { className:'display', style:{ fontSize:22, margin:'0 0 4px' } }, pedido.clienteNombre || 'Consumidor Final'),
        h('p', { style:{ margin:0, color:'var(--ink-soft)', fontSize:13.5 } }, items.length===0 ? 'Sin ítems — tocá un producto para agregarlo' : 'Pedido abierto hace '+tiempoTranscurrido(pedido.creadoEn)),
        h('button', { type:'button', onClick:function(){ setShowCambiarCliente(true); }, style:{ marginTop:6, background:'var(--green-bg)', border:'1px solid var(--green)', borderRadius:6, color:'var(--green-dark)', fontWeight:700, fontSize:12, padding:'3px 10px', cursor:'pointer' } }, 'Cambiar cliente'),
        h('div', { style:{ display:'flex', alignItems:'center', gap:6, marginTop:8 } },
          h('span', { style:{ fontSize:12.5, color:'var(--ink-faint)' } }, 'Atiende: '+(pedido.atendioPor || 'sin asignar')),
          h('button', { type:'button', onClick:function(){ setShowCambiarAtiende(true); }, style:{ background:'var(--green-bg)', border:'1px solid var(--green)', borderRadius:6, color:'var(--green-dark)', fontWeight:700, fontSize:12, padding:'3px 10px', cursor:'pointer' } }, 'Cambiar')
        )
      )
    ),
    h('div', { className:'caja-layout', style:{ display:'grid', gridTemplateColumns:'1.6fr 1fr', gap:18, alignItems:'start' } },
      h('div', null,
        h('div', { style:{ display:'flex', gap:10, marginBottom:14, flexWrap:'wrap' } },
          h('div', { style:{ position:'relative', flex:'1 1 220px' } },
            h('span', { style:{ position:'absolute', left:11, top:11, color:'var(--ink-faint)' } }, Icon('search',16)),
            h(TextInput, { value:search, onChange:function(e){setSearch(e.target.value);}, onKeyDown:function(e){ if(e.key==='Enter'){ e.preventDefault(); if(agregarPorCodigo(search)) setSearch(''); } }, placeholder:'Buscar o escanear código de barras...', style:{ paddingLeft:34 } })
          ),
          h(BotonEscanear, { onClick:function(){ setEscaner(true); } }),
          h(EscanerCodigoModal, { open:escaner, continuo:true, titulo:'Escanear productos', onClose:function(){ setEscaner(false); },
            onDetected:function(cod){
              var p = productos.find(function(x){ return x.activo && x.sku && String(x.sku)===cod; });
              // Si el producto pide peso, precio o elegir opción, se cierra la cámara para mostrar esa ventana
              if(p && (p.editableAlVender || isDecimalUnit(p.unidad))) setEscaner(false);
              if(agregarPorCodigo(cod) && p && !p.editableAlVender && !isDecimalUnit(p.unidad)) app.pushToast('Agregado: '+p.nombre, 'success');
            } }),
          h(Select, { value:filterCat, onChange:function(e){ setFilterCat(e.target.value); }, style:{ width:'auto', minWidth:180 } },
            h('option', { value:'all' }, 'Todas las categorías'),
            categorias.map(function(c){ return h('option', { key:c.id, value:c.id }, c.nombre); })
          ),
          pvDelPedido ? h('div', { style:{ display:'flex', border:'1px solid var(--border)', borderRadius:9, overflow:'hidden', flexShrink:0 } },
            [{ v:false, l:'Lista', i:'menu' }, { v:true, l:'Con fotos', i:'image' }].map(function(o){
              var act = conImagenes===o.v;

            })

        disponibles.length===0 ? h(EmptyState, { icon:Icon('package',26), title:'Sin resultados', message:'No hay productos disponibles con estos filtros.' }) :
        conImagenes ? h('div', { style:{ display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(140px, 1fr))', gap:12, maxHeight:'calc(100vh - 220px)', overflowY:'auto', padding:2 } },
          agruparProductosParaVenta(disponibles).map(function(g){
            if(g.tipo==='grupo'){
              var tot = 0; g.items.forEach(function(p){ items.forEach(function(i){ if(i.productoId===p.id) tot += i.cantidad; }); });

    return productos.filter(function(p){
      if(!p.activo || (tieneControlStock(p) && p.stock<=0)) return false;
      if(filterCat!=='all' && p.categoriaId!==filterCat) return false;
      if(search && p.nombre.toLowerCase().indexOf(search.toLowerCase())===-1 && p.sku.toLowerCase().indexOf(search.toLowerCase())===-1) return false;
      return true;
    }).sort(function(a,b){return a.nombre.localeCompare(b.nombre);});
  }, [productos, search, filterCat]);

  if(!entidad){
    return h('div', { style:{ animation:'fadeIn 0.2s ease-out' } },
      h('button', { onClick:props.onBack, style:{ display:'inline-flex', alignItems:'center', gap:6, background:'var(--panel)', border:'1px solid var(--border)', borderRadius:8, color:'var(--ink-soft)', fontSize:13, fontWeight:700, padding:'8px 14px', marginBottom:14, cursor:'pointer', boxShadow:'var(--shadow)' } }, '← Pendientes de cobro'),
      h(EmptyState, { icon:Icon('cash',26), title:'Ya no está disponible', message:'Este pedido ya fue cobrado o cancelado desde otro dispositivo.' })
    );
  }

  var nombre = entidad.clienteNombre || 'Consumidor Final';
  var pvNombresGrupo = [], atiendenGrupo = [];
  pedidosGrupo.forEach(function(ped){
    var n = nombresPV[puntoVentaDePedido(ped)] || 'Despensa';
    if(pvNombresGrupo.indexOf(n)<0) pvNombresGrupo.push(n);
    var a = (ped.atendioPor||'').trim(); if(a && atiendenGrupo.indexOf(a)<0) atiendenGrupo.push(a);
  });

  function abrirEditableNuevo(p){ setEditable({ producto:p, idx:null, item:null }); }
  function agregarPorCodigo(txt){
    var cod = String(txt||'').trim(); if(!cod) return false;
    var p = productos.find(function(x){ return x.activo && x.sku && String(x.sku)===cod; });
    if(!p){ app.pushToast('No hay ningún producto con el código '+cod, 'error'); return false; }
    if(tieneControlStock(p) && p.stock<=0){ app.pushToast('"'+p.nombre+'" no tiene stock', 'error'); return true; }
    tocarProducto(p);
    return true;
  }
  function abrirEditableItem(idx){
    var l = lineas[idx]; if(!l) return;
    var it = l.item;
    var prod = productos.find(function(x){ return x.id===it.productoId; }) || { id:it.productoId, nombre:it.nombre, precioVenta:it.precioUnit };
    setEditable({ producto:prod, idx:l.idx, pedidoId:l.pedidoId, item:it });
  }
  function confirmarEditable(datos){
    if(editable && editable.idx!=null) editarItemEditable(tipo, editable.pedidoId, editable.idx, datos);
    else if(editable) agregarItemEditable(tipo, id, editable.producto, datos);
    setEditable(null);
  }
  function tocarProducto(p){
    if(p.editableAlVender) abrirEditableNuevo(p); else if(isDecimalUnit(p.unidad)) setPesoProd({ producto:p }); else agregarItemPedidoPendiente(id, p, 1);
  }
  function handleUpdateQty(idx, cant){ var l = lineas[idx]; if(l) actualizarCantidadItemPedidoPendiente(l.pedidoId, l.idx, cant); }
  function handleRemove(idx){ var l = lineas[idx]; if(l) quitarItemPedidoPendiente(l.pedidoId, l.idx); }
  function handleCancelar(){
    Promise.all(pedidosGrupo.map(function(ped){ return eliminarPedidoPendiente(ped.id); }))
      .then(function(res){ if(res.every(Boolean)) props.onBack(); });
  }
  function handleConfirmPago(pagoData){
    if(!app.turnoAbierto){ app.pushToast('La caja está cerrada. Abrila para poder cobrar.', 'error'); setShowPago(false); return; }
    var accion = cobrarPedidosPendientes(pedidosGrupo.map(function(ped){ return ped.id; }), pagoData);
    accion.then(function(venta){
      if(venta){
        setShowPago(false);
        props.onCobrado(venta);
      }
    });
  }

  var total = items.reduce(function(s,i){return s+i.subtotal;},0);

  return h('div', { style:{ animation:'fadeIn 0.2s ease-out' } },
    h('button', { onClick:props.onBack, style:{ display:'inline-flex', alignItems:'center', gap:6, background:'var(--panel)', border:'1px solid var(--border)', borderRadius:8, color:'var(--ink-soft)', fontSize:13, fontWeight:700, padding:'8px 14px', marginBottom:14, cursor:'pointer', boxShadow:'var(--shadow)' } }, '← Pendientes de cobro'),
    h('div', { style:{ marginBottom:18, display:'flex', justifyContent:'space-between', alignItems:'flex-start', flexWrap:'wrap', gap:10 } },
      h('div', null,
        h('h1', { className:'display', style:{ fontSize:22, margin:'0 0 4px' } }, nombre),
        h('p', { style:{ margin:0, color:'var(--ink-soft)', fontSize:13.5 } }, (unificado ? pedidosGrupo.length+' pedidos unificados: '+pvNombresGrupo.join(' + ') : 'Pedido de '+pvNombresGrupo[0]) + (atiendenGrupo.length ? ' · Atiende: '+atiendenGrupo.join(', ') : '')),
        unificado ? h('div', { style:{ display:'inline-flex', alignItems:'center', gap:6, marginTop:8, background:'var(--green-bg)', color:'var(--green-dark)', borderRadius:8, padding:'5px 10px', fontSize:12, fontWeight:700 } }, Icon('check',13), 'Se cobran juntos en una sola venta') : null
      )
    ),
    h('div', { className:'caja-layout', style:{ display:'grid', gridTemplateColumns:'1.6fr 1fr', gap:18, alignItems:'start' } },
      h('div', null,
        h('div', { style:{ display:'flex', gap:10, marginBottom:14, flexWrap:'wrap' } },
          h('div', { style:{ position:'relative', flex:'1 1 220px' } },
            h('span', { style:{ position:'absolute', left:11, top:11, color:'var(--ink-faint)' } }, Icon('search',16)),
            h(TextInput, { value:search, onChange:function(e){setSearch(e.target.value);}, onKeyDown:function(e){ if(e.key==='Enter'){ e.preventDefault(); if(agregarPorCodigo(search)) setSearch(''); } }, placeholder:'Buscar o escanear código de barras...', style:{ paddingLeft:34 } })
          ),
          h(BotonEscanear, { onClick:function(){ setEscaner(true); } }),
          h(EscanerCodigoModal, { open:escaner, continuo:true, titulo:'Escanear productos', onClose:function(){ setEscaner(false); },
            onDetected:function(cod){
              var p = productos.find(function(x){ return x.activo && x.sku && String(x.sku)===cod; });
              // Si el producto pide peso, precio o elegir opción, se cierra la cámara para mostrar esa ventana
              if(p && (p.editableAlVender || isDecimalUnit(p.unidad))) setEscaner(false);
              if(agregarPorCodigo(cod) && p && !p.editableAlVender && !isDecimalUnit(p.unidad)) app.pushToast('Agregado: '+p.nombre, 'success');
            } }),
          h(Select, { value:filterCat, onChange:function(e){ setFilterCat(e.target.value); }, style:{ width:'auto', minWidth:180 } },
            h('option', { value:'all' }, 'Todas las categorías'),
            categorias.map(function(c){ return h('option', { key:c.id, value:c.id }, c.nombre); })
          )
        ),
        disponibles.length===0 ? h(EmptyState, { icon:Icon('package',26), title:'Sin resultados', message:'No hay productos disponibles con estos filtros.' }) :
        h('div', { style:{ background:'var(--panel)', border:'1px solid var(--border)', borderRadius:12, overflow:'hidden', boxShadow:'var(--shadow)', maxHeight:'calc(100vh - 220px)', overflowY:'auto' } },
          agruparProductosParaVenta(disponibles).map(function(g, idx){
            if(g.tipo==='grupo'){
              return h(GrupoProductoRow, {
                key:g.id, idx:idx, grupo:g, catById:catById,

            } },

              h('div', { style:{ textAlign:'right', flexShrink:0 } },
                h('div', { className:'mono', style:{ fontSize:15, fontWeight:800, color:'var(--green-dark)' } }, fmtMoney(p.precioVenta), isDecimalUnit(p.unidad)?h('span',{style:{fontWeight:500,fontSize:11}},'/'+fmtUnidad(p.unidad)):null)
              )

      ),
      h(CobroDetalleTicketPanel, {
        onEditItem:abrirEditableItem,
        items:items,
        onRemove:handleRemove,
        onUpdateQty:handleUpdateQty,

function filasResumenTurno(rs){
  return [
    { t:'Efectivo inicial', v: rs.montoInicial },
    { t:'Ventas en efectivo', v: rs.ventasEfectivo, signo:'+' },
    rs.cobrosCCEfectivo>0 ? { t:'Cobros de cuenta corriente (efectivo)', v: rs.cobrosCCEfectivo, signo:'+' } : null,
    rs.ingresos>0 ? { t:'Ingresos de efectivo', v: rs.ingresos, signo:'+' } : null,
    rs.egresos>0 ? { t:'Retiros / gastos', v: rs.egresos, signo:'−' } : null,
    { t:'EFECTIVO QUE DEBERÍA HABER', v: rs.efectivoEsperado, fuerte:true }
  ].filter(Boolean);
}
function filasOtrosTurno(rs){
  return [
    { t:'Ventas ('+rs.cantVentas+')', v: rs.totalVendido },
  ].concat((rs.porPuntoVenta||[]).map(function(p){ return { t:'· '+p.nombre, v:p.total }; })).concat([
    { t:'Transferencias', v: rs.totalTransferencias },
    (rs.ventasDebito>0) ? { t:'Tarjeta de débito', v: rs.ventasDebito } : null,
    (rs.ventasCredito>0) ? { t:'Tarjeta de crédito', v: rs.ventasCredito } : null,
    { t:'A cuenta corriente', v: rs.ventasCuentaCorriente },
    rs.propinas>0 ? { t:'Propinas (ya sumadas en efectivo/transf.)', v: rs.propinas } : null
  ]).filter(Boolean);
}

function textoDiferencia(dif){
  if(Math.abs(dif)<0.005) return { txt:'Caja justa', color:'var(--green-dark)', bg:'var(--green-bg)' };
  if(dif>0) return { txt:'Sobrante '+fmtMoney(dif), color:'var(--blue)', bg:'var(--blue-bg)' };
  return { txt:'Faltante '+fmtMoney(-dif), color:'var(--red)', bg:'var(--red-bg)' };
}

function imprimirCierreCaja(turno, churros){
  var cfg = window.__appConfig || {};
  var rs = turno.resumen;
  var linea = function(t, v, fuerte){ return '<div style="font-size:11px;display:flex;justify-content:space-between;'+(fuerte?'font-weight:900;':'')+'"><span>'+escHtml(t)+'</span><span>'+fmtMoney(v)+'</span></div>'; };
  var sep = '<div style="border-top:1px dashed #000;margin:4px 0;"></div>';
  var html = '';
  html += '<div style="text-align:center;font-weight:900;font-size:15px;">'+escHtml(cfg.nombreNegocio||'MI COMERCIO')+'</div>';
  html += '<div style="text-align:center;font-weight:900;font-size:13px;margin:2px 0 4px;">CIERRE DE CAJA</div>';
  var hora = function(iso){ return new Date(iso).toLocaleTimeString('es-AR', { hour:'2-digit', minute:'2-digit', hour12:false })+' hs'; };
  html += '<div style="font-size:11px;font-weight:900;">APERTURA</div>';
  html += '<div style="font-size:11px;display:flex;justify-content:space-between;"><span>Fecha: '+fmtDate(turno.abiertaEn)+'</span><span>Hora: '+hora(turno.abiertaEn)+'</span></div>';
  if(turno.abiertaPor) html += '<div style="font-size:11px;">Abrió: '+escHtml(turno.abiertaPor)+'</div>';
  html += '<div style="font-size:11px;font-weight:900;margin-top:4px;">CIERRE</div>';
  html += '<div style="font-size:11px;display:flex;justify-content:space-between;"><span>Fecha: '+fmtDate(turno.cerradaEn)+'</span><span>Hora: '+hora(turno.cerradaEn)+'</span></div>';
  if(turno.cerradaPor) html += '<div style="font-size:11px;">Cerró: '+escHtml(turno.cerradaPor)+'</div>';
  html += sep;
  filasResumenTurno(rs).forEach(function(f){ html += linea((f.signo?f.signo+' ':'')+f.t, f.v, f.fuerte); });
  html += linea('Efectivo contado', turno.efectivoContado, true);
  html += '<div style="font-size:12px;font-weight:900;text-align:center;margin:4px 0;">'+escHtml(textoDiferencia(turno.diferencia).txt)+'</div>';
  if(turno.quedaEnCaja!=null) html += linea('Queda en caja', turno.quedaEnCaja);
  html += sep;
  filasOtrosTurno(rs).forEach(function(f){ html += linea(f.t, f.v); });
  var ch = churros || rs.churros || { lineas:[], total:0 };
  html += sep + '<div style="font-size:11px;font-weight:900;">CHURROS</div>';
  if(ch.lineas.length===0) html += '<div style="font-size:11px;">Sin ventas de churros</div>';
  ch.lineas.forEach(function(l){ html += '<div style="font-size:11px;display:flex;justify-content:space-between;"><span>'+escHtml(l.nombre)+' x '+textoCantidadChurro(l)+'</span><span>'+fmtMoney(l.total)+'</span></div>'; });
  if(ch.lineas.length>0) html += linea('Total churros', ch.total, true);
  var movs = turno.movimientos||[];
  if(movs.length){
    html += sep + '<div style="font-size:11px;font-weight:900;">Movimientos</div>';
    movs.forEach(function(x){ html += linea((x.tipo==='ingreso'?'+ ':'− ')+(x.motivo||(x.tipo==='ingreso'?'Ingreso':'Retiro')), x.monto); });
  }
  if(turno.observaciones) html += sep + '<div style="font-size:11px;">Obs.: '+escHtml(turno.observaciones)+'</div>';
  html += sep + '<div style="font-size:11px;margin-top:18px;">Firma: ____________________</div>';
  var cont = document.getElementById('__ticket-print-root');
  if(!cont){ cont = document.createElement('div'); cont.id = '__ticket-print-root'; cont.className = 'print-only'; document.body.appendChild(cont); }
  cont.innerHTML = html;
  window.print();
  setTimeout(function(){ cont.innerHTML = ''; }, 1000);
}

// ── Cierre de caja por la térmica (QZ Tray, ESC/POS) ─────────────────────────
// Mismo mecanismo que el ticket de venta: comandos crudos directo a la impresora
// configurada en Ajustes. Si QZ Tray no responde, cae al diálogo (imprimirCierreCaja).
function escposFila(izq, der, ancho){
  ancho = ancho || 32;
  izq = String(izq); der = String(der);
  if(izq.length + der.length + 1 <= ancho) return escposLineaDosColumnas(izq, der, ancho) + '\n';
  // Etiqueta larga: va sola en una línea y el importe alineado a la derecha abajo
  return izq + '\n' + escposLineaDosColumnas('', der, ancho) + '\n';
}

function buildEscPosCierre(turno, churros, cfg){
  var ESC = '\x1B', GS = '\x1D';
  var ANCHO = 32;
  var NEG_ON = ESC + 'E' + '\x01', NEG_OFF = ESC + 'E' + '\x00';
  var raya = new Array(ANCHO+1).join('-');
  var rs = turno.resumen || {};
  var hora = function(iso){ return new Date(iso).toLocaleTimeString('es-AR', { hour:'2-digit', minute:'2-digit', hour12:false }) + ' hs'; };
  var fila = function(t, v, fuerte){
    var s = escposFila(t, fmtMoney(v), ANCHO);
    return fuerte ? NEG_ON + s + NEG_OFF : s;
  };
  var out = '';

  out += ESC + '@';
  out += ESC + 'a' + '\x01';                       // centrado
  out += ESC + '!' + '\x38';                       // negrita + doble alto/ancho
  out += (cfg.nombreNegocio || 'MI COMERCIO') + '\n';
  out += ESC + '!' + '\x00';
  out += NEG_ON + 'CIERRE DE CAJA' + NEG_OFF + '\n';
  out += ESC + 'a' + '\x00';                       // izquierda
  out += raya + '\n';

  out += NEG_ON + 'APERTURA' + NEG_OFF + '\n';
  out += escposLineaDosColumnas(fmtDate(turno.abiertaEn), hora(turno.abiertaEn), ANCHO) + '\n';
  if(turno.abiertaPor) out += 'Abrio: ' + turno.abiertaPor + '\n';
  out += NEG_ON + 'CIERRE' + NEG_OFF + '\n';
  out += escposLineaDosColumnas(fmtDate(turno.cerradaEn), hora(turno.cerradaEn), ANCHO) + '\n';
  if(turno.cerradaPor) out += 'Cerro: ' + turno.cerradaPor + '\n';
  out += raya + '\n';

  out += NEG_ON + 'EFECTIVO EN CAJA' + NEG_OFF + '\n';
  filasResumenTurno(rs).forEach(function(f){
    var signo = f.signo ? (f.signo==='+' ? '+ ' : '- ') : '';
    out += fila(signo + f.t, f.v, f.fuerte);
  });
  out += fila('Efectivo contado', turno.efectivoContado, true);
  out += ESC + 'a' + '\x01';
  out += ESC + '!' + '\x18';                       // negrita + doble alto
  out += textoDiferencia(turno.diferencia || 0).txt + '\n';
  out += ESC + '!' + '\x00';
  out += ESC + 'a' + '\x00';
  if(turno.quedaEnCaja != null) out += fila('Queda en caja', turno.quedaEnCaja);
  out += raya + '\n';

  out += NEG_ON + 'RESUMEN DEL TURNO' + NEG_OFF + '\n';
  filasOtrosTurno(rs).forEach(function(f){ out += fila(f.t, f.v); });
  out += raya + '\n';

  var ch = churros || rs.churros || { lineas:[], total:0 };
  out += NEG_ON + 'CHURROS' + NEG_OFF + '\n';
  if(ch.lineas.length === 0) out += 'Sin ventas de churros\n';
  ch.lineas.forEach(function(l){ out += fila(l.nombre + ' x ' + textoCantidadChurro(l), l.total); });
  if(ch.lineas.length > 0) out += fila('Total churros', ch.total, true);

  var movs = turno.movimientos || [];
  if(movs.length){
    out += raya + '\n';
    out += NEG_ON + 'INGRESOS Y RETIROS' + NEG_OFF + '\n';
    movs.forEach(function(x){
      out += fila((x.tipo==='ingreso' ? '+ ' : '- ') + (x.motivo || (x.tipo==='ingreso' ? 'Ingreso' : 'Retiro')), x.monto);
    });
  }
  if(turno.observaciones){
    out += raya + '\n';
    out += 'Obs.: ' + turno.observaciones + '\n';
  }
  out += raya + '\n\n\n';
  out += 'Firma: ____________________\n';
  out += '\n\n\n';
  out += GS + 'V' + '\x42' + '\x00';               // corte parcial de papel
  return escposLimpiarTexto(out);
}

// ── Comprobantes de ingresos / retiros / pagos a proveedores ─────────────────
// Con 1 movimiento imprime un comprobante con firma; con varios, un listado con totales.
function tituloMovCaja(x){ return x.tipo==='ingreso' ? 'INGRESO DE EFECTIVO' : 'RETIRO / PAGO'; }
function totalesMovsCaja(movs){
  var ing = 0, egr = 0;
  (movs||[]).forEach(function(x){ if(x.tipo==='ingreso') ing += x.monto||0; else egr += x.monto||0; });
  return { ingresos:r2(ing), egresos:r2(egr) };
}

function buildEscPosMovimientos(movs, subtitulo, cfg){
  var ESC = '\x1B', GS = '\x1D', ANCHO = 32;
  var NEG_ON = ESC + 'E' + '\x01', NEG_OFF = ESC + 'E' + '\x00';
  var raya = new Array(ANCHO+1).join('-');
  var hora = function(iso){ return new Date(iso).toLocaleTimeString('es-AR', { hour:'2-digit', minute:'2-digit', hour12:false }) + ' hs'; };
  var unico = movs.length===1;
  var out = '';
  out += ESC + '@' + ESC + 'a' + '\x01';
  out += ESC + '!' + '\x38' + (cfg.nombreNegocio || 'MI COMERCIO') + '\n' + ESC + '!' + '\x00';
  if(cfg.telefonoNegocio) out += 'Tel: ' + cfg.telefonoNegocio + '\n';
  out += NEG_ON + (unico ? 'COMPROBANTE DE CAJA' : 'INGRESOS Y RETIROS') + NEG_OFF + '\n';
  if(subtitulo) out += subtitulo + '\n';
  out += 'Impreso: ' + fmtDateTime(nowISO()) + '\n';
  out += ESC + 'a' + '\x00' + raya + '\n';
  if(unico){
    var x = movs[0];
    out += NEG_ON + tituloMovCaja(x) + NEG_OFF + '\n';
    out += escposLineaDosColumnas(fmtDate(x.fecha), hora(x.fecha), ANCHO) + '\n';
    out += 'Motivo: ' + (x.motivo || '-') + '\n';
    out += 'Hecho por: ' + (x.hechoPor || '-') + '\n';
    out += raya + '\n';
    out += ESC + 'a' + '\x01' + ESC + '!' + '\x30' + fmtMoney(x.monto) + '\n' + ESC + '!' + '\x00' + ESC + 'a' + '\x00';
    out += raya + '\n\n\n';
    out += 'Firma: ____________________\n\n';
    out += 'Aclaracion: _______________\n';
  } else {
    movs.forEach(function(x){
      out += fmtDate(x.fecha) + ' ' + hora(x.fecha) + (x.hechoPor ? ' - ' + x.hechoPor : '') + '\n';
      out += escposFila((x.tipo==='ingreso' ? '+ ' : '- ') + (x.motivo || (x.tipo==='ingreso' ? 'Ingreso' : 'Retiro')), fmtMoney(x.monto), ANCHO);
    });
    var t = totalesMovsCaja(movs);
    out += raya + '\n';
    out += escposFila('Total ingresos', fmtMoney(t.ingresos), ANCHO);
    out += NEG_ON + escposFila('Total retiros/pagos', fmtMoney(t.egresos), ANCHO) + NEG_OFF;
  }
  out += '\n\n\n' + GS + 'V' + '\x42' + '\x00';
  return escposLimpiarTexto(out);
}

function imprimirMovimientosCaja(movs, subtitulo){
  var cfg = window.__appConfig || {};
  var sep = '<div style="border-top:1px dashed #000;margin:4px 0;"></div>';
  var hora = function(iso){ return new Date(iso).toLocaleTimeString('es-AR', { hour:'2-digit', minute:'2-digit', hour12:false })+' hs'; };
  var linea = function(t, v, fuerte){ return '<div style="font-size:11px;display:flex;justify-content:space-between;'+(fuerte?'font-weight:900;':'')+'"><span>'+escHtml(t)+'</span><span>'+fmtMoney(v)+'</span></div>'; };
  var unico = movs.length===1;
  var html = '<div style="text-align:center;font-weight:900;font-size:15px;">'+escHtml(cfg.nombreNegocio||'MI COMERCIO')+'</div>';
  if(cfg.telefonoNegocio) html += '<div style="text-align:center;font-size:11px;">Tel: '+escHtml(cfg.telefonoNegocio)+'</div>';
  html += '<div style="text-align:center;font-weight:900;font-size:13px;margin:2px 0;">'+(unico?'COMPROBANTE DE CAJA':'INGRESOS Y RETIROS')+'</div>';
  if(subtitulo) html += '<div style="text-align:center;font-size:11px;">'+escHtml(subtitulo)+'</div>';
  html += '<div style="text-align:center;font-size:10px;">Impreso: '+fmtDateTime(nowISO())+'</div>' + sep;
  if(unico){
    var x = movs[0];
    html += '<div style="font-size:12px;font-weight:900;">'+tituloMovCaja(x)+'</div>';
    html += '<div style="font-size:11px;display:flex;justify-content:space-between;"><span>'+fmtDate(x.fecha)+'</span><span>'+hora(x.fecha)+'</span></div>';
    html += '<div style="font-size:11px;">Motivo: '+escHtml(x.motivo||'-')+'</div>';
    html += '<div style="font-size:11px;">Hecho por: '+escHtml(x.hechoPor||'-')+'</div>' + sep;
    html += '<div style="text-align:center;font-weight:900;font-size:18px;">'+fmtMoney(x.monto)+'</div>' + sep;
    html += '<div style="font-size:11px;margin-top:22px;">Firma: ____________________</div>';
    html += '<div style="font-size:11px;margin-top:14px;">Aclaración: _______________</div>';
  } else {
    movs.forEach(function(x){
      html += '<div style="font-size:10px;margin-top:3px;">'+fmtDate(x.fecha)+' '+hora(x.fecha)+(x.hechoPor?' - '+escHtml(x.hechoPor):'')+'</div>';
      html += linea((x.tipo==='ingreso'?'+ ':'− ')+(x.motivo||(x.tipo==='ingreso'?'Ingreso':'Retiro')), x.monto);
    });
    var t = totalesMovsCaja(movs);
    html += sep + linea('Total ingresos', t.ingresos) + linea('Total retiros/pagos', t.egresos, true);
  }
  var cont = document.getElementById('__ticket-print-root');
  if(!cont){ cont = document.createElement('div'); cont.id = '__ticket-print-root'; cont.className = 'print-only'; document.body.appendChild(cont); }
  cont.innerHTML = html;
  window.print();
  setTimeout(function(){ cont.innerHTML = ''; }, 1000);
}

function imprimirMovimientosCajaQZ(movs, subtitulo){
  movs = (movs||[]).slice().sort(function(a,b){ return (a.fecha||'').localeCompare(b.fecha||''); });
  if(!movs.length){ if(window.__pushToastGlobal) window.__pushToastGlobal('No hay movimientos para imprimir', 'error'); return Promise.resolve(); }

function CajaModule(){
  var app = useApp();
  var pedidosPendientes = app.pedidosPendientes, puntosVenta = app.puntosVenta || [];
  var ventaConfirmadaS = useState(null); var ventaConfirmada = ventaConfirmadaS[0]; var setVentaConfirmada = ventaConfirmadaS[1];
  var selectedS = useState(null); var selected = selectedS[0]; var setSelected = selectedS[1];

  var cobrables = useMemo(function(){
    var nombrePV = {}; puntosVenta.forEach(function(x){ nombrePV[x.id] = x.nombre; });
    var mostrarPV = puntosVenta.length>1;
    // Los pedidos con el mismo nombre de cliente (de cualquier punto de venta) se juntan en una sola
    // tarjeta y se cobran como una única venta. "Consumidor Final" o sin nombre nunca se juntan.
    var grupos = {}, orden = [];
    pedidosPendientes.forEach(function(p){
      var n = normalizeStr(p.clienteNombre);
      var clave = (!n || n==='consumidor final') ? 'id:'+p.id : 'cli:'+n;
      if(!grupos[clave]){ grupos[clave] = []; orden.push(clave); }
      grupos[clave].push(p);
    });
    return orden.map(function(clave){
      var peds = grupos[clave].slice().sort(function(a,b){ return (a.creadoEn||'').localeCompare(b.creadoEn||''); });
      var items = [], pvs = [];
      peds.forEach(function(p){
        items = items.concat(p.items||[]);
        var n = nombrePV[puntoVentaDePedido(p)] || 'Despensa';
        if(pvs.indexOf(n)<0) pvs.push(n);
      });
      var total = items.reduce(function(s,i){return s+i.subtotal;},0);
      var cantItems = items.reduce(function(s,i){return s+i.cantidad;},0);
      return { id:clave, clave:clave, ids: peds.map(function(p){ return p.id; }), cantPedidos: peds.length, tipo:'pedido',
        nombre: peds[0].clienteNombre||'Consumidor Final', total:total, cantItems:cantItems, tiempo:peds[0].creadoEn, items:items,
        puntoVenta: (mostrarPV || peds.length>1) ? pvs.join(' + ') : null };
    });
  }, [pedidosPendientes, puntosVenta]);

  var turnoAbierto = app.turnoAbierto;
  var contenido = !turnoAbierto ?
    h('div', { style:{ animation:'fadeIn 0.2s ease-out' } },
      h('div', { style:{ marginBottom:18 } }, h('h1', { className:'display', style:{ fontSize:22, margin:'0 0 4px' } }, 'Caja / Cobro'), h('p', { style:{ margin:0, color:'var(--ink-soft)', fontSize:13.5 } }, 'Apertura de caja')),
      h(CajaCerradaPanel, { pendientes: cobrables.length })
    ) :
    selected ?
    h(CobroDetalle, {
      // Se toma el grupo actual: si otro punto de venta suma un pedido del mismo cliente mientras se cobra, se incorpora
      ids: (function(){ var g = cobrables.find(function(c){ return c.clave===selected.clave; }); return g ? g.ids : selected.ids; })(),
      tipo:selected.tipo,
      onBack:function(){ setSelected(null); },
      onCobrado:function(venta){ setSelected(null); setVentaConfirmada(venta); }
    }) :
    h('div', { style:{ animation:'fadeIn 0.2s ease-out' } },
      h('div', { style:{ marginBottom:18, display:'flex', justifyContent:'space-between', alignItems:'flex-start', flexWrap:'wrap', gap:10 } },
        h('div', null, h('h1', { className:'display', style:{ fontSize:22, margin:'0 0 4px' } }, 'Caja / Cobro'), h('p', { style:{ margin:0, color:'var(--ink-soft)', fontSize:13.5 } }, 'Tocá un pedido para ver sus productos, agregar más si hace falta, y cobrarlo'))
      ),
      cobrables.length===0 ?
        h(EmptyState, { icon:Icon('cash',26), title:'Nada pendiente de cobro', message:'Cuando se arme un pedido en cualquier punto de venta, va a aparecer acá para cobrarlo.' }) :
        h(PedidosPendientesCobroPanel, { items:cobrables, onCobrar:function(it){ setSelected({ clave:it.clave, ids:it.ids, tipo:it.tipo }); } })
    );

  return h('div', null,
    h(CajaTurnoBar, null),
    contenido,
    h(VentaExitosaModal, { venta:ventaConfirmada, onClose:function(){setVentaConfirmada(null);} })
  );
}

function AnularVentaForm(props){
  var app = useApp();

  var quienS = useState(''); var quien = quienS[0]; var setQuien = quienS[1];
  var claveS = useState(''); var clave = claveS[0]; var setClave = claveS[1];

  var pagosPosteriores = movsCC.filter(function(m){ return m.tipo==='pago' && m.aplicadoAVentaId===venta.id; });
  var cliente = app.clientes.find(function(c){ return c.id===venta.clienteId && !c.esGenerico; });
  var turnoActual = app.turnoAbierto;
  var deOtroTurno = !turnoActual || venta.fecha < turnoActual.abiertaEn;
  var efectivo = 0;
  if(venta.metodoPago==='contado') efectivo = totalCobradoVenta(venta);

function HistorialVentasTab(){
  var appHV = useApp();
  var ventas = appHV.ventas, clientesHV = appHV.clientes, puntosVentaHV = appHV.puntosVenta;
  var searchS = useState(''); var search = searchS[0]; var setSearch = searchS[1];

  var detalleS = useState(null); var detalle = detalleS[0]; var setDetalle = detalleS[1];

  var filtered = useMemo(function(){
    var now = new Date();
    return ventas.filter(function(v){
      if(search && normalizeStr(nombreClienteVenta(v, clientesHV)+' '+(v.nombrePedido||v.clienteNombre||'')).indexOf(normalizeStr(search))===-1 && String(v.numero).indexOf(search)===-1) return false;
      if(filterMetodo==='anuladas'){ if(!ventaAnulada(v)) return false; } else if(filterMetodo!=='all' && v.metodoPago!==filterMetodo) return false;
      if(filterOrigen!=='all' && !desglosePuntosVenta(v).some(function(dp){ return dp.nombre===filterOrigen; })) return false;
      if(filterRango!=='todos'){
        var d = new Date(v.fecha);
        var diffDays = (now-d)/86400000;
        if(filterRango==='hoy' && v.fecha.slice(0,10)!==todayISO()) return false;
        if(filterRango==='7d' && diffDays>7) return false;
        if(filterRango==='30d' && diffDays>30) return false;
      }
      return true;
    });
  }, [ventas, clientesHV, search, filterMetodo, filterOrigen, filterRango]);

  }, [filterRango]);

  var validas = filtered.filter(function(v){ return !ventaAnulada(v); });
  var cantAnuladas = filtered.length - validas.length;
  var totalFiltrado = validas.reduce(function(s,v){return s+v.total;},0);
  var porMetodo = useMemo(function(){
    var m = { contado:0, transferencia:0, debito:0, credito:0, cuenta_corriente:0 };
    filtered.forEach(function(v){
      if(ventaAnulada(v)) return;
      if(v.metodoPago==='mixto' && v.pagos){
        m.contado += v.pagos.contado||0;
        m.transferencia += v.pagos.transferencia||0;
        m.debito += v.pagos.debito||0;
        m.credito += v.pagos.credito||0;
        m.cuenta_corriente += v.pagos.cuenta_corriente||0;
        return;
      }
      var ent = (v.metodoPago==='cuenta_corriente' && v.entrega>0) ? v.entrega : 0;
      if(ent>0){
        var km = v.entregaMetodo==='transferencia' ? 'transferencia' : 'contado';
        m[km] = (m[km]||0)+ent;
        m.cuenta_corriente = (m.cuenta_corriente||0)+(v.total-ent);

  }, [ventas, puntosVentaHV]);

      h(StatCard, { label:'Débito', value: fmtMoney(porMetodo.debito), icon:Icon('card',18), tone:'blue' }),
      h(StatCard, { label:'Crédito', value: fmtMoney(porMetodo.credito), icon:Icon('card',18), tone:'blue' }),
      h(StatCard, { label:'Cuenta corriente', value: fmtMoney(porMetodo.cuenta_corriente), icon:Icon('history',18), tone:'amber' })
    ),
    porPunto.length>1 ? h('div', { style:{ display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(180px, 1fr))', gap:12, marginBottom:18 } },
      porPunto.map(function(p){ return h(StatCard, { key:p.nombre, label:p.nombre, value: fmtMoney(p.total), icon:Icon('store',18), tone:'blue' }); })
    ) : h('div', { style:{ marginBottom:6 } }),
    h('div', { style:{ display:'flex', gap:10, flexWrap:'wrap', marginBottom:16 } },
      h('div', { style:{ position:'relative', flex:'1 1 220px', maxWidth:280 } },
        h('span', { style:{ position:'absolute', left:11, top:11, color:'var(--ink-faint)' } }, Icon('search',16)),
        h(TextInput, { value:search, onChange:function(e){setSearch(e.target.value);}, placeholder:'Buscar por cliente o N°...', style:{ paddingLeft:34 } })

        h('option',{value:'all'},'Todos los puntos de venta'),

        h('option',{value:'all'},'Todos los métodos'), h('option',{value:'contado'},'Contado'), h('option',{value:'transferencia'},'Transferencia'), h('option',{value:'debito'},'Débito'), h('option',{value:'credito'},'Crédito'), h('option',{value:'cuenta_corriente'},'Cuenta corriente'), h('option',{value:'mixto'},'Pago dividido'), h('option',{value:'anuladas'},'Solo anuladas')

function HistorialCCTab(){
  var app = useApp();
  var clientes = app.clientes, movimientosCC = app.movimientosCC, ventas = app.ventas;
  var filterClienteS = useState('all'); var filterCliente = filterClienteS[0]; var setFilterCliente = filterClienteS[1];
  var filterTipoS = useState('all'); var filterTipo = filterTipoS[0]; var setFilterTipo = filterTipoS[1];
  var filterRangoS = useState('todos'); var filterRango = filterRangoS[0]; var setFilterRango = filterRangoS[1];
  var searchS = useState(''); var search = searchS[0]; var setSearch = searchS[1];
  var ventaDetalleS = useState(null); var ventaDetalle = ventaDetalleS[0]; var setVentaDetalle = ventaDetalleS[1];
  var estadoCuentaS = useState(null); var estadoCuenta = estadoCuentaS[0]; var setEstadoCuenta = estadoCuentaS[1];
  var cuentaClienteS = useState(null); var cuentaCliente = cuentaClienteS[0]; var setCuentaCliente = cuentaClienteS[1];

  var clienteById = {}; clientes.forEach(function(c){ clienteById[c.id]=c; });
  var ventaById = {}; ventas.forEach(function(v){ ventaById[v.id]=v; });

  // Saldo del cliente después de cada movimiento. Se calcula HACIA ATRÁS desde el saldo actual del
  // cliente, así es correcto aunque no estén cargados sus movimientos más viejos (siempre están
  // todos los recientes, que son los que hay que "deshacer" para llegar a uno anterior).
  var saldoTrasMov = useMemo(function(){
    var porCli = {};
    movimientosCC.forEach(function(m){ (porCli[m.clienteId] = porCli[m.clienteId] || []).push(m); });
    var out = {};
    Object.keys(porCli).forEach(function(cid){
      var cli = clienteById[cid];
      var saldo = Math.round(((cli && cli.saldoCC) || 0)*100)/100;
      porCli[cid].slice().sort(function(a,b){ return (b.fecha||'').localeCompare(a.fecha||''); }).forEach(function(m){
        out[m.id] = saldo;
        saldo = Math.round((saldo - (m.tipo==='pago' ? -m.monto : m.monto))*100)/100;
      });
    });
    return out;
  }, [movimientosCC, clientes]);
  // Al filtrar por un cliente se trae su historial completo
  useEffect(function(){ if(filterCliente!=='all') app.cargarCuentaCliente(filterCliente); }, [filterCliente]);
  var cuentaFiltroLista = filterCliente==='all' || app.cuentasCargadas[filterCliente]==='ok';

  var clientesConMovs = useMemo(function(){
    var ids = {}; movimientosCC.forEach(function(m){ ids[m.clienteId]=true; });
    return clientes.filter(function(c){ return !c.esGenerico && (ids[c.id] || c.saldoCC>0); })
      .sort(function(a,b){ return (b.saldoCC||0)-(a.saldoCC||0) || a.nombre.localeCompare(b.nombre); });
  }, [clientes, movimientosCC]);

  var filtered = useMemo(function(){
    var now = new Date(), hoy = todayISO();
    var q = normalizeStr(search);
    return movimientosCC.filter(function(m){
      if(filterCliente!=='all' && m.clienteId!==filterCliente) return false;
      if(filterTipo!=='all' && m.tipo!==filterTipo) return false;
      if(filterRango!=='todos'){
        var diff = (now - new Date(m.fecha))/86400000;
        if(filterRango==='hoy' && (m.fecha||'').slice(0,10)!==hoy) return false;
        if(filterRango==='7d' && diff>7) return false;
        if(filterRango==='30d' && diff>30) return false;
      }
      if(q){
        var cli = clienteById[m.clienteId];
        var v = m.ventaId ? ventaById[m.ventaId] : null;
        var txt = normalizeStr((cli?cli.nombre:'')+' '+(m.nota||'')+' '+(v?('#'+v.numero+' '+v.items.map(function(i){return i.nombre;}).join(' ')):''));
        if(txt.indexOf(q)===-1) return false;
      }
      return true;
    }).sort(function(a,b){ return (b.fecha||'').localeCompare(a.fecha||''); });
  }, [movimientosCC, filterCliente, filterTipo, filterRango, search, clientes, ventas]);

  var totalDeuda = clientesConMovs.reduce(function(s,c){ return s+(c.saldoCC||0); }, 0);
  var conSaldo = clientesConMovs.filter(function(c){ return c.saldoCC>0; }).length;

    if(m.tipo==='venta') fiado += m.monto;

  });

    var v = m.ventaId ? ventaById[m.ventaId] : null;

    if(m.ventaId) return 'Entrega en '+(v ? 'venta #'+v.numero : 'venta');
    if(m.aplicadoAVentaId){ var va = ventaById[m.aplicadoAVentaId]; return 'Pago parcial de '+(va ? 'venta #'+va.numero : 'una venta'); }
    return m.nota || 'Pago a cuenta';
  }

  var th = function(t, right){ return h('th', { key:t, style:{ padding:'11px 12px', fontSize:11.5, fontWeight:700, color:'var(--ink-soft)', textTransform:'uppercase', letterSpacing:'0.03em', textAlign: right?'right':'left', whiteSpace:'nowrap' } }, t); };

  return h('div', null,

      h(StatCard, { label:'Cobrado transf.', value: fmtMoney(cobradoTr), icon:Icon('wallet',18), tone:'blue', sub:'Pagos y entregas (filtro)' })
    ),
    h('div', { style:{ display:'flex', gap:10, flexWrap:'wrap', marginBottom:16, alignItems:'center' } },

        h('option',{value:'all'},'Todos los clientes'),

        h('option',{value:'all'},'Compras y pagos'), h('option',{value:'venta'},'Solo compras'), h('option',{value:'pago'},'Solo pagos')

// Contraseña de ingreso de una sucursal (si nunca se configuró, es 1234)
function claveSucursal(suc){ return (suc && suc.clave) ? String(suc.clave) : '1234'; }

// La contraseña de ingreso se pide UNA vez por jornada y por sucursal (en cada dispositivo).
// La jornada arranca a las 5:00 de la mañana: lo hecho entre las 0:00 y las 4:59 cuenta como el día anterior,
// así no se vuelve a pedir a la medianoche si todavía se está trabajando.
var HORA_INICIO_JORNADA = 5;
function jornadaActual(){
  var d = new Date(Date.now() - HORA_INICIO_JORNADA*3600000);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function ingresoVigente(sucId){
  try{ return !!sucId && localStorage.getItem('ingresoJornada_'+sucId)===jornadaActual(); }catch(e){ return false; }
}
function marcarIngreso(sucId){ try{ localStorage.setItem('ingresoJornada_'+sucId, jornadaActual()); }catch(e){} }
function borrarIngreso(sucId){ try{ localStorage.removeItem('ingresoJornada_'+sucId); }catch(e){} }

function normUsuario(u){ return normalizeStr(u).replace(/\s+/g,''); }
function mismoUsuario(a, b){ return !!normUsuario(a) && normUsuario(a)===normUsuario(b); }

  var mobileOpenS = useState(false); var mobileOpen = mobileOpenS[0]; var setMobileOpen = mobileOpenS[1];

  var claveParaS = useState(null); var clavePara = claveParaS[0]; var setClavePara = claveParaS[1];
  var claveGestion = (app.configNegocio && app.configNegocio.claveGestion) || '1234';

      h(Toasts)
    );
  }

  return h('div', { className:'pos-root', style:{ display:'flex', minHeight:'100vh' } },
    h(ConnStatusBar),
    h('div', { className:'sidebar' },
      h(Sidebar, { page:page, setPage:goToPage, mobileOpen:false, setMobileOpen:function(){}, onHome:irAInicio })
    ),
    h('div', { style:{ flex:1, minWidth:0, display:'flex', flexDirection:'column' } },
      h(TopBar, { page:page, setMobileOpen:setMobileOpen, onHome:irAInicio, onSalir: props.onSalir }),

    )

  if(app.authError) return h(LoadingScreen, { authError: app.authError });
  if(!app.authReady || app.loadingInicial) return h(LoadingScreen);
  if(!app.sucursalId) return h(SucursalSelectorScreen);
  if(app.loadingData) return h(LoadingScreen);
  if(!sesion || sesion.sucursalId!==app.sucursalId){
    return h(LoginPuestoScreen, { key:app.sucursalId, onLogin:function(s){ setSesion(Object.assign({ sucursalId:app.sucursalId }, s)); } });
  }
  return h(AppShell, { key: sesion.tipo+'-'+(sesion.id||''), sesion:sesion, onSalir:function(){ setSesion(null); } });
}

// Cartel fijo de la demo con botón para volver a los datos de ejemplo
function DemoRibbon(){
  var confS = useState(false); var conf = confS[0]; var setConf = confS[1];
  return h(Fragment, null,
    h('div', { className:'demo-ribbon' },
      h('span', { style:{ fontWeight:800, letterSpacing:'0.04em' } }, 'DEMO'),
      h('span', { className:'demo-ribbon-txt' }, 'Los datos quedan solo en este navegador'),
      h('button', { type:'button', onClick:function(){ setConf(true); } }, 'Reiniciar')
    ),
    h(ConfirmDialog, { open:conf, onClose:function(){ setConf(false); }, title:'Reiniciar demo', tone:'red', confirmLabel:'Reiniciar',
      message:'Se borra todo lo que cargaste y vuelven los datos de ejemplo.', onConfirm:function(){ window.__demoReiniciar(); } })
  );
}

function App(){
  return h(AppProvider, null, h(AppGate), h(DemoRibbon));
}

var rootEl = document.getElementById('root');
var root = ReactDOM.createRoot(rootEl);
root.render(h(App));

var _bootLoader = document.getElementById('boot-loader');
if(_bootLoader) _bootLoader.style.display = 'none';

</script>
