<script id="demo-backend">
/* ============================================================
   MODO DEMO — reemplazo local de Firebase
   Simula Auth + Firestore (la parte de la API que usa la app) y guarda
   todo en el navegador (localStorage). No hay servidor: cada persona que
   abre la demo tiene sus propios datos, y "Reiniciar demo" vuelve al inicio.
============================================================ */
(function(){
  var STORE_KEY = 'demo_micomercio_v1';
  var store = {};       // ruta completa del documento -> datos
  var listeners = [];   // suscripciones activas
  var saveTimer = null;

  function clone(o){ return o==null ? o : JSON.parse(JSON.stringify(o)); }
  function autoId(){
    var c = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789', s = '';
    for(var i=0;i<20;i++) s += c.charAt(Math.floor(Math.random()*c.length));
    return s;
  }
  function guardar(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){
      try{ localStorage.setItem(STORE_KEY, JSON.stringify(store)); }
      catch(e){ console.warn('Demo: no se pudo guardar en el navegador (¿espacio lleno?)', e); }
    }, 150);
  }
  function notificar(){
    setTimeout(function(){ listeners.slice().forEach(function(l){ try{ l.run(); }catch(e){ console.error(e); } }); }, 0);
  }

  // ---- Valores especiales (FieldValue.increment) ----
  function esInc(v){ return v && typeof v==='object' && v.__demoInc!==undefined; }
  function aplicarCampos(base, data){
    var out = clone(base) || {};
    for(var k in data){
      var v = data[k];
      if(esInc(v)) out[k] = (Number(out[k])||0) + v.__demoInc;
      else out[k] = clone(v);
    }
    return out;
  }

  // ---- Snapshots ----
  function DocSnap(path, data){
    var partes = path.split('/');
    this.id = partes[partes.length-1];
    this.ref = new DocRef(path);
    this.exists = data!==undefined;
    this.metadata = { hasPendingWrites:false, fromCache:false };
    var d = data;
    this.data = function(){ return d===undefined ? undefined : clone(d); };
  }
  function QuerySnap(docs){
    this.docs = docs; this.size = docs.length; this.empty = docs.length===0;
    this.forEach = function(fn){ docs.forEach(fn); };
  }

  // ---- Referencias ----
  function DocRef(path){
    this.path = path;
    var partes = path.split('/');
    this.id = partes[partes.length-1];
  }
  DocRef.prototype.collection = function(sub){ return new Query(this.path+'/'+sub, [], null, null); };
  DocRef.prototype.get = function(){ return Promise.resolve(new DocSnap(this.path, store[this.path])); };
  DocRef.prototype.set = function(data, opts){
    var base = (opts && opts.merge) ? store[this.path] : undefined;
    store[this.path] = aplicarCampos(base, data);
    guardar(); notificar(); return Promise.resolve();
  };
  DocRef.prototype.update = function(data){
    if(store[this.path]===undefined) return Promise.reject(new Error('No existe el documento: '+this.path));
    store[this.path] = aplicarCampos(store[this.path], data);
    guardar(); notificar(); return Promise.resolve();
  };
  DocRef.prototype.delete = function(){ delete store[this.path]; guardar(); notificar(); return Promise.resolve(); };
  DocRef.prototype.onSnapshot = function(a, b, c){
    var next = typeof a==='function' ? a : b, err = typeof a==='function' ? b : c;
    var path = this.path;
    var l = { run:function(){ next(new DocSnap(path, store[path])); } };
    listeners.push(l);
    setTimeout(function(){ if(listeners.indexOf(l)>=0) l.run(); }, 0);
    return function(){ var i = listeners.indexOf(l); if(i>=0) listeners.splice(i,1); };
  };

  function Query(path, filtros, orden, lim){
    this.path = path; this._f = filtros; this._o = orden; this._l = lim;
  }
  Query.prototype.doc = function(id){ return new DocRef(this.path+'/'+(id || autoId())); };
  Query.prototype.add = function(data){ var r = this.doc(); return r.set(data).then(function(){ return r; }); };
  Query.prototype.where = function(campo, op, valor){ return new Query(this.path, this._f.concat([[campo,op,valor]]), this._o, this._l); };
  Query.prototype.orderBy = function(campo, dir){ return new Query(this.path, this._f, [campo, dir||'asc'], this._l); };
  Query.prototype.limit = function(n){ return new Query(this.path, this._f, this._o, n); };
  Query.prototype._ejecutar = function(){
    var pref = this.path+'/', out = [];
    for(var p in store){
      if(p.indexOf(pref)!==0) continue;
      if(p.slice(pref.length).indexOf('/')!==-1) continue;
      var d = store[p], ok = true;
      for(var i=0;i<this._f.length && ok;i++){
        var f = this._f[i], v = d[f[0]];
        if(f[1]==='==') ok = v===f[2];
        else if(f[1]==='>=') ok = v!=null && v>=f[2];
        else if(f[1]==='>') ok = v!=null && v>f[2];
        else if(f[1]==='<=') ok = v!=null && v<=f[2];
        else if(f[1]==='<') ok = v!=null && v<f[2];
        else if(f[1]==='array-contains') ok = Array.isArray(v) && v.indexOf(f[2])>=0;
      }
      if(ok) out.push(new DocSnap(p, d));
    }
    if(this._o){
      var campo = this._o[0], desc = this._o[1]==='desc';
      out = out.filter(function(s){ return s.data()[campo]!==undefined; });
      out.sort(function(a,b){
        var x = a.data()[campo], y = b.data()[campo];
        var r = x<y ? -1 : x>y ? 1 : 0;
        return desc ? -r : r;
      });
    }
    if(this._l!=null) out = out.slice(0, this._l);
    return new QuerySnap(out);
  };
  Query.prototype.get = function(){ return Promise.resolve(this._ejecutar()); };
  Query.prototype.onSnapshot = function(a, b, c){
    var next = typeof a==='function' ? a : b;
    var q = this;
    var l = { run:function(){ next(q._ejecutar()); } };
    listeners.push(l);
    setTimeout(function(){ if(listeners.indexOf(l)>=0) l.run(); }, 0);
    return function(){ var i = listeners.indexOf(l); if(i>=0) listeners.splice(i,1); };
  };

  // ---- Lotes y transacciones ----
  function Batch(){ this.ops = []; }
  Batch.prototype.set = function(ref, data, opts){ this.ops.push(['set', ref, data, opts]); return this; };
  Batch.prototype.update = function(ref, data){ this.ops.push(['update', ref, data]); return this; };
  Batch.prototype.delete = function(ref){ this.ops.push(['delete', ref]); return this; };
  Batch.prototype.commit = function(){
    this.ops.forEach(function(op){
      var p = op[1].path;
      if(op[0]==='set') store[p] = aplicarCampos((op[3] && op[3].merge) ? store[p] : undefined, op[2]);
      else if(op[0]==='update'){ if(store[p]!==undefined) store[p] = aplicarCampos(store[p], op[2]); }
      else delete store[p];
    });
    guardar(); notificar(); return Promise.resolve();
  };

  var db = {
    collection: function(name){ return new Query(name, [], null, null); },
    batch: function(){ return new Batch(); },
    enablePersistence: function(){ return Promise.resolve(); },
    runTransaction: function(fn){
      var b = new Batch();
      var tx = {
        get: function(ref){ return Promise.resolve(new DocSnap(ref.path, store[ref.path])); },
        set: function(ref, d, o){ b.set(ref, d, o); return tx; },
        update: function(ref, d){ b.update(ref, d); return tx; },
        delete: function(ref){ b.delete(ref); return tx; }
      };
      return Promise.resolve(fn(tx)).then(function(r){ return b.commit().then(function(){ return r; }); });
    }
  };
  var usuario = { uid:'demo', isAnonymous:true };
  var auth = {
    currentUser: usuario,
    onAuthStateChanged: function(cb){ var t = setTimeout(function(){ cb(usuario); }, 0); return function(){ clearTimeout(t); }; },
    signInAnonymously: function(){ return Promise.resolve({ user:usuario }); }
  };
  function firestoreFn(){ return db; }
  firestoreFn.FieldValue = { increment: function(n){ return { __demoInc:Number(n)||0 }; } };
  window.firebase = {
    initializeApp: function(){ return {}; },
    auth: function(){ return auth; },
    firestore: firestoreFn
  };

  /* ============================================================
     DATOS DE EJEMPLO (se cargan solo la primera vez)
  ============================================================ */
  function sembrar(){
    var NEG = 'negocios/principal', SUC = NEG+'/sucursales/suc-demo';
    function put(ruta, data){ store[ruta] = data; }
    function isoDias(n){ var d = new Date(); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }

    put(NEG, { nombreNegocio:'MI COMERCIO', telefonoNegocio:'261 555-0101', claveGestion:'1234', impresoraTicket:'', empleados:['Ana','Lucas','Sofía'] });
    put(SUC, { nombre:'Casa Central', direccion:'Av. San Martín 1250', telefono:'261 555-0101', activa:true, esCentral:true, clave:'1234', cajaUsuario:'caja', creadaEn:new Date(Date.now()-40*86400000).toISOString() });

    var ahoraIso = new Date().toISOString();
    var PV = {
      despensa:  { id:'pv-pedidos',    nombre:'Despensa',   usuario:'despensa' },
      carni:     { id:'pv-carniceria', nombre:'Carnicería', usuario:'carniceria' },
      verdu:     { id:'pv-verduleria', nombre:'Verdulería', usuario:'verduleria' }
    };
    var i = 0;
    for(var k in PV){
      put(SUC+'/puntosVenta/'+PV[k].id, { nombre:PV[k].nombre, usuario:PV[k].usuario, clave:'1234', creadoEn:new Date(Date.now()-30*86400000+(i++)*1000).toISOString(), renombradoDespensa:true });
    }

    var cats = [
      ['cat-carne','Carnicería','carne','#B23A2E'], ['cat-fiambre','Fiambrería','fiambre','#C9821C'],
      ['cat-verdura','Verdulería','verdura','#2D6A4F'], ['cat-almacen','Almacén','otros','#6B5B3E'],
      ['cat-bebida','Bebidas','bebida','#3A5A8C'], ['cat-limpieza','Limpieza','limpieza','#5A7A8C'],
      ['cat-panaderia','Panadería','panaderia','#9C6B2E'], ['cat-sin','Sin categoría','otros','#8C8272']
    ];
    cats.forEach(function(c){ put(SUC+'/categorias/'+c[0], { nombre:c[1], icon:c[2], color:c[3] }); });

    var cod = 7790070000010;
    // [id, nombre, cat, unidad, costo, venta, stock, stockMin, vencimiento(días), puntos, proveedor]
    var prods = [
      ['p-asado','Asado de tira','cat-carne','kg',6800,9500,18.5,5,3,['pv-carniceria'],'Frigorífico Sur'],
      ['p-nalga','Milanesa de nalga','cat-carne','kg',8200,11800,9.2,4,2,['pv-carniceria'],'Frigorífico Sur'],
      ['p-picada','Carne picada especial','cat-carne','kg',5900,8400,12,4,2,['pv-carniceria'],'Frigorífico Sur'],
      ['p-pollo','Pollo entero','cat-carne','kg',2900,4300,22,8,4,['pv-carniceria'],'Avícola Norte'],
      ['p-chorizo','Chorizo puro cerdo','cat-carne','kg',5200,7600,3.5,4,5,['pv-carniceria'],'Frigorífico Sur'],
      ['p-jamon','Jamón cocido','cat-fiambre','kg',9800,14200,3.1,3,6,['pv-pedidos'],'Distribuidora Norte'],
      ['p-queso','Queso cremoso','cat-fiambre','kg',7400,10900,6.4,3,10,['pv-pedidos'],'Distribuidora Norte'],
      ['p-tomate','Tomate redondo','cat-verdura','kg',900,1600,14,5,5,['pv-verduleria'],'Mercado Cooperativo'],
      ['p-papa','Papa','cat-verdura','kg',500,900,40,10,15,['pv-verduleria'],'Mercado Cooperativo'],
      ['p-cebolla','Cebolla','cat-verdura','kg',600,1100,25,8,20,['pv-verduleria'],'Mercado Cooperativo'],
      ['p-banana','Banana','cat-verdura','kg',1300,2200,16,6,4,['pv-verduleria'],'Mercado Cooperativo'],
      ['p-lechuga','Lechuga criolla','cat-verdura','unidad',450,900,2,6,2,['pv-verduleria'],'Mercado Cooperativo'],
      ['p-arroz','Arroz largo fino 1kg','cat-almacen','unidad',1350,1950,24,6,null,['pv-pedidos'],'Distribuidora Norte'],
      ['p-fideos','Fideos tirabuzón 500g','cat-almacen','unidad',780,1150,3,6,null,['pv-pedidos'],'Distribuidora Norte'],
      ['p-yerba','Yerba mate 1kg','cat-almacen','unidad',3200,4500,30,8,null,['pv-pedidos'],'Distribuidora Norte'],
      ['p-aceite','Aceite de girasol 1.5L','cat-almacen','unidad',2600,3700,14,5,null,['pv-pedidos'],'Distribuidora Norte'],
      ['p-azucar','Azúcar 1kg','cat-almacen','unidad',1000,1450,20,6,null,['pv-pedidos'],'Distribuidora Norte'],
      ['p-cola','Gaseosa cola 2.25L','cat-bebida','unidad',1800,2600,30,10,null,['pv-pedidos'],'Bebidas del Oeste'],
      ['p-agua','Agua mineral 1.5L','cat-bebida','unidad',650,1000,2,8,null,['pv-pedidos'],'Bebidas del Oeste'],
      ['p-vino','Vino tinto Malbec 750ml','cat-bebida','unidad',3400,5200,18,6,null,['pv-pedidos'],'Bodega Los Andes'],
      ['p-deterg','Detergente 750ml','cat-limpieza','unidad',1250,1850,12,4,null,['pv-pedidos'],'Limpieza Total'],
      ['p-lavandina','Lavandina suelta','cat-limpieza','l',400,750,35,10,null,['pv-pedidos'],'Limpieza Total'],
      ['p-pan','Pan francés','cat-panaderia','kg',1300,2100,8,3,1,['pv-pedidos'],'Panadería La Espiga']
    ];
    var prodById = {};
    prods.forEach(function(p){
      var d = { nombre:p[1], categoriaId:p[2], unidad:p[3], precioCosto:p[4], precioVenta:p[5],
        margenGanancia: Math.round(((p[5]/p[4])-1)*10000)/100,
        stock:p[6], stockMin:p[7], controlaStock:true, vencimiento: p[8]!=null ? isoDias(p[8]) : null,
        diasAlertaVencimiento:null, imagen:null, sku:String(cod++), puntosVenta:p[9], proveedor:p[10], activo:true };
      put(SUC+'/productos/'+p[0], d); prodById[p[0]] = d;
    });
    // Producto con presentaciones (x1 / x6 / x12)
    [['p-fact1','x1',1,450],['p-fact6','x6',6,2500],['p-fact12','x12',12,4800]].forEach(function(f){
      var d = { nombre:'Facturas '+f[1], categoriaId:'cat-panaderia', unidad:'unidad', precioCosto:Math.round(220*f[2]), precioVenta:f[3],
        margenGanancia: Math.round(((f[3]/(220*f[2]))-1)*10000)/100, stock:0, stockMin:0, controlaStock:false,
        vencimiento:null, diasAlertaVencimiento:null, imagen:null, sku:String(cod++), puntosVenta:['pv-pedidos'],
        proveedor:'Panadería La Espiga', grupoId:'grp-facturas', nombreBase:'Facturas', presentacionEtiqueta:f[1], varianteEtiqueta:null, activo:true };
      put(SUC+'/productos/'+f[0], d); prodById[f[0]] = d;
    });
    // Producto editable al vender
    var sand = { nombre:'Sándwich armado', categoriaId:'cat-fiambre', unidad:'unidad', precioCosto:null, precioVenta:3500, margenGanancia:null,
      stock:0, stockMin:0, controlaStock:false, vencimiento:null, diasAlertaVencimiento:null, imagen:null, sku:String(cod++),
      puntosVenta:['pv-pedidos'], proveedor:'', editableAlVender:true, ingredientesBase:['Pan','Jamón','Queso'], activo:true };
    put(SUC+'/productos/p-sandwich', sand); prodById['p-sandwich'] = sand;

    // Clientes
    put(SUC+'/clientes/cli-cf', { nombre:'Consumidor Final', direccion:'', telefono:'', saldoCC:0, esGenerico:true });
    var clientes = [
      ['cli-maria','María Gómez','Belgrano 455','261 444-1122'],
      ['cli-carlos','Carlos Fernández','Las Heras 880','261 444-3344'],
      ['cli-lucia','Lucía Pereyra','Colón 210','261 444-5566'],
      ['cli-jorge','Jorge Ibáñez','Mitre 1340','261 444-7788']
    ];
    var saldos = {};
    clientes.forEach(function(c){ saldos[c[0]] = 0; });

    // Ventas de los últimos 7 días
    var ventasIds = [], numero = 1000;
    var pvPorProd = function(pid){ return prodById[pid].puntosVenta[0]; };
    var nombrePV = { 'pv-pedidos':'Despensa', 'pv-carniceria':'Carnicería', 'pv-verduleria':'Verdulería' };
    var porPV = {
      'pv-pedidos':['p-arroz','p-fideos','p-yerba','p-aceite','p-azucar','p-cola','p-agua','p-vino','p-deterg','p-jamon','p-queso','p-pan','p-fact6','p-fact12'],
      'pv-carniceria':['p-asado','p-nalga','p-picada','p-pollo','p-chorizo'],
      'pv-verduleria':['p-tomate','p-papa','p-cebolla','p-banana','p-lechuga']
    };
    var empleados = ['Ana','Lucas','Sofía'];
    var rnd = (function(){ var s = 7; return function(){ s = (s*9301+49297)%233280; return s/233280; }; })();
    var hoy0 = new Date(); hoy0.setHours(0,0,0,0);
    var aperturaHoy = new Date(hoy0.getTime()+8*3600000);
    if(aperturaHoy > new Date()) aperturaHoy = new Date(Date.now()-3600000);
    var movs = [];

    for(var dia=7; dia>=0; dia--){
      var cant = dia===0 ? 6 : 7 + Math.floor(rnd()*6);
      for(var v=0; v<cant; v++){
        var fecha;
        if(dia===0){
          var desde = aperturaHoy.getTime(), hasta = Date.now()-60000;
          fecha = new Date(desde + (hasta-desde)*(v+1)/(cant+1));
        } else {
          fecha = new Date(hoy0.getTime() - dia*86400000 + (9 + rnd()*11)*3600000);
        }
        var pvIds = Object.keys(porPV), pvId = pvIds[Math.floor(rnd()*pvIds.length)];
        var lista = porPV[pvId], nItems = 1 + Math.floor(rnd()*3), items = [], usados = {};
        for(var n=0;n<nItems;n++){
          var pid = lista[Math.floor(rnd()*lista.length)];
          if(usados[pid]) continue; usados[pid] = true;
          var pr = prodById[pid];
          var cantidad = (pr.unidad==='kg') ? Math.round((0.5 + rnd()*1.5)*4)/4 : 1 + Math.floor(rnd()*3);
          items.push({ productoId:pid, nombre:pr.nombre, unidad:pr.unidad, cantidad:cantidad, precioUnit:pr.precioVenta, subtotal:Math.round(pr.precioVenta*cantidad*100)/100 });
        }
        var total = Math.round(items.reduce(function(s,it){ return s+it.subtotal; },0)*100)/100;
        var r = rnd(), metodo = r<0.5 ? 'contado' : r<0.75 ? 'transferencia' : r<0.88 ? 'debito' : 'cuenta_corriente';
        var cliId = 'cli-cf', cliNom = 'Consumidor Final';
        if(metodo==='cuenta_corriente'){ var c = clientes[Math.floor(rnd()*clientes.length)]; cliId = c[0]; cliNom = c[1]; }
        numero++;
        var vid = 'v-demo-'+numero, fIso = fecha.toISOString();
        put(SUC+'/ventas/'+vid, { numero:numero, fecha:fIso, items:items, total:total, metodoPago:metodo, clienteId:cliId, clienteNombre:cliNom,
          nombrePedido:null, puntoVentaId:pvId, puntoVentaNombre:nombrePV[pvId], estado:'completada',
          montoRecibido: metodo==='contado' ? Math.ceil(total/1000)*1000 : null, atendioPor:empleados[Math.floor(rnd()*3)],
          entrega:0, entregaMetodo:null, pagos:null, efectivoRecibido:null });
        if(metodo==='cuenta_corriente'){
          saldos[cliId] = Math.round((saldos[cliId]+total)*100)/100;
          movs.push({ clienteId:cliId, tipo:'venta', monto:total, fecha:fIso, nota:'Venta #'+numero, ventaId:vid });
        }
      }
    }
    // Un pago a cuenta de María, hace 2 días
    if(saldos['cli-maria']>0){
      var pago = Math.round(saldos['cli-maria']/2/100)*100 || saldos['cli-maria'];
      saldos['cli-maria'] = Math.max(0, Math.round((saldos['cli-maria']-pago)*100)/100);
      movs.push({ clienteId:'cli-maria', tipo:'pago', monto:pago, fecha:new Date(hoy0.getTime()-2*86400000+17*3600000).toISOString(), nota:'Pago a cuenta', metodo:'contado', recibidoPor:'Ana' });
    }
    movs.forEach(function(m, idx){ put(SUC+'/movimientosCC/mcc-demo-'+idx, m); });
    clientes.forEach(function(c){ put(SUC+'/clientes/'+c[0], { nombre:c[1], direccion:c[2], telefono:c[3], saldoCC:saldos[c[0]] }); });
    put(SUC+'/contadores/ventas', { ultimoNumero:numero });

    // Cierre de caja de ayer y caja abierta hoy
    var ayerAbre = new Date(hoy0.getTime()-86400000+8*3600000).toISOString();
    var ayerCierra = new Date(hoy0.getTime()-86400000+21*3600000).toISOString();
    put(SUC+'/turnosCaja/t-demo-ayer', { estado:'cerrada', abiertaEn:ayerAbre, abiertaPor:'Ana', montoInicial:20000,
      movimientos:[{ id:'mc-demo-1', tipo:'egreso', monto:15000, motivo:'Pago a proveedor - Mercado Cooperativo', hechoPor:'Ana', fecha:new Date(hoy0.getTime()-86400000+11*3600000).toISOString() }],
      cerradaEn:ayerCierra, cerradaPor:'Lucas', quedaEnCaja:20000, observaciones:'' });
    (function(){
      var t = store[SUC+'/turnosCaja/t-demo-ayer'];
      var m = { contado:0, transferencia:0, debito:0, credito:0, cuenta_corriente:0 }, tot = 0, cnt = 0, pp = {};
      for(var p in store){
        if(p.indexOf(SUC+'/ventas/')!==0) continue;
        var v = store[p];
        if(v.fecha<ayerAbre || v.fecha>ayerCierra) continue;
        cnt++; tot += v.total; m[v.metodoPago] += v.total;
        pp[v.puntoVentaNombre] = (pp[v.puntoVentaNombre]||0) + v.total;
      }
      var r2 = function(n){ return Math.round(n*100)/100; };
      var egresos = 15000, esperado = r2(20000 + m.contado - egresos);
      var contado = r2(esperado - 300);
      t.resumen = { cantVentas:cnt, totalVendido:r2(tot), propinas:0,
        porPuntoVenta:Object.keys(pp).sort().map(function(n){ return { nombre:n, total:r2(pp[n]) }; }),
        ventasEfectivo:r2(m.contado), ventasTransferencia:r2(m.transferencia), ventasCuentaCorriente:r2(m.cuenta_corriente),
        ventasDebito:r2(m.debito), ventasCredito:0, cobrosCCEfectivo:0, cobrosCCTransferencia:0,
        ingresos:0, egresos:egresos, montoInicial:20000, efectivoEsperado:esperado,
        totalTransferencias:r2(m.transferencia), churros:{ lineas:[], total:0 } };
      t.efectivoContado = contado; t.diferencia = r2(contado - esperado);
      t.quedaEnCaja = Math.min(20000, contado);
    })();
    put(SUC+'/turnosCaja/t-demo-hoy', { estado:'abierta', abiertaEn:aperturaHoy.toISOString(), abiertaPor:'Ana', montoInicial:20000, movimientos:[] });

    // Pedidos esperando cobro en Caja
    put(SUC+'/pedidosPendientes/ped-demo-1', { clienteNombre:'Marisa', atendioPor:'Lucas', creadoEn:new Date(Date.now()-12*60000).toISOString(), estado:'pendiente', puntoVentaId:'pv-carniceria',
      items:[{ productoId:'p-asado', nombre:'Asado de tira', unidad:'kg', cantidad:1.5, precioUnit:9500, subtotal:14250 }, { productoId:'p-chorizo', nombre:'Chorizo puro cerdo', unidad:'kg', cantidad:0.5, precioUnit:7600, subtotal:3800 }] });
    put(SUC+'/pedidosPendientes/ped-demo-2', { clienteNombre:'Marisa', atendioPor:'Sofía', creadoEn:new Date(Date.now()-9*60000).toISOString(), estado:'pendiente', puntoVentaId:'pv-verduleria',

    put(SUC+'/pedidosPendientes/ped-demo-3', { clienteNombre:'Consumidor Final', atendioPor:'Ana', creadoEn:new Date(Date.now()-4*60000).toISOString(), estado:'pendiente', puntoVentaId:'pv-pedidos',

    try{ localStorage.setItem('sucursalActualId', 'suc-demo'); }catch(e){}
  }

  var cargado = false;
  try{
    var raw = localStorage.getItem(STORE_KEY);
    if(raw){ store = JSON.parse(raw) || {}; cargado = true; }
  }catch(e){ store = {}; }
  if(!cargado){ sembrar(); guardar(); }

  window.__demoReiniciar = function(){
    try{ localStorage.removeItem(STORE_KEY); localStorage.removeItem('sucursalActualId'); }catch(e){}
    location.reload();
  };
})();

// clientes, ventas, etc.) quedan anidadas debajo de la sucursal activa — se define en
// AppProvider al elegir sucursal y negRef/negDoc la usan para armar la ruta en Firestore.

// dispositivo fue viendo, y encola ahí mismo cualquier escritura hecha sin conexión para

// Envuelve una promesa con un límite de tiempo: si no se resuelve antes de ms,
// se rechaza con TIMEOUT_SIN_CONEXION (usado para detectar cortes de conexión
// silenciosos durante una venta, donde el navegador cree estar online pero el
// pedido al servidor nunca vuelve).
function withTimeout(promise, ms){
  return new Promise(function(resolve, reject){
    var settled = false;
    var timer = setTimeout(function(){
      if(!settled){ settled = true; reject(new Error('TIMEOUT_SIN_CONEXION')); }
    }, ms);
    promise.then(function(v){
      if(!settled){ settled = true; clearTimeout(timer); resolve(v); }
    }, function(err){
      if(!settled){ settled = true; clearTimeout(timer); reject(err); }
    });
  });
}

}
function fmtNum(n, dec){
  dec = dec === undefined ? 3 : dec;
  if (n === null || n === undefined || isNaN(n)) n = 0;
  return n.toLocaleString('es-AR', { minimumFractionDigits:0, maximumFractionDigits:dec });

function fmtDateTime(iso){
  if(!iso) return '—';
  var d = new Date(iso);
  return d.toLocaleDateString('es-AR', { day:'2-digit', month:'2-digit', year:'numeric' }) + ' ' +
         d.toLocaleTimeString('es-AR', { hour:'2-digit', minute:'2-digit' });

function daysUntil(iso){
  if(!iso) return null;
  var today = new Date(); today.setHours(0,0,0,0);
  var target = new Date(iso); target.setHours(0,0,0,0);
  return Math.round((target - today) / 86400000);
}
function umbralAlertaVenc(producto){
  return (producto.diasAlertaVencimiento!=null) ? producto.diasAlertaVencimiento : 3;
}
function estaPorVencer(producto){
  if(!producto.vencimiento) return false;
  var d = daysUntil(producto.vencimiento);
  return d <= umbralAlertaVenc(producto);
}

function nivelAlertaProducto(producto){
  var vencido = producto.vencimiento && daysUntil(producto.vencimiento) < 0;
  if(!tieneControlStock(producto)){
    if(vencido) return 'critico';
    return estaPorVencer(producto) ? 'alerta' : null;
  }
  var sinStock = producto.stock <= 0;
  if(vencido || sinStock) return 'critico';
  var porVencer = estaPorVencer(producto);
  var stockBajo = producto.stock > 0 && producto.stock <= producto.stockMin;

    '@media print { @page { margin:10mm; size:auto; } body { padding:0; } }'
  ].join('\n') : [
    'body { margin:0; padding:20px; font-family: "Courier New", monospace; font-size:12px; color:#000; background:#fff; }',
    'table { width:100%; border-collapse:collapse; font-size:12px; }',
    'th, td { padding:5px 4px; }',
    '@media print { @page { margin:10mm; size:A4; } body { padding:0; } }'
  ].join('\n');

  var win = window.open('', '_blank', 'width=800,height=600');
  if(!win){ alert('El navegador bloqueó la ventana emergente. Permitila para este sitio.'); return; }
  win.document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"><title>' + (titulo||'Imprimir') + '</title><style>' + estilos + '</style></head><body>' + contenidoHTML + '</body></html>');
  win.document.close();
  // Esperamos a que los recursos carguen antes de imprimir
  win.onload = function(){ win.focus(); win.print(); };
  // Fallback por si onload ya disparó
  setTimeout(function(){ try{ win.focus(); win.print(); } catch(e){} }, 800);
}

function fechaEntregaCC(iso){ return new Date(new Date(iso).getTime()+1).toISOString(); }
function etiquetaMetodoCobro(m){ return m==='transferencia' ? 'Transferencia' : m==='mixto' ? 'Pago dividido' : 'Efectivo'; }
// Pago a cuenta corriente dividido (metodo 'mixto'): parte en efectivo y parte por transferencia, en mov.pagos
function desglosePagoCC(m){
  if(!m || m.tipo!=='pago') return null;
  if(m.metodo==='mixto' && m.pagos) return { contado: Number(m.pagos.contado)||0, transferencia: Number(m.pagos.transferencia)||0 };
  return m.metodo==='transferencia' ? { contado:0, transferencia: m.monto||0 } : { contado: m.monto||0, transferencia:0 };
}
// Quién recibió un pago de cuenta corriente. Las entregas hechas al momento de la compra
// no tienen el dato propio, así que se toma quién atendió esa venta.
function quienRecibioPago(m, ventaById){
  if(!m || m.tipo!=='pago') return '';
  if(m.recibidoPor) return m.recibidoPor;
  var v = (m.ventaId && ventaById) ? ventaById[m.ventaId] : null;
  return (v && v.atendioPor) || '';
}
function metodoMovTexto(m){
  if(!(m && m.tipo==='pago' && m.metodo)) return '';
  if(m.metodo==='mixto' && m.pagos) return 'Pago dividido: efectivo '+fmtMoney(m.pagos.contado||0)+' + transf. '+fmtMoney(m.pagos.transferencia||0);

// Pago dividido ('mixto'): el total se reparte entre efectivo, transferencia y/o cuenta corriente.
// Se guarda en venta.pagos = { contado, transferencia, cuenta_corriente } y venta.efectivoRecibido (para el vuelto).
function etiquetaMetodoPago(m){
  return m==='contado' ? 'Contado' : m==='transferencia' ? 'Transferencia' : m==='debito' ? 'Tarjeta de débito' : m==='credito' ? 'Tarjeta de crédito' : m==='mixto' ? 'Pago dividido' : 'Cuenta corriente';
}
function detallePagoMixto(v){
  if(!v || v.metodoPago!=='mixto' || !v.pagos) return null;
  var p = v.pagos, lineas = [];
  if(p.contado>0) lineas.push({ label:'Efectivo', monto:p.contado });
  if(p.transferencia>0) lineas.push({ label:'Transferencia', monto:p.transferencia });
  if(p.debito>0) lineas.push({ label:'Débito', monto:p.debito });
  if(p.credito>0) lineas.push({ label:'Crédito', monto:p.credito });
  if(p.cuenta_corriente>0) lineas.push({ label:'A cuenta corriente', monto:p.cuenta_corriente, deuda:true });
  var vuelto = (v.efectivoRecibido!=null && p.contado>0 && v.efectivoRecibido>p.contado) ? Math.round((v.efectivoRecibido-p.contado)*100)/100 : 0;
  return { lineas:lineas, efectivoRecibido: vuelto>0 ? v.efectivoRecibido : null, vuelto:vuelto };
}

// Una venta tiene parte a cuenta corriente (fiada) si es cta. cte. o pago dividido con parte a cuenta.
function ventaTieneCC(v){ return !!v && (v.metodoPago==='cuenta_corriente' || (v.metodoPago==='mixto' && v.pagos && v.pagos.cuenta_corriente>0)); }

function nombreClienteVenta(v, clientes){

function calcularResumenTurno(turno, ventas, movimientosCC){
  var desde = turno.abiertaEn, hasta = turno.cerradaEn || '9999';
  var enRango = function(f){ return !!f && f>=desde && f<=hasta; };
  var vs = (ventas||[]).filter(function(v){ return v.estado!=='anulada' && enRango(v.fecha); });
  var m = { contado:0, transferencia:0, debito:0, credito:0, cuenta_corriente:0 };
  // Ventas por punto de venta (las ventas viejas sin punto asignado se agrupan como "Despensa")
  var porPunto = {}, ordenPuntos = [];
  var totalVendido = 0, propinas = 0;
  vs.forEach(function(v){
    totalVendido += v.total||0;
    propinas += propinaVenta(v);
    desglosePuntosVenta(v).forEach(function(dp){
      if(!(dp.nombre in porPunto)){ porPunto[dp.nombre] = 0; ordenPuntos.push(dp.nombre); }
      porPunto[dp.nombre] += dp.total;
    });
    if(v.metodoPago==='mixto' && v.pagos){
      m.contado += v.pagos.contado||0; m.transferencia += v.pagos.transferencia||0; m.cuenta_corriente += v.pagos.cuenta_corriente||0;
      m.debito += v.pagos.debito||0; m.credito += v.pagos.credito||0;
      return;
    }
    var ent = (v.metodoPago==='cuenta_corriente' && v.entrega>0) ? v.entrega : 0;
    if(ent>0){
      m[v.entregaMetodo==='transferencia' ? 'transferencia' : 'contado'] += ent;
      m.cuenta_corriente += (v.total-ent);
    } else {
      m[v.metodoPago] = (m[v.metodoPago]||0) + totalCobradoVenta(v);
    }
  });
  // Pagos a cuenta corriente hechos por fuera de una venta (desde Clientes)
  var cobrosCC = { contado:0, transferencia:0 };
  (movimientosCC||[]).forEach(function(mv){
    if(mv.tipo!=='pago' || mv.ventaId || !enRango(mv.fecha)) return;
    var dsg = desglosePagoCC(mv);
    cobrosCC.contado += dsg.contado; cobrosCC.transferencia += dsg.transferencia;
  });
  var movs = turno.movimientos || [];
  var churros = resumenChurros(vs);
  var ingresos = 0, egresos = 0;
  movs.forEach(function(x){ if(x.tipo==='ingreso') ingresos += x.monto||0; else egresos += x.monto||0; });
  var montoInicial = r2(turno.montoInicial);

    cantVentas: vs.length, totalVendido: r2(totalVendido), propinas: r2(propinas),
    porPuntoVenta: ordenPuntos.sort(function(a,b){ return a.localeCompare(b); }).map(function(n){ return { nombre:n, total:r2(porPunto[n]) }; }),
    ventasEfectivo: r2(m.contado), ventasTransferencia: r2(m.transferencia), ventasCuentaCorriente: r2(m.cuenta_corriente),
    ventasDebito: r2(m.debito), ventasCredito: r2(m.credito),
    cobrosCCEfectivo: r2(cobrosCC.contado), cobrosCCTransferencia: r2(cobrosCC.transferencia),
    ingresos: r2(ingresos), egresos: r2(egresos), montoInicial: montoInicial,
    efectivoEsperado: efectivoEsperado,
    totalTransferencias: r2(m.transferencia + cobrosCC.transferencia),
    churros: churros

}
// Churros vendidos en el turno: cualquier ítem cuyo nombre contenga "churro".
// Una línea por producto/presentación (ej: "Churros x6", "Churros x12") con cantidad e importe.
function resumenChurros(vs){
  var porNombre = {}, orden = [];
  (vs||[]).forEach(function(v){
    (v.items||[]).forEach(function(it){
      if(normalizeStr(it.nombre).indexOf('churro')===-1) return;
      var k = normalizeStr(it.nombre)+'|'+(it.unidad||'unidad');
      if(!porNombre[k]){ porNombre[k] = { nombre: it.nombre, unidad: it.unidad||'unidad', cantidad:0, total:0 }; orden.push(k); }
      porNombre[k].cantidad = Math.round((porNombre[k].cantidad + (Number(it.cantidad)||0))*1000)/1000;
      porNombre[k].total = r2(porNombre[k].total + (Number(it.subtotal)||0));
    });
  });
  var lineas = orden.map(function(k){ return porNombre[k]; }).sort(function(a,b){ return a.nombre.localeCompare(b.nombre); });

  }, [turnoAbiertoPrevio && turnoAbiertoPrevio.abiertaEn, ventasDesde]);

  // ── Carga a pedido de datos viejos ───────────────────────────────────────────
  // desdeISO: trae todas las ventas desde esa fecha hasta la ventana en vivo.
  // Sin desdeISO: trae la página siguiente (300 ventas más viejas que las ya cargadas).
  function cargarVentasAnteriores(desdeISO){
    if(cargandoViejas) return Promise.resolve();
    var tope = viejasHasta < ventasDesde ? viejasHasta : ventasDesde;
    if(desdeISO && desdeISO>=tope) return Promise.resolve();
    if(!desdeISO && !hayMasViejas) return Promise.resolve();
    var q = negRef('ventas').where('fecha','<',tope);
    if(desdeISO) q = q.where('fecha','>=',desdeISO);
    q = q.orderBy('fecha','desc');
    if(!desdeISO) q = q.limit(300);
    setCargandoViejas(true);
    return q.get().then(function(snap){
      var arr = snapToArray(snap);
      setVentasViejas(function(prev){ return unirPorId(prev, arr); });
      if(desdeISO) setViejasHasta(desdeISO);
      else {
        if(arr.length) setViejasHasta(arr[arr.length-1].fecha);
        if(arr.length<300) setHayMasViejas(false);
      }
    }).catch(function(err){ console.error(err); pushToast('No se pudieron cargar las ventas anteriores', 'error'); })
      .finally(function(){ setCargandoViejas(false); });
  }
  // Trae TODO el historial de cuenta corriente de un cliente (sus movimientos y sus ventas).
  // Se usa al abrir su cuenta o su estado de cuenta. Se hace una sola vez por cliente y sesión.
  function cargarCuentaCliente(clienteId){
    if(!clienteId || cuentasCargadas[clienteId]) return Promise.resolve();
    setCuentasCargadas(function(o){ var n = {}; for(var k in o) n[k]=o[k]; n[clienteId] = 'cargando'; return n; });
    return Promise.all([
      negRef('movimientosCC').where('clienteId','==',clienteId).get(),
      negRef('ventas').where('clienteId','==',clienteId).get()
    ]).then(function(res){
      var movs = snapToArray(res[0]), vs = snapToArray(res[1]);
      setMovsViejos(function(prev){ return unirPorId(prev, movs); });
      setVentasViejas(function(prev){ return unirPorId(prev, vs); });
      setCuentasCargadas(function(o){ var n = {}; for(var k in o) n[k]=o[k]; n[clienteId] = 'ok'; return n; });
    }).catch(function(err){
      console.error(err);
      pushToast('No se pudo cargar la cuenta del cliente', 'error');
      setCuentasCargadas(function(o){ var n = {}; for(var k in o) n[k]=o[k]; delete n[clienteId]; return n; });
    });
  }

  // Importación masiva desde Excel: crea las categorías que falten, después crea productos nuevos
  // y actualiza los existentes. Se escribe en tandas (Firestore admite hasta 500 operaciones por lote).
  // categoriasNuevas: [{ clave, nombre }] — los productos referencian la categoría nueva con categoriaClave.
  function importarProductosExcel(nuevos, actualizaciones, categoriasNuevas){
    var idPorClave = {};
    var ops = [];
    (categoriasNuevas||[]).forEach(function(c, i){
      var ref = negRef('categorias').doc();
      idPorClave[c.clave] = ref.id;
      var colores = ['#B23A2E','#C9821C','#2D6A4F','#6B5B3E','#3A5A8C','#5A7A8C','#9C6B2E','#8C3A6B','#4A4A8C'];
      ops.push(function(b){ b.set(ref, { nombre:c.nombre, icon:'otros', color: colores[i % colores.length] }); });
    });
    function resolverCat(d){
      var o = {}; for(var k in d) if(k!=='categoriaClave') o[k] = d[k];
      if(d.categoriaClave) o.categoriaId = idPorClave[d.categoriaClave] || 'cat-sin';
      return o;
    }
    (nuevos||[]).forEach(function(d){
      var ref = negRef('productos').doc();
      var data = resolverCat(d); data.activo = true;
      ops.push(function(b){ b.set(ref, data); });
    });
    (actualizaciones||[]).forEach(function(u){
      var data = resolverCat(u.data);
      ops.push(function(b){ b.update(negDoc('productos', u.id), data); });
    });
    if(!ops.length) return Promise.resolve(false);
    var tandas = []; for(var i=0;i<ops.length;i+=450) tandas.push(ops.slice(i,i+450));
    return tandas.reduce(function(prom, t){
      return prom.then(function(){ var b = db.batch(); t.forEach(function(op){ op(b); }); return b.commit(); });
    }, Promise.resolve()).then(function(){
      var partes = [];
      if(nuevos.length) partes.push(nuevos.length+' creado'+(nuevos.length!==1?'s':''));
      if(actualizaciones.length) partes.push(actualizaciones.length+' actualizado'+(actualizaciones.length!==1?'s':''));
      pushToast('Importación lista: '+partes.join(' y ')+'.', 'success');
      return true;
    }).catch(function(err){ console.error(err); pushToast('Error al importar los productos: '+err.message, 'error'); return false; });
  }

  // ventaAplicada (opcional): { id, numero } — pago parcial de una venta fiada puntual.
  // pagos (opcional, solo metodo 'mixto'): { contado, transferencia } — pago dividido.
  function registrarPagoCC(clienteId, monto, nota, metodo, ventaAplicada, pagos, recibidoPor){
    var cliente = clientes.find(function(c){ return c.id===clienteId; });
    var nuevoSaldo = Math.max(0, Math.round(((cliente && cliente.saldoCC || 0)-monto)*100)/100);
    var batch = db.batch();
    batch.update(negDoc('clientes', clienteId), { saldoCC: nuevoSaldo });
    var movRef = negRef('movimientosCC').doc();
    var movData = { clienteId: clienteId, tipo:'pago', monto: monto, fecha: nowISO(), nota: nota || (ventaAplicada ? 'Pago parcial venta #'+ventaAplicada.numero : 'Pago a cuenta'), metodo: metodo==='transferencia' ? 'transferencia' : 'contado' };
    if(recibidoPor && String(recibidoPor).trim()) movData.recibidoPor = String(recibidoPor).trim();
    if(metodo==='mixto' && pagos){
      var pc = Math.round((Number(pagos.contado)||0)*100)/100, pt = Math.round((Number(pagos.transferencia)||0)*100)/100;
      if(pc>0 && pt>0){ movData.metodo = 'mixto'; movData.pagos = { contado:pc, transferencia:pt }; }
      else movData.metodo = pt>0 ? 'transferencia' : 'contado';
    }
    // Se usa aplicadoAVentaId (y NO ventaId) para que el cierre de caja lo cuente como cobro de cuenta corriente.
    if(ventaAplicada) movData.aplicadoAVentaId = ventaAplicada.id;
    batch.set(movRef, movData);
    return batch.commit().then(function(){
      pushToast('Pago registrado correctamente', 'success');
    }).catch(function(err){ console.error(err); pushToast('Error al registrar el pago', 'error'); });
  }

  // Registra la venta LEYENDO stock/contador reales del servidor dentro de una transacción:
  // evita que dos ventas simultáneas desde dispositivos distintos pisen el mismo stock.
  // Requiere conexión — confirmarVenta la usa como camino principal y, si no responde a
  // tiempo, cae sola al camino offline (confirmarVentaOffline, más abajo).
  function confirmarVentaOnline(d){
    return db.runTransaction(function(transaction){
      return Promise.all(
        d.productoRefs.map(function(pr){ return transaction.get(pr.ref); })
      ).then(function(prodSnaps){
        return transaction.get(d.clienteRef).then(function(clienteSnap){
          return transaction.get(d.contadorRef).then(function(contadorSnap){
            for(var i=0;i<prodSnaps.length;i++){
              var snap = prodSnaps[i];
              var it = d.productoRefs[i].item;
              if(!snap.exists) continue;
              if(snap.data().controlaStock === false) continue;
              if(snap.data().stock < it.cantidad){
                throw new Error('STOCK_INSUFICIENTE:' + it.nombre);
              }
            }

            var numero = (contadorSnap.exists ? contadorSnap.data().ultimoNumero : 1000) + 1;
            var clienteData = clienteSnap.exists ? clienteSnap.data() : d.clienteLocal;

            var venta = {
              numero: numero, fecha: d.fecha, items: d.items, total: d.total, metodoPago: d.metodoPago,
              clienteId: d.clienteLocal.id, clienteNombre: d.nombreParaVenta, nombrePedido: d.nombrePedido||null,
              puntoVentaId: d.puntoVentaId||null, puntoVentaNombre: d.puntoVentaNombre||null,
              estado:'completada', montoRecibido: d.montoRecibido === undefined ? null : d.montoRecibido,
              atendioPor: d.atendioPor, entrega: d.entrega||0, entregaMetodo: d.entregaMetodo||null,
                            pagos: d.pagos||null, efectivoRecibido: d.efectivoRecibido==null ? null : d.efectivoRecibido
            };

            transaction.set(d.ventaRef, venta);
            transaction.set(d.contadorRef, { ultimoNumero: numero }, { merge: true });

            prodSnaps.forEach(function(snap, i){
              if(!snap.exists) return;
              if(snap.data().controlaStock === false) return;
              var it = d.productoRefs[i].item;
              var nuevoStock = Math.max(0, Math.round((snap.data().stock - it.cantidad)*1000)/1000);
              transaction.update(d.productoRefs[i].ref, { stock: nuevoStock });
            });

            if(d.montoCC>0){
              var nuevoSaldo = Math.round(((clienteData.saldoCC||0)+d.montoCC)*100)/100;
              transaction.update(d.clienteRef, { saldoCC: nuevoSaldo });
              var movRef = negRef('movimientosCC').doc();
              transaction.set(movRef, { clienteId: d.clienteLocal.id, tipo:'venta', monto: d.total, fecha: d.fecha, nota:'Venta #'+numero, ventaId: d.ventaRef.id });
              (d.cobrosCC||[]).forEach(function(c){
                transaction.set(negRef('movimientosCC').doc(), { clienteId: d.clienteLocal.id, tipo:'pago', monto: c.monto, fecha: fechaEntregaCC(d.fecha), nota:'Entrega en venta #'+numero, metodo: c.metodo, ventaId: d.ventaRef.id });
              });
            }

            return { id: d.ventaRef.id, numero: numero, venta: venta };
          });
        });
      });
    });
  }

  // Registra la venta SIN transacción, con los datos que ya tenemos sincronizados en el
  // dispositivo (stock, número de venta, cliente). batch.commit() encola la escritura en
  // el almacenamiento local (IndexedDB) y la sincroniza sola apenas vuelve la conexión —
  // no esperamos la confirmación del servidor para no trabar la pantalla mientras no hay señal.
  // Contrapartida de no usar transacción: si DOS dispositivos venden offline al mismo tiempo
  // el mismo producto justo al límite del stock, no hay forma de detectarlo hasta sincronizar.
  function confirmarVentaOffline(d){
    for(var i=0;i<d.productoRefs.length;i++){
      var it = d.productoRefs[i].item;
      var prodLocal = productos.find(function(p){ return p.id===it.productoId; });
      if(prodLocal && prodLocal.controlaStock !== false && prodLocal.stock < it.cantidad){
        return Promise.reject(new Error('STOCK_INSUFICIENTE:' + it.nombre));
      }
    }

    // Se toma el mayor entre el contador del servidor (último conocido) y las ventas recientes del dispositivo
    var numero = ventas.reduce(function(m,v){ return Math.max(m, v.numero||0); }, Math.max(1000, contadorVentas||0)) + 1;
    var venta = {
      numero: numero, fecha: d.fecha, items: d.items, total: d.total, metodoPago: d.metodoPago,
      clienteId: d.clienteLocal.id, clienteNombre: d.nombreParaVenta, nombrePedido: d.nombrePedido||null,
              puntoVentaId: d.puntoVentaId||null, puntoVentaNombre: d.puntoVentaNombre||null,
      estado:'completada', montoRecibido: d.montoRecibido === undefined ? null : d.montoRecibido,
      atendioPor: d.atendioPor, entrega: d.entrega||0, entregaMetodo: d.entregaMetodo||null,
            pagos: d.pagos||null, efectivoRecibido: d.efectivoRecibido==null ? null : d.efectivoRecibido
    };

    var batch = db.batch();
    batch.set(d.ventaRef, venta);
    batch.set(d.contadorRef, { ultimoNumero: numero }, { merge:true });
    d.productoRefs.forEach(function(pr){
      var it = pr.item;
      var prodLocal = productos.find(function(p){ return p.id===it.productoId; });
      if(prodLocal && prodLocal.controlaStock !== false){
        var nuevoStock = Math.max(0, Math.round((prodLocal.stock - it.cantidad)*1000)/1000);
        batch.update(negDoc('productos', it.productoId), { stock: nuevoStock });
      }
    });
    if(d.montoCC>0){
      var nuevoSaldo = Math.round(((d.clienteLocal.saldoCC||0)+d.montoCC)*100)/100;
      batch.update(d.clienteRef, { saldoCC: nuevoSaldo });
      var movRef = negRef('movimientosCC').doc();
      batch.set(movRef, { clienteId: d.clienteLocal.id, tipo:'venta', monto: d.total, fecha: d.fecha, nota:'Venta #'+numero, ventaId: d.ventaRef.id });
      (d.cobrosCC||[]).forEach(function(c){
        batch.set(negRef('movimientosCC').doc(), { clienteId: d.clienteLocal.id, tipo:'pago', monto: c.monto, fecha: fechaEntregaCC(d.fecha), nota:'Entrega en venta #'+numero, metodo: c.metodo, ventaId: d.ventaRef.id });
      });
    }
    // No se espera este commit: si no hay conexión la promesa recién resuelve al sincronizar,
    // y no queremos trabar el ticket/modal de cobro esperando eso.
    batch.commit().catch(function(err){ console.error('Error sincronizando una venta guardada localmente:', err); });

    return Promise.resolve({ id: d.ventaRef.id, numero: numero, venta: venta });
  }

  function confirmarVenta(args){
    var items = args.items, metodoPago = args.metodoPago, clienteId = args.clienteId, montoRecibido = args.montoRecibido, clienteNombreLibre = args.clienteNombreLibre, atendioPor = args.atendioPor || '';
    var puntoVentaId = args.puntoVentaId || null, puntoVentaNombre = args.puntoVentaNombre || null;
    var clienteLocal = clientes.find(function(c){ return c.id===clienteId; }) || clientes.find(function(c){ return c.id==='cli-cf'; }) || clientes[0];
    if(!clienteLocal){
      pushToast('No se pudo confirmar la venta: todavía no hay ningún cliente cargado en esta sucursal. Probá de nuevo en unos segundos.', 'error');
      return Promise.resolve(null);
    }
    var esVentaFiada = metodoPago==='cuenta_corriente' || (metodoPago==='mixto' && args.pagos && Number(args.pagos.cuenta_corriente)>0);
    var nombreLibreLimpio = (clienteNombreLibre && clienteNombreLibre.trim()) ? clienteNombreLibre.trim() : '';
    var nombreParaVenta = (!esVentaFiada && nombreLibreLimpio) ? nombreLibreLimpio : clienteLocal.nombre;
    // Nombre con el que se armó el pedido (si difiere del cliente), para dejarlo registrado aparte
    var pedidoNom = (args.nombrePedido && args.nombrePedido.trim()) ? args.nombrePedido.trim() : nombreLibreLimpio;
    var nombrePedido = (pedidoNom && normalizeStr(pedidoNom)!==normalizeStr(nombreParaVenta) && normalizeStr(pedidoNom)!=='consumidor final') ? pedidoNom : null;
    var total = Math.round(items.reduce(function(s,i){ return s+i.subtotal; }, 0)*100)/100;
    var entrega = 0, entregaMetodo = null;
    if(metodoPago==='cuenta_corriente'){
      var entIn = Math.round((Number(args.entregaMonto)||0)*100)/100;
      if(entIn>0 && entIn<total){ entrega = entIn; entregaMetodo = args.entregaMetodo==='transferencia' ? 'transferencia' : 'contado'; }
    }
    // Pago dividido: montos por método
    var pagos = null, efectivoRecibido = null;
    if(metodoPago==='mixto'){
      var pin = args.pagos || {};
      var r2 = function(n){ return Math.max(0, Math.round((Number(n)||0)*100)/100); };
      pagos = { contado: r2(pin.contado), transferencia: r2(pin.transferencia), debito: r2(pin.debito), credito: r2(pin.credito), cuenta_corriente: r2(pin.cuenta_corriente) };
      if(pagos.cuenta_corriente>0 && (!clienteLocal || clienteLocal.esGenerico || clienteLocal.id==='cli-cf')){
        pushToast('Para cargar una parte a cuenta corriente tenés que elegir un cliente.', 'error');
        return Promise.resolve(null);
      }
      if(pagos.contado>0 && Number(args.efectivoRecibido)>pagos.contado) efectivoRecibido = r2(args.efectivoRecibido);
    }
    if(pagos){
      var sumaPagos = Math.round((pagos.contado+pagos.transferencia+pagos.debito+pagos.credito+pagos.cuenta_corriente)*100)/100;
      var aCobrar = total;
      if(Math.abs(sumaPagos-aCobrar)>0.009){
        pushToast('Los montos del pago dividido ('+fmtMoney(sumaPagos)+') no coinciden con el total ('+fmtMoney(aCobrar)+').', 'error');
        return Promise.resolve(null);
      }
    }
    // Movimientos de cuenta corriente: cuánto queda como deuda y qué se cobró en el momento
    var montoCC = 0, cobrosCC = [];
    if(metodoPago==='cuenta_corriente'){
      montoCC = Math.round((total-entrega)*100)/100;
      if(entrega>0) cobrosCC.push({ monto:entrega, metodo:entregaMetodo||'contado' });
    } else if(pagos && pagos.cuenta_corriente>0){
      montoCC = pagos.cuenta_corriente;
      if(pagos.contado>0) cobrosCC.push({ monto:pagos.contado, metodo:'contado' });
      if(pagos.transferencia>0) cobrosCC.push({ monto:pagos.transferencia, metodo:'transferencia' });
    }
    var fecha = nowISO();

    var datos = {
      ventaRef: negRef('ventas').doc(),
      // Un mismo producto puede venir en varias líneas (ej: pedidos unificados de distintos puntos de venta):
      // se suma la cantidad por producto para descontar el stock una sola vez y sin pisarse.
      productoRefs: (function(){
        var porId = {}, orden = [];
        items.forEach(function(it){
          if(!it.productoId) return;
          if(!porId[it.productoId]){ porId[it.productoId] = { productoId: it.productoId, nombre: it.nombre, cantidad: 0 }; orden.push(it.productoId); }
          porId[it.productoId].cantidad = Math.round((porId[it.productoId].cantidad + (Number(it.cantidad)||0))*1000)/1000;
        });
        return orden.map(function(id){ return { item: porId[id], ref: negDoc('productos', id) }; });
      })(),
      clienteRef: negDoc('clientes', clienteLocal.id),
      contadorRef: negDoc('contadores', 'ventas'),
      clienteLocal: clienteLocal, items: items, total: total, fecha: fecha, metodoPago: metodoPago,
      puntoVentaId: puntoVentaId, puntoVentaNombre: puntoVentaNombre, nombreParaVenta: nombreParaVenta, nombrePedido: nombrePedido, montoRecibido: montoRecibido, atendioPor: atendioPor,
      entrega: entrega, entregaMetodo: entregaMetodo,
      pagos: pagos, efectivoRecibido: efectivoRecibido, montoCC: montoCC, cobrosCC: cobrosCC
    };

    // Si ya sabemos que no hay conexión, vamos directo al camino offline (sin esperar nada).
    // Si hay conexión, intentamos la transacción normal; si el servidor no responde en 6
    // segundos (corte de conexión justo durante la venta, sin que el navegador lo note todavía),
    // caemos igual al camino offline — la venta nunca queda esperando indefinidamente.
    var intento = online ? withTimeout(confirmarVentaOnline(datos), 6000) : Promise.reject(new Error('SIN_CONEXION'));

    return intento.then(function(resultado){
      pushToast('Venta #'+resultado.numero+' registrada — '+fmtMoney(total), 'success');
      var result = { id: resultado.id };
      for(var k in resultado.venta) result[k] = resultado.venta[k];
      return result;
    }).catch(function(err){
      if(err && err.message && err.message.indexOf('STOCK_INSUFICIENTE:')===0){
        var nombreProd = err.message.split(':')[1];
        pushToast('Sin stock suficiente de "'+nombreProd+'" — alguien más lo vendió recién. Revisá el carrito.', 'error');
        return null;
      }
      if(err && err.message !== 'SIN_CONEXION' && err.message !== 'TIMEOUT_SIN_CONEXION'){
        console.error(err);
      }
      // Sin conexión o el servidor no respondió a tiempo: guardamos la venta en el dispositivo.
      return confirmarVentaOffline(datos).then(function(resultado){
        pushToast('Sin conexión: venta #'+resultado.numero+' guardada en el dispositivo — se sincronizará sola cuando vuelva internet.', 'info');
        var result = { id: resultado.id };
        for(var k in resultado.venta) result[k] = resultado.venta[k];
        return result;
      }).catch(function(err2){
        if(err2 && err2.message && err2.message.indexOf('STOCK_INSUFICIENTE:')===0){
          var nombreProd2 = err2.message.split(':')[1];
          pushToast('Sin stock suficiente de "'+nombreProd2+'".', 'error');
        } else {
          console.error(err2);
          pushToast('Error al registrar la venta.', 'error');
        }
        return null;
      });
    });
  }

  // --- Apertura / cierre de caja (un turno abierto por sucursal, compartido entre dispositivos)

  // Define qué productos se muestran en un punto de venta (desde la vista del punto).
  // idsVisibles: ids de productos que tienen que verse en pvId. Se ajusta la lista puntosVenta
  // de cada producto afectado (lista vacía = se ve en todos los puntos).
  function guardarProductosDePuntoVenta(pvId, idsVisibles){
    var todos = puntosVenta.map(function(x){ return x.id; });
    var visibles = {}; idsVisibles.forEach(function(id){ visibles[id]=true; });
    var cambios = [];
    productos.forEach(function(p){
      var antes = productoEnPuntoVenta(p, pvId), ahora = !!visibles[p.id];
      if(antes===ahora) return;
      var lista = (p.puntosVenta && p.puntosVenta.length) ? p.puntosVenta.filter(function(id){ return todos.indexOf(id)>=0; }) : todos.slice();
      if(ahora){ if(lista.indexOf(pvId)<0) lista.push(pvId); }
      else lista = lista.filter(function(id){ return id!==pvId; });
      // Si quedó en todos los puntos, se guarda vacío (= todos, incluso los que se creen después)
      if(todos.every(function(id){ return lista.indexOf(id)>=0; })) lista = [];
      cambios.push({ id:p.id, lista:lista });
    });
    if(!cambios.length){ pushToast('No hubo cambios', 'info'); return Promise.resolve(true); }
    var tandas = []; for(var i=0;i<cambios.length;i+=450) tandas.push(cambios.slice(i,i+450));
    return tandas.reduce(function(prom, t){
      return prom.then(function(){ var b = db.batch(); t.forEach(function(c){ b.update(negDoc('productos', c.id), { puntosVenta:c.lista }); }); return b.commit(); });
    }, Promise.resolve()).then(function(){
      pushToast('Productos actualizados ('+cambios.length+')', 'success'); return true;
    }).catch(function(err){ console.error(err); pushToast('Error al guardar los productos del punto de venta', 'error'); return false; });
  }

  function agregarItemPedidoPendiente(pedidoId, producto, cantidadDefault, subtotalFijo){
    var pedido = pedidosPendientes.find(function(p){ return p.id===pedidoId; });
    if(!pedido) return Promise.resolve();
    var cant = cantidadDefault != null ? cantidadDefault : 1;
    var items = pedido.items || [];
    var idx = -1;
    for(var i=0;i<items.length;i++){ if(items[i].productoId===producto.id && !items[i].editable){ idx=i; break; } }
    var nuevosItems;
    if(idx>=0){
      var nuevaCant = Math.round((items[idx].cantidad + cant)*1000)/1000;
      // subtotalFijo: venta por monto ("$2000 de pan") — se cobra exacto lo pedido
      var nuevoSubtotal = subtotalFijo!=null ? Math.round(((items[idx].subtotal||0)+subtotalFijo)*100)/100 : Math.round(producto.precioVenta*nuevaCant*100)/100;
      nuevosItems = items.slice();
      nuevosItems[idx] = { productoId:producto.id, nombre:producto.nombre, unidad:producto.unidad, cantidad:nuevaCant, precioUnit:producto.precioVenta, subtotal:nuevoSubtotal };
    } else {
      var subtotal = subtotalFijo!=null ? Math.round(subtotalFijo*100)/100 : Math.round(producto.precioVenta*cant*100)/100;
      nuevosItems = items.concat([{ productoId:producto.id, nombre:producto.nombre, unidad:producto.unidad, cantidad:cant, precioUnit:producto.precioVenta, subtotal:subtotal }]);
    }
    return negDoc('pedidosPendientes', pedidoId).update({ items:nuevosItems })
      .catch(function(err){ console.error(err); pushToast('Error al agregar el ítem al pedido', 'error'); });
  }
  function actualizarCantidadItemPedidoPendiente(pedidoId, idx, nuevaCantidad){
    var pedido = pedidosPendientes.find(function(p){ return p.id===pedidoId; });
    if(!pedido) return Promise.resolve();
    var items = pedido.items || [];
    if(idx<0 || idx>=items.length) return Promise.resolve();
    var it = items[idx];
    var minQty = isDecimalUnit(it.unidad) ? 0.05 : 1;
    var cantFinal = Math.max(minQty, nuevaCantidad);
    cantFinal = Math.round(cantFinal*1000)/1000;
    var nuevosItems = items.slice();
    nuevosItems[idx] = clonarItem(it, { cantidad:cantFinal, subtotal: Math.round(it.precioUnit*cantFinal*100)/100 });
    return negDoc('pedidosPendientes', pedidoId).update({ items:nuevosItems })
      .catch(function(err){ console.error(err); pushToast('Error al actualizar la cantidad', 'error'); });
  }
  function quitarItemPedidoPendiente(pedidoId, idx){

    if(!pedido) return Promise.resolve();
    var nuevosItems = (pedido.items || []).filter(function(_,i){ return i!==idx; });

  // Cobra juntos varios pedidos del mismo cliente (armados en distintos puntos de venta) como UNA sola venta.
  // Cada ítem queda marcado con el punto de venta de donde vino, así el cierre de caja y el historial
  // reparten bien el total por punto de venta.
  function cobrarPedidosPendientes(pedidoIds, pagoData){
    var peds = (pedidoIds||[]).map(function(id){ return pedidosPendientes.find(function(p){ return p.id===id; }); })
      .filter(function(p){ return p && p.items && p.items.length>0; });
    if(!peds.length) return Promise.resolve(null);
    if(peds.length===1) return cobrarPedidoPendiente(peds[0].id, pagoData);
    var items = [], pvIds = [], pvNombres = [], atendieron = [];
    peds.forEach(function(ped){
      var pvId = puntoVentaDePedido(ped);
      var pv = puntosVenta.find(function(x){ return x.id===pvId; });
      var pvNom = pv ? pv.nombre : 'Despensa';
      if(pvIds.indexOf(pvId)<0){ pvIds.push(pvId); pvNombres.push(pvNom); }
      var at = (ped.atendioPor||'').trim();
      if(at && atendieron.indexOf(at)<0) atendieron.push(at);
      (ped.items||[]).forEach(function(it){ items.push(clonarItem(it, { puntoVentaId: pvId, puntoVentaNombre: pvNom })); });
    });
    var nombre = peds[0].clienteNombre || '';
    var args = { items: items, puntoVentaId: pvIds.length===1 ? pvIds[0] : null, puntoVentaNombre: pvNombres.join(' + '),
      clienteNombreLibre: nombre, atendioPor: atendieron.join(', ') };
    for(var k in pagoData) args[k]=pagoData[k];
    args.nombrePedido = nombre;
    return confirmarVenta(args).then(function(venta){
      if(!venta) return null;
      var b = db.batch();
      peds.forEach(function(ped){ b.delete(negDoc('pedidosPendientes', ped.id)); });
      // Sin conexión el commit recién resuelve al sincronizar: no se espera
      b.commit().catch(function(err){ console.error('Error borrando los pedidos cobrados:', err); });
      return venta;
    });
  }
  function cobrarPedidoPendiente(pedidoId, pagoData){
    var pedido = pedidosPendientes.find(function(p){ return p.id===pedidoId; });
    if(!pedido || !pedido.items || pedido.items.length===0) return Promise.resolve(null);
    var pvId = puntoVentaDePedido(pedido);
    var pv = puntosVenta.find(function(x){ return x.id===pvId; });
    var args = { items: pedido.items, puntoVentaId: pvId, puntoVentaNombre: pv ? pv.nombre : 'Despensa', clienteNombreLibre: pedido.clienteNombre || '', atendioPor: pedido.atendioPor || '' };
    for(var k in pagoData) args[k]=pagoData[k];
    args.nombrePedido = pedido.clienteNombre || '';
    return confirmarVenta(args).then(function(venta){
      if(venta){
        return negDoc('pedidosPendientes', pedidoId).delete().then(function(){ return venta; });
      }
      return null;
    });
  }

  // Producto editable: agrega SIEMPRE una línea nueva (no se mezcla con otras) con el nombre,

  // --- Anular una venta mal hecha ---------------------------------------------------------
  // Marca la venta como anulada (queda en el historial tachada, con motivo y quién la anuló),
  // devuelve al stock lo vendido y, si fue fiada, saca de la cuenta corriente del cliente el cargo
  // y los pagos/entregas ligados a esa venta (ajustando su saldo). Al estar anulada deja de contar
  // en el cierre de caja, el inicio y las estadísticas.
  function anularVenta(venta, datos){
    datos = datos || {};
    if(!venta || ventaAnulada(venta)) return Promise.resolve(false);
    // Movimientos de cuenta corriente de esta venta: los recientes están en memoria; si es fiada
    // se consultan al servidor (pueden ser de antes de la ventana en vivo).
    var movsLocales = movimientosTodos.filter(function(m){ return m.ventaId===venta.id || m.aplicadoAVentaId===venta.id; });
    var buscarMovs = !ventaTieneCC(venta) ? Promise.resolve(movsLocales) :
      withTimeout(Promise.all([
        negRef('movimientosCC').where('ventaId','==',venta.id).get(),
        negRef('movimientosCC').where('aplicadoAVentaId','==',venta.id).get()
      ]), 6000).then(function(res){ return unirPorId(movsLocales, snapToArray(res[0]).concat(snapToArray(res[1]))); })
        .catch(function(){ return movsLocales; });
    return buscarMovs.then(function(movs){ return anularVentaConMovs(venta, datos, movs); });
  }
  function anularVentaConMovs(venta, datos, movs){
    var inc = firebase.firestore.FieldValue.increment;
    var batch = db.batch();
    var cambiosVenta = { estado:'anulada', anuladaEn: nowISO(), anuladaPor: (datos.anuladaPor||'').trim(), motivoAnulacion: (datos.motivo||'').trim() };
    batch.update(negDoc('ventas', venta.id), cambiosVenta);
    // Stock: se devuelve lo vendido (solo productos que llevan control de stock)
    var devolver = {};
    (venta.items||[]).forEach(function(it){ if(it.productoId) devolver[it.productoId] = (devolver[it.productoId]||0) + (Number(it.cantidad)||0); });
    Object.keys(devolver).forEach(function(pid){
      var prod = productos.find(function(p){ return p.id===pid; });
      if(!prod || prod.controlaStock===false) return;
      batch.update(negDoc('productos', pid), { stock: inc(Math.round(devolver[pid]*1000)/1000) });
    });
    // Cuenta corriente: se borran los movimientos de esta venta y se corrige el saldo del cliente
    var ajuste = 0;
    movs.forEach(function(m){
      ajuste += m.tipo==='pago' ? (m.monto||0) : -(m.monto||0);
      batch.delete(negDoc('movimientosCC', m.id));
    });
    ajuste = Math.round(ajuste*100)/100;
    if(movs.length && ajuste!==0 && venta.clienteId){
      batch.update(negDoc('clientes', venta.clienteId), { saldoCC: inc(ajuste) });
    }
    // Lo cargado a pedido no se actualiza solo: se refleja la anulación a mano
    var idsBorrados = {}; movs.forEach(function(m){ idsBorrados[m.id] = true; });
    setMovsViejos(function(prev){ return prev.filter(function(m){ return !idsBorrados[m.id]; }); });
    setVentasViejas(function(prev){ return prev.map(function(v){ return v.id===venta.id ? clonarItem(v, cambiosVenta) : v; }); });
    var commit = batch.commit();
    // Sin conexión la promesa recién resuelve al sincronizar: no se traba la pantalla esperando
    if(!online){
      commit.catch(function(err){ console.error('Error sincronizando la anulación:', err); });
      pushToast('Venta #'+venta.numero+' anulada (se sincroniza al volver la conexión)', 'info');
      return Promise.resolve(true);
    }
    return commit.then(function(){
      pushToast('Venta #'+venta.numero+' anulada — stock y cuenta corriente actualizados', 'success');
      return true;
    }).catch(function(err){ console.error(err); pushToast('Error al anular la venta', 'error'); return false; });
  }

  function guardarConfigNegocio(data){
    return db.collection("negocios").doc(NEGOCIO_ID).set(data, { merge: true }).then(function(){
      pushToast("Configuración guardada", "success");
    }).catch(function(err){ console.error(err); pushToast("Error al guardar la configuración", "error"); });
  }

  // --- Borrar datos de prueba (para pasar a uso real) -----------------------------------------
  // Por cada sucursal elegida borra: ventas, movimientos de cuenta corriente, cierres de caja,
  // pedidos pendientes y el contador de N° de venta (la numeración vuelve a arrancar); vacía las
  // deja en $0 el saldo de cuenta corriente de los clientes.
  // NO toca: productos, categorías, clientes, puntos de venta, empleados ni configuración.
  // Opcional: devolver al stock lo que se descontó con las ventas de prueba.
  function borrarDatosDePrueba(sucursalIds, devolverStock){
    function ref(sid, sub){ return sucursalesRef().doc(sid).collection(sub); }
    function commitEnTandas(ops){
      // Firestore admite hasta 500 operaciones por batch
      var tandas = []; for(var i=0;i<ops.length;i+=450) tandas.push(ops.slice(i,i+450));
      return tandas.reduce(function(prom, tanda){
        return prom.then(function(){ var b = db.batch(); tanda.forEach(function(op){ op(b); }); return b.commit(); });
      }, Promise.resolve());
    }
    function limpiarSucursal(sid){
      var ops = [];
      var pasoStock = !devolverStock ? Promise.resolve() :
        Promise.all([ref(sid,'ventas').get(), ref(sid,'productos').get()]).then(function(res){
          var vendido = {};
          res[0].docs.forEach(function(d){ if(d.data().estado==='anulada') return; (d.data().items||[]).forEach(function(it){ if(it.productoId) vendido[it.productoId] = (vendido[it.productoId]||0) + (Number(it.cantidad)||0); }); });
          res[1].docs.forEach(function(d){
            var pd = d.data(); var cant = vendido[d.id];
            if(!cant || pd.controlaStock===false) return;
            var nuevo = Math.round(((Number(pd.stock)||0) + cant)*1000)/1000;
            ops.push(function(b){ b.update(d.ref, { stock: nuevo }); });
          });
        });
      return pasoStock.then(function(){
        return Promise.all(['ventas','movimientosCC','turnosCaja','contadores','pedidosPendientes','clientes'].map(function(sub){ return ref(sid, sub).get(); }));
      }).then(function(snaps){
        ['ventas','movimientosCC','turnosCaja','contadores','pedidosPendientes'].forEach(function(sub, i){
          snaps[i].docs.forEach(function(d){ ops.push(function(b){ b.delete(d.ref); }); });
        });
        snaps[5].docs.forEach(function(d){ if((d.data().saldoCC||0)!==0) ops.push(function(b){ b.update(d.ref, { saldoCC:0 }); }); });
        return commitEnTandas(ops);
      });
    }
    if(!sucursalIds || !sucursalIds.length) return Promise.resolve(false);
    pushToast('Borrando datos de prueba, aguardá...', 'info');
    return sucursalIds.reduce(function(prom, sid){ return prom.then(function(){ return limpiarSucursal(sid); }); }, Promise.resolve())
      .then(function(){ setVentasViejas([]); setMovsViejos([]); setCuentasCargadas({}); setHayMasViejas(true); setViejasHasta(ventasDesde); pushToast('Listo: se borraron los datos de prueba. Ya se puede empezar a usar en real.', 'success'); return true; })
      .catch(function(err){ console.error(err); pushToast('Error al borrar los datos de prueba: '+err.message, 'error'); return false; });
  }

  // Estas acciones borran solo los datos de la SUCURSAL ACTUAL (ventas, clientes, productos,
  // categorías) — el resto de las sucursales y la configuración general del negocio no se tocan.
  function resetearTodo(){
    var colecciones = ['ventas', 'movimientosCC', 'clientes', 'productos', 'categorias', 'contadores', 'turnosCaja'];
    pushToast('Borrando datos de esta sucursal, aguardá...', 'info');

    function borrarColeccion(nombre){
      return negRef(nombre).get().then(function(snap){
        if(snap.empty) return Promise.resolve();
        var batch = db.batch();
        snap.docs.forEach(function(doc){ batch.delete(doc.ref); });
        return batch.commit().then(function(){
          // Si quedan más (Firestore borra de a 500), recursivo
          if(snap.size >= 500) return borrarColeccion(nombre);
        });
      });
    }

    return Promise.all(colecciones.map(borrarColeccion))
      .then(function(){
        pushToast('¡Listo! Se borraron todos los datos de esta sucursal.', 'success');
      })
      .catch(function(err){
        console.error(err);
        pushToast('Error al resetear: ' + err.message, 'error');
      });
  }

  // ── Sucursales ──
  function desmarcarOtrasCentrales(idAExcluir){
    // Sólo puede haber una sucursal central a la vez: al marcar una, se desmarcan las demás.
    var otras = sucursales.filter(function(s){ return s.id!==idAExcluir && s.esCentral===true; });
    if(otras.length===0) return Promise.resolve();
    var batch = db.batch();
    otras.forEach(function(s){ batch.update(sucursalDoc(s.id), { esCentral:false }); });
    return batch.commit();
  }
  function addSucursal(data){
    var d2 = {
      nombre: (data.nombre||'').trim() || 'Sucursal',
      direccion: (data.direccion||'').trim(),
      telefono: (data.telefono||'').trim(),
      esCentral: !!data.esCentral,
      clave: (data.clave||'').trim() || '1234',
      cajaUsuario: (data.cajaUsuario||'').trim() || 'caja',
      activa: true, creadaEn: nowISO()
    };
    var previo = d2.esCentral ? desmarcarOtrasCentrales(null) : Promise.resolve();
    return previo.then(function(){
      return sucursalesRef().add(d2);
    }).then(function(ref){
      pushToast('Sucursal creada', 'success');
      return ref;
    }).catch(function(err){ console.error(err); pushToast('Error al crear la sucursal', 'error'); });
  }
  function updateSucursal(id, data){
    var previo = data.esCentral===true ? desmarcarOtrasCentrales(id) : Promise.resolve();
    return previo.then(function(){
      return sucursalDoc(id).update(data);
    }).then(function(){
      pushToast('Sucursal actualizada', 'success');
    }).catch(function(err){ console.error(err); pushToast('Error al actualizar la sucursal', 'error'); });
  }
  function deleteSucursal(id){
    return sucursalDoc(id).update({ activa:false }).then(function(){
      pushToast('Sucursal dada de baja', 'info');
    }).catch(function(err){ console.error(err); pushToast('Error al dar de baja la sucursal', 'error'); });
  }
  function restoreSucursal(id){
    return sucursalDoc(id).update({ activa:true }).then(function(){
      pushToast('Sucursal reactivada', 'success');
    }).catch(function(err){ console.error(err); pushToast('Error al reactivar la sucursal', 'error'); });
  }
  function seleccionarSucursal(id){
    try{ localStorage.setItem('sucursalActualId', id); }catch(e){}
    setSucursalId(id);
  }
  function cambiarSucursal(){
    try{ localStorage.removeItem('sucursalActualId'); }catch(e){}
    setSucursalId(null);
  }

  var value = {
    categorias: categorias, productos: productos, clientes: clientes, ventas: ventasTodas,
    movimientosCC: movimientosTodos, toasts: toasts, pushToast: pushToast,
    ventasDesde: ventasDesde, cargarVentasAnteriores: cargarVentasAnteriores, hayMasVentasAnteriores: hayMasViejas,
    cargandoVentasAnteriores: cargandoViejas, ventasAnterioresHasta: (viejasHasta < ventasDesde ? viejasHasta : ventasDesde),
    cargarCuentaCliente: cargarCuentaCliente, cuentasCargadas: cuentasCargadas,
    addProducto: addProducto, addProductosMultiples: addProductosMultiples, updateProducto: updateProducto, deleteProducto: deleteProducto, restoreProducto: restoreProducto,
    importarProductosExcel: importarProductosExcel, actualizarPreciosMasivo: actualizarPreciosMasivo,
    addCategoria: addCategoria, updateCategoria: updateCategoria, deleteCategoria: deleteCategoria,
    addCliente: addCliente, updateCliente: updateCliente, deleteCliente: deleteCliente, registrarPagoCC: registrarPagoCC,
    confirmarVenta: confirmarVenta, anularVenta: anularVenta, configNegocio: configNegocio, guardarConfigNegocio: guardarConfigNegocio,
    resetearTodo: resetearTodo, borrarDatosDePrueba: borrarDatosDePrueba,
    turnosCaja: turnosCaja, turnoAbierto: turnoAbierto, ultimoCierre: ultimoCierre, abrirCaja: abrirCaja, cerrarCaja: cerrarCaja,
    registrarMovimientoCaja: registrarMovimientoCaja, quitarMovimientoCaja: quitarMovimientoCaja,
    puntosVenta: puntosVenta, guardarProductosDePuntoVenta: guardarProductosDePuntoVenta, crearPuntoVenta: crearPuntoVenta, actualizarAccesoPuntoVenta: actualizarAccesoPuntoVenta, renombrarPuntoVenta: renombrarPuntoVenta, eliminarPuntoVenta: eliminarPuntoVenta, setVistaImagenesPuntoVenta: setVistaImagenesPuntoVenta,
    agregarItemEditable: agregarItemEditable, editarItemEditable: editarItemEditable,
    pedidosPendientes: pedidosPendientes, crearPedidoPendiente: crearPedidoPendiente, actualizarAtendioPorPedido: actualizarAtendioPorPedido,
    actualizarClientePedidoPendiente: actualizarClientePedidoPendiente, eliminarPedidoPendiente: eliminarPedidoPendiente,
    agregarItemPedidoPendiente: agregarItemPedidoPendiente, actualizarCantidadItemPedidoPendiente: actualizarCantidadItemPedidoPendiente,
    quitarItemPedidoPendiente: quitarItemPedidoPendiente, cobrarPedidoPendiente: cobrarPedidoPendiente, cobrarPedidosPendientes: cobrarPedidosPendientes,
    loadingData: loadingData || !recientesCargados, authReady: authReady, authError: authError,
    online: online, ventasPendientes: ventasPendientes,
    sucursales: sucursales, sucursalId: sucursalId,
    sucursalActual: sucursales.filter(function(s){ return s.id===sucursalId; })[0] || null,
    // Si ninguna sucursal fue marcada como central todavía, no se restringe el acceso a Ajustes
    // (comportamiento anterior, sin romper negocios que ya venían usando la app).
    tieneAccesoAjustes: (function(){
      var actual = sucursales.filter(function(s){ return s.id===sucursalId; })[0] || null;
      var hayCentralDefinida = sucursales.some(function(s){ return s.esCentral===true; });
      if(!hayCentralDefinida) return true;
      return !!(actual && actual.esCentral===true);
    })(),
    loadingInicial: loadingInicial,
    seleccionarSucursal: seleccionarSucursal, cambiarSucursal: cambiarSucursal,
    addSucursal: addSucursal, updateSucursal: updateSucursal, deleteSucursal: deleteSucursal, restoreSucursal: restoreSucursal
  };
  return h(AppCtx.Provider, { value: value }, children);
}

function Button(props){
  var variant = props.variant || 'primary';

  var base = { display:'inline-flex', alignItems:'center', justifyContent:'center', gap:8, fontWeight:700, border:'1px solid transparent', borderRadius:9, transition:'transform 0.05s ease, opacity 0.15s ease, background 0.15s ease', width: props.full?'100%':'auto' };
  var sizes = { sm:{ padding:'7px 12px', fontSize:13 }, md:{ padding:'10px 16px', fontSize:14 }, lg:{ padding:'13px 20px', fontSize:15 } };
  var variants = {
    primary:{ background:'var(--green)', color:'white' },
    dark:{ background:'var(--ink)', color:'white' },
    ghost:{ background:'transparent', color:'var(--ink)', borderColor:'var(--border)' },
    subtle:{ background:'var(--panel-2)', color:'var(--ink)' },
    danger:{ background:'var(--red)', color:'white' },
    outlineGreen:{ background:'var(--green-bg)', color:'var(--green-dark)' }
  };
  var style = {};
  for(var k in base) style[k]=base[k];
  for(var k2 in sizes[size]) style[k2]=sizes[size][k2];
  for(var k3 in variants[variant]) style[k3]=variants[variant][k3];
  if(props.style) for(var k4 in props.style) style[k4]=props.style[k4];
  style.opacity = props.disabled ? 0.5 : 1;
  style.cursor = props.disabled ? 'not-allowed' : 'pointer';

  var rest = {};
  for(var k5 in props){ if(['children','variant','size','icon','full','style'].indexOf(k5)===-1) rest[k5]=props[k5]; }
  rest.style = style;
  rest.onMouseDown = function(e){ if(!props.disabled) e.currentTarget.style.transform='scale(0.98)'; };
  rest.onMouseUp = function(e){ e.currentTarget.style.transform='scale(1)'; };
  rest.onMouseLeave = function(e){ e.currentTarget.style.transform='scale(1)'; };

  return h('button', rest, props.icon || null, props.children);
}

// Campo de cantidad editable a mano en los carritos/tickets: mientras se escribe guarda el
// texto localmente (así se puede borrar y tipear otro número sin que salte al valor anterior)
// y recién aplica el cambio al salir del campo o con Enter. Escape descarta lo escrito.
function CantidadInput(props){
  var textoS = useState(String(props.cantidad)); var texto = textoS[0]; var setTexto = textoS[1];
  var editandoS = useState(false); var editando = editandoS[0]; var setEditando = editandoS[1];
  var descartarRef = useRef(false);
  useEffect(function(){ if(!editando) setTexto(String(props.cantidad)); }, [props.cantidad, editando]);
  function commit(){
    setEditando(false);
    if(descartarRef.current){ descartarRef.current = false; setTexto(String(props.cantidad)); return; }
    var v = Number(String(texto).replace(',', '.'));
    if(isNaN(v) || v<=0){ setTexto(String(props.cantidad)); return; }
    v = props.decimal ? Math.round(v*1000)/1000 : Math.round(v);
    if(v<=0) v = props.min || 1;
    setTexto(String(v));
    if(v!==props.cantidad) props.onCommit(v);
  }
  return h(TextInput, {
    type:'text', inputMode: props.decimal ? 'decimal' : 'numeric', value: texto,
    onFocus: function(e){ setEditando(true); var el = e.target; setTimeout(function(){ try{ el.select(); }catch(_){} }, 0); },
    onChange: function(e){ setEditando(true); setTexto(e.target.value.replace(/[^0-9.,]/g, '')); },
    onBlur: commit,
    onKeyDown: function(e){
      if(e.key==='Enter'){ e.preventDefault(); e.target.blur(); }
      else if(e.key==='Escape'){ descartarRef.current = true; e.target.blur(); }
    },
    style:{ width:64, textAlign:'center', padding:'4px 6px', fontSize:13, fontWeight:700 }
  });
}

  return h('select', rest, props.children);
}

function useAlertCounts(){
  var productos = useApp().productos;
  return useMemo(function(){
    var bajoStock = 0, vencProx = 0, vencido = 0;
    productos.filter(function(p){ return p.activo; }).forEach(function(p){
      if(tieneControlStock(p) && p.stock <= p.stockMin) bajoStock++;
      if(p.vencimiento){
        var d = daysUntil(p.vencimiento);
        if(d < 0) vencido++;
        else if(d <= umbralAlertaVenc(p)) vencProx++;
      }
    });
    return { bajoStock:bajoStock, vencProx:vencProx, vencido:vencido, total: bajoStock+vencProx+vencido };
  }, [productos]);
}

    ),

        h('div', { style:{ background:'var(--panel)', border:'1px solid var(--border)', borderRadius:12, padding:18, boxShadow:'var(--shadow)' } },
