// Modal para importar varios contactos de una sola vez como clientes nuevos, a partir de un
// archivo .vcf (vCard, exportado desde Contactos del celular o iCloud.com) o .csv con columnas
// de nombre y teléfono. Marca como "Ya existe" los que matchean por teléfono con un cliente que
// ya está cargado, para no duplicar — quedan destildados por defecto pero se pueden importar igual.
function ImportarContactosModal(props){
  var open = props.open, onClose = props.onClose, clientesExistentes = props.clientesExistentes, onImportar = props.onImportar;
  var contactosS = useState([]); var contactos = contactosS[0]; var setContactos = contactosS[1];
  var seleccionadosS = useState({}); var seleccionados = seleccionadosS[0]; var setSeleccionados = seleccionadosS[1];
  var cargandoS = useState(false); var cargando = cargandoS[0]; var setCargando = cargandoS[1];
  var errorS = useState(''); var error = errorS[0]; var setError = errorS[1];
  var fileInputRef = useRef(null);

  function reset(){ setContactos([]); setSeleccionados({}); setError(''); if(fileInputRef.current) fileInputRef.current.value = ''; }
  function cerrar(){ reset(); onClose(); }
  function esDuplicado(telefono){
    if(!telefono) return false;
    return (clientesExistentes||[]).some(function(c){ return telefonosCoinciden(c.telefono, telefono); });
  }
  function handleFile(e){
    var file = e.target.files && e.target.files[0];
    if(!file) return;
    setError('');
    var reader = new FileReader();
    reader.onload = function(ev){
      try {
        var parsed = parseArchivoContactos(ev.target.result);
        if(parsed.length===0){
          setError('No se pudo reconocer ningún contacto en ese archivo. Verificá que sea un .vcf exportado de Contactos, o un .csv con columnas de nombre y teléfono.');
          return;
        }
        setContactos(parsed);
        var sel = {};
        parsed.forEach(function(c, i){ if(!esDuplicado(c.telefono)) sel[i] = true; });
        setSeleccionados(sel);
      } catch(err){ console.error(err); setError('No se pudo leer el archivo.'); }
    };
    reader.readAsText(file, 'UTF-8');
  }
  function toggleSel(i){ setSeleccionados(function(s){ var n={}; for(var k in s) n[k]=s[k]; n[i] = !n[i]; return n; }); }
  function seleccionarTodos(valor){ var n={}; contactos.forEach(function(_,i){ n[i]=valor; }); setSeleccionados(n); }
  var seleccionadosCount = Object.keys(seleccionados).filter(function(k){ return seleccionados[k]; }).length;

  function confirmarImportacion(){
    var lista = contactos.filter(function(_,i){ return seleccionados[i]; });
    if(lista.length===0) return;
    setCargando(true);
    Promise.resolve(onImportar(lista)).then(function(){ setCargando(false); cerrar(); }).catch(function(){ setCargando(false); });
  }

  return h(Modal, { open:open, onClose:cerrar, title:'Importar contactos', width:560 },
    contactos.length===0 ? h('div', null,
      h('p', { style:{ fontSize:13.5, color:'var(--ink-soft)', marginBottom:14, lineHeight:1.5 } },
        'Subí un archivo .vcf (exportado desde Contactos del celular o iCloud.com) o .csv con columnas de nombre y teléfono, y elegí cuáles importar como clientes nuevos.'
      ),
      h('input', { type:'file', accept:'.vcf,.csv,text/vcard,text/csv', onChange:handleFile, ref:fileInputRef }),
      error ? h('div', { style:{ marginTop:12, background:'var(--red-bg)', color:'var(--red)', borderRadius:8, padding:'9px 12px', fontSize:12.5 } }, error) : null
    ) : h('div', null,
      h('div', { style:{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:10, flexWrap:'wrap', gap:8 } },
        h('div', { style:{ fontSize:12.5, color:'var(--ink-soft)' } }, contactos.length+' contacto'+(contactos.length!==1?'s':'')+' encontrados · '+seleccionadosCount+' seleccionado'+(seleccionadosCount!==1?'s':'')),
        h('div', { style:{ display:'flex', gap:10 } },
          h('button', { type:'button', onClick:function(){ seleccionarTodos(true); }, style:{ fontSize:11.5, fontWeight:700, color:'var(--primary)', background:'none', border:'none' } }, 'Todos'),
          h('button', { type:'button', onClick:function(){ seleccionarTodos(false); }, style:{ fontSize:11.5, fontWeight:700, color:'var(--ink-soft)', background:'none', border:'none' } }, 'Ninguno')
        )
      ),
      h('div', { style:{ border:'1px solid var(--border)', borderRadius:10, maxHeight:320, overflowY:'auto' } },
        contactos.map(function(c, i){
          var dup = esDuplicado(c.telefono);
          return h('label', { key:i, style:{ display:'flex', alignItems:'center', gap:10, padding:'8px 12px', borderBottom: i<contactos.length-1?'1px solid var(--border)':'none', cursor:'pointer', opacity: dup?0.6:1 } },
            h('input', { type:'checkbox', checked:!!seleccionados[i], onChange:function(){ toggleSel(i); } }),
            h('div', { style:{ flex:1, minWidth:0 } },
              h('div', { style:{ fontSize:13, fontWeight:600, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' } }, c.nombre),
              h('div', { style:{ fontSize:11.5, color:'var(--ink-faint)' } }, c.telefono || 'Sin teléfono')
            ),
            dup ? h(Badge, { tone:'amber' }, 'Ya existe') : null
          );
        })
      ),
      error ? h('div', { style:{ marginTop:12, background:'var(--red-bg)', color:'var(--red)', borderRadius:8, padding:'9px 12px', fontSize:12.5 } }, error) : null,
      h('div', { style:{ display:'flex', gap:10, justifyContent:'flex-end', marginTop:16, paddingTop:16, borderTop:'1px solid var(--border)', flexWrap:'wrap' } },
        h(Button, { type:'button', variant:'ghost', onClick:reset }, 'Elegir otro archivo'),
        h(Button, { type:'button', variant:'primary', onClick:confirmarImportacion, disabled:seleccionadosCount===0||cargando }, cargando?'Importando...':'Importar '+seleccionadosCount+' contacto'+(seleccionadosCount!==1?'s':''))
      )
    )
  );
}

// Lee un Excel/CSV de lista de precios y detecta automáticamente qué columna es el código,
// cuál el nombre del producto y cuál el precio, buscando por nombres de columna habituales.
// Palabras clave para reconocer columnas de código / nombre / precio / stock en listas de
// precios de proveedores, sin importar cómo las llame cada uno.
var KW_CODIGO = ['codigo de barras','codigo','cod.','cod','sku','item','articulo cod'];
var KW_NOMBRE = ['descripcion','producto / servicio','producto','articulo','detalle','nombre'];
var KW_PRECIO = ['precio de costo','precio costo','precio compra','precio unitario','precio unit','p. unit','p unit','precio','costo','importe'];
var KW_STOCK  = ['stock actual','stock disponible','cant disponible','existencia','stock','cantidad','cant.','cant','unidades'];

// Convierte una celda de Excel/CSV en un número, tolerando los formatos con los que suelen venir
// las listas de proveedores: "$ 6.063,94" (AR: punto de miles, coma decimal), "104,20" (solo coma
// decimal), "1234.56" (decimal con punto), números ya numéricos, etc. Devuelve NaN si no se puede.
function parseCostoExcel(v){
  if(v==null || v==='') return NaN;
  if(typeof v === 'number') return isFinite(v) ? v : NaN;
  var s = String(v).trim();
  if(!s) return NaN;
  s = s.replace(/[^\d.,\-]/g, ''); // saca "$", espacios, y cualquier texto/unidad pegada
  if(!s) return NaN;
  var tieneComa = s.indexOf(',')!==-1;
  var tienePunto = s.indexOf('.')!==-1;
  if(tieneComa && tienePunto){
    // Formato AR "1.234,56": el punto es separador de miles, la coma es el decimal.
    s = s.replace(/\./g,'').replace(',', '.');
  } else if(tieneComa){
    // Solo coma: es el separador decimal ("104,20" -> 104.20).
    s = s.replace(',', '.');
  } else if(tienePunto){
    var partes = s.split('.');
    // Varios puntos, o un solo punto seguido de exactamente 3 dígitos: son miles ("1.234" -> 1234).
    if(partes.length>2 || (partes.length===2 && partes[1].length===3)){
      s = partes.join('');
    }
    // Si no, se deja como decimal normal ("1234.56").
  }
  var n = parseFloat(s);
  return isNaN(n) ? NaN : n;
}

// A diferencia de parseCostoExcel (que intenta rescatar un número de cualquier texto, sacando
// todo lo que no sea dígito), esta función es estricta: dice si la celda ES un número de punta a
// punta. Se usa para decidir si una celda "parece nombre de producto" — sin esto, un nombre como
// "FRASCOS DECORADOS X 1" se descartaba como candidato a nombre porque contiene un dígito.
function pareceSoloNumero(txt){
  var t = String(txt==null?'':txt).trim().replace(/^\$\s*/, '').replace(/\s+/g, '');
  if(!t) return false;
  return /^-?\d+([.,]\d+)*$/.test(t);
}

function leerExcelListaPrecios(file){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onerror = function(){ reject(new Error('No se pudo leer el archivo.')); };
    reader.onload = function(e){
      try{
        var data = new Uint8Array(e.target.result);
        var wb = XLSX.read(data, { type:'array' });
        var ws = wb.Sheets[wb.SheetNames[0]];
        // Leemos como matriz cruda (fila por fila, celda por celda) en vez de confiar en que la
        // primera fila sea el encabezado: muchas listas de proveedores traen 2-3 filas de título
        // ("Lista de Precios", fecha, razón social) antes de la fila real de columnas, y eso rompe
        // el mapeo si se asume que la fila 1 son los encabezados.
        var filas2d = XLSX.utils.sheet_to_json(ws, { header:1, defval:'', raw:false, blankrows:false });
        resolve(analizarFilasListaPrecios(filas2d));
      }catch(err){ reject(new Error('El archivo no parece un Excel o CSV válido.')); }
    };
    reader.readAsArrayBuffer(file);
  });
}

// Analiza la matriz cruda de celdas: busca la fila de encabezados reales entre las primeras filas,
// arma un mapa de columnas por palabra clave, y después extrae cada producto tolerando que alguna
// columna esté corrida (común cuando el Excel original tiene celdas combinadas). Filas con una sola
// celda con contenido (títulos de sección tipo "BAZAR GASTRONÓMICO") se descartan solas.
function analizarFilasListaPrecios(filas2d){
  function celda(v){ return String(v==null?'':v).trim(); }
  function normCelda(v){ return normTexto(celda(v)); }
  function matchKw(normText, candidatos){
    for(var j=0;j<candidatos.length;j++){
      var kw = candidatos[j];
      if(normText===kw) return true;
      // Coincidencia de PALABRA/FRASE completa, no de subcadena suelta — evita que una
      // aclaración larga tipo "Los Precios de Lista son con IVA incluido." (que contiene
      // "precios" como parte de otra palabra/oración) se confunda con la columna real de precio.
      var re = new RegExp('(^|[^a-z0-9])'+kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'($|[^a-z0-9])');
      if(re.test(normText)) return true;
    }
    return false;
  }

  var maxFilasBuscarHeader = Math.min(20, filas2d.length);
  var headerIdx = -1, colMap = { codigo:null, nombre:null, precio:null, stock:null };
  for(var i=0;i<maxFilasBuscarHeader;i++){
    var fila = filas2d[i] || [];
    var tmpMap = { codigo:null, nombre:null, precio:null, stock:null };
    var aciertos = 0;
    for(var c=0;c<fila.length;c++){
      var norm = normCelda(fila[c]);
      if(!norm) continue;
      if(tmpMap.codigo===null && matchKw(norm, KW_CODIGO)){ tmpMap.codigo=c; aciertos++; continue; }
      if(tmpMap.nombre===null && matchKw(norm, KW_NOMBRE)){ tmpMap.nombre=c; aciertos++; continue; }
      if(tmpMap.precio===null && matchKw(norm, KW_PRECIO)){ tmpMap.precio=c; aciertos++; continue; }
      if(tmpMap.stock===null && matchKw(norm, KW_STOCK)){ tmpMap.stock=c; aciertos++; continue; }
    }
    // Con 2 o más columnas reconocidas (típicamente nombre+precio) ya lo tomamos como fila de encabezado.
    if(aciertos>=2){ headerIdx = i; colMap = tmpMap; break; }
  }

  var dataRows = headerIdx>=0 ? filas2d.slice(headerIdx+1) : filas2d.slice();

  var filas = [];
  dataRows.forEach(function(fila){
    if(!fila || !fila.length) return;
    var nonEmptyIdx = [];
    for(var c=0;c<fila.length;c++){ if(celda(fila[c])!=='') nonEmptyIdx.push(c); }
    // Filas con 0 o 1 celda cargada son títulos de sección ("FRASCOS", "PARA LA COCINA", etc.) o
    // separadores — no son productos, se ignoran sin marcarlas como error.
    if(nonEmptyIdx.length<2) return;

    // Precio: preferimos la columna mapeada por encabezado si en ESTA fila da un valor válido;
    // si no, buscamos de derecha a izquierda la última celda que parezca un monto (evita el
    // desalineamiento de columnas que traen algunos Excel con celdas combinadas).
    var precio = NaN, precioIdx = -1;
    if(colMap.precio!=null){
      var vHeaderCol = parseCostoExcel(fila[colMap.precio]);
      if(!isNaN(vHeaderCol) && vHeaderCol>0){ precio = vHeaderCol; precioIdx = colMap.precio; }
    }
    if(isNaN(precio)){
      for(var k=fila.length-1;k>=0;k--){
        if(celda(fila[k])==='') continue;
        var vTry = parseCostoExcel(fila[k]);
        if(!isNaN(vTry) && vTry>0){ precio = vTry; precioIdx = k; break; }
      }
    }

    // Código: columna mapeada si tiene algo en esta fila; si no, la primera celda no vacía.
    var codigo = '';
    if(colMap.codigo!=null && celda(fila[colMap.codigo])!==''){ codigo = celda(fila[colMap.codigo]); }
    else { codigo = celda(fila[nonEmptyIdx[0]]); }
    var codigoIdx = colMap.codigo!=null && celda(fila[colMap.codigo])!=='' ? colMap.codigo : nonEmptyIdx[0];
    var codigoDeColumna = colMap.codigo!=null && celda(fila[colMap.codigo])!=='';

    // Nombre: columna mapeada si sirve; si no, la primera celda de texto que no sea el código ni el precio.
    var nombre = '';
    if(colMap.nombre!=null && colMap.nombre!==precioIdx && celda(fila[colMap.nombre])!==''){
      nombre = celda(fila[colMap.nombre]);
    } else {
      for(var n=0;n<nonEmptyIdx.length;n++){
        var idx = nonEmptyIdx[n];
        if(idx===codigoIdx || idx===precioIdx) continue;
        var txt = celda(fila[idx]);
        if(txt.length>=3 && !pareceSoloNumero(txt)){ nombre = txt; break; }
      }
    }
    if(!nombre) nombre = codigo;

    // Stock (opcional): solo si el archivo tiene una columna reconocida como tal.
    var stock = null;
    if(colMap.stock!=null){
      var vStock = celda(fila[colMap.stock]);
      if(vStock!==''){
        var nStock = parseCostoExcel(vStock);
        if(!isNaN(nStock) && nStock>=0) stock = nStock;
      }
    }

    if(!nombre && !codigo && isNaN(precio)) return;
    filas.push({ codigo:codigo, nombre:nombre, costo:precio, stock:stock, codigoDeColumna:codigoDeColumna });
  });

  return { filas:filas, hayColStock: colMap.stock!=null, headerDetectado: headerIdx>=0 };
}

// Separa un texto en palabras "significativas" (3+ caracteres) para comparar nombres tolerando
// orden distinto, palabras de más (marca, color, tamaño) o abreviaturas parciales.
function tokensNombre(s){
  return normTexto(s).replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim().split(' ').filter(function(t){ return t.length>=3; });
}
// Puntaje 0..1 de cuánto se solapan dos listas de palabras (respecto de la más corta).
function puntajeTokens(a, b){
  if(!a.length || !b.length) return 0;
  var setB = {}; b.forEach(function(t){ setB[t]=true; });
  var inter = 0; a.forEach(function(t){ if(setB[t]) inter++; });
  return inter / Math.min(a.length, b.length);
}

// Compara cada fila del Excel contra el catálogo: primero por código exacto, después por nombre
// exacto, y como último recurso por el producto con mejor puntaje de palabras en común (marcado
// como "posible" para que el usuario lo revise antes de aplicar). Si no hay ningún candidato
// razonable, la fila queda "sin coincidencia" y se puede cargar como producto nuevo.
function calcularMatchesListaPrecios(parseado, productos){
  var activos = productos.filter(function(p){ return p.activo; });
  return parseado.filas.map(function(fila){
    var skuFila = normTexto(fila.codigo||'');
    var nombreFila = fila.nombre||'';
    var nombreFilaNorm = normTexto(nombreFila);
    var costo = fila.costo;
    var encontrado = null, certeza = 'sin';
    if(skuFila){
      encontrado = activos.find(function(p){ return p.sku && normTexto(p.sku)===skuFila; });
      if(encontrado) certeza = 'seguro';
    }
    if(!encontrado && nombreFilaNorm){
      encontrado = activos.find(function(p){ return normTexto(p.nombre)===nombreFilaNorm; });
      if(encontrado) certeza = 'seguro';
    }
    if(!encontrado && nombreFilaNorm.length>=3){
      var tokensFila = tokensNombre(nombreFila);
      var mejor = null, mejorPuntaje = 0;
      activos.forEach(function(p){
        var pn = normTexto(p.nombre);
        var score = puntajeTokens(tokensFila, tokensNombre(p.nombre));
        // Si un nombre contiene literalmente al otro, es una señal fuerte aunque compartan pocas palabras.
        if(pn.indexOf(nombreFilaNorm)!==-1 || nombreFilaNorm.indexOf(pn)!==-1) score = Math.max(score, 0.85);
        if(score > mejorPuntaje){ mejorPuntaje = score; mejor = p; }
      });
      if(mejor && mejorPuntaje>=0.6){ encontrado = mejor; certeza = 'posible'; }
    }
    return {
      key: uid('row-'),
      etiqueta: nombreFila || skuFila || '(fila sin nombre)',
      nombreOriginal: nombreFila,
      codigoOriginal: fila.codigo || '',
      codigoConfiable: !!fila.codigoDeColumna,
      costo: costo,
      stockLista: fila.stock,
      producto: encontrado,
      certeza: certeza,
      incluir: certeza==='seguro' && !isNaN(costo) && costo>0
    };
  }).filter(function(r){ return r.etiqueta && (r.producto || (!isNaN(r.costo) && r.costo>0)); });
}

  var filasS = useState([]); var filas = filasS[0]; var setFilas = filasS[1];
  var guardandoS = useState(false); var guardando = guardandoS[0]; var setGuardando = guardandoS[1];

  var cotizacionUsdS = useState(''); var cotizacionUsd = cotizacionUsdS[0]; var setCotizacionUsd = cotizacionUsdS[1];
  var buscandoCotizacionS = useState(false); var buscandoCotizacion = buscandoCotizacionS[0]; var setBuscandoCotizacion = buscandoCotizacionS[1];
  var errorCotizacionS = useState(''); var errorCotizacion = errorCotizacionS[0]; var setErrorCotizacion = errorCotizacionS[1];
  var aplicarStockS = useState(false); var aplicarStock = aplicarStockS[0]; var setAplicarStock = aplicarStockS[1];
  var modoStockS = useState('sumar'); var modoStock = modoStockS[0]; var setModoStock = modoStockS[1];
  // Config para las filas del Excel que no matchean ningún producto y el usuario elige dar de alta.

  var margenNuevosS = useState(40); var margenNuevos = margenNuevosS[0]; var setMargenNuevos = margenNuevosS[1];

  function costoConAjustes(costoBase){
    var c = Number(costoBase)||0;
    if(monedaLista==='USD'){
      var cot = Number(cotizacionUsd)||0;
      c = c * cot;
    }
    var iva = Number(ivaPct)||0;
    var flete = Number(fletePct)||0;
    return c * (1+iva/100) * (1+flete/100);

  // Trae la cotización del dólar oficial desde una API pública y gratuita (dolarapi.com), para no
  // tener que tipearla a mano. Si falla (sin internet, API caída, etc.) se puede cargar manualmente.
  function buscarCotizacionOficial(){
    setBuscandoCotizacion(true);
    setErrorCotizacion('');

      .then(function(data){
        var venta = data && (data.venta || data.compra);
        if(!venta) throw new Error('Respuesta inesperada');
        setCotizacionUsd(String(venta));
        setBuscandoCotizacion(false);
      })

        setErrorCotizacion('No pudimos obtener la cotización automáticamente. Cargala a mano.');
        setBuscandoCotizacion(false);

  // Calcula el stock final a guardar para una fila, según el modo elegido (sumar al stock

  function stockFinal(f){
    if(!aplicarStock || f.stockLista==null || !f.producto) return null;
    if(modoStock==='reemplazar') return f.stockLista;
    return (Number(f.producto.stock)||0) + f.stockLista;

        return;

// Lee la foto de la factura con OCR, totalmente en el navegador y gratis (Tesseract.js — no manda
// la imagen a ningún servicio externo ni requiere API key). Devuelve el texto reconocido para
// que parsearTextoFacturaOCR() intente extraer proveedor/fecha/N° factura/productos.
function leerFacturaConOCR(dataUrl, onProgreso){
  if(!window.Tesseract){
    return Promise.reject(new Error('OCR_NO_DISPONIBLE'));
  }
  return window.Tesseract.recognize(dataUrl, 'spa', {
    logger: function(info){
      if(onProgreso && info && info.status==='recognizing text'){ onProgreso(info.progress||0); }
    }
  }).then(function(result){
    return (result && result.data && result.data.text) || '';
  });
}

// Lee la foto de la factura con IA real (Google Gemini) usando la clave configurada en Ajustes.
// Gemini tiene un nivel gratuito (sin tarjeta) que alcanza de sobra para este uso. Devuelve
// directamente el objeto ya estructurado {proveedorNombre, numeroFactura, fecha, items[...]},
// mucho más preciso que el parser heurístico de OCR porque entiende el layout de la factura.
function leerFacturaConGemini(dataUrl, apiKey){
  var m = /^data:([^;]+);base64,(.*)$/.exec(dataUrl || '');
  if(!m) return Promise.reject(new Error('IMAGEN_INVALIDA'));
  var mimeType = m[1], base64 = m[2];
  var prompt = 'Sos un asistente que lee facturas de compra argentinas (factura A, B o C de AFIP, remito o ticket de proveedor) a partir de una foto. Devolvé EXCLUSIVAMENTE un objeto JSON (sin texto adicional, sin markdown, sin bloques de código), con esta forma exacta:\n{"proveedorNombre": string|null, "numeroFactura": string|null, "fecha": "YYYY-MM-DD"|null, "items": [{"nombre": string, "cantidad": number, "costoUnitario": number, "unidad": string|null, "sku": string|null}]}\nReglas generales: "costoUnitario" es el precio unitario de cada producto tal como figura en la columna de precio unitario de la factura (sin IVA si está discriminado aparte), NO el subtotal de la línea ni ningún total. "cantidad" es la cantidad real de unidades del producto (columna "CANT."). No incluyas como items las líneas de totales, subtotales, IVA, percepciones, IIBB ni otros datos fiscales. Si un dato no se puede leer, usá null y no inventes valores que no estén en la imagen.\nRENGLONES DOBLES (muy importante, es un patrón muy común en facturas de distribuidoras mayoristas): a veces un mismo producto ocupa DOS renglones seguidos en la tabla: el de arriba tiene un código y una cantidad chica (ej. "1 UN") con un nombre GENÉRICO de combo/oferta/pack (ej. "COMBO PURE ARCOR", "OFERTA SURT BAGLEY X 7", "OFERTA DIVERSION X 7") y un precio que es el total del paquete; el de abajo (a veces con sangría/indentado, a veces empieza con espacios) tiene OTRO código, la cantidad REAL de unidades individuales (ej. "12 DI", "7 DI", "7 UN" — DI significa "display", son unidades de venta reales) y el nombre ESPECÍFICO del producto real con su medida o presentación (ej. "PURE ARCOR TOMATE 12X520G", "SURTIDO BAGLEY 21X400"), con un precio unitario que multiplicado por esa cantidad da aproximadamente el total del renglón de arriba. Cuando detectes este patrón: IGNORÁ COMPLETAMENTE el renglón genérico de arriba (combo/oferta) y devolvé como item SOLO el renglón de abajo, con el nombre específico del producto, su cantidad real y su precio unitario real — nunca los dos como items separados, y nunca el genérico solo.';
  return fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-goog-api-key': apiKey },
    body: JSON.stringify({
      contents: [{ parts: [ { text: prompt }, { inline_data: { mime_type: mimeType, data: base64 } } ] }],
      generationConfig: { temperature: 0, responseMimeType: 'application/json' }
    })
  }).then(function(resp){
    if(!resp.ok){
      return resp.json().catch(function(){ return null; }).then(function(errBody){
        var msg = (errBody && errBody.error && errBody.error.message) || ('HTTP '+resp.status);
        throw new Error('GEMINI_ERROR: '+msg);
      });
    }
    return resp.json();
  }).then(function(data){
    var texto = data && data.candidates && data.candidates[0] && data.candidates[0].content &&
      data.candidates[0].content.parts && data.candidates[0].content.parts[0] && data.candidates[0].content.parts[0].text;
    if(!texto) throw new Error('GEMINI_SIN_RESPUESTA');
    var limpio = texto.trim().replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
    try{ return JSON.parse(limpio); }
    catch(e){ throw new Error('GEMINI_JSON_INVALIDO'); }
  });
}

// Palabras que indican que una línea es un total/subtotal/impuesto/dato fiscal y no un producto —
// se descartan como ítems de la factura (pero se siguen revisando para fecha/N° de factura).
// Incluye términos típicos de facturas AFIP (A/B/C) para no confundir el encabezado, los datos
// fiscales o los renglones de "Otros Tributos" con productos.
var LINEAS_IGNORAR_ITEM = /\b(total|subtotal|sub total|iva|descuento|vuelto|efectivo|tarjeta|cuit|caja|percepcion|percepción|bonificaci[oó]n|importe total|c[oó]digo|producto\s*\/?\s*servicio|punto de venta|comp\.?\s*nro|cae|iibb|ingresos brutos|gravado|no gravado|exento|alicuota|al[ií]cuota|neto|condici[oó]n|responsable inscripto|consumidor final|fecha de|leyenda|otros tributos|comprobante autorizado)\b/i;
// Detecta montos en formato AR ($1.234,56 / 1234,56 / 1234.56 / 1234) dentro de una línea.
var REGEX_MONTO = /\d{1,3}(?:\.\d{3})+,\d{2}|\d+,\d{2}|\d+\.\d{2}|\d+/g;

function montoANumero(s){
  s = s.replace(/[^0-9.,]/g,'');
  if(/,\d{2}$/.test(s)){ s = s.replace(/\./g,'').replace(',', '.'); }
  else { s = s.replace(/,/g,''); }
  var n = parseFloat(s);
  return isNaN(n) ? null : n;
}

// Parser heurístico: intenta separar la factura leída por OCR en proveedor / N° factura / fecha /
// productos. Al ser heurística (no IA) es menos precisa — por eso el resultado SIEMPRE se muestra
// para revisión manual antes de guardar, nunca se aplica directo.
function parsearTextoFacturaOCR(texto){
  var lineas = (texto||'').split(/\r?\n/).map(function(l){ return l.trim(); }).filter(Boolean);

  var numeroFactura = null;
  var mNro = /(?:factura|comprobante|n[°ºo]\.?|nro\.?)\s*[:\-]?\s*([0-9][0-9\-]{4,})/i.exec(texto||'');
  if(mNro) numeroFactura = mNro[1];

  var fecha = null;
  var mFecha = /(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/.exec(texto||'');
  if(mFecha) fecha = mFecha[0];

  // Primeras líneas "de texto" (sin números) suelen ser el nombre del proveedor/negocio emisor.
  var proveedorNombre = null;
  for(var i=0;i<Math.min(lineas.length,5);i++){
    var l = lineas[i];
    if(l.length>=3 && !/\d{4,}/.test(l) && !LINEAS_IGNORAR_ITEM.test(l)){ proveedorNombre = l; break; }
  }

  var items = [];
  lineas.forEach(function(linea){
    if(LINEAS_IGNORAR_ITEM.test(linea)) return;
    var montosStr = linea.match(REGEX_MONTO);
    if(!montosStr || montosStr.length<1) return;
    var montos = montosStr.map(montoANumero).filter(function(n){ return n!=null; });
    if(!montos.length) return;
    // El nombre del producto es la línea sin los números encontrados.
    var nombre = linea.replace(REGEX_MONTO, ' ').replace(/\s+/g,' ').trim();
    nombre = nombre.replace(/^[-•*.\s]+/, '').trim();
    if(nombre.length<3) return; // línea sin descripción útil (probablemente no es un producto)

    var cantidad = null, costoUnitario = null;
    if(montos.length>=2){
      // Si el primer número es chico (<100) lo tomamos como cantidad; el precio unitario es el
      // número que sigue inmediatamente (columna "Precio Unit."), NO el mayor de la línea —
      // en una factura tipo A de AFIP el mayor suele ser el "Subtotal c/IVA", no el precio unitario.
      if(montos[0] < 100 && Number.isInteger(montos[0])){
        cantidad = montos[0];
        costoUnitario = montos[1];
      } else {
        cantidad = 1;
        costoUnitario = montos[0];
      }
    } else {
      cantidad = 1;
      costoUnitario = montos[0];
    }
    if(!costoUnitario || costoUnitario<=0) return;
    items.push({ nombre: nombre, cantidad: cantidad, costoUnitario: costoUnitario, unidad: 'unidad' });
  });

  return {
    proveedorNombre: proveedorNombre,
    numeroFactura: numeroFactura,
    fecha: fecha,
    nota: null,
    items: items
  };
}

// Normaliza fechas que puedan venir como DD/MM/AAAA a formato YYYY-MM-DD (para el input type=date).
function normalizarFechaIA(f){
  if(!f) return '';
  f = String(f).trim();
  var m1 = /^(\d{4})-(\d{2})-(\d{2})/.exec(f);
  if(m1) return m1[1]+'-'+m1[2]+'-'+m1[3];
  var m2 = /^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/.exec(f);
  if(m2){
    var dd = m2[1].length<2?'0'+m2[1]:m2[1];
    var mm = m2[2].length<2?'0'+m2[2]:m2[2];
    var yy = m2[3].length===2 ? '20'+m2[3] : m2[3];
    return yy+'-'+mm+'-'+dd;
  }
  return '';
}

// Convierte el resultado del parser OCR en el shape que espera FacturaCompraForm, matcheando
// proveedor y productos contra el catálogo existente (por nombre normalizado o SKU).
function matchearFacturaIA(res, productos, proveedores){
  res = res || {};
  var proveedorId = '';
  if(res.proveedorNombre){
    var pNorm = normTexto(res.proveedorNombre);
    var prov = (proveedores||[]).find(function(p){ return normTexto(p.nombre)===pNorm; });
    if(prov) proveedorId = prov.id;
  }
  var items = (Array.isArray(res.items) ? res.items : []).map(function(it){
    var nombreIA = (it.nombre||'').toString().trim();
    var nNorm = normTexto(nombreIA);
    var skuIA = it.sku ? normTexto(it.sku) : null;
    var match = (productos||[]).find(function(p){
      return normTexto(p.nombre)===nNorm || (skuIA && p.sku && normTexto(p.sku)===skuIA);
    });
    var cantidad = (it.cantidad!=null && it.cantidad!=='') ? String(it.cantidad) : '';
    var costoUnitario = (it.costoUnitario!=null && it.costoUnitario!=='') ? String(it.costoUnitario) : '';
    if(match){
      return { productoId: match.id, nombre:'', categoriaId:'', unidad: match.unidad, cantidad: cantidad, costoUnitario: costoUnitario, stockMin:'', actualizarCosto:false };
    }
    return { productoId:'__nuevo__', nombre: nombreIA, categoriaId:'', unidad: it.unidad || 'unidad', cantidad: cantidad, costoUnitario: costoUnitario, stockMin:'0', actualizarCosto:false };
  }).filter(function(it){ return it.productoId==='__nuevo__' ? it.nombre : true; });
  return {
    proveedorId: proveedorId,
    numeroFactura: res.numeroFactura ? String(res.numeroFactura) : '',
    fecha: normalizarFechaIA(res.fecha) || todayISO(),
    nota: res.nota ? String(res.nota) : '',
    items: items.length ? items : [nuevoItemFactura()]
  };
}

// Revisión simplificada de una factura leída automáticamente (IA o lector gratuito): solo muestra
// los productos reconocidos para corregir cantidad/costo/producto, sin pedir proveedor, N° de
// factura ni fecha — al confirmar, únicamente actualiza el stock de cada producto.
function FacturaIAItemsForm(props){
  var itemsS = useState(props.items && props.items.length ? props.items : [nuevoItemFactura()]); var items = itemsS[0]; var setItems = itemsS[1];
  var savingS = useState(false); var saving = savingS[0]; var setSaving = savingS[1];

  function updateItem(idx, campo, val){
    setItems(function(prev){
      var copia = prev.slice();
      var it = {}; for(var k in copia[idx]) it[k]=copia[idx][k];
      it[campo] = val;
      copia[idx] = it;
      return copia;
    });
  }
  function removeItem(idx){ setItems(function(prev){ return prev.length>1 ? prev.filter(function(_,i){ return i!==idx; }) : prev; }); }
  function addItem(){ setItems(function(prev){ return prev.concat([nuevoItemFactura()]); }); }

  function handleSubmit(e){
    e.preventDefault();
    var validos = items.filter(function(it){ return it.productoId && (it.productoId!=='__nuevo__' || it.nombre) && Number(it.cantidad)>0 && it.costoUnitario!==''; });
    if(!validos.length) return;
    setSaving(true);
    Promise.resolve(props.onSave(validos)).catch(function(){}).then(function(){ setSaving(false); });
  }

  return h('form', { onSubmit:handleSubmit },
    props.imagenAdjunta ? h('img', { src:props.imagenAdjunta, alt:'', style:{ width:'100%', maxHeight:180, objectFit:'contain', borderRadius:10, border:'1px solid var(--border)', marginBottom:14, background:'var(--panel-2)' } }) : null,

    items.map(function(it, idx){

    }),
    h(Button, { type:'button', variant:'ghost', size:'sm', icon:Icon('plus',14), onClick:addItem }, 'Agregar producto'),

      h(Button, { type:'button', variant:'ghost', onClick:props.onCancel }, 'Cancelar'),
      h(Button, { type:'submit', variant:'primary', disabled:saving }, saving ? 'Actualizando...' : 'Actualizar stock')

function buildTicketText(venta, config){
  var nombre = (config && config.nombreNegocio) ? config.nombreNegocio : 'MI COMERCIO';
  var telefono = (config && config.telefonoNegocio) ? config.telefonoNegocio : '';
  var lineas = [];
  lineas.push('*' + nombre + '*');
  if(telefono) lineas.push('Tel: ' + telefono);
  lineas.push('Venta #' + venta.numero);
  lineas.push(fmtDateTime(venta.fecha));
  lineas.push('Cliente: ' + venta.clienteNombre);
  if(venta.vendedor) lineas.push('Atendido por: ' + venta.vendedor);
  lineas.push('-----------------------------');
  venta.items.forEach(function(it){
    var cant = fmtCantidadVenta(it);
    lineas.push(it.nombre);
    lineas.push('  ' + cant + ' x ' + fmtMoney(it.precioUnit) + ' = ' + fmtMoney(it.subtotal));
  });
  lineas.push('-----------------------------');
  lineas.push('*TOTAL: ' + fmtMoney(venta.total) + '*');
  var metodoLabel = metodoPagoLabel(venta.metodoPago);
  lineas.push('Abonado: ' + metodoLabel);
  if(venta.montoRecibido!=null && venta.montoRecibido>venta.total){
    lineas.push('Recibido: ' + fmtMoney(venta.montoRecibido));
    lineas.push('Vuelto: ' + fmtMoney(venta.montoRecibido - venta.total));

  lineas.push('');
  lineas.push('¡Gracias por tu compra!');
  return lineas.join('\n');
}

function buildEstadoCuentaText(cliente, movimientos, config){

  var movs = movimientos.slice().sort(function(a,b){ return new Date(a.fecha)-new Date(b.fecha); });
  var saldoCorrido = 0;
  var lineas = [];

  lineas.push('Estado de cuenta corriente');
  lineas.push('Cliente: ' + cliente.nombre);

    lineas.push('Sin movimientos registrados.');

    movs.forEach(function(m){

// Control de cuenta corriente de un proveedor: total facturado (facturas de compra) vs. total pagado,
// historial de pagos y botones para reenviar el comprobante de cada pago por WhatsApp o email.
function CuentaProveedorModal(props){
  var proveedor = props.proveedor;
  var app = useApp();
  var configNegocio = app.configNegocio;
  var facturas = useMemo(function(){
    return app.facturasCompra.filter(function(f){ return f.proveedorId===proveedor.id; }).sort(function(a,b){ return new Date(b.fecha)-new Date(a.fecha); });
  }, [app.facturasCompra, proveedor.id]);
  var facturaById = useMemo(function(){
    var map = {}; facturas.forEach(function(f){ map[f.id]=f; }); return map;
  }, [facturas]);
  var pagos = useMemo(function(){
    return app.pagosProveedor.filter(function(p){ return p.proveedorId===proveedor.id; }).sort(function(a,b){ return new Date(b.fecha)-new Date(a.fecha); });
  }, [app.pagosProveedor, proveedor.id]);

  var totalFacturado = facturas.reduce(function(s,f){ return s+(f.total||0); }, 0);
  var totalPagado = pagos.reduce(function(s,p){ return s+(p.monto||0); }, 0);
  var saldo = Math.round((totalFacturado-totalPagado)*100)/100;

  // Cuenta corriente por factura: cada pago queda atado a una factura puntual (p.facturaId),
  // así que el saldo de cada factura se calcula solo con SUS pagos, separado del resto.
  var pagadoPorFactura = useMemo(function(){
    var map = {};
    pagos.forEach(function(p){
      if(!p.facturaId) return;
      map[p.facturaId] = (map[p.facturaId]||0) + (p.monto||0);
    });
    return map;
  }, [pagos]);
  var facturasConSaldo = useMemo(function(){
    return facturas.map(function(f){
      var pagado = Math.round(((pagadoPorFactura[f.id]||0))*100)/100;
      var saldoF = Math.round(((f.total||0)-pagado)*100)/100;
      return { factura:f, pagado:pagado, saldo:saldoF };
    });
  }, [facturas, pagadoPorFactura]);
  // Calcula el saldo pendiente que quedaba INMEDIATAMENTE DESPUÉS de un pago puntual (para el comprobante).

// Devuelve la abreviatura de la unidad para mostrar en pantalla
function fmtUnidad(unidad){
  if(unidad==='kg') return 'kg';
  if(unidad==='m') return 'm';
  return 'un.';
}
// Devuelve true si la unidad usa cantidades decimales (kg, metros)
function isDecimalUnit(unidad){
  return unidad==='kg' || unidad==='m';
}
// Texto de cantidad para un ítem de venta: si se vendió por una presentación (ej. "Pack x6"),
// la cantidad es siempre entera y no lleva la abreviatura de la unidad base (ya está en el nombre).
function fmtCantidadVenta(it){
  if(it.presentacionId) return fmtNum(it.cantidad,0);
  return fmtNum(it.cantidad)+fmtUnidad(it.unidad);
}

function normalizarTelefono(tel){
  // Quita todo lo que no sea dígito; si no empieza con código de país, asume Argentina (54)
  var digits = (tel||'').replace(/\D/g,'');
  if(!digits) return '';
  if(digits.indexOf('54')===0) return digits;
  return '54' + digits;
}

// ── Importar contactos (Clientes) ───────────────────────────────────────────
// Compara dos teléfonos ignorando formato/código de país: se queda con los
// últimos 8 dígitos de cada uno (suficiente para un número local argentino)
// y los compara — así "011 15-1234-5678" y "+54 9 11 1234-5678" matchean.
function telefonosCoinciden(a, b){
  var da = (a||'').replace(/\D/g,''); var db = (b||'').replace(/\D/g,'');
  if(!da || !db) return false;
  var la = da.slice(-8), lb = db.slice(-8);
  return la.length>=6 && la===lb;
}
// Decodifica texto quoted-printable (=XX) que algunos exportadores de vCard
// viejos usan para nombres con acentos — pasa los bytes por TextDecoder UTF-8.
function decodeQuotedPrintable(str){
  var bytes = [];
  for(var i=0;i<str.length;i++){
    if(str[i]==='=' && /^[0-9A-Fa-f]{2}$/.test(str.substr(i+1,2))){
      bytes.push(parseInt(str.substr(i+1,2),16)); i+=2;
    } else { bytes.push(str.charCodeAt(i)); }
  }
  try { return new TextDecoder('utf-8').decode(new Uint8Array(bytes)); } catch(e){ return str; }
}
// Parsea un archivo .vcf (vCard) con uno o varios contactos — el formato que
// exportan tanto el iPhone (Contactos → compartir/Guardar en Archivos, o
// iCloud.com) como Google Contacts. Devuelve [{ nombre, telefono }].
function parseVCardContactos(texto){
  var contactos = [];
  var normalizado = String(texto||'').replace(/\r\n/g,'\n').replace(/\r/g,'\n').replace(/\n[ \t]/g,'');
  var bloques = normalizado.split(/BEGIN:VCARD/i).slice(1);
  bloques.forEach(function(bloque){
    var lineas = bloque.split(/END:VCARD/i)[0].split('\n').filter(Boolean);
    var nombre = '', telefono = '', telefonoCel = '';
    lineas.forEach(function(linea){
      var idx = linea.indexOf(':');
      if(idx<0) return;
      var campo = linea.slice(0,idx), valor = linea.slice(idx+1).trim();
      var campoBase = campo.split(';')[0].toUpperCase().replace(/^ITEM\d+\./i,'');
      if(/QUOTED-PRINTABLE/i.test(campo)) valor = decodeQuotedPrintable(valor);
      if(campoBase==='FN' && !nombre) nombre = valor;
      else if(campoBase==='N' && !nombre){
        var partes = valor.split(';');
        nombre = ((partes[1]||'')+' '+(partes[0]||'')).trim();
      } else if(campoBase==='TEL'){
        if(!telefono) telefono = valor;
        if(/CELL|MOBILE|MOVIL|CELULAR/i.test(campo) && !telefonoCel) telefonoCel = valor;
      }
    });
    if(telefonoCel) telefono = telefonoCel;
    if(nombre || telefono) contactos.push({ nombre: nombre || '(Sin nombre)', telefono: telefono });
  });
  return contactos;
}
// Parsea un .csv con columnas de nombre y teléfono (encabezados en español o
// inglés: "Nombre"/"Name", "Teléfono"/"Phone"/"Celular"). Soporta comillas.
function parseCSVContactos(texto){
  var lineas = String(texto||'').replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n').filter(function(l){ return l.trim(); });
  if(lineas.length===0) return [];
  function splitCSVLine(linea){
    var campos = [], actual='', enComillas=false;
    for(var i=0;i<linea.length;i++){
      var c = linea[i];
      if(c==='"'){ if(enComillas && linea[i+1]==='"'){ actual+='"'; i++; } else enComillas=!enComillas; }
      else if(c===',' && !enComillas){ campos.push(actual); actual=''; }
      else actual+=c;
    }
    campos.push(actual);
    return campos;
  }
  var header = splitCSVLine(lineas[0]).map(function(hd){ return hd.trim().toLowerCase(); });
  var idxNombre = header.findIndex(function(hd){ return /nombre|name/.test(hd); });
  var idxTelefono = header.findIndex(function(hd){ return /tel|phone|celular|m[oó]vil/.test(hd); });
  if(idxNombre<0 && idxTelefono<0) return [];
  var contactos = [];
  for(var i=1;i<lineas.length;i++){
    var campos = splitCSVLine(lineas[i]);
    var nombre = idxNombre>=0 ? (campos[idxNombre]||'').trim() : '';
    var telefono = idxTelefono>=0 ? (campos[idxTelefono]||'').trim() : '';
    if(nombre || telefono) contactos.push({ nombre: nombre || '(Sin nombre)', telefono: telefono });
  }
  return contactos;
}
function parseArchivoContactos(texto){

// ── Impresión térmica ───────────────────────────────────────────────────────
// Usa window.print() con CSS optimizado para impresora térmica 80mm.
// El diálogo de Windows aparece solo la primera vez; después Chrome recuerda
// la impresora seleccionada y el cliente solo aprieta Enter (o Ctrl+P).

function imprimirTicket(venta){
  var cfg    = window.__appConfig || {};
  var nombre = cfg.nombreNegocio || 'MI COMERCIO';
  var tel    = cfg.telefonoNegocio || '';
  var mp     = metodoPagoLabel(venta.metodoPago);

  // Construir HTML del ticket
  var html = '';
  html += '<div style="text-align:center;font-weight:900;font-size:15px;margin-bottom:2px;">' + nombre + '</div>';
  if(tel) html += '<div style="text-align:center;font-size:11px;margin-bottom:2px;">Tel: ' + tel + '</div>';
  html += '<div style="text-align:center;font-size:11px;">Venta #' + venta.numero + '</div>';
  html += '<div style="text-align:center;font-size:11px;margin-bottom:6px;">' + fmtDateTime(venta.fecha) + '</div>';
  html += '<div style="border-top:1px dashed #000;margin:4px 0;"></div>';
  html += '<div style="font-size:11px;margin-bottom:4px;">Cliente: ' + venta.clienteNombre + '</div>';
  if(venta.vendedor) html += '<div style="font-size:11px;margin-bottom:4px;">Atendido por: ' + venta.vendedor + '</div>';
  html += '<div style="border-top:1px dashed #000;margin:4px 0;"></div>';

  venta.items.forEach(function(it){
    var cant = fmtCantidadVenta(it);
    html += '<div style="font-size:11px;">' + it.nombre + '</div>';
    html += '<div style="font-size:11px;display:flex;justify-content:space-between;margin-bottom:3px;">'
          + '<span>' + cant + ' x ' + fmtMoney(it.precioUnit) + '</span>'
          + '<span>' + fmtMoney(it.subtotal) + '</span></div>';
  });

  html += '<div style="border-top:1px dashed #000;margin:4px 0;"></div>';
  html += '<div style="display:flex;justify-content:space-between;font-weight:900;font-size:13px;margin-bottom:4px;">'
        + '<span>TOTAL</span><span>' + fmtMoney(venta.total) + '</span></div>';
  html += '<div style="font-size:11px;">Abonado: ' + mp + '</div>';

  if(venta.montoRecibido != null && venta.montoRecibido > venta.total){
    html += '<div style="font-size:11px;">Recibido: ' + fmtMoney(venta.montoRecibido) + '</div>';
    html += '<div style="font-size:11px;">Vuelto: ' + fmtMoney(venta.montoRecibido - venta.total) + '</div>';
  }

  html += '<div style="border-top:1px dashed #000;margin:4px 0;"></div>';
  html += '<div style="text-align:center;font-size:11px;margin-top:4px;">¡Gracias por tu compra!</div>';

  // Inyectar en contenedor de impresión
  var cont = document.getElementById('__ticket-print-root');
  if(!cont){
    cont = document.createElement('div');
    cont.id = '__ticket-print-root';
    cont.className = 'print-only';
    document.body.appendChild(cont);
  }
  cont.innerHTML = html;
  window.print();
  setTimeout(function(){ cont.innerHTML = ''; }, 1000);
}

// Arma el texto del pedido sugerido a un proveedor: solo los productos por debajo del stock
// ideal, con cuánto falta de cada uno, más las notas del proveedor si tiene.
function buildFaltantesProveedorText(proveedor, productos){
  var faltantes = (productos||[]).filter(function(p){ return p.stockIdeal!=null && (Number(p.stockIdeal)-Number(p.stock||0))>0; });
  var lineas = [];
  lineas.push('Pedido sugerido — ' + proveedor.nombre);
  lineas.push('Fecha: ' + fmtDate(nowISO()));
  lineas.push('-----------------------------');
  if(faltantes.length===0){
    lineas.push('No hay productos por debajo del stock ideal.');
  } else {
    faltantes.forEach(function(p){
      var falta = Math.round((Number(p.stockIdeal)-Number(p.stock||0))*1000)/1000;
      lineas.push('• ' + p.nombre + ': faltan ' + fmtNum(falta) + ' ' + fmtUnidad(p.unidad) + ' (actual ' + fmtNum(p.stock) + ', ideal ' + fmtNum(p.stockIdeal) + ')');
    });
  }
  if((proveedor.notas||'').trim()){
    lineas.push('-----------------------------');
    lineas.push('Notas: ' + proveedor.notas.trim());
  }
  return lineas.join('\n');
}

function CajaModule(){

  var showDescuentoIndividualS = useState(false); var showDescuentoIndividual = showDescuentoIndividualS[0]; var setShowDescuentoIndividual = showDescuentoIndividualS[1];

    return productos.filter(function(p){
      if(!p.activo || p.stock<=0) return false;
      if(filterCat!=='all' && p.categoriaId!==filterCat) return false;
      if(search && p.nombre.toLowerCase().indexOf(search.toLowerCase())===-1 && p.sku.toLowerCase().indexOf(search.toLowerCase())===-1 && (p.codigoInterno||'').toLowerCase().indexOf(search.toLowerCase())===-1) return false;

  function addToTicket(producto, cantidadDefault, presentacion){

    var nombreItem = presentacion ? (producto.nombre+' — '+presentacion.nombre) : producto.nombre;
    var presentacionId = presentacion ? presentacion.id : null;

      var stockEnTicketBase = prev.filter(function(i){return i.productoId===producto.id;}).reduce(function(s,i){return s+i.cantidad*(i.factor||1);},0);
      if(stockEnTicketBase + cant*factor > producto.stock){

        cant = presentacionId ? Math.floor(cantMaxima) : Math.max(0, Math.round(cantMaxima*1000)/1000);
        if(cant<=0) return prev;
      }

      if(idxExistente>=0){
        var descuentoPrev = prev[idxExistente].descuentoPct || 0;
        var nuevaCant = presentacionId ? (prev[idxExistente].cantidad + cant) : Math.round((prev[idxExistente].cantidad + cant)*1000)/1000;
        var nuevoSubtotal = Math.round(precioUnit*nuevaCant*(1-descuentoPrev/100)*100)/100;
        var copia = prev.slice();
        copia[idxExistente] = { productoId:producto.id, nombre:nombreItem, unidad:producto.unidad, cantidad:nuevaCant, precioUnit:precioUnit, descuentoPct:descuentoPrev, subtotal:nuevoSubtotal, presentacionId:presentacionId, factor:factor };
        return copia;
      }
      var subtotal = Math.round(precioUnit*cant*100)/100;
      return prev.concat([{ productoId:producto.id, nombre:nombreItem, unidad:producto.unidad, cantidad:cant, precioUnit:precioUnit, descuentoPct:0, subtotal:subtotal, presentacionId:presentacionId, factor:factor }]);

    setTicket(function(prev){

      var prod = productos.find(function(p){ return p.id===it.productoId; });

function CerrarCajaModal(props){
  var cajaActual = props.cajaActual;
  var montoS = useState(''); var monto = montoS[0]; var setMonto = montoS[1];
  var notaS = useState(''); var nota = notaS[0]; var setNota = notaS[1];
  var cajeroS = useState(function(){ try{ return localStorage.getItem('ultimoCajero')||''; }catch(e){ return ''; } }); var cajero = cajeroS[0]; var setCajero = cajeroS[1];
  var enviandoS = useState(false); var enviando = enviandoS[0]; var setEnviando = enviandoS[1];
  var resultadoS = useState(null); var resultado = resultadoS[0]; var setResultado = resultadoS[1];
  var errorS = useState(''); var error = errorS[0]; var setError = errorS[1];

  function submit(e){
    e.preventDefault();
    if(!cajaActual) return;
    try{ localStorage.setItem('ultimoCajero', cajero.trim()); }catch(e){}
    var montoNumSubmit = monto!=='' ? Number(monto) : 0;

    // Calculamos el resumen con los datos que YA tenemos en el navegador (no dependemos
    // de que el servidor confirme el guardado para poder mostrarlo e imprimirlo).
    var ventasCajaSubmit = props.ventas.filter(function(v){ return v.cajaId === cajaActual.id; });
    var tContado = 0, tTransferencia = 0, tCredito = 0, tDebito = 0, tQr = 0, tCC = 0;
    ventasCajaSubmit.forEach(function(v){
      if(v.metodoPago==='contado') tContado += v.total;
      else if(v.metodoPago==='transferencia') tTransferencia += v.total;
      else if(v.metodoPago==='credito') tCredito += v.total;
      else if(v.metodoPago==='debito') tDebito += v.total;
      else if(v.metodoPago==='qr') tQr += v.total;
      else if(v.metodoPago==='cuenta_corriente') tCC += v.total;
    });
    tContado = Math.round(tContado*100)/100;
    tTransferencia = Math.round(tTransferencia*100)/100;
    tCredito = Math.round(tCredito*100)/100;
    tDebito = Math.round(tDebito*100)/100;
    tQr = Math.round(tQr*100)/100;
    tCC = Math.round(tCC*100)/100;
    var efectivoEsperadoSubmit = Math.round((cajaActual.montoInicial + tContado)*100)/100;
    var diferenciaSubmit = Math.round((montoNumSubmit - efectivoEsperadoSubmit)*100)/100;

    var resultadoLocal = {
      numero: cajaActual.numero, montoInicial: cajaActual.montoInicial,
      cajeroApertura: cajaActual.cajeroApertura || '', cajeroCierre: cajero.trim(),
      totalContado: tContado, totalTransferencia: tTransferencia, totalCredito: tCredito, totalDebito: tDebito, totalQr: tQr, totalCuentaCorriente: tCC,
      cantidadVentas: ventasCajaSubmit.length, efectivoEsperado: efectivoEsperadoSubmit,
      montoContado: montoNumSubmit, diferencia: diferenciaSubmit
    };

    setEnviando(true);
    setError('');
    setResultado(resultadoLocal);

    Promise.resolve(props.onConfirm(montoNumSubmit||0, nota, cajero)).then(function(res){
      setEnviando(false);
      if(!res){
        setError('El resumen ya está calculado y podés imprimirlo, pero el cierre no se pudo guardar en el servidor. Revisá tu conexión — si la caja sigue figurando como "abierta", volvé a intentar el cierre.');
      }
    }).catch(function(err){
      console.error(err);
      setEnviando(false);

    });
  }

  // Importante: el resumen de resultado se evalúa ANTES de chequear cajaActual,

        h('div', { style:{ display:'flex', justifyContent:'space-between', fontSize:13.5 } }, h('span',null,'Cajero cierre'), h('span',{style:{fontWeight:700}}, resultado.cajeroCierre || '—')),
        h('div', { style:{ display:'flex', justifyContent:'space-between', fontSize:13.5 } }, h('span',null,'Monto inicial'), h('span',{className:'mono',style:{fontWeight:700}}, fmtMoney(resultado.montoInicial))),
        h('div', { style:{ display:'flex', justifyContent:'space-between', fontSize:13.5 } }, h('span',null,'Ventas en efectivo'), h('span',{className:'mono',style:{fontWeight:700}}, fmtMoney(resultado.totalContado))),

        h('div', { style:{ display:'flex', justifyContent:'space-between', fontSize:13.5 } }, h('span',null,'Ventas con QR'), h('span',{className:'mono',style:{fontWeight:700}}, fmtMoney(resultado.totalQr))),
        h('div', { style:{ display:'flex', justifyContent:'space-between', fontSize:13.5 } }, h('span',null,'Ventas en cta. corriente'), h('span',{className:'mono',style:{fontWeight:700}}, fmtMoney(resultado.totalCuentaCorriente))),

function DevolucionVentaModal(props){
  var venta = props.venta;
  var app = useApp();
  var seleccionS = useState({}); var seleccion = seleccionS[0]; var setSeleccion = seleccionS[1];
  var motivoS = useState(''); var motivo = motivoS[0]; var setMotivo = motivoS[1];
  var enviandoS = useState(false); var enviando = enviandoS[0]; var setEnviando = enviandoS[1];
  var errorS = useState(''); var error = errorS[0]; var setError = errorS[1];
  // Una vez registrada la devolución, se muestra una pantalla de éxito con el comprobante DE LA
  // DEVOLUCIÓN (no el ticket de la venta original) para imprimir o mandar por WhatsApp.
  var devolucionHechaS = useState(null); var devolucionHecha = devolucionHechaS[0]; var setDevolucionHecha = devolucionHechaS[1];
  var showWspDevS = useState(false); var showWspDev = showWspDevS[0]; var setShowWspDev = showWspDevS[1];
  var showPreviewDevS = useState(false); var showPreviewDev = showPreviewDevS[0]; var setShowPreviewDev = showPreviewDevS[1];

  useEffect(function(){ setSeleccion({}); setMotivo(''); setError(''); setDevolucionHecha(null); }, [venta && venta.id]);

  if(!venta) return null;

  var clientes = app.clientes;
  var clienteReal = clientes.find(function(c){ return c.id===venta.clienteId && !c.esGenerico; });
  var telefonoSugerido = clienteReal ? clienteReal.telefono : '';

  function handleWhatsappDevolucion(){
    if(telefonoSugerido && normalizarTelefono(telefonoSugerido)){
      var texto = buildDevolucionTicketText(venta, devolucionHecha, app.configNegocio);
      var url = 'https://wa.me/' + normalizarTelefono(telefonoSugerido) + '?text=' + encodeURIComponent(texto);
      window.open(url, '_blank');
    } else {
      setShowWspDev(true);
    }
  }

  if(devolucionHecha){
    return h(Fragment, null,
      h('div', { style:{ textAlign:'center', padding:'10px 0 4px' } },
        h('div', { style:{ display:'inline-flex', width:56, height:56, borderRadius:'50%', background:'var(--green-bg)', color:'var(--green-dark)', alignItems:'center', justifyContent:'center', marginBottom:14 } }, Icon('check',28)),
        h('div', { className:'display', style:{ fontSize:22, marginBottom:4 } }, fmtMoney(devolucionHecha.monto)),
        h('div', { style:{ fontSize:13.5, color:'var(--ink-soft)', marginBottom:18 } }, 'Devolución registrada — Venta #'+venta.numero),
        h('div', { style:{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:8, marginBottom:10 } },
          h(Button, { variant:'subtle', icon:Icon('printer',16), onClick:function(){ setShowPreviewDev(true); } }, 'Imprimir'),
          h(Button, { variant:'subtle', icon:Icon('whatsapp',16,'#25D366'), onClick:handleWhatsappDevolucion }, 'WhatsApp')
        ),
        h(Button, { variant:'primary', full:true, onClick:function(){ props.onDone && props.onDone(devolucionHecha); } }, 'Listo')
      ),
      h(Modal, { key:'modal-wsp-dev', open:showWspDev, onClose:function(){setShowWspDev(false);}, title:'Enviar comprobante de devolución', width:380 },
        h(EnviarWhatsappDevolucionModal, { venta:venta, devolucion:devolucionHecha, telefonoSugerido:telefonoSugerido, onClose:function(){setShowWspDev(false);} })
      ),
      showPreviewDev ? h(VistaPreviaTicketDevolucionModal, { key:'modal-preview-dev', venta:venta, devolucion:devolucionHecha, onClose:function(){ setShowPreviewDev(false); } }) : null,
      h('div', { key:'print-area', style:{ display:'none' } },
        h('div', { className:'print-only' }, h(TicketDevolucionImprimible, { venta:venta, devolucion:devolucionHecha }))
      )
    );
  }

  var devueltoPorItem = venta.devueltoPorItem || {};

  function disponible(idx){
    var it = venta.items[idx];
    var yaDevuelto = Number(devueltoPorItem[idx])||0;
    return Math.max(0, Math.round((it.cantidad - yaDevuelto)*1000)/1000);
  }
  function toggle(idx){
    setSeleccion(function(prev){
      var c = {}; for(var k in prev) c[k]=prev[k];
      if(c[idx]!=null) delete c[idx]; else c[idx] = String(disponible(idx));
      return c;
    });
  }
  function setCantidad(idx, val){
    setSeleccion(function(prev){ var c={}; for(var k in prev) c[k]=prev[k]; c[idx]=val; return c; });
  }

  var montoAEstimar = Object.keys(seleccion).reduce(function(s, idx){
    var it = venta.items[idx];
    var cant = Number(seleccion[idx])||0;
    var precioUnitEfectivo = it.cantidad ? (it.subtotal/it.cantidad) : it.precioUnit;
    return s + cant*precioUnitEfectivo;
  }, 0);
  montoAEstimar = Math.round(montoAEstimar*100)/100;

  function handleSubmit(){
    setError('');
    var items = Object.keys(seleccion).map(function(idx){ return { index:Number(idx), cantidad:Number(seleccion[idx])||0 }; }).filter(function(it){ return it.cantidad>0; });
    if(items.length===0){ setError('Elegí al menos un producto y cantidad a devolver'); return; }
    for(var i=0;i<items.length;i++){
      if(items[i].cantidad > disponible(items[i].index) + 0.0001){ setError('La cantidad a devolver supera lo disponible'); return; }
    }
    setEnviando(true);
    app.registrarDevolucionVenta(venta.id, items, motivo).then(function(resultado){
      setEnviando(false);
      setDevolucionHecha(resultado.devolucion);
    }).catch(function(err){
      setEnviando(false);
      setError(err && err.message ? err.message : 'No se pudo registrar la devolución');
    });
  }

  var hayDisponibles = venta.items.some(function(it, idx){ return disponible(idx)>0; });

  return h('div', null,
    !hayDisponibles ? h('div', { style:{ fontSize:13, color:'var(--ink-faint)', padding:'16px 0' } }, 'Ya se devolvió la totalidad de esta venta.') :
    h(Fragment, null,
      h('div', { style:{ fontSize:13, color:'var(--ink-soft)', marginBottom:14 } }, 'Tildá los productos a devolver y ajustá la cantidad — el stock se repone automáticamente.'),
      error ? h('div', { style:{ background:'var(--red-bg)', color:'var(--red)', borderRadius:8, padding:'9px 12px', fontSize:12.5, marginBottom:14, fontWeight:600 } }, error) : null,
      h('div', { style:{ border:'1px solid var(--border)', borderRadius:10, marginBottom:14, overflow:'hidden' } },
        venta.items.map(function(it, idx){
          var disp = disponible(idx);
          var checked = seleccion[idx]!=null;
          return h('div', { key:idx, style:{ display:'flex', alignItems:'center', gap:10, padding:'10px 12px', borderTop: idx>0?'1px solid var(--border)':'none', opacity: disp<=0?0.45:1 } },
            h('input', { type:'checkbox', checked:checked, disabled: disp<=0, onChange:function(){ toggle(idx); } }),
            h('div', { style:{ flex:1, minWidth:0 } },
              h('div', { style:{ fontSize:13.5, fontWeight:600, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' } }, it.nombre),
              h('div', { style:{ fontSize:11.5, color:'var(--ink-faint)' } }, disp<=0 ? 'Ya devuelto por completo' : ('Vendido: '+fmtCantidadVenta(it)+' · Disponible: '+fmtNum(disp)))
            ),
            checked ? h(TextInput, { type:'number', min:'0', max:disp, step:'any', value:seleccion[idx], onChange:function(e){ setCantidad(idx, e.target.value); }, style:{ width:80, textAlign:'right' } }) : null
          );
        })
      ),
      h(Field, { label:'Motivo (opcional)' }, h(TextInput, { value:motivo, onChange:function(e){ setMotivo(e.target.value); }, placeholder:'Ej: producto en mal estado' })),
      h('div', { style:{ display:'flex', justifyContent:'space-between', alignItems:'center', margin:'14px 0' } },
        h('span', { style:{ fontSize:13, color:'var(--ink-soft)' } }, 'Monto a devolver'),
        h('span', { className:'mono', style:{ fontWeight:800, fontSize:18 } }, fmtMoney(montoAEstimar))
      ),
      venta.metodoPago==='cuenta_corriente' ? h('div', { style:{ fontSize:12, color:'var(--ink-faint)', marginBottom:14 } }, 'Como esta venta fue a cuenta corriente, el monto se descuenta del saldo del cliente.') : null,
      h('div', { style:{ display:'flex', justifyContent:'flex-end', gap:10 } },
        h(Button, { type:'button', variant:'ghost', onClick:props.onClose }, 'Cancelar'),
        h(Button, { type:'button', variant:'primary', disabled:enviando||montoAEstimar<=0, onClick:handleSubmit }, enviando?'Registrando...':'Registrar devolución')
      )
    )
  );
}

function CodigosBarraModule(){

  var showPreviewS = useState(false); var showPreview = showPreviewS[0]; var setShowPreview = showPreviewS[1];

  var disponibles = useMemo(function(){
    return productos.filter(function(p){
      if(!p.activo) return false;
      if(filterCat!=='all' && p.categoriaId!==filterCat) return false;
      if(search && p.nombre.toLowerCase().indexOf(search.toLowerCase())===-1 && p.sku.toLowerCase().indexOf(search.toLowerCase())===-1 && (p.codigoInterno||'').toLowerCase().indexOf(search.toLowerCase())===-1) return false;
      return true;
    }).sort(function(a,b){return a.nombre.localeCompare(b.nombre);});
  }, [productos, search, filterCat]);

  var cantidadSeleccionados = Object.keys(seleccionados).filter(function(id){ return seleccionados[id]; }).length;

  function toggleUno(id){
    setSeleccionados(function(prev){
      var copia = Object.assign({}, prev);

      return copia;
    });

  function seleccionarTodos(){

      disponibles.forEach(function(p){ copia[p.id] = true; });
      return copia;
    });
  }
  function deseleccionarTodos(){
    setSeleccionados(function(prev){

      disponibles.forEach(function(p){ copia[p.id] = false; });
      return copia;

  var productosAImprimir = useMemo(function(){

    h('div', { className:'grid-barcodes', style:{ display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(140px, 1fr))', gap:10 } },

function MiniBarcode(props){
  var svgRef = useRef(null);
  useEffect(function(){
    if(svgRef.current && window.JsBarcode){
      try{
        window.JsBarcode(svgRef.current, props.sku, {
          format:'CODE128', width:1, height:28, displayValue:false, margin:2,
          background:'#ffffff', lineColor:'#000000'
        });
        // JsBarcode fija un width/height en px sobre el SVG según la cantidad de barras del código.
        // Lo forzamos a 100% del contenedor (con el viewBox que JsBarcode ya dejó armado) para que
        // nunca empuje el ancho de la card, sin importar cuán largo sea el SKU.
        svgRef.current.removeAttribute('width');
        svgRef.current.style.width = '100%';
        svgRef.current.style.height = 'auto';
        svgRef.current.style.display = 'block';
      } catch(err){ console.error('Error generando código de barras:', err); }
    }
  }, [props.sku]);
  return h('svg', { ref:svgRef, style:{ width:'100%', height:'auto', display:'block' } });
}

var ESTADOS_ARMADO = [
  { id:'pendiente', label:'Pendiente', tone:'neutral' },
  { id:'armando', label:'Armando', tone:'amber' },
  { id:'listo', label:'Listo', tone:'blue' },
  { id:'entregado', label:'Entregado', tone:'green' },
  { id:'cancelado', label:'Cancelado', tone:'red' }
];
function estadoArmadoInfo(id){ return ESTADOS_ARMADO.find(function(e){return e.id===id;}) || ESTADOS_ARMADO[0]; }
function siguienteEstadoArmado(id){
  var orden = ['pendiente','armando','listo','entregado'];
  var idx = orden.indexOf(id);
  return idx>=0 && idx<orden.length-1 ? orden[idx+1] : null;
}
function fechaEntregaBadgeTone(fechaEntrega, estado){
  if(estado==='entregado' || estado==='cancelado') return 'neutral';
  var d = daysUntil(fechaEntrega);
  if(d===null) return 'neutral';
  if(d<0) return 'red';
  if(d<=1) return 'amber';
  return 'neutral';
}
function fechaEntregaLabel(fechaEntrega){
  var d = daysUntil(fechaEntrega);
  if(d===null) return '—';
  if(d===0) return 'Hoy';
  if(d===1) return 'Mañana';
  if(d===-1) return 'Ayer (vencido)';
  if(d<0) return 'Vencido hace '+Math.abs(d)+' días';
  return 'En '+d+' días';
}

// Arma el texto de una donación (para WhatsApp y como base del comprobante impreso).
function buildDonacionTexto(donacion, config){
  var cfg = config || window.__appConfig || {};
  var nombreNegocio = cfg.nombreNegocio || 'MI COMERCIO';
  var lineas = [];
  lineas.push('*Comprobante de donación — ' + nombreNegocio + '*');
  lineas.push('');
  lineas.push('Institución: ' + donacion.clienteNombre);
  if(donacion.domicilio) lineas.push('Domicilio: ' + donacion.domicilio);
  if(donacion.clienteTelefono) lineas.push('Teléfono: ' + donacion.clienteTelefono);
  lineas.push('Fecha de entrega: ' + fmtDate(donacion.fechaEntrega) + (donacion.horaEntrega ? ' ' + donacion.horaEntrega + 'hs' : ''));
  lineas.push('');
  lineas.push('Productos donados:');
  (donacion.items||[]).forEach(function(it){
    lineas.push('• ' + it.cantidad + 'x ' + it.nombre);
  });
  if((donacion.notas||'').trim()) { lineas.push(''); lineas.push('Notas: ' + donacion.notas); }
  lineas.push('');
  lineas.push('¡Gracias por confiar en nosotros!');
  return lineas.join('\n');
}

/* ============================================================
   MÓDULO: CALENDARIO DE RECORDATORIOS
   Junta en una sola vista mensual las fechas de entrega/devolución de
   Pedidos y Alquileres (automático, de solo lectura acá) con recordatorios
   manuales de pagos u otros trámites (se cargan y editan desde acá).
============================================================ */
var MESES_LARGOS = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
var DIAS_SEMANA_CORTOS = ['L','M','M','J','V','S','D'];

var EVENTO_TONOS = {
  pedido:   { dot:'var(--blue)',    bg:'var(--blue-bg)',   fg:'var(--blue)',        label:'Pedido' },
  alquiler: { dot:'var(--primary)', bg:'var(--primary-bg)',fg:'var(--primary)',     label:'Alquiler' },
  donacion: { dot:'#0E8A78',        bg:'#E8FBF7',          fg:'#0E8A78',            label:'Donación' },
  pago:     { dot:'var(--green-dark)', bg:'var(--green-bg)', fg:'var(--green-dark)', label:'Pago' },
  otro:     { dot:'#8A5C12',        bg:'var(--amber-bg)',  fg:'#8A5C12',            label:'Otro' }
};

function pad2n(n){ return (n<10?'0':'')+n; }
function dateToISOLocal(d){ return d.getFullYear()+'-'+pad2n(d.getMonth()+1)+'-'+pad2n(d.getDate()); }
function isoToLocalDate(iso){
  var partes = (iso||'').split('-');
  return new Date(Number(partes[0]), (Number(partes[1])||1)-1, Number(partes[2])||1);
}
function buildMonthGrid(year, month){
  var primero = new Date(year, month, 1);
  var offsetLunes = (primero.getDay()+6)%7; // Lunes=0 ... Domingo=6
  var cursor = new Date(year, month, 1-offsetLunes);
  var semanas = [];
  for(var w=0; w<6; w++){
    var fila = [];
    for(var d=0; d<7; d++){
      fila.push({ date:new Date(cursor), iso:dateToISOLocal(cursor), inMonth: cursor.getMonth()===month });
      cursor.setDate(cursor.getDate()+1);
    }
    semanas.push(fila);
  }
  return semanas;
}
// Junta en un mapa { "YYYY-MM-DD": [eventos] } las fechas de pedidos/alquileres (automático,
// de solo lectura) con los recordatorios manuales (editables).
function eventosPorFecha(pedidos, recordatorios){
  var map = {};
  function agregar(iso, ev){ if(!iso) return; if(!map[iso]) map[iso]=[]; map[iso].push(ev); }
  (pedidos||[]).forEach(function(p){
    if(p.estadoArmado==='cancelado') return;
    var esAlquiler = p.tipo==='alquiler';
    var esDonacion = p.tipo==='donacion';
    if(esAlquiler && p.fechaAlquiler){
      agregar(p.fechaAlquiler, { origen:'pedido', tipo:'alquiler', titulo:'Retiro — '+p.clienteNombre, fecha:p.fechaAlquiler, ref:p });
    }
    if(p.fechaEntrega){
      var tipoEvento = esAlquiler ? 'alquiler' : (esDonacion ? 'donacion' : 'pedido');
      var tituloEvento = esAlquiler ? ('Devolución — '+p.clienteNombre) : (esDonacion ? ('Donación — '+p.clienteNombre) : ('Entrega — '+p.clienteNombre));
      agregar(p.fechaEntrega, { origen:'pedido', tipo: tipoEvento, titulo:tituloEvento, fecha:p.fechaEntrega, ref:p });
    }
  });
  (recordatorios||[]).forEach(function(r){
    agregar(r.fecha, { origen:'recordatorio', tipo: r.tipo==='pago'?'pago':'otro', titulo:r.titulo, fecha:r.fecha, ref:r });
  });
  return map;
}

function ComboItemsEditor(props){

        if(v.estado==='anulada') return;
        var fechaVenta = (v.fecha||'').slice(0,10);
        totalGeneral += v.total||0;
        if(fechaVenta===hoy){ totalHoy += v.total||0; cantHoy++; }
        if(fechaVenta.slice(0,7)===inicioMes){ totalMes += v.total||0; cantMes++; }
      });
      return { id:suc.id, nombre:suc.nombre, totalHoy:totalHoy, cantHoy:cantHoy, totalMes:totalMes, cantMes:cantMes, totalGeneral:totalGeneral, cantVentas:suc.ventas.length };
    });
  }, [datos]);

  var totales = useMemo(function(){
    return filas.reduce(function(acc, f){
      acc.totalHoy += f.totalHoy; acc.totalMes += f.totalMes; acc.totalGeneral += f.totalGeneral;
      return acc;
    }, { totalHoy:0, totalMes:0, totalGeneral:0 });
  }, [filas]);

  return h('div', { style:{ animation:'fadeIn 0.2s ease-out' } },
    h('div', { style:{ display:'flex', alignItems:'flex-start', justifyContent:'space-between', marginBottom:18, flexWrap:'wrap', gap:10 } },
      h('div', null,
        h('h1', { className:'display', style:{ fontSize:22, margin:0 } }, h(Tooltip, { text:'Vista consolidada de las ventas de todas las sucursales registradas', place:'bottom' }, 'Comparativa entre sucursales'))
      ),
      h(Button, { variant:'ghost', icon:Icon('history',15), onClick:cargar, disabled:cargando }, cargando ? 'Actualizando...' : 'Actualizar')
    ),
    error ? h('div', { style:{ background:'var(--red-bg)', color:'var(--red)', borderRadius:8, padding:'10px 14px', fontSize:13, fontWeight:600, marginBottom:16 } }, error) : null,
    cargando ? h('div', { style:{ color:'var(--ink-soft)', fontSize:13.5, padding:'30px 0', textAlign:'center' } }, 'Cargando datos de todas las sucursales...') :
    h(Fragment, null,
      h('div', { className:'grid-3', style:{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:16, marginBottom:22 } },
        h(StatCard, { label:'Ventas de hoy (todas)', value:fmtMoney(totales.totalHoy), icon:Icon('cash',18), tone:'green' }),
        h(StatCard, { label:'Ventas del mes (todas)', value:fmtMoney(totales.totalMes), icon:Icon('receipt',18), tone:'blue' }),
        h(StatCard, { label:'Histórico (todas)', value:fmtMoney(totales.totalGeneral), icon:Icon('wallet',18), tone:'amber' })
      ),
      h('div', { style:{ background:'var(--panel)', border:'1px solid var(--border)', borderRadius:14, overflow:'hidden', boxShadow:'var(--shadow)' } },
        h('table', { style:{ width:'100%', borderCollapse:'collapse', fontSize:13.5 } },
          h('thead', null,
            h('tr', { style:{ background:'var(--panel-2)' } },
              h('th', { style:{ textAlign:'left', padding:'12px 16px' } }, 'Sucursal'),
              h('th', { style:{ textAlign:'right', padding:'12px 16px' } }, 'Ventas hoy'),
              h('th', { style:{ textAlign:'right', padding:'12px 16px' } }, '$ Hoy'),
              h('th', { style:{ textAlign:'right', padding:'12px 16px' } }, 'Ventas del mes'),
              h('th', { style:{ textAlign:'right', padding:'12px 16px' } }, '$ Mes'),
              h('th', { style:{ textAlign:'right', padding:'12px 16px' } }, '$ Histórico')
            )
          ),
          h('tbody', null,
            filas.map(function(f){
              return h('tr', { key:f.id, style:{ borderTop:'1px solid var(--border)' } },
                h('td', { style:{ padding:'12px 16px', fontWeight:700, display:'flex', alignItems:'center', gap:8 } }, Icon('store',15), f.nombre),
                h('td', { style:{ padding:'12px 16px', textAlign:'right' } }, fmtNum(f.cantHoy,0)),
                h('td', { style:{ padding:'12px 16px', textAlign:'right', fontWeight:700, color:'var(--green-dark)' } }, fmtMoney(f.totalHoy)),
                h('td', { style:{ padding:'12px 16px', textAlign:'right' } }, fmtNum(f.cantMes,0)),
                h('td', { style:{ padding:'12px 16px', textAlign:'right', fontWeight:700 } }, fmtMoney(f.totalMes)),
                h('td', { style:{ padding:'12px 16px', textAlign:'right', color:'var(--ink-soft)' } }, fmtMoney(f.totalGeneral))
              );
            }),
            filas.length===0 ? h('tr', null, h('td', { colSpan:6, style:{ padding:20, textAlign:'center', color:'var(--ink-faint)' } }, 'Todavía no hay sucursales con ventas registradas')) : null
          )
        )
      )
    )
  );
}

function BottomNav(props){
  var alerts = useAlertCounts();
  var app = useApp();
  var items = [
    { id:'dashboard', label:'Inicio', icon:'home' },
    { id:'caja', label:'Caja', icon:'cash' },
    { id:'stock', label:'Stock', icon:'package' },
    { id:'compras', label:'Compras', icon:'receipt' },
    { id:'clientes', label:'Clientes', icon:'users' },
    { id:'pedidos', label:'Pedidos', icon:'calendar' },
    { id:'calendario', label:'Calendario', icon:'bell' },
    { id:'historial', label:'Historial', icon:'history' },
    { id:'ajustes', label:'Ajustes', icon:'settings' },
  ];
  if(app.modoDueno && app.sucursales.length>1) items.splice(1, 0, { id:'comparativa', label:'Comparar', icon:'chart' });
  if(app.rolActual==='cajero') items = items.filter(function(it){ return NAV_ITEMS_CAJERO.indexOf(it.id)>=0; });
  return h('nav', { className:'bottom-nav' },
    items.map(function(item){
      var active = props.page === item.id;
      return h('button', {
        key: item.id,
        className: 'bottom-nav-btn' + (active ? ' active' : ''),
        onClick: function(){ props.setPage(item.id); }
      },
        Icon(item.icon, 20),
        item.label,
        (item.id==='stock' && alerts.total>0) ? h('span', { style:{ position:'absolute', top:6, fontSize:8, background:'var(--amber)', color:'#2A1C04', borderRadius:999, padding:'1px 4px', fontWeight:800 } }, alerts.total) : null
      );
    })
  );
}

/* ============================================================
   APP PRINCIPAL
============================================================ */
function AppShell(){
  var app = useApp();
  var esCajero = app.rolActual==='cajero';
  var pageS = useState(esCajero ? 'caja' : 'dashboard'); var page = pageS[0]; var setPageRaw = pageS[1];
  var mobileOpenS = useState(false); var mobileOpen = mobileOpenS[0]; var setMobileOpen = mobileOpenS[1];

  // El rol "cajero" solo puede navegar a Caja y Notas (acceso restringido definido por el
  // cliente); si por algún motivo queda posicionado en otra página, se redirige a Caja.
  function setPage(id){
    if(esCajero && NAV_ITEMS_CAJERO.indexOf(id)<0) id = 'caja';
    setPageRaw(id);
  }
  useEffect(function(){
    if(esCajero && NAV_ITEMS_CAJERO.indexOf(page)<0) setPageRaw('caja');
  }, [esCajero, page]);

  function renderPage(){
    if(page==='dashboard') return h(Dashboard, { setPage:setPage });
    if(page==='caja') return h(CajaModule);
    if(page==='stock') return h(StockModule);
    if(page==='compras') return h(ComprasModule);
    if(page==='clientes') return h(ClientesModule);
    if(page==='pedidos') return h(PedidosModule);
    if(page==='calendario') return h(CalendarioModule, { setPage:setPage });
    if(page==='historial') return h(HistorialModule);
    if(page==='tiendaweb') return h(TiendaWebModule);
    if(page==='comparativa') return h(ComparativaModule);
    if(page==='ajustes') return h(AjustesModule);
    return null;
  }

  return h('div', { className:'pos-root', style:{ display:'flex', minHeight:'100vh' } },
    h('div', { className:'sidebar' },
      h(Sidebar, { page:page, setPage:setPage, mobileOpen:false, setMobileOpen:function(){} })
    ),
    h('div', { style:{ flex:1, minWidth:0, display:'flex', flexDirection:'column' } },
      h(TopBar, { page:page, setMobileOpen:setMobileOpen }),
      h('main', { className:'main-content', style:{ flex:1, padding:'28px 32px', maxWidth:1400, width:'100%', margin:'0 auto' } }, renderPage())
    ),
    h(BottomNav, { page:page, setPage:setPage }),
    h(Toasts),
    h(ImageLightbox),
    h(BackupReminder)
  );
}

function AppGate(){
  var app = useApp();
  // Antes de tener sesión iniciada no sabemos aún la sucursal, así que "cargando datos"
  // solo aplica una vez que sesionActiva es true (recién ahí arrancan las suscripciones).
  var esperandoDatos = app.sesionActiva && app.loadingData;
  useEffect(function(){
    if(app.authError || (app.authReady && app.sucursalesCargado && !esperandoDatos)){
      var el = document.getElementById('boot-loader');
      if(el) el.style.display = 'none';
    }
  }, [app.authReady, app.sucursalesCargado, esperandoDatos, app.authError]);

  if(app.authError) return h(LoadingScreen, { authError: app.authError });
  if(!app.authReady || !app.sucursalesCargado) return null;
  if(!app.sesionActiva){
    return app.sucursales.length===0 ? h(SetupCredencialesScreen) : h(LoginScreen);
  }
  if(esperandoDatos) return null;
  return h(AppShell);
}

function App(){
  return h(AppProvider, null, h(AppGate));
}

var rootEl = document.getElementById('root');
var root = ReactDOM.createRoot(rootEl);
root.render(h(App));

// Service Worker: cachea la app (HTML, JS de las librerías, fuentes) para que se pueda
// abrir e ir usando aunque no haya conexión a internet. Se registra al final para no
// demorar la primera carga. Requiere que index.html, manifest.json, sw.js e icon-*.png
// estén servidos desde el mismo directorio, por HTTPS (o localhost).
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(err){
      console.warn('No se pudo registrar el Service Worker (la app seguirá funcionando online):', err);
    });
  });
}
