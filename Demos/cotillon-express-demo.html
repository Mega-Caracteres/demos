  // ---- Reservas web (pedidos que entran desde el sitio público) ----
  // El stock de estas reservas ya se descontó del lado del sitio público al momento de
  // reservar (transacción atómica ahí), así que "cobrar y entregar" acá NUNCA vuelve a
  // descontar stock — solo registra la venta y el cobro. Si se cancela, recién ahí se repone.
  function cobrarReservaWeb(reservaId, metodoPago, montoRecibido){
    if(!cajaActual){
      pushToast('No podés cobrar reservas sin abrir la caja primero', 'error');
      return Promise.resolve(null);
    }
    var reservaRef = negDoc('reservasWeb', reservaId);
    var ventaRef = negRef('ventas').doc();
    var contadorRef = negDoc('contadores', 'ventas');
    var fecha = nowISO();
    var usuarioActual = nombreUsuarioActual();

    return db.runTransaction(function(transaction){
      return transaction.get(reservaRef).then(function(reservaSnap){
        if(!reservaSnap.exists) throw new Error('La reserva ya no existe.');
        var reserva = reservaSnap.data();
        if(reserva.estado!=='pendiente') throw new Error('Esta reserva ya fue procesada.');
        return transaction.get(contadorRef).then(function(contadorSnap){
          var numero = (contadorSnap.exists ? contadorSnap.data().ultimoNumero : 1000) + 1;
          var itemsVenta = (reserva.items||[]).map(function(it){
            return {
              productoId: it.tipo==='producto' ? it.id : null,
              nombre: it.tipo==='combo' ? ('Combo: '+it.nombre) : it.nombre,
              cantidad: it.cantidad, factor: 1, precioUnit: it.precioUnit, subtotal: it.subtotal
            };
          });
          var venta = {
            numero: numero, fecha: fecha, items: itemsVenta, total: reserva.total, metodoPago: metodoPago,
            clienteId: null, clienteNombre: reserva.clienteNombre,
            estado:'completada', montoRecibido: montoRecibido===undefined ? null : montoRecibido,
            cajaId: cajaActual.id, cajaNumero: cajaActual.numero, vendedor: usuarioActual,
            origenReservaWeb: true, reservaWebId: reservaId
          };
          transaction.set(ventaRef, venta);
          transaction.set(contadorRef, { ultimoNumero: numero }, { merge:true });
          transaction.update(reservaRef, { estado:'entregado', ventaId: ventaRef.id, fechaEntrega: fecha });
          return { id: ventaRef.id, numero: numero };
        });
      });
    }).then(function(resultado){
      pushToast('Venta #'+resultado.numero+' registrada desde la reserva', 'success');
      return resultado;
    }).catch(function(err){
      console.error(err);
      pushToast(err && err.message ? err.message : 'Error al cobrar la reserva', 'error');
      return null;
    });
  }

  function cancelarReservaWeb(reservaId, motivo){
    var reservaRef = negDoc('reservasWeb', reservaId);
    var fecha = nowISO();
    var usuarioActual = nombreUsuarioActual();
    var rolActualSnapshot = rolActual;

    return db.runTransaction(function(transaction){
      return transaction.get(reservaRef).then(function(reservaSnap){
        if(!reservaSnap.exists) throw new Error('La reserva ya no existe.');
        var reserva = reservaSnap.data();
        if(reserva.estado!=='pendiente') throw new Error('Esta reserva ya fue procesada.');
        var descontados = reserva.productosDescontados || [];
        var refs = descontados.map(function(d){ return negDoc('productos', d.productoId); });
        return Promise.all(refs.map(function(ref){ return transaction.get(ref); })).then(function(snaps){
          snaps.forEach(function(snap, i){
            if(!snap.exists) return;
            var d = descontados[i];
            var stockAnterior = snap.data().stock;
            var nuevoStock = Math.round((stockAnterior + d.cantidad)*1000)/1000;
            transaction.update(negDoc('productos', d.productoId), { stock: nuevoStock });
            transaction.set(negRef('historialProductos').doc(), {
              productoId: d.productoId, productoNombre: d.nombre, tipo:'ajuste', origen:'Cancelación de reserva web',
              usuario: usuarioActual, rol: rolActualSnapshot, fecha: fecha,
              cambios: [{ campo:'stock', anterior: stockAnterior, nuevo: nuevoStock }]
            });
          });
          transaction.update(reservaRef, { estado:'cancelada', motivoCancelacion: (motivo||'').trim(), fechaCancelacion: fecha });
        });
      });
    }).then(function(){
      pushToast('Reserva cancelada y stock repuesto', 'info');
      return true;
    }).catch(function(err){
      console.error(err);
      pushToast(err && err.message ? err.message : 'Error al cancelar la reserva', 'error');
      return false;
    });
  }

  // ---- Pedidos (toma de pedidos con fecha de entrega y seguimiento de armado) ----
  // estadoArmado recorre: pendiente -> armando -> listo -> entregado (o cancelado en cualquier momento).
  // El pedido se cobra en varios pagos parciales (pedido.pagos[]) hasta cubrir pedido.total;
  // pedido.anticipo guarda la suma acumulada ya cobrada, para no recalcularla en cada lectura.
  // Al registrar el PRIMER pago se descuenta automáticamente del stock la cantidad de cada
  // ítem que sea un producto del catálogo (los ítems personalizados, sin productoId, no afectan stock).
  // Registra un pedido, alquiler o donación. Las donaciones (tipo:'donacion') descuentan el
  // stock de forma automática e inmediata al crearse (no hay pago ni seña que lo dispare, como
  // sí pasa con pedidos/alquileres vía registrarPagoPedido) — todo en una única transacción
  // junto con la creación del documento, para que quede atómico.
  function addPedido(data){
    var items = data.items || [];
    var total = Math.round(items.reduce(function(s,it){ return s+(Number(it.subtotal)||0); }, 0)*100)/100;
    var tipo = data.tipo==='alquiler' ? 'alquiler' : (data.tipo==='donacion' ? 'donacion' : 'pedido');
    var esDonacion = tipo==='donacion';
    var d2 = {
      tipo: tipo,
      clienteId: data.clienteId || null,
      clienteNombre: (data.clienteNombre||'').trim(),
      clienteTelefono: (data.clienteTelefono||'').trim(),
      domicilio: esDonacion ? (data.domicilio||'').trim() : null,
      fechaAlquiler: tipo==='alquiler' ? (data.fechaAlquiler || null) : null,
      fechaEntrega: data.fechaEntrega || null,
      horaEntrega: (data.horaEntrega||'').trim(),
      items: items,
      notas: (data.notas||'').trim(),
      anticipo: esDonacion ? total : 0,
      pagos: [],
      formaPagoAbono: tipo!=='donacion' ? (data.formaPagoAbono || null) : null,
      deposito: tipo==='alquiler' ? (Math.round((Number(data.deposito)||0)*100)/100) : 0,
      depositoDevuelto: false,
      stockDescontado: false,
      total: total,
      estadoArmado: 'pendiente',
      fecha: nowISO()
    };
    if(!d2.clienteNombre) return Promise.reject(new Error(esDonacion ? 'Falta el nombre de la institución' : 'Falta el nombre del cliente'));
    if(tipo==='alquiler' && !d2.fechaAlquiler) return Promise.reject(new Error('Falta la fecha de alquiler'));
    if(!d2.fechaEntrega) return Promise.reject(new Error(tipo==='alquiler' ? 'Falta la fecha de entrega/devolución' : 'Falta la fecha de entrega'));

    if(esDonacion){
      var mapaProductosDon = {};
      items.forEach(function(it){
        if(!it.productoId) return; // ítems personalizados: no tienen stock que descontar
        if(!mapaProductosDon[it.productoId]) mapaProductosDon[it.productoId] = { cantidad:0, nombre:it.nombre, ref: negDoc('productos', it.productoId) };
        mapaProductosDon[it.productoId].cantidad += Number(it.cantidad)||0;
      });
      var idsUnicosDon = Object.keys(mapaProductosDon);
      var pedidoRefDon = negRef('pedidos').doc();
      d2.stockDescontado = true;
      return db.runTransaction(function(transaction){
        return Promise.all(idsUnicosDon.map(function(id){ return transaction.get(mapaProductosDon[id].ref); })).then(function(prodSnaps){
          var sinStockSuficiente = [];
          prodSnaps.forEach(function(snap, i){
            if(!snap.exists) return;
            var id = idsUnicosDon[i];
            var stockReal = snap.data().stock;
            var necesario = mapaProductosDon[id].cantidad;
            if(stockReal < necesario) sinStockSuficiente.push(mapaProductosDon[id].nombre);
            var nuevoStock = Math.max(0, Math.round((stockReal-necesario)*1000)/1000);
            transaction.update(mapaProductosDon[id].ref, { stock: nuevoStock });
          });
          transaction.set(pedidoRefDon, d2);
          return sinStockSuficiente;
        });
      }).then(function(sinStockSuficiente){
        pushToast('Donación registrada — stock descontado', 'success');
        if(sinStockSuficiente.length>0) pushToast('Sin stock suficiente de: '+sinStockSuficiente.join(', ')+' (quedó en 0)', 'error');
        registrarHistorialPedido({ pedidoId: pedidoRefDon.id, pedidoCliente: d2.clienteNombre, tipo:'creacion', origen:'Alta de donación', cambios:[] });
        return pedidoRefDon.id;
      }).catch(function(err){ console.error(err); pushToast('Error al registrar la donación', 'error'); throw err; });
    }

    return negRef('pedidos').add(d2).then(function(docRef){
      pushToast('Pedido registrado correctamente', 'success');
      registrarHistorialPedido({
        pedidoId: docRef.id, pedidoCliente: d2.clienteNombre, tipo:'creacion',
        origen: 'Alta de '+(tipo==='alquiler'?'alquiler':(tipo==='donacion'?'donación':'pedido')), cambios: []
      });
      return docRef.id;
    }).catch(function(err){ console.error(err); pushToast('Error al registrar el pedido', 'error'); throw err; });
  }
  // Historial de pedidos/alquileres/donaciones: mismo esquema que registrarHistorialProducto —
  // registra quién hizo cada cambio y, cuando aplica, el valor anterior/nuevo de cada campo, para
  // poder deshacer una modificación puntual sin perder trazabilidad.
  function registrarHistorialPedido(entry){
    var d = {
      pedidoId: entry.pedidoId, pedidoCliente: entry.pedidoCliente || '',
      tipo: entry.tipo, origen: entry.origen || '',
      usuario: nombreUsuarioActual(), rol: rolActual,
      cambios: entry.cambios || [], fecha: entry.fecha || nowISO(),
      afectaStock: !!entry.afectaStock, pagoFecha: entry.pagoFecha || null, primerPago: !!entry.primerPago
    };
    return negRef('historialPedidos').add(d).catch(function(err){ console.error('Error registrando historial de pedido:', err); });
  }
  // Compara los datos nuevos contra el pedido actual (en memoria) y arma la lista de cambios
  // reales — igual que detectarCambiosProducto, pero sin comparar campos calculados (total) ni
  // los que ya se registran aparte con su propia lógica (pagos, anticipo, stockDescontado).
  function detectarCambiosPedido(anterior, data){
    var ignorar = { total:1, pagos:1, anticipo:1, stockDescontado:1, fecha:1, estadoArmado:1 };
    var cambios = [];
    for(var k in data){
      if(ignorar[k]) continue;
      var valAnterior = anterior[k]!==undefined ? anterior[k] : null;
      var valNuevo = data[k]!==undefined ? data[k] : null;
      if(k==='items'){
        if(JSON.stringify(valAnterior||[])===JSON.stringify(valNuevo||[])) continue;
      } else {
        if(valAnterior===valNuevo) continue;
        if(typeof valAnterior==='number' || typeof valNuevo==='number'){
          if(Number(valAnterior||0)===Number(valNuevo||0)) continue;
        }
      }
      cambios.push({ campo:k, anterior: (valAnterior===undefined?null:valAnterior), nuevo: (valNuevo===undefined?null:valNuevo) });
    }
    return cambios;
  }
  function updatePedido(id, data){
    var anterior = pedidos.find(function(p){ return p.id===id; }) || {};
    var cambios = detectarCambiosPedido(anterior, data);
    var d2 = {}; for(var k in data) d2[k]=data[k];
    if(data.items){
      d2.total = Math.round(data.items.reduce(function(s,it){ return s+(Number(it.subtotal)||0); }, 0)*100)/100;
    }
    return negDoc('pedidos', id).update(d2).then(function(){
      pushToast('Pedido actualizado', 'success');
      if(cambios.length){
        registrarHistorialPedido({
          pedidoId: id, pedidoCliente: anterior.clienteNombre || data.clienteNombre || '',
          tipo:'edicion', origen:'Edición manual', cambios: cambios
        });
      }
    }).catch(function(err){ console.error(err); pushToast('Error al actualizar el pedido', 'error'); });
  }

  // Agrupa las cantidades de los ítems de catálogo de un pedido por producto (por si el mismo
  // producto aparece en más de una línea), lista para leer/escribir stock en una transacción.
  function agruparItemsConProductoDePedido(pedido){
    var mapa = {};
    (pedido.items||[]).forEach(function(it){
      if(!it.productoId) return; // ítems personalizados: no tienen stock que descontar
      if(!mapa[it.productoId]) mapa[it.productoId] = { cantidad:0, nombre:it.nombre, ref: negDoc('productos', it.productoId) };
      mapa[it.productoId].cantidad += Number(it.cantidad)||0;
    });
    return mapa;
  }

  // Registra un pago parcial (seña, cuota, saldo final, etc.) sobre un pedido. Si es el primer
  // pago que recibe el pedido, dentro de la MISMA transacción descuenta del stock los productos
  // del catálogo incluidos — así el stock queda comprometido apenas el cliente confirma con una seña.
  function registrarPagoPedido(pedidoId, monto, nota){
    monto = Math.round((Number(monto)||0)*100)/100;
    if(!(monto>0)) return Promise.reject(new Error('Ingresá un monto válido'));
    var pedidoRef = negDoc('pedidos', pedidoId);

    return db.runTransaction(function(transaction){
      return transaction.get(pedidoRef).then(function(pedidoSnap){
        if(!pedidoSnap.exists) throw new Error('El pedido ya no existe');
        var pedido = pedidoSnap.data();
        var esPrimerPago = !pedido.stockDescontado && (!pedido.pagos || pedido.pagos.length===0);
        var mapaProductos = esPrimerPago ? agruparItemsConProductoDePedido(pedido) : {};
        var idsUnicos = Object.keys(mapaProductos);

        return Promise.all(idsUnicos.map(function(id){ return transaction.get(mapaProductos[id].ref); })).then(function(prodSnaps){
          var totalPrevio = pedido.anticipo || 0;
          var totalPedido = pedido.total || 0;
          var saldoRestante = Math.max(0, Math.round((totalPedido-totalPrevio)*100)/100);
          var montoFinal = saldoRestante>0 ? Math.min(monto, saldoRestante) : monto;
          var nuevoAnticipo = Math.round((totalPrevio+montoFinal)*100)/100;
          var pagosNuevos = (pedido.pagos||[]).concat([{ monto: montoFinal, fecha: nowISO(), nota: (nota||'').trim() }]);

          var sinStockSuficiente = [];
          prodSnaps.forEach(function(snap, i){
            if(!snap.exists) return;
            var id = idsUnicos[i];
            var stockReal = snap.data().stock;
            var necesario = mapaProductos[id].cantidad;
            if(stockReal < necesario) sinStockSuficiente.push(mapaProductos[id].nombre);
            var nuevoStock = Math.max(0, Math.round((stockReal-necesario)*1000)/1000);
            transaction.update(mapaProductos[id].ref, { stock: nuevoStock });
          });

          var patch = { anticipo: nuevoAnticipo, pagos: pagosNuevos };
          if(esPrimerPago) patch.stockDescontado = true;
          transaction.update(pedidoRef, patch);

          return { montoFinal: montoFinal, montoAjustado: montoFinal!==monto, esPrimerPago: esPrimerPago, sinStockSuficiente: sinStockSuficiente, anticipoAnterior: totalPrevio, anticipoNuevo: nuevoAnticipo, pagoFecha: pagosNuevos[pagosNuevos.length-1].fecha, clienteNombre: pedido.clienteNombre };
        });
      });
    }).then(function(res){
      var msg = 'Pago de '+fmtMoney(res.montoFinal)+' registrado';
      if(res.esPrimerPago) msg += ' — stock descontado';
      pushToast(msg, 'success');
      if(res.montoAjustado) pushToast('El monto se ajustó a '+fmtMoney(res.montoFinal)+' para no superar el total del pedido', 'info');
      if(res.sinStockSuficiente.length>0) pushToast('Sin stock suficiente de: '+res.sinStockSuficiente.join(', ')+' (quedó en 0)', 'error');
      registrarHistorialPedido({
        pedidoId: pedidoId, pedidoCliente: res.clienteNombre, tipo:'pago', origen:'Pago de '+fmtMoney(res.montoFinal),
        cambios:[{ campo:'anticipo', anterior: res.anticipoAnterior, nuevo: res.anticipoNuevo }],
        pagoFecha: res.pagoFecha, primerPago: res.esPrimerPago
      });
      return res;
    }).catch(function(err){
      console.error(err);
      pushToast('Error al registrar el pago: '+(err && err.message ? err.message : 'ver consola'), 'error');
      throw err;
    });
  }

  // Repone en el stock las cantidades que se habían descontado al cobrar la primera seña de un
  // pedido — se usa al cancelar o eliminar un pedido cuyo stock ya había sido comprometido.
  function restaurarStockPedido(pedido){
    var mapaProductos = agruparItemsConProductoDePedido(pedido);
    var idsUnicos = Object.keys(mapaProductos);
    if(idsUnicos.length===0) return Promise.resolve();
    return db.runTransaction(function(transaction){
      return Promise.all(idsUnicos.map(function(id){ return transaction.get(mapaProductos[id].ref); })).then(function(prodSnaps){
        prodSnaps.forEach(function(snap, i){
          if(!snap.exists) return;
          var id = idsUnicos[i];
          var nuevoStock = Math.round((snap.data().stock + mapaProductos[id].cantidad)*1000)/1000;
          transaction.update(mapaProductos[id].ref, { stock: nuevoStock });
        });
      });
    });
  }
  function cambiarEstadoPedido(id, estado){
    var pedido = pedidos.find(function(p){ return p.id===id; });
    var estadoAnterior = pedido ? pedido.estadoArmado : null;
    var labels = { pendiente:'Pedido marcado como pendiente', armando:'Pedido en armado', listo:'Pedido listo para entregar', entregado:'Pedido entregado', cancelado:'Pedido cancelado' };
    // Si la cancelación implica restituir stock, ese movimiento queda marcado para no poder
    // deshacerse en un click: revertirlo requeriría volver a descontar el stock correctamente.
    var afectaStock = estado==='cancelado';
    if(estado==='cancelado' && pedido && pedido.stockDescontado){
      return restaurarStockPedido(pedido).then(function(){
        return negDoc('pedidos', id).update({ estadoArmado: estado, stockDescontado:false });
      }).then(function(){
        pushToast('Pedido cancelado — stock restituido', 'success');
        registrarHistorialPedido({
          pedidoId:id, pedidoCliente: pedido?pedido.clienteNombre:'', tipo:'estado', origen:'Pedido cancelado — stock restituido',
          cambios:[{ campo:'estadoArmado', anterior: estadoAnterior, nuevo: estado }], afectaStock:true
        });
      }).catch(function(err){ console.error(err); pushToast('Error al cancelar el pedido', 'error'); });
    }
    return negDoc('pedidos', id).update({ estadoArmado: estado }).then(function(){
      pushToast(labels[estado] || 'Estado actualizado', 'success');
      registrarHistorialPedido({
        pedidoId:id, pedidoCliente: pedido?pedido.clienteNombre:'', tipo:'estado', origen: labels[estado]||'Cambio de estado',
        cambios:[{ campo:'estadoArmado', anterior: estadoAnterior, nuevo: estado }], afectaStock: afectaStock
      });
    }).catch(function(err){ console.error(err); pushToast('Error al cambiar el estado del pedido', 'error'); });
  }
  function deletePedido(id){
    var pedido = pedidos.find(function(p){ return p.id===id; });
    var restaurar = (pedido && pedido.stockDescontado) ? restaurarStockPedido(pedido) : Promise.resolve();
    return restaurar.then(function(){ return negDoc('pedidos', id).delete(); }).then(function(){
      pushToast('Pedido eliminado', 'info');
      return true;
    }).catch(function(err){ console.error(err); pushToast('Error al eliminar el pedido', 'error'); return false; });
  }
  // Deshace un movimiento puntual del historial de un pedido/alquiler/donación (edición manual,
  // depósito marcado/desmarcado, cambio de estado o pago registrado), volviendo cada campo a su
  // valor "anterior" — mismo esquema que revertirHistorialProducto, pero con dos resguardos por
  // la plata y el stock involucrados:
  // - un cambio de estado que restituyó stock (cancelación) no se puede deshacer con un click,
  //   porque re-descontar el stock correctamente necesitaría repetir la lógica de la primera seña.
  // - un pago solo se puede deshacer si es el ÚLTIMO pago del pedido (si se deshiciera uno del
  //   medio, el resto de los pagos y el stock ya descontado quedarían inconsistentes).
  function revertirHistorialPedido(entry){
    if(!entry) return Promise.resolve();
    if(entry.tipo==='estado' && entry.afectaStock){
      pushToast('Este cambio de estado restituyó stock — no se puede deshacer automáticamente', 'error');
      return Promise.resolve();
    }
    if(entry.tipo==='pago'){
      var pedidoActual = pedidos.find(function(p){ return p.id===entry.pedidoId; });
      if(!pedidoActual){ pushToast('El pedido ya no existe', 'error'); return Promise.resolve(); }
      var pagosActuales = pedidoActual.pagos || [];
      var ultimoPago = pagosActuales[pagosActuales.length-1];
      if(!ultimoPago || ultimoPago.fecha!==entry.pagoFecha){
        pushToast('Solo se puede deshacer el último pago registrado del pedido', 'error');
        return Promise.resolve();
      }
      var anticipoAnterior = entry.cambios && entry.cambios[0] ? entry.cambios[0].anterior : 0;
      var patchPago = { anticipo: anticipoAnterior, pagos: pagosActuales.slice(0,-1) };
      var restaurarStockPago = entry.primerPago ? restaurarStockPedido(pedidoActual) : Promise.resolve();
      if(entry.primerPago) patchPago.stockDescontado = false;
      return restaurarStockPago.then(function(){ return negDoc('pedidos', entry.pedidoId).update(patchPago); }).then(function(){
        pushToast('Pago deshecho'+(entry.primerPago?' — stock restituido':''), 'success');
        registrarHistorialPedido({
          pedidoId: entry.pedidoId, pedidoCliente: entry.pedidoCliente||'', tipo:'edicion', origen:'Deshacer — '+(entry.origen||''),
          cambios:[{ campo:'anticipo', anterior: entry.cambios[0].nuevo, nuevo: anticipoAnterior }]
        });
      }).catch(function(err){ console.error(err); pushToast('Error al deshacer el pago', 'error'); });
    }
    // edición manual o cambio de estado sin stock: se aplica el patch inverso tal cual
    var patch = {};
    (entry.cambios||[]).forEach(function(c){ patch[c.campo] = c.anterior; });
    if(patch.items){
      patch.total = Math.round((patch.items||[]).reduce(function(s,it){ return s+(Number(it.subtotal)||0); }, 0)*100)/100;
    }
    return negDoc('pedidos', entry.pedidoId).update(patch).then(function(){
      pushToast('Cambio deshecho', 'success');
      registrarHistorialPedido({
        pedidoId: entry.pedidoId, pedidoCliente: entry.pedidoCliente||'', tipo:'edicion', origen:'Deshacer — '+(entry.origen||''),
        cambios: (entry.cambios||[]).map(function(c){ return { campo:c.campo, anterior:c.nuevo, nuevo:c.anterior }; })
      });
    }).catch(function(err){ console.error(err); pushToast('Error al deshacer el cambio', 'error'); });
  }

  // Registra una factura de compra: crea (o incrementa el stock de) cada producto de la factura
  // y descuenta/crea todo de forma atómica con una transacción, igual que confirmarVenta.
  // items: [{ productoId, esNuevo, nombre, categoriaId, unidad, cantidad, costoUnitario, stockMin, actualizarCosto }]
  function registrarFacturaCompra(args){
    var items = args.items || [];
    var proveedorId = args.proveedorId || null;
    var proveedorNombre = args.proveedorNombre || '';
    var numeroFactura = args.numeroFactura || '';
    var fecha = args.fecha || nowISO();
    var imagen = args.imagen || null;
    var nota = args.nota || '';

    if(items.length===0){
      pushToast('Agregá al menos un producto a la factura', 'error');
      return Promise.resolve(null);
    }

    var facturaRef = negRef('facturasCompra').doc();
    // Para los ítems existentes armamos la referencia real; para los nuevos, reservamos un ID
    // de antemano (negRef().doc() genera un ID sin escribir nada) para poder crearlos dentro
    // de la misma transacción que la factura.
    var itemRefs = items.map(function(it){
      return it.esNuevo ? negRef('productos').doc() : negDoc('productos', it.productoId);
    });
    var existentes = [];
    items.forEach(function(it, i){ if(!it.esNuevo) existentes.push({ item:it, ref:itemRefs[i], idx:i }); });

    var total = Math.round(items.reduce(function(s,it){ return s + (Number(it.cantidad)||0) * (Number(it.costoUnitario)||0); }, 0)*100)/100;
    var origenFactura = 'Factura de compra' + (numeroFactura?' N° '+numeroFactura:'') + (proveedorNombre?' — '+proveedorNombre:'');
    var usuarioActual = nombreUsuarioActual();
    var rolActualSnapshot = rolActual;

    return db.runTransaction(function(transaction){
      return Promise.all(existentes.map(function(e){ return transaction.get(e.ref); })).then(function(snaps){
        var itemsFactura = [];
        var historialItems = [];
        items.forEach(function(it, i){
          var cantidad = Number(it.cantidad)||0;
          var costoUnitario = Number(it.costoUnitario)||0;
          if(it.esNuevo){
            var margen = it.margen!=null ? Number(it.margen) : 40;
            var nuevoProducto = {
              nombre: it.nombre, categoriaId: it.categoriaId, unidad: it.unidad || 'unidad',
              costo: costoUnitario, margen: margen,
              precioVenta: Math.round(calcPrecioVenta(costoUnitario, margen)*100)/100,
              stock: cantidad, stockMin: it.stockMin!=null ? Number(it.stockMin) : 0,
              vencimiento: it.vencimiento || null, imagen: null, sku: uid('SKU'), activo: true
            };
            transaction.set(itemRefs[i], nuevoProducto);
            itemsFactura.push({ productoId: itemRefs[i].id, nombre: it.nombre, cantidad: cantidad, costoUnitario: costoUnitario, subtotal: Math.round(cantidad*costoUnitario*100)/100, esNuevo: true });
            historialItems.push({
              productoId: itemRefs[i].id, productoNombre: it.nombre, tipo:'creacion', origen: origenFactura,
              usuario: usuarioActual, rol: rolActualSnapshot, fecha: fecha,
              cambios: [{ campo:'stock', anterior: 0, nuevo: cantidad }]
            });
          } else {
            var snapIdx = existentes.findIndex(function(e){ return e.idx===i; });
            var snap = snaps[snapIdx];
            var dataActual = snap.exists ? snap.data() : {};
            var stockActual = dataActual.stock || 0;
            var nuevoStock = Math.round((stockActual + cantidad)*1000)/1000;
            var patch = { stock: nuevoStock };
            var cambiosItem = [{ campo:'stock', anterior: stockActual, nuevo: nuevoStock }];
            if(it.actualizarCosto){
              var margenActual = dataActual.margen!=null ? dataActual.margen : 40;
              var costoAnterior = dataActual.costo || 0;
              var ventaAnterior = dataActual.precioVenta || 0;
              patch.costo = costoUnitario;
              patch.precioVenta = Math.round(calcPrecioVenta(costoUnitario, margenActual)*100)/100;
              if(costoAnterior !== costoUnitario) cambiosItem.push({ campo:'costo', anterior: costoAnterior, nuevo: costoUnitario });
              if(ventaAnterior !== patch.precioVenta) cambiosItem.push({ campo:'precioVenta', anterior: ventaAnterior, nuevo: patch.precioVenta });
            }
            transaction.update(itemRefs[i], patch);
            itemsFactura.push({ productoId: itemRefs[i].id, nombre: it.nombre || dataActual.nombre, cantidad: cantidad, costoUnitario: costoUnitario, subtotal: Math.round(cantidad*costoUnitario*100)/100, esNuevo: false });
            historialItems.push({
              productoId: itemRefs[i].id, productoNombre: it.nombre || dataActual.nombre, tipo:'compra', origen: origenFactura,
              usuario: usuarioActual, rol: rolActualSnapshot, fecha: fecha, cambios: cambiosItem
            });
          }
        });

        historialItems.forEach(function(hi){ transaction.set(negRef('historialProductos').doc(), hi); });

        var factura = {
          proveedorId: proveedorId, proveedorNombre: proveedorNombre, numeroFactura: numeroFactura,
          fecha: fecha, items: itemsFactura, total: total, imagen: imagen, nota: nota
        };
        transaction.set(facturaRef, factura);
        return { id: facturaRef.id, factura: factura };
      });
    }).then(function(resultado){
      pushToast('Factura registrada — stock actualizado ('+fmtMoney(total)+')', 'success');
      var result = { id: resultado.id };
      for(var k in resultado.factura) result[k] = resultado.factura[k];
      return result;
    }).catch(function(err){
      console.error(err);
      pushToast('Error al registrar la factura de compra', 'error');
      return null;
    });
  }

  // Pagos a proveedores: control simple de cuenta corriente (total facturado vs. total pagado).
  function addPagoProveedor(data){
    var d2 = {}; for(var k in data) d2[k]=data[k];
    return negRef('pagosProveedor').add(d2).then(function(docRef){
      pushToast('Pago registrado', 'success');
      return docRef.id;
    }).catch(function(err){ console.error(err); pushToast('Error al registrar el pago', 'error'); return null; });
  }
  function deletePagoProveedor(id){
    return negDoc('pagosProveedor', id).delete().then(function(){
      pushToast('Pago eliminado', 'info');
    }).catch(function(err){ console.error(err); pushToast('Error al eliminar el pago', 'error'); });
  }

  function guardarConfigNegocio(data){
    return negocioRef(NEGOCIO_ID).set(data, { merge: true }).then(function(){
      pushToast("Configuración guardada", "success");
    }).catch(function(err){ console.error(err); pushToast("Error al guardar la configuración", "error"); });
  }

  // Agrega (o actualiza) una sucursal en el registro global meta/sucursales.
  function registrarSucursalEnListado(id, nombre){
    return sucursalesMetaRef().get().then(function(snap){
      var lista = (snap.exists && Array.isArray(snap.data().lista)) ? snap.data().lista.slice() : [];
      var idx = lista.findIndex(function(s){ return s.id===id; });
      if(idx>=0) lista[idx] = { id:id, nombre:nombre };
      else lista.push({ id:id, nombre:nombre });
      return sucursalesMetaRef().set({ lista: lista }, { merge:true });
    });
  }

  // ---- Configuración inicial (primer uso): crea la PRIMERA sucursal del sistema ----
  // Esta primera sucursal queda con acceso total (modo dueño) automáticamente, ya que
  // quien hace la configuración inicial es, por definición, quien administra el negocio.
  function crearCredenciales(nombreSucursal, usuario, password){
    var u = (usuario||'').trim();
    var nombreSuc = (nombreSucursal||'').trim() || 'Sucursal Principal';
    if(!u) return Promise.reject(new Error('Ingresá un usuario'));
    if(!password || password.length < 4) return Promise.reject(new Error('La contraseña debe tener al menos 4 caracteres'));
    var id = slugify(nombreSuc);
    return sha256Hex(password).then(function(hash){
      return negocioRef(id).set({ authUsuario: u, authPasswordHash: hash, accesoTotal: true, nombreNegocio: nombreSuc }, { merge:true });
    }).then(function(){
      return registrarSucursalEnListado(id, nombreSuc);
    }).then(function(){
      NEGOCIO_ID = id;
      try{
        localStorage.setItem('pos_sesion_activa','1');
        localStorage.setItem('pos_sucursal_activa', id);
        localStorage.setItem('pos_modo_dueno', '1');
      }catch(e){}
      setSucursalActiva(id);
      setModoDueno(true);
      setSesionActiva(true);
      setLoginError('');
    });
  }

  // Crea una sucursal ADICIONAL (desde Ajustes, en modo dueño), con sus propias credenciales.
  function crearSucursalNueva(nombreSucursal, usuario, password, accesoTotal){
    var u = (usuario||'').trim();
    var nombreSuc = (nombreSucursal||'').trim();
    if(!nombreSuc) return Promise.reject(new Error('Ingresá un nombre para la sucursal'));
    if(!u) return Promise.reject(new Error('Ingresá un usuario'));
    if(!password || password.length < 4) return Promise.reject(new Error('La contraseña debe tener al menos 4 caracteres'));
    var idBase = slugify(nombreSuc);
    var id = idBase;
    var yaExiste = sucursales.some(function(s){ return s.id===id; });
    if(yaExiste) id = idBase + '-' + uid('').slice(0,4);
    return sha256Hex(password).then(function(hash){
      return negocioRef(id).set({ authUsuario: u, authPasswordHash: hash, accesoTotal: !!accesoTotal, nombreNegocio: nombreSuc }, { merge:true });
    }).then(function(){
      return registrarSucursalEnListado(id, nombreSuc);
    }).then(function(){
      pushToast('Sucursal "'+nombreSuc+'" creada correctamente', 'success');
      return id;
    }).catch(function(err){
      console.error(err);
      pushToast('Error al crear la sucursal: ' + err.message, 'error');
      throw err;
    });
  }

  // Elimina una sucursal del registro global (deja de aparecer y de poder usarse para iniciar sesión).
  // No borra las ventas/productos/clientes ya guardados de esa sucursal en Firestore, solo la "desregistra".
  // No se puede eliminar la sucursal en la que se está trabajando actualmente.
  function eliminarSucursal(id){
    if(id === sucursalActiva){
      var err = new Error('No podés eliminar la sucursal en la que estás trabajando ahora. Cambiá a otra sucursal primero.');
      pushToast(err.message, 'error');
      return Promise.reject(err);
    }
    return sucursalesMetaRef().get().then(function(snap){
      var lista = (snap.exists && Array.isArray(snap.data().lista)) ? snap.data().lista.slice() : [];
      var nuevaLista = lista.filter(function(s){ return s.id !== id; });
      return sucursalesMetaRef().set({ lista: nuevaLista }, { merge:true });
    }).then(function(){
      pushToast('Sucursal eliminada', 'success');
    }).catch(function(err){
      console.error(err);
      pushToast('Error al eliminar la sucursal: ' + err.message, 'error');
      throw err;
    });
  }

  // ---- Login: un único formulario. Probamos las credenciales primero contra el usuario/
  // contraseña "administrador" de cada sucursal (acceso total) y, si no matchea ninguno,
  // contra los empleados con acceso al sistema habilitado (rol "cajero", acceso restringido)
  // de cada sucursal. Si la sucursal que matchea tiene accesoTotal, se habilita el "modo dueño"
  // (esto solo aplica al login de administrador).
  function iniciarSesion(usuario, password){
    var u = (usuario||'').trim();
    if(!sucursales.length){
      setLoginError('No hay sucursales configuradas');
      return Promise.resolve(false);
    }
    function entrarComoAdmin(suc, d){
      NEGOCIO_ID = suc.id;
      try{ localStorage.setItem('pos_sucursal_activa', suc.id); }catch(e){}
      setSucursalActiva(suc.id);
      setModoDueno(!!d.accesoTotal);
      setRolActual('administrador');
      setNombreEmpleadoActual('');
      setSesionActiva(true);
      setLoginError('');
    }
    function entrarComoCajero(suc, emp){
      NEGOCIO_ID = suc.id;
      try{ localStorage.setItem('pos_sucursal_activa', suc.id); }catch(e){}
      setSucursalActiva(suc.id);
      setModoDueno(false);
      setRolActual('cajero');
      setNombreEmpleadoActual(emp.nombre||'');
      setSesionActiva(true);
      setLoginError('');
    }
    return sha256Hex(password||'').then(function(hash){
      function probarAdmin(i){
        if(i >= sucursales.length) return probarEmpleado(0);
        var suc = sucursales[i];
        return negocioRef(suc.id).get().then(function(snap){
          if(!snap.exists) return probarAdmin(i+1);
          var d = snap.data();
          if(d.authUsuario && d.authUsuario.toLowerCase()===u.toLowerCase() && d.authPasswordHash===hash){
            entrarComoAdmin(suc, d);
            return true;
          }
          return probarAdmin(i+1);
        });
      }
      function probarEmpleado(i){
        if(i >= sucursales.length){
          setLoginError('Usuario o contraseña incorrectos');
          return false;
        }
        var suc = sucursales[i];
        return db.collection('negocios').doc(suc.id).collection('empleados').get().then(function(snap){
          var match = null;
          snap.forEach(function(doc){
            var d = doc.data();
            if(match) return;
            if(d.accesoSistema && d.activo!==false && d.usuario && d.usuario.toLowerCase()===u.toLowerCase() && d.passwordHash===hash){
              match = Object.assign({ id: doc.id }, d);
            }
          });
          if(match){
            entrarComoCajero(suc, match);
            return true;
          }
          return probarEmpleado(i+1);
        }).catch(function(err){
          console.error('Error buscando empleados en '+suc.id, err);
          return probarEmpleado(i+1);
        });
      }
      return probarAdmin(0);
    });
  }

  function cerrarSesion(){
    setSesionActiva(false);
    setSucursalActiva(null);
    setModoDueno(false);
    setRolActual('administrador');
    setNombreEmpleadoActual('');
  }

  // Cambia la sucursal que se está viendo/operando, sin cerrar sesión.
  // Solo tiene sentido en modo dueño (accesoTotal), ya que no vuelve a pedir contraseña.
  function cambiarSucursalActiva(id){
    if(!modoDueno) return;
    NEGOCIO_ID = id;
    try{ localStorage.setItem('pos_sucursal_activa', id); }catch(e){}
    setSucursalActiva(id);
  }

  function cambiarCredenciales(passwordActual, nuevoUsuario, nuevaPassword){
    var u = (nuevoUsuario||'').trim();
    return sha256Hex(passwordActual||'').then(function(hashActual){
      if(hashActual !== authHashGuardado){
        throw new Error('La contraseña actual no es correcta');
      }
      if(!u) throw new Error('El usuario no puede estar vacío');
      if(!nuevaPassword || nuevaPassword.length < 4) throw new Error('La nueva contraseña debe tener al menos 4 caracteres');
      return sha256Hex(nuevaPassword);
    }).then(function(nuevoHash){
      return negocioRef(NEGOCIO_ID).set({ authUsuario: u, authPasswordHash: nuevoHash }, { merge:true });
    }).then(function(){
      pushToast('Usuario y contraseña actualizados', 'success');
    });
  }

  // Trae, con lecturas puntuales (no en tiempo real), las ventas de TODAS las sucursales
  // para armar la vista comparativa del dueño.
  function obtenerResumenComparativo(){
    return Promise.all(sucursales.map(function(suc){
      return db.collection('negocios').doc(suc.id).collection('ventas').get().then(function(snap){
        return { id: suc.id, nombre: suc.nombre, ventas: snapToArray(snap) };
      }).catch(function(err){
        console.error('Error leyendo ventas de '+suc.id, err);
        return { id: suc.id, nombre: suc.nombre, ventas: [] };
      });
    }));
  }

  function resetearTodo(){
    var colecciones = ['ventas', 'movimientosCC', 'clientes', 'productos', 'categorias', 'contadores', 'cajas', 'proveedores', 'empleados', 'facturasCompra', 'pagosProveedor', 'pedidos', 'historialProductos', 'historialPedidos', 'notas', 'recordatorios'];
    pushToast('Borrando datos, aguardá...', 'info');

    // Bloqueamos la siembra automática ANTES de borrar nada (local e inmediato, más la
    // marca remota) — si el orden fuera al revés, hay una ventana de tiempo en la que la
    // base ya quedó vacía pero la marca todavía no existe, y en ese instante el efecto de
    // siembra inicial vuelve a insertar los productos de ejemplo solo.
    setSeeded(true);
    setSeedCompletado(true);

    function borrarColeccion(nombre){
      return negRef(nombre).get().then(function(snap){
        if(snap.empty) return Promise.resolve();
        var batch = db.batch();
        snap.docs.forEach(function(doc){ batch.delete(doc.ref); });
        return batch.commit().then(function(){
          // Si quedan más (Firestore borra de a 500), recursivo
          if(snap.size >= 500) return borrarColeccion(nombre);
        });
      });
    }

    // También limpiar la config del negocio (se mantiene el usuario/contraseña de acceso).
    // seedCompletado:true evita que, al quedar la base vacía, se vuelvan a cargar solos
    // los productos y clientes de ejemplo — el reseteo queda realmente vacío.
    return negocioRef(sucursalActiva).set({ seedCompletado:true }, { merge:true })
      .then(function(){ return Promise.all(colecciones.map(borrarColeccion)); })
      .then(function(){
        return negocioRef(sucursalActiva).set({ nombreNegocio: 'MI COMERCIO', telefonoNegocio: '', seedCompletado:true }, { merge: true });
      })
      .then(function(){
        setSeedCompletado(true);
        setSeeded(true);
        pushToast('¡Sistema reseteado! Todos los datos fueron eliminados.', 'success');
      })
      .catch(function(err){
        console.error(err);
        pushToast('Error al resetear: ' + err.message, 'error');
      });
  }

  var value = {
    categorias: categorias, productos: productos, clientes: clientes, ventas: ventas,
    movimientosCC: movimientosCC, historialProductos: historialProductos, toasts: toasts, pushToast: pushToast,
    addProducto: addProducto, updateProducto: updateProducto, updateProductosMasivo: updateProductosMasivo, deleteProducto: deleteProducto, restoreProducto: restoreProducto, revertirHistorialProducto: revertirHistorialProducto,
    addCategoria: addCategoria, updateCategoria: updateCategoria, deleteCategoria: deleteCategoria,
    addCliente: addCliente, addClientesMasivo: addClientesMasivo, updateCliente: updateCliente, deleteCliente: deleteCliente, registrarPagoCC: registrarPagoCC,
    gruposClientes: gruposClientes, addGrupoCliente: addGrupoCliente, updateGrupoCliente: updateGrupoCliente, deleteGrupoCliente: deleteGrupoCliente,
    confirmarVenta: confirmarVenta, registrarDevolucionVenta: registrarDevolucionVenta, configNegocio: configNegocio, guardarConfigNegocio: guardarConfigNegocio,
    resetearTodo: resetearTodo,
    cajas: cajas, cajaActual: cajaActual, cajasAbiertas: cajasAbiertas, setCajaSeleccionadaId: setCajaSeleccionadaId, abrirCaja: abrirCaja, cerrarCaja: cerrarCaja,
    proveedores: proveedores, addProveedor: addProveedor, updateProveedor: updateProveedor, deleteProveedor: deleteProveedor,
    empleados: empleados, addEmpleado: addEmpleado, updateEmpleado: updateEmpleado, deleteEmpleado: deleteEmpleado,
    facturasCompra: facturasCompra, registrarFacturaCompra: registrarFacturaCompra,
    pagosProveedor: pagosProveedor, addPagoProveedor: addPagoProveedor, deletePagoProveedor: deletePagoProveedor,
    notas: notas, addNota: addNota, updateNota: updateNota, deleteNota: deleteNota,
    pedidos: pedidos, addPedido: addPedido, updatePedido: updatePedido, deletePedido: deletePedido, cambiarEstadoPedido: cambiarEstadoPedido, registrarPagoPedido: registrarPagoPedido,
    historialPedidos: historialPedidos, revertirHistorialPedido: revertirHistorialPedido,
    recordatorios: recordatorios, addRecordatorio: addRecordatorio, updateRecordatorio: updateRecordatorio, deleteRecordatorio: deleteRecordatorio,
    combos: combos, addCombo: addCombo, updateCombo: updateCombo, deleteCombo: deleteCombo,
    banners: banners, addBanner: addBanner, updateBanner: updateBanner, deleteBanner: deleteBanner,
    reservasWeb: reservasWeb, cobrarReservaWeb: cobrarReservaWeb, cancelarReservaWeb: cancelarReservaWeb,
    loadingData: loadingData, authReady: authReady, authError: authError,
    authUsuarioGuardado: authUsuarioGuardado, sesionActiva: sesionActiva, loginError: loginError,
    crearCredenciales: crearCredenciales, iniciarSesion: iniciarSesion, cerrarSesion: cerrarSesion, cambiarCredenciales: cambiarCredenciales,
    rolActual: rolActual, nombreEmpleadoActual: nombreEmpleadoActual,
    sucursales: sucursales, sucursalesCargado: sucursalesCargado, sucursalActiva: sucursalActiva,
    nombreSucursalActiva: nombreSucursalActiva, modoDueno: modoDueno,
    cambiarSucursalActiva: cambiarSucursalActiva, crearSucursalNueva: crearSucursalNueva,
    eliminarSucursal: eliminarSucursal,
    obtenerResumenComparativo: obtenerResumenComparativo
  };
  return h(AppCtx.Provider, { value: value }, children);
}

function Toasts(){
  var toasts = useApp().toasts;
  return h('div', { style:{ position:'fixed', bottom:20, right:20, zIndex:9999, display:'flex', flexDirection:'column', gap:8, maxWidth:340 } },
    toasts.map(function(t){
      var bg = t.type==='success' ? 'var(--green-dark)' : t.type==='error' ? 'var(--red)' : 'var(--ink)';
      return h('div', { key:t.id, style:{ animation:'slideIn 0.25s ease-out', background:bg, color:'white', padding:'12px 16px', borderRadius:8, fontSize:14, fontWeight:500, boxShadow:'0 8px 24px rgba(0,0,0,0.18)', display:'flex', alignItems:'center', gap:10 } },
        t.type==='success' ? Icon('check',18) : null,

        h('span', null, t.msg)

    })
  );
}

// Botón compacto que abre el escáner. Se usa junto a cualquier campo de código de barras.
function ScanButton(props){
  return h('button', {
    type:'button',
    onClick: props.onClick,
    title: 'Escanear con la cámara',
    style:{ width:40, height:40, flexShrink:0, borderRadius:8, border:'1px solid var(--border)', background:'var(--panel-2)', color:'var(--ink)', display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer' }
  }, Icon('camera',17));

function BarcodeScannerModal(props){
  // props: open, onClose, onDetected(codigo), title, continuous
  var elIdS = useState(function(){ return 'barcode-scanner-'+uid('bs'); }); var elId = elIdS[0];
  var qrRef = useRef(null);
  var runningRef = useRef(false);
  var errorS = useState(''); var error = errorS[0]; var setError = errorS[1];
  var lastCodeRef = useRef(''); var lastTimeRef = useRef(0);
  var onDetectedRef = useRef(props.onDetected);
  useEffect(function(){ onDetectedRef.current = props.onDetected; });

  useEffect(function(){
    if(!props.open) return;
    if(typeof Html5Qrcode === 'undefined'){
      setError('No se pudo cargar el módulo de cámara. Revisá tu conexión a internet e intentá de nuevo.');
      return;
    }
    setError('');
    var cancelado = false;
    var instance = new Html5Qrcode(elId, {
      formatsToSupport: [
        Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8,
        Html5QrcodeSupportedFormats.UPC_A, Html5QrcodeSupportedFormats.UPC_E,
        Html5QrcodeSupportedFormats.CODE_128, Html5QrcodeSupportedFormats.CODE_39,
        Html5QrcodeSupportedFormats.CODABAR, Html5QrcodeSupportedFormats.ITF,
        Html5QrcodeSupportedFormats.QR_CODE
      ],
      verbose:false
    });
    qrRef.current = instance;
    instance.start(
      { facingMode:'environment' },
      { fps:10, qrbox:function(vw,vh){ var size=Math.floor(Math.min(vw,vh)*0.7); return { width:size, height:size }; } },
      function onScanSuccess(decodedText){
        if(cancelado) return;
        var now = Date.now();
        if(decodedText===lastCodeRef.current && (now-lastTimeRef.current)<1500) return; // evita disparar 2 veces el mismo código
        lastCodeRef.current = decodedText; lastTimeRef.current = now;
        onDetectedRef.current && onDetectedRef.current(decodedText);
      },
      function onScanFailure(){ /* se llama todo el tiempo mientras no encuentra nada — se ignora */ }
    ).then(function(){ runningRef.current = true; }).catch(function(){
      if(!cancelado) setError('No se pudo acceder a la cámara. Revisá los permisos del navegador para este sitio.');
    });

    return function(){
      cancelado = true;
      if(qrRef.current && runningRef.current){
        runningRef.current = false;
        qrRef.current.stop().then(function(){ return qrRef.current.clear(); }).catch(function(){});
      }
    };
  }, [props.open]);

  if(!props.open) return null;
  return h(Modal, { open:props.open, onClose:props.onClose, title: props.title || 'Escanear código de barras', width:420 },
    error ? h('div', { style:{ background:'var(--red-bg)', color:'var(--red)', borderRadius:8, padding:'10px 12px', fontSize:12.5, marginBottom:12 } }, error) : null,

function Button(props){
  var variant = props.variant || 'primary';
  var size = props.size || 'md';
  var base = { display:'inline-flex', alignItems:'center', justifyContent:'center', gap:8, fontWeight:700, border:'1px solid transparent', borderRadius:9, transition:'transform 0.05s ease, opacity 0.15s ease, background 0.15s ease', width: props.full?'100%':'auto' };
  var sizes = { sm:{ padding:'7px 12px', fontSize:13 }, md:{ padding:'10px 16px', fontSize:14 }, lg:{ padding:'13px 20px', fontSize:15 } };
  var variants = {
    primary:{ background:'var(--primary)', color:'white' },
    dark:{ background:'var(--ink)', color:'white' },
    ghost:{ background:'transparent', color:'var(--ink)', borderColor:'var(--border)' },
    subtle:{ background:'var(--panel-2)', color:'var(--ink)' },
    danger:{ background:'var(--red)', color:'white' },
    outlineGreen:{ background:'var(--green-bg)', color:'var(--green-dark)' }
  };
  var style = {};
  for(var k in base) style[k]=base[k];
  for(var k2 in sizes[size]) style[k2]=sizes[size][k2];
  for(var k3 in variants[variant]) style[k3]=variants[variant][k3];
  if(props.style) for(var k4 in props.style) style[k4]=props.style[k4];
  style.opacity = props.disabled ? 0.5 : 1;
  style.cursor = props.disabled ? 'not-allowed' : 'pointer';

  var rest = {};
  for(var k5 in props){ if(['children','variant','size','icon','full','style'].indexOf(k5)===-1) rest[k5]=props[k5]; }
  rest.style = style;
  rest.onMouseDown = function(e){ if(!props.disabled) e.currentTarget.style.transform='scale(0.98)'; };
  rest.onMouseUp = function(e){ e.currentTarget.style.transform='scale(1)'; };
  rest.onMouseLeave = function(e){ e.currentTarget.style.transform='scale(1)'; };

  return h('button', rest, props.icon || null, props.children);
}

/* Tooltip emergente: envuelve un texto/label y muestra una explicación al pasar
   el mouse (o al tocar, en pantallas táctiles) en vez de mostrar el texto siempre
   visible en gris debajo del campo. */
function Tooltip(props){
  var openS = useState(false); var open = openS[0]; var setOpen = openS[1];
  var place = props.place || 'top';
  if(!props.text) return props.children;
  return h('span', {
      style:{ position:'relative', display:'inline-flex', alignItems:'center', gap:5, cursor:'help' },
      onMouseEnter:function(){ setOpen(true); },
      onMouseLeave:function(){ setOpen(false); },
      onClick:function(e){ e.stopPropagation(); setOpen(function(s){ return !s; }); }
    },
    h('span', { style:{ textDecoration:'underline dotted', textUnderlineOffset:3, textDecorationColor:'var(--ink-faint)' } }, props.children),
    h('span', {
      style:{
        display:'inline-flex', alignItems:'center', justifyContent:'center',
        width:13, height:13, borderRadius:999, background:'var(--ink-faint)', color:'#fff',
        fontSize:9.5, fontWeight:800, fontStyle:'italic', flexShrink:0, lineHeight:1
      }
    }, 'i'),
    open ? h('div', {
        style:{
          position:'absolute', left:0, zIndex:50,
          top: place==='top' ? 'auto' : 'calc(100% + 8px)',
          bottom: place==='top' ? 'calc(100% + 8px)' : 'auto',
          width:'max-content', maxWidth:260,
          background:'var(--ink)', color:'#fff', fontSize:12, fontWeight:500,
          lineHeight:1.45, padding:'8px 10px', borderRadius:8,

}

   LIGHTBOX DE IMÁGENES (ampliar foto de producto al tocarla)
============================================================ */
var ImageLightboxStore = (function(){
  var listeners = [];
  return {
    subscribe: function(fn){
      listeners.push(fn);
      return function(){ listeners = listeners.filter(function(l){ return l!==fn; }); };
    },
    open: function(src, alt){
      var payload = { src:src, alt:alt||'' };
      listeners.forEach(function(fn){ fn(payload); });
    },
    close: function(){
      listeners.forEach(function(fn){ fn(null); });
    }
  };
})();

function ImageLightbox(){
  var s = useState(null); var img = s[0]; var setImg = s[1];
  useEffect(function(){
    return ImageLightboxStore.subscribe(setImg);
  }, []);
  useEffect(function(){
    if(!img) return;
    function onKey(e){ if(e.key==='Escape') ImageLightboxStore.close(); }
    window.addEventListener('keydown', onKey);
    return function(){ window.removeEventListener('keydown', onKey); };
  }, [img]);
  if(!img) return null;
  return h('div', {
    onMouseDown: function(e){ if(e.target===e.currentTarget) ImageLightboxStore.close(); },
    style:{ position:'fixed', inset:0, background:'rgba(20,17,14,0.82)', zIndex:2000, display:'flex', alignItems:'center', justifyContent:'center', padding:24, animation:'fadeIn 0.15s ease-out', cursor:'zoom-out' }
  },
    h('img', { src:img.src, alt:img.alt, style:{ maxWidth:'92vw', maxHeight:'88vh', objectFit:'contain', borderRadius:12, boxShadow:'0 24px 64px rgba(0,0,0,0.45)', animation:'popIn 0.18s ease-out' } }),
    h('button', {
      onClick: function(){ ImageLightboxStore.close(); },
      'aria-label':'Cerrar',
      style:{ position:'fixed', top:18, right:18, background:'rgba(255,255,255,0.14)', border:'none', borderRadius:10, width:38, height:38, display:'flex', alignItems:'center', justifyContent:'center', color:'#fff', cursor:'pointer' }
    }, Icon('x',18))
  );
}

// Ítems de navegación a los que tiene acceso el rol "cajero" (acceso restringido, definido
// por el cliente): Caja, Pedidos y Calendario (las Notas ahora viven dentro de Calendario,
// como una pestaña). El rol "administrador" ve todo.
var NAV_ITEMS_CAJERO = ['caja', 'pedidos', 'calendario'];
// Arma la lista de navegación agregando "Comparativa" solo para el dueño y solo si
// existe más de una sucursal (no tiene sentido comparar con una sola), y filtrando
// a los ítems permitidos si el rol actual es "cajero".
function buildNavItems(modoDueno, multiSucursal, rol){
  var items = (!modoDueno || !multiSucursal) ? NAV_ITEMS.slice() : (function(){
    var arr = NAV_ITEMS.slice();
    arr.splice(1, 0, { id:'comparativa', label:'Comparativa', icon:'chart' });
    return arr;
  })();
  if(rol==='cajero') items = items.filter(function(it){ return NAV_ITEMS_CAJERO.indexOf(it.id)>=0; });
  return items;
}

function useAlertCounts(){
  var productos = useApp().productos;
  return useMemo(function(){
    var bajoStock = 0, vencProx = 0, vencido = 0;
    productos.filter(function(p){ return p.activo; }).forEach(function(p){
      if(p.stock <= p.stockMin) bajoStock++;
      if(p.vencimiento){
        var d = daysUntil(p.vencimiento);
        if(d < 0) vencido++;
        else if(d <= umbralAlertaVenc(p)) vencProx++;
      }
    });
    return { bajoStock:bajoStock, vencProx:vencProx, vencido:vencido, total: bajoStock+vencProx+vencido };
  }, [productos]);
}

function TopBar(props){
  var app = useApp();
  var online = useOnlineStatus();
  var titles = { dashboard:'Inicio', caja:'Caja / Punto de venta', stock:'Control de stock', compras:'Compras y proveedores', clientes:'Clientes', pedidos:'Pedidos', codigos:'Códigos de barra', historial:'Historial', tiendaweb:'Tienda web', ajustes:'Ajustes del negocio', comparativa:'Comparativa entre sucursales' };
  return h('header', { className:'topbar', style:{ display:'flex', alignItems:'center', gap:12, padding:'14px 16px', borderBottom:'1px solid var(--border)', background:'var(--panel)', position:'sticky', top:0, zIndex:30 } },
    h('button', { onClick: function(){ props.setMobileOpen(true); }, style:{ background:'var(--panel-2)', border:'none', borderRadius:8, width:36, height:36, display:'flex', alignItems:'center', justifyContent:'center' } }, Icon('menu',18)),
    h('span', { className:'display', style:{ fontSize:15 } }, titles[props.page]),
    !online ? h('span', { title:'Sin conexión a internet — los cambios se guardan localmente y se sincronizan solos al reconectar', style:{ marginLeft:'auto', display:'flex', alignItems:'center', gap:6, background:'var(--amber-bg)', color:'var(--amber)', borderRadius:999, padding:'5px 12px', fontSize:12, fontWeight:700 } }, Icon('alert',13), 'Sin conexión') : null,
    app.rolActual==='cajero' ? h('span', { style:{ marginLeft: online?'auto':0, display:'flex', alignItems:'center', gap:6, background:'var(--blue-bg)', color:'var(--blue)', borderRadius:999, padding:'5px 12px', fontSize:12, fontWeight:700 } }, Icon('users',13), app.nombreEmpleadoActual || 'Cajero/a') : null,
    app.nombreSucursalActiva ? h('span', { style:{ marginLeft: (online && app.rolActual!=='cajero') ? 'auto' : 0, display:'flex', alignItems:'center', gap:6, background:'var(--panel-2)', borderRadius:999, padding:'5px 12px', fontSize:12, fontWeight:700, color:'var(--ink-soft)' } }, Icon('store',13), app.nombreSucursalActiva) : null
  );
}

   MÓDULO: DASHBOARD
============================================================ */
function Dashboard(props){
  var app = useApp();
  var productos = app.productos, ventas = app.ventas, categorias = app.categorias, notas = app.notas, addNota = app.addNota;
  var activos = productos.filter(function(p){ return p.activo; });
  var hoy = todayISO();
  var ventasHoy = ventas.filter(function(v){ return v.fecha.slice(0,10)===hoy; });
  var totalHoy = ventasHoy.reduce(function(s,v){ return s+v.total; }, 0);

  var bajoStock = activos.filter(function(p){ return p.stock<=p.stockMin; }).sort(function(a,b){ return a.stock-b.stock; });
  var porVencer = activos.filter(function(p){ return estaPorVencer(p); }).sort(function(a,b){ return daysUntil(a.vencimiento)-daysUntil(b.vencimiento); });

  var catById = {};
  categorias.forEach(function(c){ catById[c.id]=c; });
  var prodById = {};
  productos.forEach(function(p){ prodById[p.id]=p; });

  var last7 = useMemo(function(){
    var days = [];
    for(var i=6;i>=0;i--){
      var d = new Date(); d.setDate(d.getDate()-i);
      var iso = d.toISOString().slice(0,10);
      var total = ventas.filter(function(v){ return v.fecha.slice(0,10)===iso; }).reduce(function(s,v){ return s+v.total; }, 0);
      days.push({ iso:iso, label: d.toLocaleDateString('es-AR',{weekday:'short'}).replace('.',''), total:total });
    }
    return days;
  }, [ventas]);
  var maxDay = Math.max.apply(null, last7.map(function(d){return d.total;}).concat([1]));

  // Ranking de productos por cantidad vendida y por facturación, en base a todas las ventas registradas.
  var rankingProductos = useMemo(function(){
    var map = {};
    ventas.forEach(function(v){
      (v.items||[]).forEach(function(it){
        if(!it.productoId) return;
        if(!map[it.productoId]) map[it.productoId] = { productoId: it.productoId, nombre: it.nombre, unidad: it.unidad, cantidad:0, monto:0 };
        map[it.productoId].cantidad += Number(it.cantidad)||0;
        map[it.productoId].monto += Number(it.subtotal)||0;
      });
    });
    var arr = Object.keys(map).map(function(k){ return map[k]; });
    var masVendidos = arr.slice().sort(function(a,b){ return b.cantidad-a.cantidad; }).slice(0,5);
    var menosVendidos = arr.slice().sort(function(a,b){ return a.cantidad-b.cantidad; }).slice(0,5);
    return { masVendidos: masVendidos, menosVendidos: menosVendidos, hayDatos: arr.length>0 };
  }, [ventas]);

  // Movimiento de ventas por franja horaria (agrupando todas las ventas por la hora del día en que se hicieron).
  var rangoHorario = useMemo(function(){
    var buckets = {};
    ventas.forEach(function(v){
      var d = new Date(v.fecha);
      if(isNaN(d.getTime())) return;
      var hr = d.getHours();
      if(!buckets[hr]) buckets[hr] = { hora:hr, cantVentas:0, monto:0, productos:0, itemsDetalle:[] };
      buckets[hr].cantVentas += 1;
      buckets[hr].monto += Number(v.total)||0;
      buckets[hr].productos += (v.items||[]).reduce(function(s,it){ return s+(Number(it.cantidad)||0); }, 0);
      (v.items||[]).forEach(function(it){
        buckets[hr].itemsDetalle.push({ productoId:it.productoId, nombre:it.nombre, precioUnit:Number(it.precioUnit)||0, cantidad:Number(it.cantidad)||0 });
      });
    });
    var arr = Object.keys(buckets).map(function(k){
      var b = buckets[k];
      var porProducto = {};
      b.itemsDetalle.forEach(function(it){
        var key = it.productoId || it.nombre;
        if(!porProducto[key] || it.precioUnit>porProducto[key].precioUnit) porProducto[key] = it;
      });
      b.mayoresPrecios = Object.keys(porProducto).map(function(k2){ return porProducto[k2]; }).sort(function(a,b2){ return b2.precioUnit-a.precioUnit; }).slice(0,5);
      return b;
    });
    arr.sort(function(a,b){ return b.monto-a.monto; });
    return arr;
  }, [ventas]);
  var maxHora = Math.max.apply(null, rangoHorario.map(function(r){return r.monto;}).concat([1]));
  function lblHora(h){ var hh = h<10?('0'+h):(''+h); var hh2 = (h+1)%24; hh2 = hh2<10?('0'+hh2):(''+hh2); return hh+':00 - '+hh2+':00'; }

  var horaSeleccionadaS = useState(null); var horaSeleccionada = horaSeleccionadaS[0]; var setHoraSeleccionada = horaSeleccionadaS[1];
  var notaTextoS = useState(''); var notaTexto = notaTextoS[0]; var setNotaTexto = notaTextoS[1];
  function handleAddNotaRapida(){
    var v = notaTexto.trim();
    if(!v) return;
    Promise.resolve(addNota({ texto:v })).then(function(){ setNotaTexto(''); });
  }

  return h('div', { style:{ animation:'fadeIn 0.2s ease-out' } },
    h('div', { style:{ marginBottom:22 } },
      h('h1', { className:'display', style:{ fontSize:24, margin:'0 0 4px' } }, 'Buen día 👋'),
      h('p', { style:{ margin:0, color:'var(--ink-soft)', fontSize:14 } }, new Date().toLocaleDateString('es-AR',{ weekday:'long', day:'numeric', month:'long', year:'numeric' }))
    ),
    h('div', { className:'grid-2', style:{ display:'grid', gridTemplateColumns:'1fr 300px', gap:16, marginBottom:22, alignItems:'start' } },
      h('div', { style:{ background:'var(--panel)', border:'1px solid var(--border)', borderRadius:12, padding:18, boxShadow:'var(--shadow)' } },
        h('div', { style:{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:14 } },
          h('span', { className:'display', style:{ fontSize:14, display:'flex', alignItems:'center', gap:8 } }, Icon('note',15,'var(--primary)'), ' NOTAS'),
          h(Button, { size:'sm', variant:'ghost', onClick:function(){ props.setPage('notas'); } }, 'Ver todas ', Icon('arrowright',14))
        ),
        h('div', { style:{ display:'flex', gap:8, marginBottom:14, flexWrap:'wrap' } },
          h('div', { style:{ flex:'1 1 240px' } },
            h(TextInput, { value:notaTexto, onChange:function(e){ setNotaTexto(e.target.value); }, placeholder:'Escribí una nota rápida...', onKeyDown:function(e){ if(e.key==='Enter'){ e.preventDefault(); handleAddNotaRapida(); } } })
          ),
          h(Button, { variant:'primary', icon:Icon('plus',15), onClick:handleAddNotaRapida, disabled: !notaTexto.trim() }, 'Agregar')
        ),
        notas.length===0 ? h('div', { style:{ fontSize:13, color:'var(--ink-faint)', padding:'8px 0' } }, 'Todavía no hay notas. Agregá la primera.') :
        h('div', { style:{ display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(160px, 1fr))', gap:10 } },
          notas.slice(0,6).map(function(n){
            var tone = NOTE_TONES[n.color] || NOTE_TONES.amarillo;
            return h('div', { key:n.id, style:{ background:tone.bg, border:'1px solid '+tone.border, borderRadius:10, padding:'10px 12px', minHeight:84, display:'flex', flexDirection:'column', justifyContent:'space-between' } },
              h('div', { style:{ fontSize:12.5, lineHeight:1.4, color:'var(--ink)', overflow:'hidden', display:'-webkit-box', WebkitLineClamp:4, WebkitBoxOrient:'vertical' } }, n.texto),

function fileToDataUrl(file){
  return new Promise(function(resolve, reject){

// Input de texto/número/fecha para editar un valor "in place" en una celda de tabla:
// mantiene el valor en un estado local mientras se escribe y recién dispara onCommit
// al perder el foco o presionar Enter (Escape descarta el cambio). Si onCommit devuelve
// false (valor inválido), la celda vuelve a mostrar el valor original.
function EditableCell(props){
  var valS = useState(props.value==null?'':props.value); var val = valS[0]; var setVal = valS[1];
  useEffect(function(){ setVal(props.value==null?'':props.value); }, [props.value]);
  function commit(){
    var actual = props.value==null?'':props.value;
    if(String(val)===String(actual)) return;
    var ok = props.onCommit(val);
    if(ok===false) setVal(actual);
  }
  var style = { }; for(var k in (props.style||{})) style[k]=props.style[k];
  return h('input', {
    type: props.type||'text',
    step: props.step, min: props.min,
    className: 'cell-edit'+(props.className?(' '+props.className):''),
    value: val,
    placeholder: props.placeholder,
    onChange: function(e){ setVal(e.target.value); },
    onBlur: commit,
    onKeyDown: function(e){
      e.stopPropagation();
      if(e.key==='Enter'){ e.currentTarget.blur(); }
      else if(e.key==='Escape'){ setVal(props.value==null?'':props.value); e.currentTarget.blur(); }
    },
    onClick: function(e){ e.stopPropagation(); },
    style: style
  });
}
// Select para editar un campo de referencia (ej. categoría) directamente desde la fila de la tabla.
function EditableSelectCell(props){
  var style = { }; for(var k in (props.style||{})) style[k]=props.style[k];
  return h('select', {
    className: 'cell-edit cell-edit-select'+(props.className?(' '+props.className):''),
    value: props.value||'',
    onChange: function(e){ props.onCommit(e.target.value); },
    onClick: function(e){ e.stopPropagation(); },
    style: style
  }, props.children);
}

// Modal de cambio masivo: elegís un proveedor, ves sus productos, tildás cuáles incluir
// (por defecto todos) y elegís un campo (Categoría / Marca / Proveedor) con el valor nuevo
// a aplicar a todos los seleccionados de una sola vez.
function CambioMasivoModal(props){
  var productos = props.productos || [];
  var categorias = props.categorias || [];
  var proveedores = props.proveedores || [];
  var proveedorIdS = useState(''); var proveedorId = proveedorIdS[0]; var setProveedorId = proveedorIdS[1];
  var seleccionadosS = useState({}); var seleccionados = seleccionadosS[0]; var setSeleccionados = seleccionadosS[1];
  var campoS = useState('categoria'); var campo = campoS[0]; var setCampo = campoS[1];
  var nuevaCategoriaS = useState(''); var nuevaCategoria = nuevaCategoriaS[0]; var setNuevaCategoria = nuevaCategoriaS[1];
  var nuevaMarcaS = useState(''); var nuevaMarca = nuevaMarcaS[0]; var setNuevaMarca = nuevaMarcaS[1];
  var nuevoProveedorS = useState(''); var nuevoProveedor = nuevoProveedorS[0]; var setNuevoProveedor = nuevoProveedorS[1];
  var nuevoStockS = useState(''); var nuevoStock = nuevoStockS[0]; var setNuevoStock = nuevoStockS[1];
  var nuevoCostoS = useState(''); var nuevoCosto = nuevoCostoS[0]; var setNuevoCosto = nuevoCostoS[1];
  var nuevaImagenS = useState(null); var nuevaImagen = nuevaImagenS[0]; var setNuevaImagen = nuevaImagenS[1];
  var imagenFileRef = useRef(null);
  var aplicandoS = useState(false); var aplicando = aplicandoS[0]; var setAplicando = aplicandoS[1];
  var errorS = useState(''); var error = errorS[0]; var setError = errorS[1];

  function handleNuevaImagen(e){
    var file = e.target.files && e.target.files[0];
    if(!file) return;
    fileToDataUrl(file).then(function(dataUrl){ setNuevaImagen(dataUrl); });
  }

  var candidatos = useMemo(function(){
    if(!proveedorId) return [];
    return productos.filter(function(p){ return p.activo && p.proveedorId===proveedorId; }).sort(function(a,b){ return a.nombre.localeCompare(b.nombre); });
  }, [productos, proveedorId]);

  // Al elegir (o cambiar) el proveedor, arranca con TODOS sus productos tildados —
  // el usuario destilda los que no quiere incluir en el cambio.
  useEffect(function(){
    var nuevo = {};
    productos.filter(function(p){ return p.activo && p.proveedorId===proveedorId; }).forEach(function(p){ nuevo[p.id] = true; });
    setSeleccionados(nuevo);
  }, [proveedorId]);

  function toggleUno(id){
    setSeleccionados(function(prev){ var c={}; for(var k in prev) c[k]=prev[k]; c[id] = !c[id]; return c; });
  }
  function toggleTodos(){
    var hayAlguno = candidatos.some(function(p){ return seleccionados[p.id]; });
    var nuevo = {};
    candidatos.forEach(function(p){ nuevo[p.id] = !hayAlguno; });
    setSeleccionados(nuevo);
  }

  var idsSeleccionados = candidatos.filter(function(p){ return seleccionados[p.id]; }).map(function(p){ return p.id; });
  var todosSeleccionados = candidatos.length>0 && candidatos.every(function(p){ return seleccionados[p.id]; });

  function handleAplicar(){
    setError('');
    if(idsSeleccionados.length===0){ setError('Seleccioná al menos un producto'); return; }
    var data = {}, etiqueta = '';
    if(campo==='categoria'){
      if(!nuevaCategoria){ setError('Elegí la categoría nueva'); return; }
      data.categoriaId = nuevaCategoria;
      etiqueta = 'Cambio masivo — Categoría';
    } else if(campo==='marca'){
      data.marca = nuevaMarca.trim();
      etiqueta = 'Cambio masivo — Marca';
    } else if(campo==='proveedor'){
      if(!nuevoProveedor){ setError('Elegí el proveedor nuevo'); return; }
      data.proveedorId = nuevoProveedor;
      etiqueta = 'Cambio masivo — Proveedor';
    } else if(campo==='stock'){
      if(nuevoStock===''){ setError('Ingresá el stock nuevo'); return; }
      data.stock = Number(nuevoStock)||0;
      etiqueta = 'Cambio masivo — Stock';
    } else if(campo==='costo'){
      if(nuevoCosto===''){ setError('Ingresá el precio costo nuevo'); return; }
      data.costo = Number(nuevoCosto)||0;
      // El margen de cada producto puede ser distinto, así que el precio de venta
      // se recalcula por producto preservando SU margen actual (igual que al actualizar
      // el costo desde una factura de compra o desde la edición individual).
      data._recalcularVentaDesdeCosto = true;
      etiqueta = 'Cambio masivo — Precio costo';
    } else if(campo==='imagen'){
      if(!nuevaImagen){ setError('Elegí una imagen'); return; }
      data.imagen = nuevaImagen;
      etiqueta = 'Cambio masivo — Imagen';
    }
    setAplicando(true);
    Promise.resolve(props.onAplicar(idsSeleccionados, data, etiqueta)).then(function(){
      setAplicando(false);
      props.onClose();
    }).catch(function(err){
      setAplicando(false);
      setError(err && err.message ? err.message : 'No se pudo aplicar el cambio');
    });
  }

  return h('div', null,
    h('div', { style:{ fontSize:13, color:'var(--ink-soft)', marginBottom:14 } }, 'Elegí un proveedor para ver sus productos, tildá cuáles incluir y el campo/valor nuevo a aplicar — se cambia todo junto, de una sola vez.'),
    error ? h('div', { style:{ background:'var(--red-bg)', color:'var(--red)', borderRadius:8, padding:'9px 12px', fontSize:12.5, marginBottom:14, fontWeight:600 } }, error) : null,
    h(Field, { label:'Proveedor', required:true },
      h(Select, { value:proveedorId, onChange:function(e){ setProveedorId(e.target.value); } },
        h('option', { value:'' }, '— Elegir proveedor —'),
        proveedores.map(function(pv){ return h('option', { key:pv.id, value:pv.id }, pv.nombre); })
      )
    ),
    !proveedorId ? null : (
      candidatos.length===0 ?
        h('div', { style:{ fontSize:13, color:'var(--ink-faint)', padding:'16px 0' } }, 'Este proveedor no tiene productos activos cargados.') :
        h(Fragment, null,
          h('div', { className:'grid-2', style:{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:14, marginBottom:4 } },
            h(Field, { label:'Campo a cambiar' },
              h(Select, { value:campo, onChange:function(e){ setCampo(e.target.value); } },
                h('option', { value:'categoria' }, 'Categoría'),
                h('option', { value:'marca' }, 'Marca'),
                h('option', { value:'proveedor' }, 'Proveedor'),
                h('option', { value:'stock' }, 'Stock'),
                h('option', { value:'costo' }, 'Precio costo'),
                h('option', { value:'imagen' }, 'Imagen')
              )
            ),
            campo==='categoria' ? h(Field, { label:'Categoría nueva', required:true },
              h(Select, { value:nuevaCategoria, onChange:function(e){ setNuevaCategoria(e.target.value); } },
                h('option', { value:'' }, '— Elegir categoría —'),
                categorias.map(function(c){ return h('option', { key:c.id, value:c.id }, c.nombre); })
              )
            ) : null,
            campo==='marca' ? h(Field, { label:'Marca nueva' }, h(TextInput, { value:nuevaMarca, onChange:function(e){ setNuevaMarca(e.target.value); }, placeholder:'Ej: Arcor' })) : null,
            campo==='proveedor' ? h(Field, { label:'Proveedor nuevo', required:true },
              h(Select, { value:nuevoProveedor, onChange:function(e){ setNuevoProveedor(e.target.value); } },
                h('option', { value:'' }, '— Elegir proveedor —'),
                proveedores.map(function(pv){ return h('option', { key:pv.id, value:pv.id }, pv.nombre); })
              )
            ) : null,
            campo==='stock' ? h(Field, { label:'Stock nuevo', required:true },
              h(TextInput, { type:'number', min:0, step:'any', value:nuevoStock, onChange:function(e){ setNuevoStock(e.target.value); }, placeholder:'Ej: 10' })
            ) : null,
            campo==='costo' ? h(Field, { label:'Precio costo nuevo', required:true },
              h(TextInput, { type:'number', min:0, step:'any', value:nuevoCosto, onChange:function(e){ setNuevoCosto(e.target.value); }, placeholder:'Ej: 1500' })
            ) : null,
            campo==='imagen' ? h(Field, { label:'Imagen nueva', required:true },
              h('div', { style:{ display:'flex', alignItems:'center', gap:10 } },
                nuevaImagen ? h('img', { src:nuevaImagen, style:{ width:44, height:44, borderRadius:8, objectFit:'cover', border:'1px solid var(--border)' } }) : null,
                h(Button, { type:'button', variant:'subtle', size:'sm', onClick:function(){ imagenFileRef.current && imagenFileRef.current.click(); } }, nuevaImagen ? 'Cambiar imagen' : 'Elegir imagen'),
                h('input', { ref:imagenFileRef, type:'file', accept:'image/*', onChange:handleNuevaImagen, style:{ display:'none' } })
              )
            ) : null
          ),
          campo==='costo' ? h('div', { style:{ fontSize:12, color:'var(--ink-faint)', margin:'-8px 0 10px' } }, 'El precio de venta de cada producto se recalcula automáticamente respetando su % de ganancia actual.') : null,
          campo==='imagen' ? h('div', { style:{ fontSize:12, color:'var(--ink-faint)', margin:'-8px 0 10px' } }, 'La misma imagen se aplicará a todos los productos seleccionados.') : null,
          h('div', { style:{ display:'flex', justifyContent:'space-between', alignItems:'center', margin:'10px 0 6px' } },
            h('span', { style:{ fontSize:12.5, fontWeight:700, color:'var(--ink-soft)' } }, idsSeleccionados.length+' de '+candidatos.length+' producto'+(candidatos.length!==1?'s':'')+' seleccionados'),
            h(Button, { type:'button', variant:'ghost', size:'sm', onClick:toggleTodos }, todosSeleccionados ? 'Deseleccionar todos' : 'Seleccionar todos')
          ),
          h('div', { style:{ border:'1px solid var(--border)', borderRadius:10, maxHeight:280, overflowY:'auto', marginBottom:16 } },
            candidatos.map(function(p, i){
              var cat = categorias.find(function(c){ return c.id===p.categoriaId; });
              return h('label', { key:p.id, style:{ display:'flex', alignItems:'center', gap:10, padding:'9px 12px', borderBottom: i<candidatos.length-1?'1px solid var(--border)':'none', cursor:'pointer' } },
                h('input', { type:'checkbox', checked: !!seleccionados[p.id], onChange:function(){ toggleUno(p.id); } }),
                h('div', { style:{ flex:1, minWidth:0 } },
                  h('div', { style:{ fontSize:13, fontWeight:600, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' } }, p.nombre),
                  h('div', { style:{ fontSize:11, color:'var(--ink-faint)' } }, (cat?cat.nombre:'Sin categoría')+(p.marca?' · '+p.marca:''))
                )
              );
            })
          ),
          h('div', { style:{ display:'flex', justifyContent:'flex-end', gap:10 } },
            h(Button, { type:'button', variant:'ghost', onClick:props.onClose }, 'Cancelar'),
            h(Button, { type:'button', variant:'primary', disabled:aplicando||idsSeleccionados.length===0, onClick:handleAplicar }, aplicando ? 'Aplicando...' : ('Aplicar a '+idsSeleccionados.length+' producto'+(idsSeleccionados.length!==1?'s':'')))
          )
        )
    )
  );
}
