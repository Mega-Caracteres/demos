<!-- MODO DEMO: sin conexión a Firebase real. Este bloque reemplaza al SDK de Firebase
     por un motor que simula Firestore/Auth 100% en memoria del navegador. Nada de lo que
     pase acá se guarda ni se comparte con la base de datos real del negocio: cada visita
     arranca de cero con datos de ejemplo, y se pierde todo al recargar la página. -->
<script id="mock-firebase-demo">
"use strict";
(function(){
  var STORE = Object.create(null);
  var listeners = [];
  var notifyScheduled = false;
  function scheduleNotify(){
    if(notifyScheduled) return;
    notifyScheduled = true;
    setTimeout(function(){
      notifyScheduled = false;
      listeners.slice().forEach(function(l){ try{ l(); }catch(e){ console.error(e); } });
    }, 0);
  }
  function genId(){ return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,9); }
  function clone(o){ return o===undefined ? undefined : JSON.parse(JSON.stringify(o)); }

  function DocRef(path){ this.path = path; this.id = path.split('/').pop(); }
  DocRef.prototype.collection = function(name){ return new CollectionRef(this.path + '/' + name); };
  function makeDocSnap(path){
    var data = STORE[path];
    return { exists: data !== undefined, id: path.split('/').pop(), data: function(){ return clone(data); } };
  }
  DocRef.prototype.get = function(){ return Promise.resolve(makeDocSnap(this.path)); };
  DocRef.prototype.set = function(data, opts){
    var cur = STORE[this.path];
    var merge = opts && opts.merge;
    STORE[this.path] = (merge && cur) ? Object.assign({}, cur, data) : Object.assign({}, data);
    scheduleNotify();
    return Promise.resolve();
  };
  DocRef.prototype.update = function(data){
    STORE[this.path] = Object.assign({}, STORE[this.path] || {}, data);
    scheduleNotify();
    return Promise.resolve();
  };
  DocRef.prototype.delete = function(){ delete STORE[this.path]; scheduleNotify(); return Promise.resolve(); };
  DocRef.prototype.onSnapshot = function(cb){
    var self = this;
    var fn = function(){ cb(makeDocSnap(self.path)); };
    listeners.push(fn);
    setTimeout(fn, 0);
    return function(){ var i = listeners.indexOf(fn); if(i>=0) listeners.splice(i,1); };
  };

  function CollectionRef(path){ this.path = path; this._orderBy = null; this._limit = null; }
  CollectionRef.prototype.doc = function(id){ return new DocRef(this.path + '/' + (id || genId())); };
  CollectionRef.prototype.add = function(data){ var ref = this.doc(); return ref.set(data).then(function(){ return ref; }); };
  CollectionRef.prototype.orderBy = function(field, dir){
    var q = new CollectionRef(this.path); q._orderBy = { field:field, dir:dir||'asc' }; q._limit = this._limit; return q;
  };
  CollectionRef.prototype.limit = function(n){
    var q = new CollectionRef(this.path); q._orderBy = this._orderBy; q._limit = n; return q;
  };
  CollectionRef.prototype._docs = function(){
    var prefix = this.path + '/';
    var out = [];
    Object.keys(STORE).forEach(function(p){
      if(p.indexOf(prefix) === 0 && p.slice(prefix.length).indexOf('/') === -1) out.push({ path:p, id:p.slice(prefix.length) });
    });
    if(this._orderBy){
      var f = this._orderBy.field, dir = this._orderBy.dir;
      out.sort(function(a,b){
        var av = STORE[a.path][f], bv = STORE[b.path][f];
        if(av===undefined && bv===undefined) return 0;
        if(av===undefined) return dir==='desc' ? 1 : -1;
        if(bv===undefined) return dir==='desc' ? -1 : 1;
        if(av<bv) return dir==='desc' ? 1 : -1;
        if(av>bv) return dir==='desc' ? -1 : 1;
        return 0;
      });
    }
    if(this._limit) out = out.slice(0, this._limit);
    return out;
  };
  function makeQuerySnap(docsMeta){
    return { docs: docsMeta.map(function(m){ return { id:m.id, data:function(){ return clone(STORE[m.path]); } }; }) };
  }
  CollectionRef.prototype.get = function(){ return Promise.resolve(makeQuerySnap(this._docs())); };
  CollectionRef.prototype.onSnapshot = function(cb){
    var self = this;
    var fn = function(){ cb(makeQuerySnap(self._docs())); };
    listeners.push(fn);
    setTimeout(fn, 0);
    return function(){ var i = listeners.indexOf(fn); if(i>=0) listeners.splice(i,1); };
  };

  function Batch(){ this.ops = []; }
  Batch.prototype.set = function(ref, data, opts){ this.ops.push({ type:'set', ref:ref, data:data, opts:opts }); return this; };
  Batch.prototype.update = function(ref, data){ this.ops.push({ type:'update', ref:ref, data:data }); return this; };
  Batch.prototype.delete = function(ref){ this.ops.push({ type:'delete', ref:ref }); return this; };
  Batch.prototype.commit = function(){
    this.ops.forEach(function(op){
      if(op.type==='set'){
        var cur = STORE[op.ref.path]; var merge = op.opts && op.opts.merge;
        STORE[op.ref.path] = (merge && cur) ? Object.assign({}, cur, op.data) : Object.assign({}, op.data);
      } else if(op.type==='update'){
        STORE[op.ref.path] = Object.assign({}, STORE[op.ref.path]||{}, op.data);
      } else if(op.type==='delete'){
        delete STORE[op.ref.path];
      }
    });
    scheduleNotify();
    return Promise.resolve();
  };

  function Transaction(){}
  Transaction.prototype.get = function(ref){ return Promise.resolve(makeDocSnap(ref.path)); };
  Transaction.prototype.set = function(ref, data, opts){
    var cur = STORE[ref.path]; var merge = opts && opts.merge;
    STORE[ref.path] = (merge && cur) ? Object.assign({}, cur, data) : Object.assign({}, data);
    return this;
  };
  Transaction.prototype.update = function(ref, data){ STORE[ref.path] = Object.assign({}, STORE[ref.path]||{}, data); return this; };
  Transaction.prototype.delete = function(ref){ delete STORE[ref.path]; return this; };

  function Firestore(){}
  Firestore.prototype.collection = function(name){ return new CollectionRef(name); };
  Firestore.prototype.batch = function(){ return new Batch(); };
  Firestore.prototype.runTransaction = function(fn){
    var t = new Transaction();
    return Promise.resolve().then(function(){ return fn(t); }).then(function(res){ scheduleNotify(); return res; });
  };
  var dbInstance = new Firestore();

  function Auth(){}
  Auth.prototype.onAuthStateChanged = function(cb){
    setTimeout(function(){ cb({ uid:'demo-visitante', isAnonymous:true }); }, 0);
    return function(){};
  };
  Auth.prototype.signInAnonymously = function(){ return Promise.resolve({ user:{ uid:'demo-visitante' } }); };
  var authInstance = new Auth();

  window.firebase = {
    initializeApp: function(){ /* modo demo: no se conecta a ningún proyecto real */ },
    firestore: function(){ return dbInstance; },
    auth: function(){ return authInstance; }
  };

  // Datos iniciales de la demo (ficticios, se recrean en cada carga de página)
  STORE['meta/sucursales'] = { lista: [ { id:'demo', nombre:'Cotillón Express (Demo)' } ] };
  STORE['negocios/demo'] = {
    nombreNegocio: 'Cotillón Express (Demo)',
    telefonoNegocio: '',
    authUsuario: 'demo',
    accesoTotal: true,
    seedCompletado: false
  };
})();
</script>

<style id="app-styles">
  :root{
    --bg: #E4D4F4;
    --panel: #FFFFFF;
    --panel-2: #ECE9F1;
    --border: #E5E2EC;
    --ink: #11183F;
    --ink-soft: #74758A;
    --ink-faint: #999AAD;
    --green: #00B837;
    --green-dark: #00962E;
    --green-bg: #EAF9EF;
    --amber: #C9821C;
    --amber-bg: #FBF0DD;
    --red: #FF1717;
    --red-bg: #FFEDED;
    --blue: #11BDE3;
    --blue-bg: #EFFBFD;
    --primary: #F5008F;
    --primary-bg: #FFF0F8;
    --shadow: 0 1px 2px rgba(17,24,63,0.05), 0 4px 16px rgba(17,24,63,0.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Archivo',sans-serif; -webkit-font-smoothing:antialiased;
  }
  #root{min-height:100vh;}
  ::selection{background:var(--primary); color:white;}
  .mono{font-family:'JetBrains Mono',monospace;}
  .display{font-family:'Archivo Black',sans-serif;}
  ::-webkit-scrollbar{width:10px; height:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px;}
  ::-webkit-scrollbar-thumb:hover{background:var(--ink-faint);}
  button{font-family:inherit; cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible{
    outline:2px solid var(--primary); outline-offset:2px;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
  }
  @keyframes slideIn{ from{ transform:translateX(12px); opacity:0; } to{ transform:translateX(0); opacity:1; } }
  @keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }
  @keyframes popIn{ from{ transform:scale(0.96); opacity:0; } to{ transform:scale(1); opacity:1; } }
  @keyframes printOut{ from{ transform:translateY(-8px); opacity:0; max-height:0; } to{ transform:translateY(0); opacity:1; max-height:200px; } }

  /* Stock table: sticky header */
  .stock-table-scroll { overflow-x: auto; overflow-y: auto; flex: 1; min-height: 0; }
  .stock-table-scroll thead th { background: var(--panel-2); }

  /* Stock table: celdas editables inline */
  .cell-edit{ width:100%; box-sizing:border-box; border:1px solid transparent; background:transparent; border-radius:6px; padding:6px 8px; font-size:13px; color:var(--ink); font-family:inherit; }
  .cell-edit:hover{ border-color:var(--border); background:var(--panel-2); }
  .cell-edit:focus{ border-color:var(--primary); background:var(--panel); outline:none; box-shadow:0 0 0 2px var(--primary-bg); }
  .cell-edit-select{ cursor:pointer; }
  .cell-edit-sm{ font-size:11px; padding:3px 5px; }

  @media (max-width: 880px){
    .sidebar{ display:none !important; }
    .topbar{ display:none !important; }
    .main-content{ padding:12px 12px 80px !important; }
    .grid-2{ grid-template-columns:1fr !important; }
    .grid-3{ grid-template-columns:1fr !important; }
    .grid-4{ grid-template-columns:repeat(2,1fr) !important; }
    .grid-barcodes{ grid-template-columns:repeat(auto-fill, minmax(110px, 1fr)) !important; }
    .caja-layout{ flex-direction:column !important; }
    .caja-cart-col{ width:100% !important; min-width:0 !important; max-width:none !important; flex:1 1 auto !important; }
    .caja-layout .ticket-panel{ position:static !important; order:-1; }
    .bottom-nav{ display:flex !important; }
  }
  .bottom-nav{
    display:none;
    position:fixed; bottom:0; left:0; right:0; z-index:100;
    background:var(--ink); border-top:1px solid rgba(255,255,255,0.1);
    height:64px; align-items:stretch; justify-content:stretch;
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .bottom-nav-btn{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:none; border:none; color:#999AAD; font-size:9.5px; font-family:inherit;
    gap:3px; cursor:pointer; padding:0; min-width:0;
  }
  .bottom-nav-btn.active{ color:#fff; }
  .bottom-nav-btn svg{ flex-shrink:0; }

  #boot-loader{
    position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:10px; z-index:99999;
  }
  #boot-loader .title{ font-family:'Archivo Black',sans-serif; font-size:18px; }
  #boot-loader .sub{ color:var(--ink-soft); font-size:13.5px; }
  #boot-loader .err{ color:var(--red); font-size:12.5px; max-width:480px; text-align:center; white-space:pre-wrap; font-family:monospace; margin-top:10px; }

  /* Impresión: oculta todo excepto el contenido imprimible */
  .print-only{ display:none; }
  @media print{
    /* Ticket térmico */
    @page{ margin:0; size:80mm auto; }
    body > *{ display:none !important; }

    /* Ticket de venta */
    #__ticket-print-root{
      display:block !important;
      visibility:visible !important;
      position:fixed; left:0; top:0;
      width:78mm; padding:2mm 1mm;
      font-family:'Courier New', monospace;
      font-size:12px; color:#000; background:#fff;
    }

    /* Estado de cuenta y códigos de barras:
       el wrapper oculto con display:none debe mostrarse,
       y dentro de él se muestra el .print-only */
    .print-wrapper-hidden{
      display:block !important;
      visibility:visible !important;
      position:fixed !important;
      left:0 !important; top:0 !important;
      width:100% !important;
      background:#fff !important;
      z-index:99999 !important;
    }
    .print-only{
      display:block !important;
      visibility:visible !important;
    }
    .etiqueta-print-wrap{
      display:flex !important;
      justify-content:center !important;
      align-items:center !important;
      width:100% !important;
      padding:16px !important;
    }
    .etiquetas-grid-print{
      display:flex !important;
      flex-wrap:wrap !important;
      gap:10px !important;
      justify-content:center !important;
      padding:16px !important;
    }
    .estado-cuenta-print{
      padding:16px !important;
      font-family:'Courier New', monospace !important;
      font-size:12px !important;
      color:#000 !important;
    }
  }
</style>
</head>

<script>
  // Si algo revienta antes de que React monte, lo mostramos en pantalla
  // en vez de dejar la pantalla de carga infinita y silenciosa.
  window.addEventListener('error', function(e){
    var sub = document.getElementById('boot-sub');
    var loader = document.getElementById('boot-loader');
    if (loader && loader.style.display !== 'none') {
      sub.textContent = 'Error al iniciar la aplicación:';
      var pre = document.createElement('div');
      pre.className = 'err';
      pre.textContent = (e.error && e.error.stack) ? e.error.stack : e.message;
      loader.appendChild(pre);
    }
  });
</script>

<script id="app-script">
"use strict";
var h = React.createElement;

/* ============================================================

============================================================ */
var firebaseConfig = {
  // MODO DEMO: no se usa ningún proyecto real (ver mock-firebase-demo más arriba)
  apiKey: "demo", authDomain: "demo", projectId: "demo"
};
// NEGOCIO_ID identifica la sucursal activa. Antes de iniciar sesión vale null:
// recién se fija cuando el login encuentra a qué sucursal pertenecen las credenciales.
var NEGOCIO_ID = null;

firebase.initializeApp(firebaseConfig);
var auth = firebase.auth();
var db = firebase.firestore();
// Persistencia offline: cachea los datos en el dispositivo para que la app pueda seguir
// leyendo y escribiendo (ventas, stock, etc.) sin conexión. Los cambios hechos offline quedan
// en cola y se sincronizan solos apenas vuelve la señal. Si falla (ej. varias pestañas abiertas
// o un navegador viejo que no lo soporta) la app sigue funcionando igual, sólo sin ese cacheo.
if(db.enablePersistence){
  db.enablePersistence({ synchronizeTabs:true }).catch(function(err){
    console.warn('Persistencia offline no disponible:', err && err.code);
  });
}

function negRef(sub){ return db.collection('negocios').doc(NEGOCIO_ID).collection(sub); }
function negDoc(sub, id){ return db.collection('negocios').doc(NEGOCIO_ID).collection(sub).doc(id); }
// Referencia al documento de configuración/credenciales de UNA sucursal específica (no necesariamente la activa)
function negocioRef(sucursalId){ return db.collection('negocios').doc(sucursalId); }
// Registro global con la lista de sucursales existentes (nombre + id). Es el "índice" que permite
// que el login busque en qué sucursal están las credenciales ingresadas.
function sucursalesMetaRef(){ return db.collection('meta').doc('sucursales'); }
function slugify(texto){
  return (texto||'').toString().trim().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') || uid('suc-');
}
// Normaliza texto para comparar (minúsculas, sin acentos, sin espacios de más) — usado para
// matchear productos del catálogo contra filas de un Excel de lista de precios de un proveedor.
function normTexto(s){
  return (s==null?'':String(s)).trim().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ');
}

/* ============================================================
   UTILIDADES
============================================================ */
function uid(p){
  p = p || '';
  return p + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);
}
function fmtMoney(n){
  if (n === null || n === undefined || isNaN(n)) n = 0;
  return n.toLocaleString('es-AR', { style:'currency', currency:'ARS', minimumFractionDigits:2, maximumFractionDigits:2 });
}
function fmtNum(n, dec){
  dec = dec === undefined ? 3 : dec;
  if (n === null || n === undefined || isNaN(n)) n = 0;
  return n.toLocaleString('es-AR', { minimumFractionDigits:0, maximumFractionDigits:dec });
}
function fmtDate(iso){
  if(!iso) return '—';
  var d = new Date(iso);
  return d.toLocaleDateString('es-AR', { day:'2-digit', month:'2-digit', year:'numeric' });
}
function fmtDateTime(iso){
  if(!iso) return '—';
  var d = new Date(iso);
  return d.toLocaleDateString('es-AR', { day:'2-digit', month:'2-digit', year:'numeric' }) + ' ' +
         d.toLocaleTimeString('es-AR', { hour:'2-digit', minute:'2-digit' });
}
function daysUntil(iso){
  if(!iso) return null;
  var today = new Date(); today.setHours(0,0,0,0);
  var target = new Date(iso); target.setHours(0,0,0,0);
  return Math.round((target - today) / 86400000);
}
function umbralAlertaVenc(producto){
  return (producto.diasAlertaVencimiento!=null) ? producto.diasAlertaVencimiento : 3;
}
function estaPorVencer(producto){
  if(!producto.vencimiento) return false;
  var d = daysUntil(producto.vencimiento);
  return d <= umbralAlertaVenc(producto);
}
function nivelAlertaProducto(producto){
  var vencido = producto.vencimiento && daysUntil(producto.vencimiento) < 0;
  var sinStock = producto.stock <= 0;
  if(vencido || sinStock) return 'critico';
  var porVencer = estaPorVencer(producto);
  var stockBajo = producto.stock > 0 && producto.stock <= producto.stockMin;
  if(porVencer || stockBajo) return 'alerta';
  return null;
}
// ---- Historial de productos: etiquetas legibles de cada campo y formateo de sus valores
// (usado por HistorialProductoModal para mostrar "de X a Y" en cada modificación registrada).
var CAMPOS_PRODUCTO_LABELS = {
  nombre:'Nombre', categoriaId:'Categoría', marca:'Marca', costo:'Precio costo', margen:'% Ganancia',
  precioVenta:'Precio venta', stock:'Stock', stockMin:'Stock mínimo', stockIdeal:'Stock ideal',
  vencimiento:'Vencimiento', prioridad:'Prioridad de venta', unidad:'Unidad', proveedorId:'Proveedor', sku:'SKU'
};
var TIPO_HISTORIAL_LABELS = { edicion:'Edición manual', compra:'Factura de compra', venta:'Venta', creacion:'Alta de producto', baja:'Baja de producto', reactivacion:'Reactivación' };
var TIPO_HISTORIAL_TONES = { edicion:'blue', compra:'green', venta:'amber', creacion:'blue', baja:'red', reactivacion:'green' };
function formatValorHistorialProducto(campo, valor, categorias, proveedores){
  if(valor===null || valor===undefined || valor==='') return '—';
  if(campo==='categoriaId'){ var c=(categorias||[]).find(function(x){return x.id===valor;}); return c?c.nombre:'—'; }
  if(campo==='proveedorId'){ var pr=(proveedores||[]).find(function(x){return x.id===valor;}); return pr?pr.nombre:'—'; }
  if(campo==='costo' || campo==='precioVenta') return fmtMoney(Number(valor));
  if(campo==='margen') return fmtNum(Number(valor),2)+'%';
  if(campo==='prioridad') return valor ? 'Sí' : 'No';
  if(campo==='vencimiento') return fmtDate(valor);
  if(campo==='stock' || campo==='stockMin' || campo==='stockIdeal') return fmtNum(Number(valor));
  return String(valor);
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function nowISO(){ return new Date().toISOString(); }
// ---- Historial de pedidos/alquileres/donaciones: etiquetas y formateo, mismo esquema que el
// historial de productos (usado por HistorialPedidoModal para mostrar "de X a Y").
var CAMPOS_PEDIDO_LABELS = {
  tipo:'Tipo', clienteNombre:'Cliente', clienteTelefono:'Teléfono', domicilio:'Domicilio',
  fechaAlquiler:'Fecha de alquiler', fechaEntrega:'Fecha de entrega', horaEntrega:'Hora de entrega',
  notas:'Notas', formaPagoAbono:'Forma de pago', deposito:'Depósito', depositoDevuelto:'Depósito devuelto',
  items:'Ítems', estadoArmado:'Estado', anticipo:'Cobrado'
};
var TIPO_HISTORIAL_PEDIDO_LABELS = { creacion:'Alta', edicion:'Edición manual', estado:'Cambio de estado', pago:'Pago registrado' };
var TIPO_HISTORIAL_PEDIDO_TONES = { creacion:'blue', edicion:'blue', estado:'amber', pago:'green' };
function formatValorHistorialPedido(campo, valor){
  if(campo==='items'){
    var items = valor||[];
    var total = items.reduce(function(s,it){ return s+(Number(it.subtotal)||0); }, 0);
    return items.length+' ítem'+(items.length!==1?'s':'')+' — '+fmtMoney(total);
  }
  if(valor===null || valor===undefined || valor==='') return '—';
  if(campo==='deposito' || campo==='anticipo') return fmtMoney(Number(valor));
  if(campo==='depositoDevuelto') return valor ? 'Sí' : 'No';
  if(campo==='fechaAlquiler' || campo==='fechaEntrega') return fmtDate(valor);
  if(campo==='estadoArmado') return estadoArmadoInfo(valor).label;
  if(campo==='formaPagoAbono') return METODO_PAGO_LABELS[valor] || String(valor);
  if(campo==='tipo') return valor==='alquiler'?'Alquiler':(valor==='donacion'?'Donación':'Pedido');
  return String(valor);
}
function calcPrecioVenta(costo, margen, iva, transporte){
  var c = Number(costo)||0, m = Number(margen)||0, i = Number(iva)||0, t = Number(transporte)||0;
  var base = c * (1 + m/100);
  return base * (1 + i/100 + t/100);
}
function calcMargenDesdeVenta(costo, venta){
  var c = Number(costo)||0, v = Number(venta)||0;
  if(c<=0) return 0;
  return ((v-c)/c)*100;
}

function printInNewWindow(contenidoHTML, titulo, esEtiquetas){
  var estilos = esEtiquetas ? [
    'body { margin:0; padding:16px; font-family: Arial, sans-serif; background:#fff; }',
    '.etiqueta-print { border:1px solid #ccc; border-radius:6px; padding:14px; text-align:center; width:280px; display:inline-block; margin:8px; vertical-align:top; break-inside:avoid; }',
    '.mono { font-family: "JetBrains Mono", "Courier New", monospace; }',
    '@media print { @page { margin:10mm; size:auto; } body { padding:0; } }'
  ].join('\n') : [
    'body { margin:0; padding:20px; font-family: "Courier New", monospace; font-size:12px; color:#000; background:#fff; }',
    'table { width:100%; border-collapse:collapse; font-size:12px; }',
    'th, td { padding:5px 4px; }',
    '@media print { @page { margin:10mm; size:A4; } body { padding:0; } }'
  ].join('\n');

  var win = window.open('', '_blank', 'width=800,height=600');
  if(!win){ alert('El navegador bloqueó la ventana emergente. Permitila para este sitio.'); return; }
  win.document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"><title>' + (titulo||'Imprimir') + '</title><style>' + estilos + '</style></head><body>' + contenidoHTML + '</body></html>');
  win.document.close();
  // Esperamos a que los recursos carguen antes de imprimir
  win.onload = function(){ win.focus(); win.print(); };
  // Fallback por si onload ya disparó
  setTimeout(function(){ try{ win.focus(); win.print(); } catch(e){} }, 800);
}

/* ============================================================
   BACKUP DEL SISTEMA (Excel .xlsx / PDF) — con recordatorio semanal
============================================================ */
// Convierte cualquier valor (objetos, arrays, imágenes base64) en algo apto para
// una celda de planilla/tabla, sin inflar el archivo con imágenes pesadas.
function limpiarValorBackup(v){
  if(v===null || v===undefined) return '';
  if(typeof v==='string' && v.indexOf('data:image')===0) return '[imagen adjunta — no incluida en el backup]';
  if(Array.isArray(v)) return JSON.stringify(v);
  if(typeof v==='object') return JSON.stringify(v);
  return v;
}
function filaPlanaBackup(obj){
  var out = {};
  Object.keys(obj||{}).forEach(function(k){ out[k] = limpiarValorBackup(obj[k]); });
  return out;
}
// Genera una fila por cada item dentro de un array de "padres" (ventas, facturas de compra, etc.)
function itemsDetalleBackup(arr, campoRef, valorRefFn){
  var filas = [];
  (arr||[]).forEach(function(padre){
    var items = padre.items || [];
    items.forEach(function(it){
      var fila = {}; fila[campoRef] = valorRefFn(padre);
      Object.keys(it||{}).forEach(function(k){ fila[k] = limpiarValorBackup(it[k]); });
      filas.push(fila);
    });
  });
  return filas;
}
function backupStorageKey(app){ return 'ultimoBackupSistema__' + (app.sucursalActiva || 'default'); }
function obtenerUltimoBackup(app){
  try{ return localStorage.getItem(backupStorageKey(app)); }catch(e){ return null; }
}
function registrarBackupRealizado(app){
  try{ localStorage.setItem(backupStorageKey(app), nowISO()); }catch(e){}
}
function diasDesdeFecha(fechaISO){
  if(!fechaISO) return null;
  return Math.max(0, Math.floor((Date.now() - new Date(fechaISO).getTime()) / 86400000));
}
function diasDesdeBackup(app){
  return diasDesdeFecha(obtenerUltimoBackup(app));
}
function nombreArchivoBackup(app, ext){
  var suc = (app.nombreSucursalActiva || 'sistema').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
  return 'backup-' + (suc || 'sistema') + '-' + todayISO() + '.' + ext;
}
// Arma todas las "colecciones" del backup a partir de los datos vivos del contexto.
function construirColeccionesBackup(app){
  var col = {};
  col['Resumen'] = [
    { campo:'Negocio', valor: (app.configNegocio && app.configNegocio.nombreNegocio) || '' },
    { campo:'Sucursal', valor: app.nombreSucursalActiva || '' },
    { campo:'Fecha del backup', valor: fmtDateTime(nowISO()) },
    { campo:'Productos', valor: (app.productos||[]).length },
    { campo:'Categorías', valor: (app.categorias||[]).length },
    { campo:'Clientes', valor: (app.clientes||[]).length },
    { campo:'Ventas', valor: (app.ventas||[]).length },
    { campo:'Movimientos de cuenta corriente', valor: (app.movimientosCC||[]).length },
    { campo:'Cajas', valor: (app.cajas||[]).length },
    { campo:'Proveedores', valor: (app.proveedores||[]).length },
    { campo:'Cajeros', valor: (app.empleados||[]).length },
    { campo:'Facturas de compra', valor: (app.facturasCompra||[]).length },
    { campo:'Pagos a proveedores', valor: (app.pagosProveedor||[]).length },
    { campo:'Notas', valor: (app.notas||[]).length },
    { campo:'Recordatorios', valor: (app.recordatorios||[]).length }
  ];
  col['Productos'] = (app.productos||[]).map(filaPlanaBackup);
  col['Categorias'] = (app.categorias||[]).map(filaPlanaBackup);
  col['Clientes'] = (app.clientes||[]).map(filaPlanaBackup);
  col['Ventas'] = (app.ventas||[]).map(function(v){ var f=filaPlanaBackup(v); f.itemsCant=(v.items||[]).length; return f; });
  col['Ventas - Items'] = itemsDetalleBackup(app.ventas, 'ventaNumero', function(v){ return v.numero!=null ? v.numero : v.id; });
  col['Movimientos CC'] = (app.movimientosCC||[]).map(filaPlanaBackup);
  col['Cajas'] = (app.cajas||[]).map(filaPlanaBackup);
  col['Proveedores'] = (app.proveedores||[]).map(filaPlanaBackup);
  col['Cajeros'] = (app.empleados||[]).map(filaPlanaBackup);
  col['Compras'] = (app.facturasCompra||[]).map(function(f){ var r=filaPlanaBackup(f); r.itemsCant=(f.items||[]).length; return r; });
  col['Compras - Items'] = itemsDetalleBackup(app.facturasCompra, 'facturaId', function(f){ return f.id; });
  col['Pagos a proveedores'] = (app.pagosProveedor||[]).map(filaPlanaBackup);
  col['Notas'] = (app.notas||[]).map(filaPlanaBackup);
  col['Recordatorios'] = (app.recordatorios||[]).map(filaPlanaBackup);
  return col;
}
function descargarBackupExcelDesdeColecciones(colecciones, app){
  var wb = XLSX.utils.book_new();
  Object.keys(colecciones).forEach(function(nombre){
    var filas = colecciones[nombre];
    var ws = (filas && filas.length) ? XLSX.utils.json_to_sheet(filas) : XLSX.utils.aoa_to_sheet([['(Sin registros)']]);
    XLSX.utils.book_append_sheet(wb, ws, nombre.slice(0,31));
  });
  XLSX.writeFile(wb, nombreArchivoBackup(app, 'xlsx'));
}
function descargarBackupPDFDesdeColecciones(colecciones, app){
  var jsPDFCtor = window.jspdf && window.jspdf.jsPDF;
  if(!jsPDFCtor) throw new Error('No se pudo cargar el generador de PDF');
  var doc = new jsPDFCtor({ orientation:'landscape', unit:'pt', format:'a4' });
  var primero = true;
  Object.keys(colecciones).forEach(function(nombre){
    var filas = colecciones[nombre];
    if(!primero) doc.addPage();
    primero = false;
    var y = 40;
    doc.setFont('helvetica','bold'); doc.setFontSize(15);
    doc.text('Backup del sistema — ' + (app.nombreSucursalActiva||''), 40, y);
    y += 16;
    doc.setFont('helvetica','normal'); doc.setFontSize(9);
    doc.text('Generado el ' + fmtDateTime(nowISO()), 40, y);
    y += 18;
    doc.setFont('helvetica','bold'); doc.setFontSize(12);
    doc.text(nombre, 40, y);
    y += 6;
    if(!filas || !filas.length){
      doc.setFont('helvetica','normal'); doc.setFontSize(10);
      doc.text('(Sin registros)', 40, y+16);
      return;
    }
    var columnas = [];
    filas.forEach(function(f){ Object.keys(f).forEach(function(k){ if(columnas.indexOf(k)===-1) columnas.push(k); }); });
    var body = filas.map(function(f){ return columnas.map(function(c){ var v=f[c]; return (v===undefined||v===null) ? '' : String(v); }); });
    doc.autoTable({
      head:[columnas], body:body, startY:y+6,
      styles:{ fontSize:7, cellPadding:3, overflow:'linebreak' },
      headStyles:{ fillColor:[45,106,79], textColor:255 },
      margin:{ left:40, right:40 }, theme:'grid'
    });
  });
  doc.save(nombreArchivoBackup(app, 'pdf'));
}
// Recordatorio: avisa una vez por sesión si pasó una semana (o más) desde el último backup.
function BackupReminder(){
  var app = useApp();
  var avisadoRef = useRef(false);
  useEffect(function(){
    if(avisadoRef.current) return;
    avisadoRef.current = true;
    var dias = diasDesdeBackup(app);
    if(dias===null){
      app.pushToast('Todavía no hiciste ningún backup del sistema. Te recomendamos descargar uno desde Ajustes.', 'info');
    } else if(dias>=7){
      app.pushToast('Pasaron ' + dias + ' días desde el último backup. Te recomendamos descargar uno nuevo desde Ajustes.', 'info');
    }
  }, []);
  return null;
}

function sha256Hex(texto){
  var enc = new TextEncoder().encode(texto);
  return crypto.subtle.digest('SHA-256', enc).then(function(buf){
    var arr = Array.from(new Uint8Array(buf));
    return arr.map(function(b){ return b.toString(16).padStart(2,'0'); }).join('');
  });
}

function useOnlineStatus(){
  var onlineS = useState(function(){ return typeof navigator!=='undefined' ? navigator.onLine : true; });
  var online = onlineS[0], setOnline = onlineS[1];
  useEffect(function(){
    function goOnline(){ setOnline(true); }
    function goOffline(){ setOnline(false); }
    window.addEventListener('online', goOnline);
    window.addEventListener('offline', goOffline);
    return function(){
      window.removeEventListener('online', goOnline);
      window.removeEventListener('offline', goOffline);
    };
  }, []);
  return online;
}

      PRODUCTOS_SEED.forEach(function(p){
        var rest = {}; for(var k in p){ if(k!=='id') rest[k]=p[k]; }
        batch.set(negDoc('productos', p.id), rest);

      });
      batch.set(negocioRef(sucursalActiva), { seedCompletado:true }, { merge:true });

  // Resguardo por actualización: sesiones guardadas por una versión anterior (previa a

  useEffect(function(){

  var cajaActual = useMemo(function(){

  useEffect(function(){

  // Garantiza que exista el documento del contador transaccional de N° de venta,
  // arrancando desde el máximo histórico real (para no repetir números de ventas ya cargadas).
  var contadorInicializadoRef = useRef(null);
  useEffect(function(){

    contadorInicializadoRef.current = sucursalActiva;
    var maxActual = ventas.reduce(function(m,v){ return Math.max(m, v.numero||0); }, 1000);
    var contadorRef = negDoc('contadores', 'ventas');
    db.runTransaction(function(transaction){

          transaction.set(contadorRef, { ultimoNumero: maxActual });

  // ---- Historial de modificaciones de productos: registra quién hizo cada cambio (edición
  // manual, alta, baja/reactivación, factura de compra o venta) y, cuando corresponde, el
  // valor anterior y nuevo de cada campo (en especial el stock, para poder ver cuánto había
  // antes de cada actualización). "usuario" es el nombre del cajero logueado, o "Administrador"
  // si entró con las credenciales de la sucursal.
  function nombreUsuarioActual(){
    return rolActual==='cajero' ? (nombreEmpleadoActual || 'Cajero/a') : 'Administrador';
  }
  function registrarHistorialProducto(entry){
    var d = {
      productoId: entry.productoId, productoNombre: entry.productoNombre || '',
      tipo: entry.tipo, origen: entry.origen || '',
      usuario: nombreUsuarioActual(), rol: rolActual,
      cambios: entry.cambios || [], fecha: entry.fecha || nowISO()
    };
    return negRef('historialProductos').add(d).catch(function(err){ console.error('Error registrando historial de producto:', err); });
  }
  // Compara los datos nuevos contra el producto actual (en memoria) y arma la lista de
  // cambios reales (ignora campos que no cambiaron o que llegan como el mismo valor numérico).
  function detectarCambiosProducto(anterior, data){
    var cambios = [];
    for(var k in data){
      if(k==='activo') continue; // la baja/reactivación se registra aparte, con su propio tipo
      var valAnterior = anterior[k]!==undefined ? anterior[k] : null;
      var valNuevo = data[k]!==undefined ? data[k] : null;
      if(valAnterior===valNuevo) continue;
      if(typeof valAnterior==='number' || typeof valNuevo==='number'){
        if(Number(valAnterior||0)===Number(valNuevo||0)) continue;
      }
      cambios.push({ campo:k, anterior: (valAnterior===undefined?null:valAnterior), nuevo: (valNuevo===undefined?null:valNuevo) });
    }
    return cambios;
  }

  // Cambio masivo: aplica el mismo patch (ej. { categoriaId: 'x' }) a varios productos de una
  // sola vez, en un batch de Firestore (una sola escritura atómica por lote) en vez de N updates
  // sueltos, y deja UN registro de historial por producto afectado (para no perder trazabilidad).
  function updateProductosMasivo(ids, data, etiquetaOrigen){
    ids = (ids||[]).filter(Boolean);
    if(ids.length===0) return Promise.resolve();
    // Si el cambio masivo es de costo, cada producto puede tener un % de ganancia distinto,
    // así que el precio de venta se recalcula por producto (preservando SU margen actual) en
    // vez de aplicar el mismo patch fijo a todos.
    var recalcularVentaDesdeCosto = !!data._recalcularVentaDesdeCosto;
    var dataBase = {};
    for(var k in data){ if(k!=='_recalcularVentaDesdeCosto') dataBase[k] = data[k]; }
    var batch = db.batch();
    var historiales = [];
    ids.forEach(function(id){
      var anterior = productos.find(function(p){ return p.id===id; }) || {};
      var dataProducto = dataBase;
      if(recalcularVentaDesdeCosto){
        var margenActual = anterior.margen!=null ? anterior.margen : 40;
        dataProducto = {};
        for(var k2 in dataBase){ dataProducto[k2] = dataBase[k2]; }
        dataProducto.precioVenta = Math.round(calcPrecioVenta(dataBase.costo, margenActual)*100)/100;
      }
      var cambios = detectarCambiosProducto(anterior, dataProducto);
      batch.update(negDoc('productos', id), dataProducto);
      if(cambios.length){
        historiales.push({ productoId:id, productoNombre: anterior.nombre||'', tipo:'edicion', origen: etiquetaOrigen || 'Cambio masivo', cambios: cambios });
      }
    });
    return batch.commit().then(function(){
      pushToast(ids.length+' producto'+(ids.length!==1?'s':'')+' actualizado'+(ids.length!==1?'s':''), 'success');
      historiales.forEach(function(h){ registrarHistorialProducto(h); });
    }).catch(function(err){ console.error(err); pushToast('Error al aplicar el cambio masivo', 'error'); throw err; });
  }
  function deleteProducto(id){

  // Deshace una modificación puntual registrada en el historial de un producto (edición manual,
  // cambio masivo, alta o factura de compra que le cambió campos, o baja/reactivación), volviendo
  // cada campo a su valor "anterior" guardado en ese registro. Queda a su vez registrado como un
  // nuevo movimiento de historial ("Deshacer — <origen original>") para no perder trazabilidad —
  // por eso también se puede deshacer un "deshacer" si hiciera falta. No aplica a ventas: revertir
  // solo el stock de una venta ya cobrada dejaría la caja y el ticket desactualizados.
  function revertirHistorialProducto(entry){
    if(!entry || entry.tipo==='venta') return Promise.resolve();
    if(entry.tipo==='baja' || entry.tipo==='reactivacion'){
      var activo = entry.tipo==='baja'; // volver a como estaba antes de esa baja/reactivación
      return negDoc('productos', entry.productoId).update({ activo: activo }).then(function(){
        pushToast('Cambio deshecho', 'success');
        registrarHistorialProducto({
          productoId: entry.productoId, productoNombre: entry.productoNombre||'',
          tipo: activo?'reactivacion':'baja', origen: 'Deshacer — '+(entry.origen||''), cambios: []
        });
      }).catch(function(err){ console.error(err); pushToast('Error al deshacer el cambio', 'error'); });
    }
    var patch = {};
    (entry.cambios||[]).forEach(function(c){ patch[c.campo] = c.anterior; });
    return negDoc('productos', entry.productoId).update(patch).then(function(){
      pushToast('Cambio deshecho', 'success');
      registrarHistorialProducto({
        productoId: entry.productoId, productoNombre: entry.productoNombre||'',
        tipo:'edicion', origen: 'Deshacer — '+(entry.origen||''),
        cambios: (entry.cambios||[]).map(function(c){ return { campo:c.campo, anterior:c.nuevo, nuevo:c.anterior }; })
      });
    }).catch(function(err){ console.error(err); pushToast('Error al deshacer el cambio', 'error'); });
  }

  // Crea varios clientes de una sola vez (importación de contactos del teléfono). Se hace en
  // lotes de a 450 por las dudas (el límite de Firestore es 500 escrituras por batch).
  function addClientesMasivo(lista){
    lista = (lista||[]).filter(function(c){ return (c.nombre && c.nombre.trim()) || (c.telefono && c.telefono.trim()); });
    if(lista.length===0) return Promise.resolve({ creados:0 });
    var lotes = [];
    for(var i=0;i<lista.length;i+=450) lotes.push(lista.slice(i,i+450));
    function procesarLote(idx){
      if(idx>=lotes.length) return Promise.resolve();
      var batch = db.batch();
      lotes[idx].forEach(function(c){
        batch.set(negRef('clientes').doc(), { nombre: (c.nombre||'').trim() || 'Sin nombre', telefono: (c.telefono||'').trim(), direccion:'', saldoCC:0 });
      });
      return batch.commit().then(function(){ return procesarLote(idx+1); });
    }
    return procesarLote(0).then(function(){
      pushToast(lista.length+' contacto'+(lista.length!==1?'s':'')+' importado'+(lista.length!==1?'s':'')+' como cliente'+(lista.length!==1?'s':''), 'success');
      return { creados: lista.length };
    }).catch(function(err){ console.error(err); pushToast('Error al importar los contactos', 'error'); throw err; });
  }

  function cerrarCaja(montoContado, nota, cajero, cajaIdParam){
    var cajaACerrar = cajaIdParam ? cajas.find(function(c){ return c.id===cajaIdParam; }) : cajaActual;
    if(!cajaACerrar){
      pushToast('No hay ninguna caja abierta', 'error');
      return Promise.resolve(null);
    }
    var ventasCaja = ventas.filter(function(v){ return v.cajaId === cajaACerrar.id; });
    var totalContado = 0, totalTransferencia = 0, totalCredito = 0, totalDebito = 0, totalQr = 0, totalCC = 0;
    ventasCaja.forEach(function(v){
      if(v.metodoPago==='contado') totalContado += v.total;
      else if(v.metodoPago==='transferencia') totalTransferencia += v.total;
      else if(v.metodoPago==='credito') totalCredito += v.total;
      else if(v.metodoPago==='debito') totalDebito += v.total;
      else if(v.metodoPago==='qr') totalQr += v.total;
      else if(v.metodoPago==='cuenta_corriente') totalCC += v.total;
    });
    totalContado = Math.round(totalContado*100)/100;
    totalTransferencia = Math.round(totalTransferencia*100)/100;
    totalCredito = Math.round(totalCredito*100)/100;
    totalDebito = Math.round(totalDebito*100)/100;
    totalQr = Math.round(totalQr*100)/100;
    totalCC = Math.round(totalCC*100)/100;
    var efectivoEsperado = Math.round((cajaACerrar.montoInicial + totalContado)*100)/100;
    var montoContadoNum = Math.round((Number(montoContado)||0)*100)/100;
    var diferencia = Math.round((montoContadoNum - efectivoEsperado)*100)/100;
    var notaCierreTxt = (nota||'').trim();
    var cajeroCierreTxt = (cajero||'').trim();

    return negDoc('cajas', cajaACerrar.id).update({
      estado: 'cerrada',

      montoContado: montoContadoNum,
      notaCierre: notaCierreTxt,

      totalTransferencia: totalTransferencia,
      totalCredito: totalCredito,
      totalDebito: totalDebito,
      totalQr: totalQr,

      cantidadVentas: ventasCaja.length,
      efectivoEsperado: efectivoEsperado,
      diferencia: diferencia
    }).then(function(){
      pushToast('Caja #'+cajaACerrar.numero+' cerrada correctamente', 'success');

        numero: cajaACerrar.numero, montoInicial: cajaACerrar.montoInicial,
        fechaApertura: cajaACerrar.fechaApertura, fechaCierre: fechaCierreTxt,
        notaApertura: cajaACerrar.notaApertura || '', notaCierre: notaCierreTxt,
        cajeroApertura: cajaACerrar.cajeroApertura || '', cajeroCierre: cajeroCierreTxt,

        cantidadVentas: ventasCaja.length, efectivoEsperado: efectivoEsperado,

  function confirmarVenta(args){
    if(!cajaActual){
      pushToast('No podés registrar ventas sin abrir la caja primero', 'error');
      return Promise.resolve(null);
    }
    var items = args.items, metodoPago = args.metodoPago, clienteId = args.clienteId, montoRecibido = args.montoRecibido, clienteNombreLibre = args.clienteNombreLibre, vendedor = (args.vendedor||'').trim();
    var clienteLocal = clientes.find(function(c){ return c.id===clienteId; }) || clientes[0];
    var nombreParaVenta = (clienteNombreLibre && clienteNombreLibre.trim()) ? clienteNombreLibre.trim() : clienteLocal.nombre;
    var total = Math.round(items.reduce(function(s,i){ return s+i.subtotal; }, 0)*100)/100;
    var fecha = nowISO();

    var ventaRef = negRef('ventas').doc();
    // Agrupamos por producto base: un mismo producto puede aparecer en varias líneas del carrito
    // si se vendió en más de una presentación (ej. "Pack x6" y "Unidad" del mismo jugo), y todas
    // esas líneas descuentan del mismo stock base, así que hay que sumarlas antes de leer/escribir.
    var totalPorProducto = {};
    items.forEach(function(it){
      var cantidadBase = it.cantidad * (it.factor || 1);
      if(!totalPorProducto[it.productoId]){
        totalPorProducto[it.productoId] = { ref: negDoc('productos', it.productoId), cantidad: 0, nombre: it.nombre };
      }
      totalPorProducto[it.productoId].cantidad += cantidadBase;
    });
    var productoIds = Object.keys(totalPorProducto);
    var clienteRef = negDoc('clientes', clienteLocal.id);
    var contadorRef = negDoc('contadores', 'ventas');
    var usuarioActual = nombreUsuarioActual();
    var rolActualSnapshot = rolActual;

    return db.runTransaction(function(transaction){
      // 1) TODAS las lecturas primero (regla de Firestore: leer antes de escribir en una transacción).
      //    Leer el valor REAL desde el servidor en este instante, no el que tenemos en memoria local,
      //    así dos ventas simultáneas desde dispositivos distintos nunca pisan el stock una a la otra.
      return Promise.all(
        productoIds.map(function(id){ return transaction.get(totalPorProducto[id].ref); })
      ).then(function(prodSnaps){
        return transaction.get(clienteRef).then(function(clienteSnap){
          return transaction.get(contadorRef).then(function(contadorSnap){
            // 2) Validar stock real (recién leído) y calcular el próximo número de venta de forma atómica
            for(var i=0;i<prodSnaps.length;i++){
              var snap = prodSnaps[i];
              var id = productoIds[i];
              if(!snap.exists) continue;
              var stockReal = snap.data().stock;
              if(stockReal < totalPorProducto[id].cantidad){
                throw new Error('STOCK_INSUFICIENTE:' + totalPorProducto[id].nombre);
              }
            }

            var numero = (contadorSnap.exists ? contadorSnap.data().ultimoNumero : 1000) + 1;
            var clienteData = clienteSnap.exists ? clienteSnap.data() : clienteLocal;

            var venta = {
              numero: numero, fecha: fecha, items: items, total: total, metodoPago: metodoPago,
              clienteId: clienteLocal.id, clienteNombre: nombreParaVenta,
              estado:'completada', montoRecibido: montoRecibido === undefined ? null : montoRecibido,
              cajaId: cajaActual.id, cajaNumero: cajaActual.numero, vendedor: vendedor
            };

            // 3) Ahora sí, todas las escrituras (con los valores frescos leídos arriba)
            transaction.set(ventaRef, venta);
            transaction.set(contadorRef, { ultimoNumero: numero }, { merge: true });

            prodSnaps.forEach(function(snap, i){
              if(!snap.exists) return;
              var id = productoIds[i];
              var stockAnterior = snap.data().stock;
              var nuevoStock = Math.max(0, Math.round((stockAnterior - totalPorProducto[id].cantidad)*1000)/1000);
              transaction.update(totalPorProducto[id].ref, { stock: nuevoStock });
              transaction.set(negRef('historialProductos').doc(), {
                productoId: id, productoNombre: totalPorProducto[id].nombre, tipo:'venta', origen:'Venta #'+numero,
                usuario: usuarioActual, rol: rolActualSnapshot, fecha: fecha,
                cambios: [{ campo:'stock', anterior: stockAnterior, nuevo: nuevoStock }]
              });
            });

            if(metodoPago==='cuenta_corriente'){
              var nuevoSaldo = Math.round(((clienteData.saldoCC||0)+total)*100)/100;
              transaction.update(clienteRef, { saldoCC: nuevoSaldo });
              var movRef = negRef('movimientosCC').doc();
              transaction.set(movRef, { clienteId: clienteLocal.id, tipo:'venta', monto: total, fecha: fecha, nota:'Venta #'+numero, ventaId: ventaRef.id });
            }

            return { id: ventaRef.id, numero: numero, venta: venta };
          });
        });
      });
    }).then(function(resultado){
      pushToast('Venta #'+resultado.numero+' registrada — '+fmtMoney(total), 'success');
      var result = { id: resultado.id };
      for(var k in resultado.venta) result[k] = resultado.venta[k];
      return result;
    }).catch(function(err){
      console.error(err);
      if(err && err.message && err.message.indexOf('STOCK_INSUFICIENTE:')===0){
        var nombreProd = err.message.split(':')[1];
        pushToast('Sin stock suficiente de "'+nombreProd+'" — alguien más lo vendió recién. Revisá el carrito.', 'error');
      } else {
        pushToast('Error al registrar la venta. Revisá tu conexión.', 'error');
      }
      return null;
    });
  }

  function registrarDevolucionVenta(ventaId, itemsSeleccionados, motivo){
    itemsSeleccionados = (itemsSeleccionados||[]).filter(function(it){ return it && Number(it.cantidad)>0; });
    if(itemsSeleccionados.length===0) return Promise.reject(new Error('Elegí al menos un producto a devolver'));
    var ventaRef = negDoc('ventas', ventaId);
    var usuarioActual = nombreUsuarioActual();
    var rolActualSnapshot = rolActual;
    var fecha = nowISO();

    return db.runTransaction(function(transaction){
      // 1) Leer la venta real del servidor: así, si hubo otra devolución hecha desde otro
      //    dispositivo mientras este modal estaba abierto, la cantidad ya devuelta se lee
      //    fresca y no se puede devolver de más.
      return transaction.get(ventaRef).then(function(ventaSnap){
        if(!ventaSnap.exists) throw new Error('La venta ya no existe');
        var venta = ventaSnap.data();
        var devueltoPorItem = venta.devueltoPorItem || {};

        // Validar cantidades contra lo que falta por devolver de cada línea
        itemsSeleccionados.forEach(function(sel){
          var itemVenta = venta.items[sel.index];
          if(!itemVenta) throw new Error('Ítem de venta inválido');
          var yaDevuelto = Number(devueltoPorItem[sel.index])||0;
          var disponible = Math.round((itemVenta.cantidad - yaDevuelto)*1000)/1000;
          if(sel.cantidad > disponible + 0.0001) throw new Error('DISPONIBLE_INSUFICIENTE:'+itemVenta.nombre);
        });

        var productoRefs = itemsSeleccionados.map(function(sel){ return negDoc('productos', venta.items[sel.index].productoId); });
        var clienteRef = venta.metodoPago==='cuenta_corriente' ? negDoc('clientes', venta.clienteId) : null;

        return Promise.all(productoRefs.map(function(ref){ return transaction.get(ref); })).then(function(prodSnaps){
          return (clienteRef ? transaction.get(clienteRef) : Promise.resolve(null)).then(function(clienteSnap){
            // 2) Escrituras: stock de vuelta + historial de cada producto
            var montoTotal = 0;
            var itemsRegistro = [];
            var nuevoDevueltoPorItem = {}; for(var k in devueltoPorItem) nuevoDevueltoPorItem[k]=devueltoPorItem[k];

            itemsSeleccionados.forEach(function(sel, i){
              var itemVenta = venta.items[sel.index];
              var cantidadDevuelta = Math.round(Number(sel.cantidad)*1000)/1000;
              var precioUnitEfectivo = itemVenta.cantidad ? (itemVenta.subtotal / itemVenta.cantidad) : itemVenta.precioUnit;
              var montoItem = Math.round(cantidadDevuelta * precioUnitEfectivo * 100)/100;
              montoTotal += montoItem;
              nuevoDevueltoPorItem[sel.index] = Math.round(((Number(devueltoPorItem[sel.index])||0) + cantidadDevuelta)*1000)/1000;
              itemsRegistro.push({ productoId: itemVenta.productoId, nombre: itemVenta.nombre, cantidad: cantidadDevuelta, subtotal: montoItem });

              var snap = prodSnaps[i];
              if(snap.exists){
                var cantidadBase = cantidadDevuelta * (itemVenta.factor || 1);
                var stockAnterior = snap.data().stock;
                var nuevoStock = Math.round((stockAnterior + cantidadBase)*1000)/1000;
                transaction.update(productoRefs[i], { stock: nuevoStock });
                transaction.set(negRef('historialProductos').doc(), {
                  productoId: itemVenta.productoId, productoNombre: itemVenta.nombre, tipo:'devolucion', origen:'Devolución de venta #'+venta.numero,
                  usuario: usuarioActual, rol: rolActualSnapshot, fecha: fecha,
                  cambios: [{ campo:'stock', anterior: stockAnterior, nuevo: nuevoStock }]
                });
              }
            });

            montoTotal = Math.round(montoTotal*100)/100;
            var totalDevueltoAntes = Number(venta.totalDevuelto)||0;
            var totalDevueltoNuevo = Math.round((totalDevueltoAntes + montoTotal)*100)/100;
            var registroDevolucion = { fecha: fecha, motivo: (motivo||'').trim(), usuario: usuarioActual, monto: montoTotal, items: itemsRegistro };
            var devoluciones = (venta.devoluciones||[]).slice();
            devoluciones.push(registroDevolucion);

            transaction.update(ventaRef, {
              devueltoPorItem: nuevoDevueltoPorItem, totalDevuelto: totalDevueltoNuevo, devoluciones: devoluciones,
              estadoDevolucion: totalDevueltoNuevo >= venta.total-0.005 ? 'total' : 'parcial'
            });

            if(clienteRef && clienteSnap && clienteSnap.exists){
              var clienteData = clienteSnap.data();
              var nuevoSaldo = Math.max(0, Math.round(((clienteData.saldoCC||0)-montoTotal)*100)/100);
              transaction.update(clienteRef, { saldoCC: nuevoSaldo });
              transaction.set(negRef('movimientosCC').doc(), { clienteId: venta.clienteId, tipo:'devolucion', monto: montoTotal, fecha: fecha, nota:'Devolución de venta #'+venta.numero, ventaId: ventaId });
            }

            return { numero: venta.numero, monto: montoTotal, devolucion: registroDevolucion };
          });
        });
      });
    }).then(function(resultado){
      pushToast('Devolución de venta #'+resultado.numero+' registrada — '+fmtMoney(resultado.monto), 'success');
      return resultado;
    }).catch(function(err){
      console.error(err);
      if(err && err.message && err.message.indexOf('DISPONIBLE_INSUFICIENTE:')===0){
        var nombreProd = err.message.split(':')[1];
        pushToast('No queda cantidad disponible para devolver de "'+nombreProd+'"', 'error');
      } else {
        pushToast(err && err.message ? err.message : 'Error al registrar la devolución', 'error');
      }
      throw err;
    });
  }
