<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bitácora — Centro de Estética (Demo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FFFFFF;
    --bg-alt: #EFE7D8;
    --ink: #2B2420;
    --ink-soft: #6B6156;
    --primary: #1A1A1A;
    --primary-soft: #333333;
    --accent: #D9A6A6;
    --accent-deep: #B97C7C;
    --gold: #C9A66B;
    --line: #E1D6C0;
    --white: #FFFDF9;
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Fraunces', serif;
    font-weight:500;
    letter-spacing:-0.01em;
  }
  .app{
    max-width:1080px;
    margin:0 auto;
    padding:32px 20px 60px;
  }
  .header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:28px;
    flex-wrap:wrap;
    gap:8px;
  }
  .header h1{
    font-size:30px;
    color:var(--primary);
    margin:0;
  }
  .header .eyebrow{
    font-size:12px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--accent-deep);
    display:block;
    margin-bottom:4px;
  }
  .layout{
    display:flex;
    align-items:flex-start;
    gap:28px;
  }
  .main{
    flex:1;
    min-width:0;
  }
  .tabs{
    display:flex;
    flex-direction:column;
    gap:4px;
    background:var(--bg-alt);
    padding:10px;
    border-radius:var(--radius);
    width:210px;
    flex-shrink:0;
    position:sticky;
    top:20px;
  }
  .tab{
    border:none;
    background:transparent;
    padding:10px 14px;
    border-radius:10px;
    font-family:'Work Sans', sans-serif;
    font-size:14px;
    font-weight:500;
    color:var(--ink-soft);
    cursor:pointer;
    transition:background .18s ease, color .18s ease;
    white-space:nowrap;
    text-align:left;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    width:100%;
  }
  .tab.active{
    background:var(--primary);
    color:var(--white);
  }
  .card{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:24px;
    margin-bottom:18px;
  }
  .card h2{
    font-size:19px;
    margin:0 0 16px;
    color:var(--primary);
  }
  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }
  @media (max-width:600px){ .grid{grid-template-columns:1fr;} }
  label{
    display:block;
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:5px;
    font-weight:500;
  }
  input, select, textarea{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:9px;
    font-family:'Work Sans', sans-serif;
    font-size:14px;
    background:var(--bg);
    color:var(--ink);
  }
  textarea{ resize:vertical; }
  input:focus, select:focus, textarea:focus, button:focus-visible{
    outline:2px solid var(--accent-deep);
    outline-offset:1px;
  }
  .birthday-banner{
    background:linear-gradient(135deg, var(--accent) 0%, var(--gold) 100%);
    border-radius:var(--radius);
    padding:22px 24px;
    margin-bottom:18px;
  }
  .birthday-banner h2{ color:var(--white); margin:0 0 4px; }
  .birthday-banner .sub{ font-size:12.5px; color:var(--white); opacity:0.9; margin-bottom:14px; }
  .birthday-entry{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:rgba(255,255,255,0.22);
    border-radius:10px;
    padding:12px 16px;
    margin-bottom:8px;
  }
  .birthday-entry:last-child{ margin-bottom:0; }
  .birthday-entry .name{ font-family:'Fraunces', serif; font-size:16px; font-weight:500; color:var(--white); }
  .birthday-entry .cake{ font-size:20px; margin-right:10px; }
  .btn-birthday{
    background:var(--white);
    color:var(--accent-deep);
    border:none;
    padding:8px 14px;
    border-radius:8px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    font-family:'Work Sans', sans-serif;
    white-space:nowrap;
  }
  .btn-birthday:active{ transform:scale(0.98); }
  .birthday-alert-entry{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:10px 0;
    border-bottom:1px solid var(--line);
  }
  .birthday-alert-entry:last-child{ border-bottom:none; }
  .birthday-alert-entry .name{ font-weight:600; }
  .modal-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.45);
    z-index:1000;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .modal-overlay.open{ display:flex; }
  .modal-box{
    background:var(--white);
    border-radius:var(--radius);
    padding:22px;
    max-width:440px;
    width:100%;
    max-height:85vh;
    overflow:auto;
    box-shadow:0 20px 50px rgba(0,0,0,0.25);
  }
  .modal-box h2{ margin-top:0; }
  .modal-box textarea{ min-height:160px; }
  .modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top:16px;
  }
  .field{margin-bottom:0;}
  .field-hint{
    font-size:12px;
    color:var(--ink-soft);
    margin-top:4px;
    min-height:14px;
  }
  .row-actions{
    display:flex;
    gap:8px;
    margin-top:6px;
  }
  .btn{
    border:none;
    border-radius:9px;
    padding:11px 18px;
    font-family:'Work Sans', sans-serif;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    transition:transform .12s ease, opacity .12s ease;
  }
  .btn:active{ transform:scale(0.98); }
  .btn-primary{ background:var(--primary); color:var(--white); }
  .btn-primary:hover{ background:var(--primary-soft); }
  .btn-ghost{ background:transparent; color:var(--ink-soft); border:1px solid var(--line); }
  .btn-ghost:hover{ background:var(--bg-alt); }
  .btn-danger{ background:transparent; color:var(--accent-deep); font-size:12px; padding:6px 10px; }
  .addnew{
    display:flex;
    gap:6px;
    margin-top:6px;
  }
  .addnew input{ font-size:13px; padding:8px 10px; }
  .addnew button{
    padding:8px 12px;
    font-size:12px;
    white-space:nowrap;
  }
  .full{ grid-column: 1 / -1; }
  .entry{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 0;
    border-top:1px solid var(--line);
  }
  .entry:first-child{ border-top:none; }
  .entry-main{ display:flex; gap:14px; align-items:center; }
  .entry-date{
    font-family:'Fraunces', serif;
    font-size:15px;
    color:var(--primary);
    min-width:78px;
  }
  .entry-date span{
    display:block;
    font-size:11px;
    color:var(--ink-soft);
    font-family:'Work Sans', sans-serif;
    margin-top:1px;
  }
  .entry-info b{ font-weight:600; }
  .tag{
    display:inline-block;
    font-size:11px;
    padding:2px 9px;
    border-radius:999px;
    background:var(--bg-alt);
    color:var(--ink-soft);
    margin-left:6px;
  }
  .empty{
    text-align:center;
    padding:36px 10px;
    color:var(--ink-soft);
    font-size:14px;
  }
  .empty .display{
    font-size:18px;
    color:var(--primary);
    margin-bottom:6px;
  }
  .filters{
    display:flex;
    gap:10px;
    margin-bottom:16px;
    flex-wrap:wrap;
  }
  .filters select{ width:auto; min-width:150px; }
  .filters input[type="date"]{ width:auto; min-width:150px; }
  .filters .btn-ghost{ padding:10px 14px; }
  .employee-card{
    display:flex;
    align-items:center;
    gap:18px;
    padding:18px 0;
    border-top:1px solid var(--line);
  }
  .employee-card:first-child{ border-top:none; }
  .bloom{ width:64px; height:64px; flex-shrink:0; position:relative; }
  .petal{
    position:absolute;
    left:50%; top:50%;
    width:14px; height:26px;
    background:var(--accent);
    border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
    transform-origin:50% 100%;
  }
  .bloom-center{
    position:absolute; left:50%; top:50%;
    width:16px; height:16px;
    background:var(--gold);
    border-radius:50%;
    transform:translate(-50%,-50%);
    z-index:2;
  }
  .emp-name{ font-weight:600; font-size:15px; margin-bottom:2px; }
  .emp-stats{ font-size:13px; color:var(--ink-soft); }
  .toast{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--primary);
    color:var(--white);
    padding:11px 22px;
    border-radius:999px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .loading{ text-align:center; padding:40px; color:var(--ink-soft); font-size:14px; }
  .detail-list{ margin-top:10px; padding-left:0; list-style:none; }
  .detail-list li{
    font-size:12.5px;
    color:var(--ink-soft);
    padding:5px 0;
    border-top:1px dashed var(--line);
  }
  .detail-list li:first-child{ border-top:none; }
  .summary-row{
    display:flex;
    gap:22px;
    margin-bottom:6px;
  }
  .summary-row .stat{ text-align:left; }
  .summary-row .stat b{
    display:block;
    font-family:'Fraunces', serif;
    font-size:22px;
    color:var(--primary);
  }
  .summary-row .stat span{ font-size:11px; color:var(--ink-soft); }
  .cal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:16px;
  }
  .cal-header .month-label{
    font-size:18px;
    color:var(--primary);
  }
  .cal-nav{ display:flex; gap:8px; }
  .cal-nav button{
    border:1px solid var(--line);
    background:var(--white);
    border-radius:8px;
    width:34px; height:34px;
    font-size:15px;
    cursor:pointer;
    color:var(--primary);
  }
  .cal-nav button:hover{ background:var(--bg-alt); }
  .cal-weekdays{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:6px;
    margin-bottom:6px;
  }
  .cal-weekdays span{
    text-align:center;
    font-size:11px;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:0.04em;
  }
  .cal-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:6px;
  }
  .cal-day{
    border:1px solid var(--line);
    border-radius:9px;
    padding:8px 6px;
    min-height:62px;
    cursor:pointer;
    background:var(--white);
    transition:border-color .15s ease;
  }
  .cal-day.closed{ opacity:0.4; cursor:default; }
  .cal-day.empty{ visibility:hidden; }
  .cal-day.selected{ border-color:var(--primary); border-width:2px; }
  .cal-day .num{
    font-family:'Fraunces', serif;
    color:var(--primary);
    font-size:14px;
  }
  .cal-day .status{
    font-size:10.5px;
    color:var(--ink-soft);
    margin-top:5px;
    line-height:1.3;
  }
  .slot-list{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-top:14px;
  }
  .slot-block{
    padding:10px 13px;
    border-radius:9px;
    font-size:13px;
    border:1px solid var(--line);
    background:var(--bg);
  }
  .slot-block.empty{
    background:var(--bg-alt);
  }
  .slot-block.full{
    border-style:dashed;
  }
  .slot-block-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
  }
  .slot-block-time{
    font-family:'Fraunces', serif;
    font-weight:500;
    color:var(--primary);
    font-size:14px;
  }
  .slot-block-count{
    font-size:11px;
    color:var(--ink-soft);
  }
  .slot-block-appt{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:8px;
    padding:6px 0 0;
    color:var(--ink-soft);
  }
  .slot-block-appt b{ color:var(--ink); font-weight:600; }
  .slot-block-add{
    display:block;
    width:100%;
    margin-top:8px;
    padding:8px 10px;
    border-radius:8px;
    border:1px dashed var(--accent-deep);
    background:transparent;
    color:var(--accent-deep);
    font-family:'Work Sans', sans-serif;
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
    text-align:center;
  }
  .slot-block-add:hover{ background:var(--bg-alt); }
  .slot-block.empty .slot-block-add{ margin-top:0; }
  .tab-badge{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:18px;
    height:18px;
    padding:0 5px;
    margin-left:6px;
    background:var(--accent-deep);
    color:var(--white);
    border-radius:999px;
    font-size:11px;
    font-weight:700;
    vertical-align:middle;
  }

  /* ===== Responsive: celulares y pantallas chicas ===== */
  @media (max-width:640px){
    .app{ padding:20px 14px 50px; }
    .header{ margin-bottom:22px; }
    .header h1{ font-size:24px; }
    .card{ padding:18px; }

    /* en celular, el navegador vuelve a ser horizontal arriba en vez de barra lateral */
    .layout{ flex-direction:column; gap:0; }
    .tabs{
      flex-direction:row;
      width:100%;
      gap:6px;
      padding:5px;
      border-radius:999px;
      position:static;
      margin-bottom:22px;
      overflow-x:auto;
      -webkit-overflow-scrolling:touch;
      scrollbar-width:none;
    }
    .tabs::-webkit-scrollbar{ display:none; }
    .tab{
      border-radius:999px;
      flex-shrink:0;
      width:auto;
      padding:9px 18px;
      justify-content:center;
    }

    /* filas de turnos / servicios / stock / recordatorios: apilar en vez de achicar */
    .entry{
      flex-direction:column;
      align-items:stretch;
      gap:10px;
      padding:14px 0;
    }
    .entry-main{ width:100%; }
    .entry > .btn,
    .entry > div[style*="display:flex"]{
      align-self:flex-end;
    }

    /* tarjetas de clientas / profesionales / reportes: apilar */
    .employee-card{
      flex-direction:column;
      align-items:flex-start;
      gap:10px;
    }
    .employee-card > button{ align-self:flex-end; }

    /* filtros de turnos: uno debajo del otro, ancho completo */
    .filters{ flex-direction:column; gap:8px; }
    .filters select{ width:100%; min-width:0; }

    /* inputs con ancho fijo en px definidos desde JS: que ocupen el ancho disponible */
    input[data-client-phone-for],
    input[data-phone-for],
    input[data-price-for],
    input[data-qty-for],
    input[data-min-for],
    input[data-prodprice-for]{
      width:100% !important;
    }

    /* fila de agregar clienta/profesional: input arriba, botón abajo */
    .addnew{ flex-wrap:wrap; }
    .addnew input{ flex:1 1 100%; }
    .addnew button{ flex:1 1 100%; }

    /* totales (turnos, comisiones, stock): que se acomoden en varias líneas */
    .summary-row{ flex-wrap:wrap; gap:16px; row-gap:14px; }

    /* calendario: celdas más chicas para que entren las 7 columnas */
    .cal-day{ padding:6px 3px; min-height:50px; }
    .cal-day .num{ font-size:13px; }
    .cal-day .status{ font-size:9.5px; }
    .cal-nav button{ width:32px; height:32px; }

    /* turnos libres/ocupados del día: que ocupen bien el ancho */
    .slot-block-head{ flex-direction:row; }
  }

  @media (max-width:380px){
    .header h1{ font-size:21px; }
    .cal-weekdays span{ font-size:9.5px; }
    .cal-day .status{ display:none; } /* en pantallas muy chicas, solo el número, sin "libres" */
  }
</style>
<!-- MODO DEMO: sin conexión a Firebase real. Este bloque reemplaza al SDK de Firebase
     por un motor que simula Firestore 100% en memoria del navegador, precargado con datos
     de ejemplo. Nada de lo que pase acá se guarda ni se comparte con la base de datos real
     del negocio: cada visita arranca de cero y se pierde todo al recargar la página. -->
<script id="mock-firebase-demo">
"use strict";
(function(){
  var STORE = Object.create(null);
  function clone(o){ return o===undefined ? undefined : JSON.parse(JSON.stringify(o)); }

  function DocRef(path){ this.path = path; this.id = path.split('/').pop(); }
  DocRef.prototype.get = function(){
    var data = STORE[this.path];
    return Promise.resolve({ exists: data !== undefined, id: this.id, data: function(){ return clone(data); } });
  };
  DocRef.prototype.set = function(data){ STORE[this.path] = clone(data); return Promise.resolve(); };

  function CollectionRef(path){ this.path = path; }
  CollectionRef.prototype.doc = function(id){ return new DocRef(this.path + '/' + id); };

  function Firestore(){}
  Firestore.prototype.collection = function(name){ return new CollectionRef(name); };
  var dbInstance = new Firestore();

  window.firebase = {
    initializeApp: function(){ /* modo demo: no se conecta a ningún proyecto real */ },
    firestore: function(){ return dbInstance; }
  };

  // ===== Datos de ejemplo (se recrean en cada carga de página) =====
  var hoy = new Date();
  var pad = function(n){ return String(n).padStart(2,'0'); };
  var hoyStr = hoy.getFullYear() + '-' + pad(hoy.getMonth()+1) + '-' + pad(hoy.getDate());
  var cumpleHoy = '1995-' + pad(hoy.getMonth()+1) + '-' + pad(hoy.getDate());
  var enTresHoras = new Date(hoy.getTime() + 3*60*60*1000);
  var horaProxima = pad(enTresHoras.getHours()) + ':' + pad(enTresHoras.getMinutes());

  STORE['centro_estetica/employees'] = { value: [
    { name:'Ana Gómez', phone:'261 555-1111' },
    { name:'Lucía Fernández', phone:'261 555-2222' }
  ]};
  STORE['centro_estetica/services'] = { value: [
    { name:'Manicura', price:3500 },
    { name:'Depilación facial', price:2800 },
    { name:'Masaje descontracturante', price:6000 },
    { name:'Limpieza de cutis', price:5500 }
  ]};
  STORE['centro_estetica/clients'] = { value: [
    { name:'María Pérez', phone:'261 444-1234', birthday:'1990-05-12' },
    { name:'Carla Sosa', phone:'261 444-5678', birthday: cumpleHoy },
    { name:'Julieta Rossi', phone:'261 444-9012', birthday:'1988-11-03' }
  ]};
  STORE['centro_estetica/products'] = { value: [
    { name:'Esmalte semipermanente', qty:2, min:5, price:1800 },
    { name:'Cera descartable', qty:15, min:5, price:600 },
    { name:'Crema hidratante', qty:8, min:3, price:2200 }
  ]};
  STORE['centro_estetica/appointments'] = { value: [
    { id:'demo-1', date:hoyStr, time:horaProxima, employee:'Ana Gómez', service:'Manicura', client:'María Pérez', price:3500, pct:'40', notes:'', deposit:'', payment:'', products:[] },
    { id:'demo-2', date:hoyStr, time:'11:00', employee:'Lucía Fernández', service:'Depilación facial', client:'Carla Sosa', price:2800, pct:'40', notes:'', deposit:'', payment:'Efectivo', products:[] }
  ]};
  STORE['centro_estetica/birthdaySettings'] = { value: { template:"¡Feliz cumpleaños, {nombre}! 🎉\n\nTe deseamos un día espectacular. ¡Te esperamos pronto!", discount:'10' } };
})();
</script>
</head>
<body>
<div class="app" id="app">
  <div class="loading" id="loading">Abriendo la bitácora…</div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="message-modal-overlay">
  <div class="modal-box">
    <h2 id="message-modal-title">Editar mensaje</h2>
    <textarea id="message-modal-textarea" rows="8"></textarea>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="message-modal-cancel">Cancelar</button>
      <button class="btn btn-primary" id="message-modal-send">Enviar por WhatsApp</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="birthday-alert-modal-overlay">
  <div class="modal-box" style="max-width:480px;">
    <h2>🎂 Cumpleaños de hoy</h2>
    <div class="sub" id="birthday-alert-sub" style="font-size:12.5px; color:var(--ink-soft); margin:-8px 0 14px;"></div>
    <div id="birthday-alert-list"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="birthday-alert-close">Cerrar</button>
      <button class="btn btn-primary" id="birthday-alert-goto">Ir a Recordatorios</button>
    </div>
  </div>
</div>

const WORK_DAYS = [1,2,3,4,5,6]; // 0=domingo ... 6=sábado. Lunes a sábado.
const START_HOUR = 9;
const END_HOUR = 20;
const FALLBACK_SIMULTANEOUS_SLOTS = 3; // si no hay profesionales cargadas, tope de turnos a la misma hora
const SLOT_MINUTES = 30; // duración de cada franja, en minutos
const SLOT_HOURS = [];
for(let m = START_HOUR * 60; m < END_HOUR * 60; m += SLOT_MINUTES){
  const h = Math.floor(m / 60);
  const mm = m % 60;
  SLOT_HOURS.push(String(h).padStart(2,'0') + ':' + String(mm).padStart(2,'0'));
}

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=> t.classList.remove('show'), 2200);
}

function openMessagePreview({ title, message, phone }){
  const overlay = document.getElementById('message-modal-overlay');
  const textarea = document.getElementById('message-modal-textarea');
  const titleEl = document.getElementById('message-modal-title');
  const sendBtn = document.getElementById('message-modal-send');
  const cancelBtn = document.getElementById('message-modal-cancel');

  titleEl.textContent = title || 'Editar mensaje';
  textarea.value = message;
  overlay.classList.add('open');

  const close = ()=> overlay.classList.remove('open');

  cancelBtn.onclick = close;
  overlay.onclick = (e)=>{ if(e.target === overlay) close(); };

  sendBtn.onclick = ()=>{
    const finalMsg = textarea.value;
    const url = `https://wa.me/${phone || ''}?text=${encodeURIComponent(finalMsg)}`;
    window.open(url, '_blank');
    if(!phone) showToast('Esa clienta no tiene WhatsApp cargado: elegí el contacto manualmente');
    close();
  };
}

function buildBirthdayMessage(name){
  let body = (state.birthdaySettings.template || DEFAULT_BIRTHDAY_TEMPLATE).replace(/\{nombre\}/g, name);
  if(state.birthdaySettings.discount){
    body += `\n\nAdemás, tenés un ${state.birthdaySettings.discount}% de descuento especial en tu próxima visita.`;
  }
  return `*${BUSINESS_NAME.toUpperCase()}*\n-----------------------------\n${body}`;
}

function sendBirthdayGreeting(name){
  const client = state.clients.find(c=> c.name === name);
  const phone = client && client.phone ? client.phone : '';
  openMessagePreview({ title: `Saludo para ${name}`, message: buildBirthdayMessage(name), phone });
}

function openBirthdayAlertModal(clients){
  const overlay = document.getElementById('birthday-alert-modal-overlay');
  const sub = document.getElementById('birthday-alert-sub');
  const list = document.getElementById('birthday-alert-list');
  const closeBtn = document.getElementById('birthday-alert-close');
  const gotoBtn = document.getElementById('birthday-alert-goto');

  sub.textContent = `${clients.length} clienta${clients.length===1?'':'s'} está${clients.length===1?'':'n'} de cumpleaños hoy. Tocá "Enviar saludo" para mandarle la plantilla por WhatsApp.`;
  list.innerHTML = clients.map(c=>`
    <div class="birthday-alert-entry">
      <span class="name">${c.name}</span>
      <button class="btn btn-primary" data-alert-remind="${c.name}">Enviar saludo</button>
    </div>
  `).join('');
  list.querySelectorAll('[data-alert-remind]').forEach(btn=>{
    btn.onclick = ()=> sendBirthdayGreeting(btn.dataset.alertRemind);
  });

  overlay.classList.add('open');
  const close = ()=> overlay.classList.remove('open');
  closeBtn.onclick = close;
  overlay.onclick = (e)=>{ if(e.target === overlay) close(); };
  gotoBtn.onclick = ()=>{
    close();
    state.tab = 'recordatorios';
    render();
  };
}

function openApptEditModal(id){
  const appt = state.appointments.find(a=> a.id === id);
  if(!appt) return;
  const overlay = document.getElementById('appt-edit-modal-overlay');

  document.getElementById('dl-e-emp').innerHTML = state.employees.map(e=>`<option value="${e.name}"></option>`).join('');
  document.getElementById('dl-e-svc').innerHTML = state.services.map(s=>`<option value="${s.name}"></option>`).join('');
  document.getElementById('dl-e-client').innerHTML = state.clients.map(c=>`<option value="${c.name}"></option>`).join('');

  document.getElementById('e-date').value = appt.date || '';
  document.getElementById('e-time').value = appt.time || '';
  document.getElementById('e-emp').value = appt.employee || '';
  document.getElementById('e-svc').value = appt.service || '';
  document.getElementById('e-client').value = appt.client || '';
  document.getElementById('e-price').value = appt.price || '';
  document.getElementById('e-pct').value = appt.pct || '';
  document.getElementById('e-deposit').value = appt.deposit || '';
  document.getElementById('e-payment').value = appt.payment || 'Efectivo';
  document.getElementById('e-notes').value = appt.notes || '';

  overlay.classList.add('open');
  const close = ()=> overlay.classList.remove('open');
  document.getElementById('appt-edit-cancel').onclick = close;
  overlay.onclick = (e)=>{ if(e.target === overlay) close(); };

  document.getElementById('appt-edit-save').onclick = async ()=>{
    const date = document.getElementById('e-date').value;
    const time = document.getElementById('e-time').value;
    const employee = document.getElementById('e-emp').value.trim();
    const service = document.getElementById('e-svc').value.trim();
    const client = document.getElementById('e-client').value.trim();
    const price = document.getElementById('e-price').value;
    const pct = document.getElementById('e-pct').value;
    const deposit = document.getElementById('e-deposit').value;
    const payment = document.getElementById('e-payment').value;
    const notes = document.getElementById('e-notes').value.trim();
    if(!date || !time || !employee || !service){
      showToast('Completá fecha, hora, profesional y servicio');
      return;
    }
    appt.date = date;
    appt.time = time;
    appt.employee = employee;
    appt.service = service;
    appt.client = client;
    appt.price = price;
    appt.pct = pct;
    appt.deposit = deposit;
    appt.payment = payment;
    appt.notes = notes;
    await saveAppointments();
    close();
    render();
    showToast('Turno actualizado');
  };
}

async function loadAll(){
  try{
    const doc = await dataCollection.doc('appointments').get();
    state.appointments = doc.exists ? (doc.data().value || []) : [];
  }catch(e){ state.appointments = []; showToast('No se pudo conectar con la base de datos.'); }
  try{
    const doc = await dataCollection.doc('employees').get();
    const raw = doc.exists ? (doc.data().value || []) : [];
    state.employees = raw.map(item => typeof item === 'string' ? { name: item, phone: '' } : item);
  }catch(e){ state.employees = []; }
  try{
    const doc = await dataCollection.doc('services').get();
    const raw = doc.exists ? (doc.data().value || []) : [];
    state.services = raw.map(item => typeof item === 'string' ? { name: item, price: '' } : item);
  }catch(e){ state.services = []; }
  try{
    const doc = await dataCollection.doc('clients').get();
    const raw = doc.exists ? (doc.data().value || []) : [];
    state.clients = raw.map(item => typeof item === 'string' ? { name: item, phone: '', birthday: '' } : { birthday: '', ...item });
  }catch(e){ state.clients = []; }
  try{
    const doc = await dataCollection.doc('products').get();
    state.products = doc.exists ? (doc.data().value || []) : [];
  }catch(e){ state.products = []; }
  try{
    const doc = await dataCollection.doc('birthdaySettings').get();
    const saved = doc.exists ? (doc.data().value || {}) : {};
    state.birthdaySettings = { template: saved.template || DEFAULT_BIRTHDAY_TEMPLATE, discount: saved.discount || '' };
  }catch(e){ /* mantiene el valor por defecto */ }
  state.ready = true;
  render();
  const upcoming = getUpcomingCount();
  const lowStock = getLowStockProducts().length;
  const birthdaysToday = getTodayBirthdays();
  const parts = [];
  if(upcoming > 0) parts.push(`${upcoming} turno${upcoming===1?'':'s'} en las próximas 24hs`);
  if(lowStock > 0) parts.push(`${lowStock} producto${lowStock===1?'':'s'} con stock bajo`);
  if(parts.length){
    showToast('Tenés ' + parts.join(' y '));
  }
  if(birthdaysToday.length){
    openBirthdayAlertModal(birthdaysToday);
  }
}

function fmtDate(d){
  const dt = new Date(d + 'T00:00:00');
  const dias = ['dom','lun','mar','mié','jue','vie','sáb'];
  const meses = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return { day: dt.getDate() + ' ' + meses[dt.getMonth()], weekday: dias[dt.getDay()] };
}

function commissionOf(a){ return (Number(a.price)||0) * (Number(a.pct)||0) / 100; }
function productsRevenueOf(a){ return (a.products||[]).reduce((s,p)=> s + (Number(p.price)||0) * (Number(p.qty)||0), 0); }

function getUpcomingCount(){
  const now = new Date();
  const in24h = new Date(now.getTime() + 24*60*60*1000);
  return state.appointments.filter(a=>{
    const dt = new Date(`${a.date}T${a.time}:00`);
    return dt >= now && dt <= in24h && !a.reminded;
  }).length;
}

function getTodayBirthdays(){
  const now = new Date();
  const mm = now.getMonth();
  const dd = now.getDate();
  return state.clients.filter(c=>{
    if(!c.birthday) return false;
    const bd = new Date(c.birthday + 'T00:00:00');
    return bd.getMonth() === mm && bd.getDate() === dd;
  });
}

function getLowStockProducts(){
  return state.products.filter(p=>{
    const qty = Number(p.qty)||0;
    const min = p.min !== undefined && p.min !== '' ? Number(p.min) : 3;
    return qty <= min;
  });
}

function calcApptTotals(servicePriceVal, depositVal, productsList){
  const servicePrice = Number(servicePriceVal)||0;
  const productsTotal = (productsList||[]).reduce((s,p)=> s + (Number(p.price)||0) * (Number(p.qty)||0), 0);
  const deposit = Number(depositVal)||0;
  const total = servicePrice + productsTotal;
  const balance = total - deposit;
  return { servicePrice, productsTotal, deposit, total, balance };
}

function updateApptSummary(){
  const priceEl = document.getElementById('f-price');

  const { total, deposit, balance } = calcApptTotals(priceEl.value, depositEl.value, state.registrarProducts);

}

function renderDisponibilidad(){
  const year = state.calYear;
  const month = state.calMonth;
  const meses = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const firstDay = new Date(year, month, 1);
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const startWeekday = firstDay.getDay();

  // Capacidad de turnos simultáneos por franja: uno por cada profesional cargada
  // (o un tope fijo si todavía no se cargó ninguna profesional).
  const slotCapacity = state.employees.length > 0 ? state.employees.length : FALLBACK_SIMULTANEOUS_SLOTS;

  const apptsByDateTime = {};
  state.appointments.forEach(a=>{
    const key = a.date + '|' + a.time;
    if(!apptsByDateTime[key]) apptsByDateTime[key] = [];
    apptsByDateTime[key].push(a);
  });

  let cells = '';
  for(let i=0;i<startWeekday;i++){ cells += `<div class="cal-day empty"></div>`; }
  for(let d=1; d<=daysInMonth; d++){
    const dateObj = new Date(year, month, d);
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const weekday = dateObj.getDay();
    const isWorkDay = WORK_DAYS.includes(weekday);
    const freeCount = SLOT_HOURS.filter(t=>{
      const n = (apptsByDateTime[dateStr + '|' + t] || []).length;
      return n < slotCapacity;
    }).length;
    const selected = state.calSelectedDate === dateStr ? 'selected' : '';
    cells += `
      <div class="cal-day ${isWorkDay?'':'closed'} ${selected}" data-day="${isWorkDay ? dateStr : ''}">
        <div class="num">${d}</div>
        <div class="status">${isWorkDay ? freeCount + ' libres' : 'Cerrado'}</div>
      </div>
    `;
  }

  let detail = '';
  if(state.calSelectedDate){
    const d = fmtDate(state.calSelectedDate);
    const blocks = SLOT_HOURS.map(t=>{
      const appts = apptsByDateTime[state.calSelectedDate + '|' + t] || [];
      const isFull = appts.length >= slotCapacity;
      const apptsHtml = appts.map(a=>
        `<div class="slot-block-appt"><b>${a.employee}</b> · ${a.service}${a.client ? ' — ' + a.client : ''}</div>`
      ).join('');
      const addBtn = isFull ? '' : `<button class="slot-block-add" data-slot-date="${state.calSelectedDate}" data-slot-time="${t}">${appts.length ? '+ Agregar otro turno a esta hora' : 'Agregar turno'}</button>`;
      return `
        <div class="slot-block ${appts.length ? '' : 'empty'} ${isFull ? 'full' : ''}">
          <div class="slot-block-head">
            <span class="slot-block-time">${t}</span>
            <span class="slot-block-count">${appts.length}/${slotCapacity} ocupados</span>
          </div>
          ${apptsHtml}
          ${addBtn}
        </div>
      `;
    }).join('');
    detail = `
      <div class="card">
        <h2>${d.day} · ${d.weekday}</h2>
        <p style="font-size:12.5px; color:var(--ink-soft); margin:-8px 0 4px;">Podés cargar hasta ${slotCapacity} turno${slotCapacity===1?'':'s'} en simultáneo por horario${state.employees.length>0 ? ' (uno por profesional)' : ''}.</p>
        <div class="slot-list">${blocks}</div>
      </div>
    `;
  }

  return `
    <div class="card">
      <div class="cal-header">
        <div class="month-label display">${meses[month]} ${year}</div>
        <div class="cal-nav">
          <button id="cal-prev">‹</button>
          <button id="cal-next">›</button>
        </div>
      </div>
      <div class="cal-weekdays">
        <span>Dom</span><span>Lun</span><span>Mar</span><span>Mié</span><span>Jue</span><span>Vie</span><span>Sáb</span>
      </div>
      <div class="cal-grid">${cells}</div>
    </div>
    ${detail}
  `;
}

function renderCaja(){
  const dateVal = state.cajaDate;
  const dayAppts = state.appointments.filter(a=> a.date === dateVal).sort((a,b)=> a.time.localeCompare(b.time));
  const d = fmtDate(dateVal);

  const totalServicios = dayAppts.reduce((s,a)=> s + (Number(a.price)||0), 0);
  const totalProductos = dayAppts.reduce((s,a)=> s + productsRevenueOf(a), 0);
  const totalFacturado = totalServicios + totalProductos;
  const totalComisiones = dayAppts.reduce((s,a)=> s + commissionOf(a), 0);
  const totalSenas = dayAppts.reduce((s,a)=> s + (Number(a.deposit)||0), 0);
  const neto = totalFacturado - totalComisiones;

  const byPayment = {};
  dayAppts.forEach(a=>{
    const { total } = calcApptTotals(a.price, a.deposit, a.products);
    const method = a.payment || 'Sin especificar';
    byPayment[method] = (byPayment[method]||0) + total;
  });
  const paymentRows = Object.keys(byPayment).length
    ? Object.entries(byPayment).map(([method, amount])=> `
      <div class="entry" style="padding:12px 0;">
        <div class="entry-main"><div class="entry-info"><b>${method}</b></div></div>

    list = dayAppts.map(a=>{

      return `
      <div class="entry">
        <div class="entry-main">
          <div class="entry-date">${a.time}</div>
          <div class="entry-info">
            <b>${a.service}</b> con <b>${a.employee}</b>
            ${a.client ? `<span class="tag">${a.client}</span>` : ''}
            ${(a.price || productsTotal) ? `<span class="tag">$${total.toLocaleString('es-AR')}</span>` : ''}
            ${a.payment ? `<span class="tag">${a.payment}</span>` : ''}
            ${deposit ? `<span class="tag">Seña $${deposit.toLocaleString('es-AR')}</span>` : ''}
          </div>
        </div>
      </div>`;
    }).join('');
  }

  return `
    <div class="card">
      <h2>Cierre de caja</h2>
      <div class="grid" style="margin-bottom:6px;">
        <div class="field">
          <label for="caja-date">Fecha</label>

        </div>

      <div class="field-hint" style="margin-bottom:14px;">El total facturado incluye las señas cargadas en cada turno de este día.</div>

        <div class="stat"><b>${dayAppts.length}</b><span>turnos del día</span></div>
        <div class="stat"><b>$${totalFacturado.toLocaleString('es-AR')}</b><span>facturado total</span></div>
        ${totalSenas ? `<div class="stat"><b>$${totalSenas.toLocaleString('es-AR')}</b><span>en señas incluidas</span></div>` : ''}
        <div class="stat"><b>$${totalComisiones.toLocaleString('es-AR')}</b><span>comisiones del día</span></div>
        <div class="stat"><b>$${neto.toLocaleString('es-AR')}</b><span>neto para el local</span></div>
      </div>

    <div class="card">
      <h2>Por forma de pago</h2>

        list.forEach(a=>{
          const d = fmtDate(a.date);
          msg += `Fecha: ${d.day} — Servicio: ${a.service} — Corresponde: $${commissionOf(a).toLocaleString('es-AR')}\n`;
        });
        msg += `-----------------------------\nTOTAL: $${totalCommission.toLocaleString('es-AR')}`;

        const phone = emp && emp.phone ? emp.phone : '';
        const url = `https://wa.me/${phone}?text=${encodeURIComponent(msg)}`;
        window.open(url, '_blank');
        if(!phone) showToast('No tiene WhatsApp cargado: elegí el contacto manualmente al abrir WhatsApp');
      };
    });
  }
}

loadAll();
